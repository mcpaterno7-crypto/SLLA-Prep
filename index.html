 t:["Ignoring district, state, and federal requirements risks building a plan that conflicts with policies the school must follow.","Taking district goals wholesale skips adapting them to this school's specific math data.","Checking policy requirements up front means the plan is aligned from the start, not patched together later.","Checking for compliance after the plan is built risks having to redo work that policy review upfront would have prevented."]},
{cat:"SL", q:"A principal wants a strategic planning process to model the school's own values around collaboration. Which planning structure best reflects this?",
 o:["A single consultant drafts the plan based on the principal's stated preferences","The principal drafts goals independently and asks the leadership team to approve them","Each department drafts its own goals, then shares them with other departments for informal feedback before finalizing","Cross-functional teams of staff collaboratively draft goals, which are refined through shared feedback cycles"], c:3,
 e:"PSEL 1 calls for modeling the school's core values in all aspects of leadership, including how the plan itself gets built.",
 t:["An outside consultant working from one person's preferences isn't a collaborative process at all.","Asking the team to approve a plan already written doesn't reflect genuine collaborative authorship.","Informal feedback between departments is a step toward collaboration, but it still isn't the shared, cross-functional drafting process that genuinely models the school's collaborative values from the start.","This is genuine shared authorship — teams building and refining the plan together, not separately or after the fact."]},
{cat:"SL", q:"A principal reviewing the strategic plan mid-year finds that one grade level has made significant progress while another has stagnated. Best next step?",
 o:["Apply the successful grade level's exact approach to the stagnant grade level without adaptation","Wait until year-end to investigate the discrepancy","Focus remaining resources only on the higher-performing grade level to maximize overall gains","Investigate what conditions differ between the two grade levels before deciding on a course of action"], c:3,
 e:"PSEL 1's continuous-improvement approach calls for understanding the specific conditions behind a data pattern before acting on it.",
 t:["Copying what worked elsewhere without understanding why it worked risks missing what the stagnant grade actually needs.","Waiting until year-end lets the stagnant grade continue struggling for months without any intervention.","Concentrating resources on the grade already succeeding abandons the one that needs help most.","Understanding why the two grades diverged is necessary before any fix can actually target the real cause."]},
{cat:"SL", q:"A principal wants families with varying school experiences (recent immigrants, multigenerational local families) to feel their perspectives shaped the school's new vision. Best approach?",
 o:["Rely on the PTO to represent all family perspectives","Share a draft vision and ask for written feedback only","Hold one general town hall meeting open to all families","Use varied outreach (small groups, translated surveys, community partner referrals) to reach different family experiences"], c:3,
 e:"PSEL 1 calls for engaging internal and external communities with diverse perspectives in developing the vision and goals.",
 t:["A single parent organization often doesn't reflect the full range of family backgrounds and experiences in the community.","Written-only feedback can exclude families who prefer or need spoken or in-person engagement.","A single general meeting format doesn't account for varied comfort levels, schedules, or languages across different families.","Using multiple formats and channels is what actually reaches families with different backgrounds and needs."]},
{cat:"SL", q:"A principal wants a strategic plan's action steps to be specific enough that any staff member could understand their role. Which version of an action step best meets that standard?",
 o:["'Writing instruction will improve schoolwide.'","'Each ELA teacher will implement two peer-review writing conferences per unit, documented in a shared log.'","'Teachers will focus more on writing this year.'","'The school will prioritize writing as an area of growth.'"], c:1,
 e:"PSEL 1 calls for goals and action steps that are specific and measurable enough to guide implementation, not vague intentions.",
 t:["This states an intended outcome broadly, with no specific action anyone could actually carry out.","This names exactly who does what, how often, and how it will be documented.","\"Focus more\" gives no concrete action a teacher could point to and actually do.","A priority statement signals intent but doesn't specify any actual step staff would take."]},
{cat:"SL", q:"A principal wants to determine whether the school's current staffing model supports the strategic plan's goals for personalized learning. Best evaluation approach?",
 o:["Analyze whether current staffing (class size, support allocation) enables the personalized practices named in the goals","Wait for the next budget cycle to review staffing","Compare staffing ratios to a state average","Assume current staffing is adequate since no formal complaints have arisen"], c:0,
 e:"PSEL 1 calls for aligning resources, including staffing, with the mission, vision, and goals through direct evaluation.",
 t:["Directly checking whether class size and support staffing enable the specific practices named in the goals answers the actual question.","Delaying the check until the next budget cycle means continuing to operate on an unverified assumption about staffing fit.","A state average doesn't reveal whether this school's staffing supports its own specific personalized-learning goals.","Absence of complaints doesn't confirm the staffing model actually supports the stated goals."]},
{cat:"SL", q:"A principal wants a strategic plan to reflect the school's unique context rather than a generic template. Best approach when starting the planning process?",
 o:["Begin with an analysis of the school's own multiple data sources and unique context before drafting goals","Base the plan primarily on the principal's prior experience at other schools","Use the district's default goals for all schools without modification","Adapt a strategic plan template from a similar-sized school in another state"], c:0,
 e:"PSEL 1 calls for using multiple sources of data specific to the school to shape goals, not a generic template.",
 t:["Starting from this school's own data ensures the plan reflects its actual situation, not someone else's.","Past experience at other schools may not transfer to this school's specific context.","A default template applied without modification is exactly the generic approach the question wants to avoid.","Even an adapted outside template starts from someone else's context rather than this school's own data."]},
{cat:"SL", q:"A principal wants staff to feel their voice shaped which professional learning topics were prioritized in the strategic plan. Best approach?",
 o:["Survey staff on instructional challenges and use that data alongside student outcome data to prioritize PD topics","Choose PD topics recommended by the district office without staff input","Rotate PD topics annually regardless of identified needs","Select PD topics based on what worked well at the principal's previous school"], c:0,
 e:"PSEL 1 calls for using data and staff input together to shape plans and priorities within the strategic plan.",
 t:["Combining staff-identified challenges with outcome data ensures PD choices reflect both voice and evidence.","Accepting district recommendations without staff input leaves out the voice the question specifically wants included.","Rotating topics on a fixed schedule ignores whatever the actual current needs happen to be.","What worked at a previous school doesn't reflect this staff's actual current challenges."]},
{cat:"SL", q:"A principal wants the strategic plan's timeline to account for realistic implementation given competing school priorities. Best approach?",
 o:["Set an ambitious timeline to create urgency, regardless of competing demands","Leave the timeline open-ended to avoid pressure on staff","Map the plan's timeline against other known school commitments and adjust pacing accordingly","Base the timeline primarily on the district's reporting deadlines, adjusting slightly where possible"], c:2,
 e:"PSEL 1 calls for a strategic planning process that promotes alignment among all aspects of the school organization, including realistic pacing.",
 t:["Setting an aggressive timeline without regard for competing commitments risks a plan staff can't realistically deliver.","No timeline at all removes the accountability and pacing structure a plan needs.","This builds a realistic schedule by actually accounting for what else is competing for staff time.","Anchoring mainly to external reporting deadlines, even with small adjustments, still doesn't map the timeline against the school's own actual competing commitments the way genuine realistic pacing requires."]},
{cat:"SL", q:"A principal wants a plan to close an opportunity gap in enrollment in advanced coursework to be grounded in accurate data. Best first step?",
 o:["Set an enrollment target based on the average across similar schools in the district, then track progress toward it","Set a general goal to 'increase diversity' in advanced courses","Wait for a formal equity audit from the district before setting any goal","Analyze current enrollment data by subgroup alongside identification criteria to understand the actual gap"], c:3,
 e:"PSEL 1 calls for using multiple sources of data to identify unique strengths, needs, and gaps before setting a specific, grounded goal.",
 t:["Tracking progress is a good instinct, but a target borrowed from other schools' averages still isn't grounded in this school's own subgroup data and identification criteria — the actual source of the gap here.","A vague diversity goal has no data behind it to show what's actually driving the current gap.","Waiting for an outside audit delays the school's own ability to start understanding and addressing the gap now.","Examining enrollment by subgroup alongside identification criteria directly reveals where the actual gap comes from."]},
{cat:"SL", q:"A principal wants a strategic plan's success indicators to be understandable to families without an education background. Best approach?",
 o:["Translate data and success indicators into plain-language summaries alongside the technical version","Simplify indicators so much that they no longer reflect actual outcomes","Use the same technical language as the district's official plan","Share success indicators only with staff, since families won't understand them"], c:0,
 e:"PSEL 1 calls for communicating the shared vision and goals in ways that facilitate family members' ability to understand and act on them.",
 t:["This keeps the indicators accurate while also making them genuinely accessible to families without an education background.","Over-simplifying to the point of losing accuracy trades clarity for correctness, which isn't a real solution.","Technical language written for administrators doesn't serve the stated goal of being understandable to families.","Withholding indicators from families entirely contradicts the goal of making them understandable to families in the first place."]},
{cat:"SL", q:"A principal is deciding how frequently to review progress on the strategic plan's goals. Best approach?",
 o:["Review only at the end of the school year to allow strategies time to work","Review only if state assessment results suggest a problem","Establish regular interim checkpoints (e.g., quarterly) to review data and adjust as needed","Review whenever a stakeholder raises a concern"], c:2,
 e:"PSEL 1 calls for using data-driven decision making systematically to monitor plans, which requires scheduled, regular checkpoints.",
 t:["Waiting until the end of the year to check progress means problems go undetected for months.","Relying on state results as the trigger means the school isn't proactively watching its own plan.","Scheduled interim checkpoints catch problems early enough to actually adjust course.","Reactive review based on complaints means quiet problems can go unnoticed for a long time."]},
{cat:"SL", q:"A principal wants a plan for a new dual-language program to align with the school's overall vision rather than operate as a separate initiative. Best approach?",
 o:["Focus the program's planning solely on staffing logistics","Let the dual-language program set its own standalone vision to maintain flexibility","Develop the dual-language program independently from the school's broader strategic plan","Explicitly connect the dual-language program's goals and metrics to the school's existing vision and strategic priorities"], c:3,
 e:"PSEL 1 calls for a strategic planning process that promotes alignment among all aspects of the school organization, not siloed initiatives.",
 t:["Logistics matter, but planning only around staffing ignores whether the program actually connects to the school's broader vision.","A separate vision risks the program drifting from what the rest of the school is working toward.","Building the program apart from the strategic plan is exactly the siloed approach the question warns against.","This directly ties the new program's success measures to the same vision guiding everything else in the school."]},
{cat:"SL", q:"A principal notices that goals in the strategic plan lack any connection to specific data sources that would show progress. Best correction?",
 o:["Remove data-based goals in favor of qualitative descriptions","Identify likely data sources for each goal informally, planning to confirm them once the plan is implemented","Leave the goals as written since specificity can come later","Revise each goal to name the specific data source and metric that will demonstrate progress"], c:3,
 e:"PSEL 1 calls for goals that are measurable and tied to identifiable data sources so that progress can be tracked.",
 t:["Dropping measurable goals altogether removes accountability rather than fixing the missing data-source connection.","Identifying likely sources is progress, but leaving formal confirmation until after implementation still means the plan launches without a locked-in way to actually track each goal's progress.","Postponing specificity means the plan continues to lack a way to demonstrate progress in the meantime.","This directly fixes the gap by attaching a concrete way to measure each goal's progress."]},
{cat:"SL", q:"A principal wants the strategic planning committee's membership to include staff who might raise difficult questions, not just enthusiastic supporters. Best approach?",
 o:["Limit the committee to administrators to avoid conflict","Rotate membership so no one raises the same concern twice","Select committee members based on their support for the principal's existing priorities","Intentionally include a range of perspectives, including likely skeptics, to stress-test the plan"], c:3,
 e:"PSEL 1 calls for engaging diverse perspectives in implementing the vision, which includes constructive skepticism, not just agreement.",
 t:["Restricting membership to administrators avoids conflict but also avoids the broader range of perspectives the question wants included.","Rotating people out to avoid hearing the same concern twice risks silencing a valid, recurring issue rather than resolving it.","Choosing only supporters defeats the purpose of including people who might raise difficult questions.","Deliberately including likely skeptics is what actually pressure-tests the plan before it's finalized."]},
{cat:"SL", q:"A principal wants families to see visible evidence that their earlier input shaped the final strategic plan. Best approach?",
 o:["Explicitly reference specific family input in the final plan and explain how it was incorporated or why it wasn't","Share only the final plan without referencing the input process","Assume families will trust the plan reflects their input without further explanation","Finalize the plan and note in general terms that 'community input was considered'"], c:0,
 e:"PSEL 1 calls for communicating the shared vision and goals in ways that let stakeholders see their engagement mattered, closing the feedback loop.",
 t:["Naming specific input and explaining how it was used (or why not) is what makes families' engagement visibly matter.","Presenting only the final plan gives families no way to see whether their input was actually considered.","Assuming trust without evidence leaves families with no real confirmation their voice was heard.","A vague acknowledgment doesn't show families anything concrete about how their specific input was used."]},
// ---------------- INSTRUCTIONAL LEADERSHIP (IL) ----------------
{cat:"IL", q:"A principal wants to guide an individual teacher's professional development plan for the year based on specific, identified needs rather than generic goals. Best first step?",
 o:["Review specific walkthrough and student outcome data with the teacher to co-create individualized goals","Assign the same PD plan template used for all staff","Wait until the formal evaluation cycle to discuss PD needs","Let the teacher self-select any PD topic of interest"], c:0,
 e:"PSEL 2 calls for guiding and monitoring individual teacher professional development plans grounded in specific identified needs.",
 t:["Grounding the plan in this teacher's actual data, developed together, ensures it's specific rather than generic.","A universal template is inherently generic, which is exactly what the question wants to avoid.","Waiting delays addressing needs that could be identified and acted on now.","Open self-selection doesn't ensure the topic connects to the specific needs the data reveals."]},
{cat:"IL", q:"A principal wants to establish clear expectations for teachers to strengthen their content knowledge in a newly adopted math curriculum. Best approach?",
 o:["Require teachers to independently research the new content standards","Set explicit expectations paired with structured opportunities (content-specific coaching, study groups) to build that knowledge","Assume teachers will build content knowledge informally over time","Address content gaps only if student performance data reveals a problem"], c:1,
 e:"PSEL 2 calls for establishing expectations and providing opportunities for teachers to strengthen content knowledge to achieve outcomes.",
 t:["Leaving teachers to research content standards alone offers no structured support to actually build the knowledge.","Pairing clear expectations with real support structures is what actually builds the needed content knowledge.","Assuming it will happen without structure leaves content gaps unaddressed indefinitely.","Waiting for a problem to surface in outcomes means students experience the gap before it's addressed."]},
{cat:"IL", q:"A principal wants to offer differentiated professional development so that both new and veteran teachers get what they individually need. Best approach?",
 o:["Focus all PD resources on new teachers, since they need it most","Offer the same core PD sessions to all staff, with additional optional resources available for those who want more","Offer a range of formats (mentoring for new teachers, book studies or peer coaching for veterans) matched to experience and need","Let veteran teachers opt out of all PD requirements"], c:2,
 e:"PSEL 2 calls for providing differentiated professional development opportunities suited to varying staff needs and experience.",
 t:["Concentrating resources only on new teachers leaves veteran teachers' distinct needs unmet.","Optional extra resources add some flexibility, but the core experience is still one-size-fits-all rather than genuinely differentiated by role and experience level.","Offering mentoring for new teachers and book studies or coaching for veterans actually differentiates support by need.","Letting veterans skip PD altogether removes any structured support for their continued growth."]},
{cat:"IL", q:"A principal wants to build teacher leadership capacity rather than centralize all instructional decisions in the principal's office. Best approach?",
 o:["Make all instructional decisions directly to ensure consistency","Rotate instructional leadership responsibilities randomly among staff","Delay building teacher leadership until the principal has more tenure at the school","Identify emerging teacher leaders and provide structured opportunities to lead PLCs, mentor peers, or pilot new practices"], c:3,
 e:"PSEL 2 calls for developing the capacity of faculty by providing support and opportunities for teacher leadership.",
 t:["Keeping every instructional decision with the principal is the opposite of building distributed teacher leadership.","Random rotation doesn't intentionally develop or leverage teachers' actual leadership strengths.","Delaying capacity-building for an arbitrary reason means teacher leadership goes undeveloped in the meantime.","Deliberately identifying and supporting emerging leaders is what actually builds distributed capacity."]},
{cat:"IL", q:"A principal wants to model ongoing self-reflection about their own instructional leadership effectiveness. Best approach?",
 o:["Review school-level outcome data each year and note personal areas for growth based on those trends","Avoid seeking feedback to maintain confidence in current practices","Seek regular informal peer feedback and engage in structured self-reflection alongside formal PD","Rely on annual formal evaluations from the superintendent as the sole source of feedback"], c:2,
 e:"PSEL 2 calls for understanding one's own learning and effectiveness through self-reflection, PD, and peer collaboration.",
 t:["Reviewing outcome data is a reasonable starting point, but without also seeking direct peer feedback and structured reflection, it's an indirect measure of the principal's own practice rather than the fuller picture the question calls for.","Avoiding feedback to preserve confidence directly contradicts the goal of genuine self-reflection.","Combining peer input with structured reflection alongside PD is what actually builds self-awareness over time.","A single annual outside evaluation is infrequent and doesn't provide the ongoing reflection the question calls for."]},
{cat:"IL", q:"A principal wants to foster continuous improvement of both individual and collective instructional capacity across the building. Best structural approach?",
 o:["Combine individual coaching with collective structures (PLCs, shared data review) that build capacity at both levels","Focus solely on schoolwide PD days","Address instructional capacity only through the formal evaluation process","Focus solely on individual teacher coaching cycles"], c:0,
 e:"PSEL 2 calls for fostering continuous improvement of both personal and collective instructional capacity, requiring both individual and collective structures.",
 t:["Pairing individual coaching with collective structures builds capacity at both levels simultaneously.","Schoolwide PD days alone don't provide the individualized coaching half of the equation.","Evaluation alone is infrequent and evaluative, not a genuine capacity-building structure.","Individual coaching alone misses the collective, shared-learning half of what's being asked for."]},
{cat:"IL", q:"A principal wants to strengthen teachers' knowledge of a newly adopted, more rigorous ELA curriculum. Best first step?",
 o:["Provide a one-day overview training on the new curriculum's structure and expectations","Distribute the new curriculum materials and trust teachers to self-train","Require teachers to attend a single vendor training session","Provide structured PD and ongoing coaching specifically focused on the demands of the new curriculum's rigor"], c:3,
 e:"PSEL 2 calls for strengthening teachers' knowledge of rigorous, standards-based instructional programs through structured, ongoing support.",
 t:["A one-day overview introduces the curriculum, but it doesn't provide the ongoing, structured coaching needed to actually build teachers' capacity to deliver its full rigor over time.","Leaving teachers to self-train on a more rigorous curriculum offers no structured support for the added demands.","One training session doesn't provide the ongoing coaching a more rigorous curriculum's demands require.","Sustained, structured support specifically focused on the new rigor is what actually builds teachers' capacity to deliver it."]},
{cat:"IL", q:"A principal wants grade-level teams to monitor individual student progress collaboratively rather than each teacher tracking data alone. Best approach?",
 o:["Require each teacher to submit progress data to the principal individually","Establish regular team meetings where teachers jointly review student progress data and plan interventions together","Address student progress only during formal parent conferences","Rely on the school counselor to track student progress across classrooms"], c:1,
 e:"PSEL 2 calls for working with teams to analyze student work and monitor student progress collaboratively.",
 t:["Individual submissions to the principal keep the data siloed rather than shared collaboratively among the team.","This is the direct definition of collaborative monitoring: the team reviewing data and planning interventions together.","Limiting review to conference time means most of the year goes without collaborative monitoring.","Delegating tracking to the counselor removes classroom teachers from the collaborative process entirely."]},
{cat:"IL", q:"A principal wants to ensure a new intervention program actually meets identified student needs rather than being adopted for convenience. Best approach?",
 o:["Adopt the program based on vendor marketing materials","Identify specific student needs through data first, then evaluate whether the program's design addresses those needs","Adopt the program because it requires the least implementation time","Adopt the program because it was recommended by a neighboring school"], c:1,
 e:"PSEL 2 calls for identifying student needs and developing plans to meet them through appropriate curricular and instructional practices.",
 t:["Marketing materials describe the vendor's claims, not evidence the program fits this school's specific needs.","Starting from actual student needs and checking whether the program addresses them avoids adopting for convenience.","Choosing based on ease of rollout ignores whether the program actually addresses identified needs.","Another school's recommendation doesn't confirm the program fits this school's specific student needs."]},
{cat:"IL", q:"A principal wants to ensure vertical alignment extends beyond the school's own grades to include the feeder middle school. Best approach?",
 o:["Establish ongoing collaborative meetings between the two schools' staff to discuss curriculum coherence","Share curriculum maps with the feeder school once a year and invite written feedback","Send the feeder school a copy of the school's curriculum map without further discussion","Assume alignment naturally occurs since both schools use the same state standards"], c:0,
 e:"PSEL 2 calls for ongoing development with feeder schools to ensure consistency and coherence of curriculum.",
 t:["Regular, ongoing conversation between the two schools' staff is what actually builds coherence over time.","An annual document exchange is a step toward coordination, but without live, ongoing dialogue between staff at both schools, it's a much thinner version of the collaborative alignment process the question calls for.","Sending a document without dialogue misses the two-way conversation alignment actually requires.","Using the same state standards doesn't guarantee the two schools are actually teaching them in a coherent sequence."]},
{cat:"IL", q:"A principal wants to confirm that a new school improvement plan fully aligns curriculum, instruction, assessment, and professional development with content standards. Best approach?",
 o:["Focus only on whether the assessments align with standards","Analyze the improvement plan holistically to ensure these elements are linked together systematically","Assume alignment exists since each component was developed independently by content experts","Review each element separately without checking their connections"], c:1,
 e:"PSEL 2 calls for assuring alignment of curriculum, instruction, assessment, and PD with content standards, reviewed as a connected system.",
 t:["Checking only one element misses whether it actually connects to the others in the plan.","Looking at how all the elements connect together is what actually confirms systemic alignment, not just individual pieces.","Independent development by different experts doesn't guarantee the pieces actually connect to each other.","Reviewing pieces separately, without checking their connections, is exactly what the question says to avoid."]},
{cat:"IL", q:"A principal wants to help a teacher expand their repertoire of differentiated teaching strategies for a highly diverse classroom. Best approach?",
 o:["Wait until formal evaluation to note a need for differentiation","Provide a general list of differentiation strategies via email","Observe the classroom, then co-plan specific differentiated strategies and materials suited to that teacher's students","Recommend the teacher attend a general differentiation workshop"], c:2,
 e:"PSEL 2 calls for assisting teachers with differentiated strategies and materials matched to their specific classroom context.",
 t:["Waiting until evaluation delays building a skill this teacher needs for the students in front of them now.","A generic list gives ideas but no support in applying them to this teacher's specific classroom.","Observing the actual classroom and co-planning together tailors the support to this teacher's specific students.","A general workshop isn't tailored to the specific classroom context the teacher is working in."]},
{cat:"IL", q:"A principal wants to identify research-based strategies specifically to close an opportunity gap in access to advanced math coursework. Best approach?",
 o:["Review current research on closing opportunity gaps, and match evidence-based strategies to the school's specific enrollment data","Set a general goal to 'increase access' without specifying strategies","Wait for the district to mandate a specific approach","Adopt whichever strategy the loudest advocate on staff proposes"], c:0,
 e:"PSEL 2 calls for identifying and using research-based and evidence-based strategies and practices to close opportunity and achievement gaps.",
 t:["Grounding strategy selection in both research and this school's actual enrollment data targets the real, specific gap.","A goal with no specified strategy gives no direction on what will actually change.","Waiting for direction from the district delays addressing a gap the school could start on now.","Whoever argues most persuasively on staff isn't the same as what the research or data actually supports."]},
{cat:"IL", q:"A principal wants classroom visits to yield feedback that's actually actionable rather than general praise or criticism. Best approach?",
 o:["Share only positive feedback to maintain staff morale","Focus feedback exclusively on areas of concern to drive urgency","Provide a single overall rating after each visit","Provide specific, evidence-based feedback tied to an observed practice, along with a concrete next step"], c:3,
 e:"PSEL 2 calls for conducting classroom visits that provide constructive, actionable feedback supporting faculty development.",
 t:["Positive-only feedback protects morale but gives no actionable direction for improvement.","Focusing solely on problems, without acknowledgment of what's working, misses balanced, actionable feedback.","A rating number gives no specific detail a teacher could act on.","Naming a specific observed practice and a concrete next step is what actually makes feedback usable."]},
{cat:"IL", q:"A principal wants to promote effective, equitable use of technology in instruction, ensuring all students have access, not just those in certain classrooms. Best first step?",
 o:["Address access only if a family raises a concern","Purchase additional devices without auditing current use","Audit actual classroom-level technology use and access patterns to identify and address gaps","Assume equitable access exists since the school owns enough devices for all students"], c:2,
 e:"PSEL 2 calls for providing students with access to technology tools that enhance learning, starting with an honest audit of actual use.",
 t:["Waiting for a complaint means unequal access could persist unnoticed for a long time.","Buying more devices doesn't fix unequal access if the actual usage patterns haven't been examined.","Actually looking at how technology is used classroom by classroom is the direct way to find where gaps exist.","Owning enough devices doesn't confirm they're being used equitably across classrooms."]},
{cat:"IL", q:"A principal wants to support teachers in using technology not just for content delivery but for meaningful assessment of student learning. Best approach?",
 o:["Model and coach specific ways technology can be used to assess and respond to student learning, not just deliver content","Leave technology-based assessment entirely to teacher discretion","Provide a list of approved assessment apps","Require a minimum number of technology-based assignments per week"], c:0,
 e:"PSEL 2 calls for supporting teachers in the use of technology in both instruction and assessment of student learning.",
 t:["Showing concrete examples of using tech to assess and respond to learning builds the actual skill being asked for.","Leaving it entirely up to individual teachers means many may never move beyond using tech for content delivery.","A list of apps doesn't teach teachers how to use them for meaningful assessment.","A quota measures frequency of use, not whether it's being used for meaningful assessment."]},
{cat:"IL", q:"A principal wants to use the school's assessment and accountability system to improve teaching and learning for every student, not just those near a proficiency cutoff. Best approach?",
 o:["Focus improvement efforts primarily on students just below the proficiency line","Review aggregate schoolwide proficiency rates each quarter alongside overall attendance trends","Facilitate ongoing analysis of performance data across all subgroups and achievement levels to inform instruction broadly","Address only the lowest-performing classroom's data"], c:2,
 e:"PSEL 2 calls for facilitating ongoing analyses of the performance of subgroups and all students, not a narrow band near a cutoff.",
 t:["Concentrating only on students near the proficiency line neglects students further from or above the cutoff.","Reviewing rates quarterly is more frequent monitoring, but aggregate numbers still mask how specific subgroups or achievement bands are performing, which the question specifically wants examined.","Looking broadly across every subgroup and achievement level ensures instruction serves every student, not just those near a cutoff.","Focusing on a single classroom ignores the schoolwide, every-student framing of the goal."]},
{cat:"IL", q:"A principal wants formative and summative assessment data to genuinely inform both teaching practice and program quality decisions. Best approach?",
 o:["Review assessment data only once per year during planning season","Use summative data only for external reporting requirements","Rely solely on formative data for internal decisions","Use both formative and summative data together to evaluate student learning, teaching effectiveness, and program quality"], c:3,
 e:"PSEL 2 calls for analyzing multiple sources of data, including formative and summative assessments, to evaluate learning and program quality.",
 t:["Reviewing only once a year misses using data to inform instruction throughout the year.","Using summative data solely for external reporting wastes its potential to inform instruction.","Relying only on formative data ignores what summative data can reveal about program quality.","Combining both data types gives a fuller picture of student learning, teaching effectiveness, and program quality together."]},
{cat:"IL", q:"A principal wants to communicate assessment data about schoolwide progress to families in a way that builds understanding, not confusion. Best approach?",
 o:["Share aggregate proficiency percentages without further context","Translate the data into a plain-language summary highlighting trends and next steps, alongside opportunities for questions","Share the same technical data report used with the school board","Share data only with families whose children are below proficiency"], c:1,
 e:"PSEL 2 calls for analyzing, interpreting, and communicating data to the school community about progress toward goals in an understandable way.",
 t:["Numbers alone, without context, can confuse rather than inform families.","Translating the data into accessible language with context and next steps is what actually builds family understanding.","A report written for a board audience isn't accessible to most families.","Limiting communication to certain families excludes the broader community from understanding schoolwide progress."]},
{cat:"IL", q:"A principal wants to support a team of teachers in developing classroom assessments that provide genuinely meaningful feedback to students, not just a grade. Best approach?",
 o:["Require all classroom assessments be approved by the principal before use","Facilitate collaborative time for teachers to review and refine assessments against a shared framework for meaningful feedback","Address assessment quality only during formal evaluation","Provide a generic assessment template for all classes to use"], c:1,
 e:"PSEL 2 calls for supporting teachers in developing classroom assessments aligned with the curriculum that provide meaningful feedback.",
 t:["Requiring sign-off adds a compliance step without building teachers' own capacity to write meaningful assessments.","Working together against a shared framework builds teachers' collective skill in writing assessments that give real feedback.","Waiting for the evaluation cycle to address assessment quality delays support that could happen year-round.","A one-size-fits-all template doesn't account for what different subjects or grade levels actually need to assess."]},
{cat:"IL", q:"A principal wants to ensure the assessments used in early childhood classrooms are appropriate to students' developmental stage, not simply scaled-down versions of upper-grade tests. Best approach?",
 o:["Review early childhood assessments against known child development and measurement standards, adjusting as needed","Rely on teacher intuition alone to judge appropriateness","Use the same assessment format across all grade levels for consistency","Eliminate formal assessment in early childhood grades entirely"], c:0,
 e:"PSEL 2 calls for using valid assessments consistent with knowledge of child development and technical standards of measurement.",
 t:["Checking early childhood assessments against known developmental standards is the direct way to confirm they're age-appropriate.","Intuition alone, without reference to developmental standards, risks inconsistent or inappropriate assessment practices.","Using the same assessment format for young children as older students ignores developmental differences the question specifically raises.","Removing assessment altogether goes too far and loses any way to understand how young children are developing."]},
{cat:"IL", q:"A principal wants walkthrough feedback processes to also build teachers' own capacity for self-reflection, not just receive principal feedback. Best approach?",
 o:["Provide detailed written feedback and ask teachers to read it before their next scheduled evaluation meeting","Pair each walkthrough with a brief reflective question for the teacher to consider and respond to before a follow-up conversation","Skip walkthrough feedback for teachers with strong overall ratings","Deliver feedback verbally only, with no documentation"], c:1,
 e:"PSEL 2 calls for supporting teachers' self-reflection alongside formal feedback as part of building instructional capacity.",
 t:["Asking teachers to read feedback ahead of a future meeting is a step toward engagement, but without a specific reflective question tied to that walkthrough and a prompt follow-up conversation, it still functions mostly as one-way feedback delivery.","Asking teachers to reflect before a follow-up conversation actively builds their own capacity for self-reflection, not just receiving feedback.","Skipping feedback for already-strong teachers misses ongoing opportunities for their continued growth and reflection.","Verbal-only feedback with no documentation makes it hard for teachers to revisit and reflect on their own growth over time."]},
{cat:"IL", q:"A principal wants a schoolwide focus on rigor to be genuinely reflected in daily instruction, not just in stated curriculum documents. Best way to verify this?",
 o:["Assume rigor is present since the curriculum was recently revised","Review the written curriculum for evidence of rigor","Ask department chairs to self-report on rigor in their classrooms","Combine curriculum review with walkthroughs and student work analysis to check whether rigor shows up in daily practice"], c:3,
 e:"PSEL 2 calls for creating a culture supporting rigor in both curriculum and instruction, verified through direct evidence, not documents alone.",
 t:["A recently revised curriculum document doesn't confirm rigor is actually happening in daily instruction.","Reviewing the document alone checks intent, not what's actually happening in classrooms.","Self-report from chairs is secondhand and may not accurately reflect classroom-level practice.","Triangulating documents with direct classroom evidence is what actually confirms rigor shows up in daily practice."]},
// ---------------- CLIMATE & CULTURE LEADERSHIP (CC) ----------------
{cat:"CC", q:"A principal wants staff to feel safe openly examining and discussing their beliefs about teaching and learning, even when those beliefs differ. Best approach?",
 o:["Address differing beliefs during one-on-one conversations with each teacher, then share common themes at a later staff meeting","Create structured spaces (book studies, protocol-based discussions) where staff can safely share differing beliefs","Address beliefs only when they surface as a conflict","Avoid surfacing differing beliefs to maintain harmony"], c:1,
 e:"PSEL 3 calls for creating opportunities and a safe environment for staff to examine and express beliefs about teaching and learning.",
 t:["Sharing common themes afterward adds some transparency, but staff still don't get the chance to safely engage with each other's differing views directly, which is what actually builds shared understanding across the whole group.","Structured, facilitated formats create the safety needed to explore differing beliefs together.","Waiting for conflict to surface means beliefs go unexamined until tension is already high.","Avoiding the topic entirely prevents the very growth the question is asking about."]},
{cat:"CC", q:"A principal wants to hold faculty accountable for maintaining a safe and supportive climate in their own classrooms. Best approach?",
 o:["Provide climate-related professional development to all staff at the start of the year","Assume climate is adequate unless a formal complaint is filed","Set clear, shared climate expectations and provide ongoing feedback and support toward meeting them","Address climate concerns only through the formal evaluation process"], c:2,
 e:"PSEL 3 calls for holding faculty and staff accountable for a safe and supportive climate through clear expectations and support.",
 t:["Upfront training sets a foundation, but without also providing ongoing feedback and support throughout the year toward clear expectations, a single start-of-year session doesn't sustain the accountability the situation calls for.","Waiting for a complaint is reactive and doesn't proactively hold staff accountable.","Setting shared expectations and providing continuing feedback actually builds accountability over time.","Limiting climate accountability to the infrequent formal evaluation misses ongoing support."]},
{cat:"CC", q:"A principal wants each student to be treated with an understanding of their specific culture and context, not a uniform approach. Best strategy to build this understanding among staff?",
 o:["Address cultural context only when a conflict arises","Support staff in learning about the specific cultural backgrounds and contexts represented in their own classrooms","Assume experienced teachers already understand their students' cultures","Provide a single cultural competency training covering broad generalizations"], c:1,
 e:"PSEL 3 calls for treating each student with an understanding of their specific culture and context, which requires specific, not generic, staff learning.",
 t:["Waiting for conflict means cultural understanding is reactive rather than a proactive foundation.","Learning about the actual, specific backgrounds represented builds understanding tailored to real students, not generalizations.","Assuming existing knowledge is sufficient skips verifying or building actual understanding.","Broad generalizations, by design, don't capture the specific context the question is asking staff to understand."]},
{cat:"CC", q:"A principal wants to integrate students' home languages and cultures into the learning environment, not just acknowledge them. Best approach?",
 o:["Display a few cultural posters in common areas","Host a single multicultural assembly each year","Incorporate students' languages and cultural knowledge into curriculum, classroom materials, and instructional practices","Address language and culture only in designated language-support classrooms"], c:2,
 e:"PSEL 3 calls for integrating the cultures and languages of the school community into the learning environment, not symbolic acknowledgment alone.",
 t:["Posters are passive acknowledgment, not integration into actual instruction.","One assembly per year doesn't integrate languages and cultures into daily learning.","Weaving students' languages and cultural knowledge into everyday instruction is genuine integration, not symbolic gesture.","Confining it to separate classrooms keeps it segregated rather than integrated into the general learning environment."]},
{cat:"CC", q:"A principal reviewing extracurricular participation data notices certain student groups are underrepresented in nearly every club and team. Best first step?",
 o:["Identify participation barriers (cost, transportation, scheduling) for underrepresented groups and address them directly","Address the pattern only if it appears in a formal equity audit","Assume the underrepresentation reflects student disinterest","Create a separate club specifically for the underrepresented group"], c:0,
 e:"PSEL 3 calls for ensuring equitable access to cocurricular programs by identifying and addressing specific opportunity gaps.",
 t:["Naming the actual barriers (cost, transportation, scheduling) is the direct way to fix why participation is low.","Waiting for an outside audit delays addressing a pattern the school can already see.","Assuming disinterest, without investigating barriers, risks missing the real cause.","A separate club addresses the symptom without opening up the existing clubs and teams these students are being excluded from."]},
{cat:"CC", q:"A principal investigating a student discipline incident wants to ensure the process protects the student's rights and due process. Best approach?",
 o:["Make a discipline decision quickly to resolve the matter before it escalates","Delay the decision indefinitely until every possible detail is gathered","Rely primarily on the reporting adult's account, briefly checking in with the student involved before deciding","Follow established procedures for a fair, timely, documented investigation that protects the student's rights"], c:3,
 e:"PSEL 3 calls for implementing discipline policies and practices that conduct legal, fair, and timely investigations while protecting privacy, rights, and due process.",
 t:["Rushing a decision risks skipping the fairness and rigor due process requires.","Delaying indefinitely denies timely resolution, which is also part of a fair process.","A brief check-in with the student adds a small additional step, but without a full, documented, fair investigation process, the decision still rests mainly on one account rather than the more rigorous, protected process due process requires.","Following an established, documented procedure is what actually protects both fairness and the student's rights."]},
{cat:"CC", q:"A principal notices a recurring pattern where students from a specific socioeconomic background are consistently placed in remedial course tracks regardless of assessment performance. Best first step?",
 o:["Increase remedial course offerings to accommodate the pattern","Review placement criteria and practices to identify and alter systems that may be perpetuating inequitable tracking","Address the pattern only if families formally request reconsideration","Review a sample of recent placement decisions to confirm they generally reflect assessment performance"], c:1,
 e:"PSEL 3 calls for identifying and altering systems of practice that perpetuate inequities and avoiding deficit-based schooling.",
 t:["Expanding remedial courses accommodates the pattern rather than questioning whether it's actually equitable.","Examining the actual criteria and practices is the direct way to find what's producing a pattern unrelated to assessment performance.","Waiting for individual families to push back leaves the systemic issue unaddressed for everyone else.","Spot-checking some placements is more rigorous than pure assumption, but a sample review of individual decisions doesn't examine whether the placement criteria and practices themselves are systemically producing the pattern the data shows."]},
{cat:"CC", q:"A principal wants to avoid deficit-based assumptions influencing how staff discuss students from under-resourced families. Best approach?",
 o:["Facilitate ongoing professional learning that helps staff recognize and reframe deficit-based language and assumptions","Address the issue only with individual teachers identified as having a pattern","Issue a one-time memo asking staff to avoid negative language","Address the language only when a parent complains"], c:0,
 e:"PSEL 3 calls for avoiding practices of deficit-based schooling, built through sustained professional learning rather than a single directive.",
 t:["Sustained learning to help staff recognize and reframe deficit language builds a lasting change in how they talk about students.","Addressing only flagged individuals misses building broader staff awareness of the issue.","A single memo asking staff to change language doesn't build the deeper understanding needed to actually shift assumptions.","Waiting for a complaint is reactive and leaves the pattern unaddressed until harm has already occurred."]},
{cat:"CC", q:"A principal wants to act with cultural competence when making a decision that will affect a specific cultural group differently than others. Best approach?",
 o:["Consult with a few staff members from various backgrounds generally, then make the decision","Consult with representatives of the affected cultural group and consider the decision's differentiated impact before finalizing it","Apply the same decision uniformly regardless of differentiated impact, to avoid appearing to show favoritism","Make the decision based on what has worked for the majority of students historically"], c:1,
 e:"PSEL 3 calls for acting with cultural competence and responsiveness in decision-making, including engaging affected groups directly.",
 t:["Broader staff input is useful, but consulting staff generally isn't the same as directly engaging representatives from the specific cultural group affected and weighing the decision's differentiated impact on them.","Directly engaging the group affected and weighing the real impact is what cultural competence in decision-making looks like.","Applying a decision uniformly despite known differentiated impact ignores the actual effect on the affected group.","Relying on majority historical patterns risks perpetuating the same impact the question flags as a concern."]},
{cat:"CC", q:"A principal receives a report suggesting a pattern of inequitable treatment toward a specific group of students by a particular team of teachers. Best first step?",
 o:["Address the report informally in a general staff email","Refer the matter entirely to the district equity office without school-level involvement","Investigate the report directly and specifically, gathering evidence before determining next steps","Wait for a second report to confirm the pattern"], c:2,
 e:"PSEL 3 calls for investigating reports of inequity directly as part of acting with cultural competence and responsiveness.",
 t:["A general email doesn't investigate the specific report or gather any evidence.","Handing it off entirely removes the school leader's own responsibility to investigate at the building level.","Direct, evidence-based investigation is the appropriate first step before deciding what action to take.","Waiting for confirmation before investigating leaves a credible first report unaddressed."]},
{cat:"CC", q:"A principal wants equity and cultural responsiveness reflected in all aspects of leadership, not just discipline or curriculum decisions. Which action best reflects this broader commitment?",
 o:["Address equity only in the annual school improvement plan document","Appoint an equity coordinator to review major decisions across hiring, scheduling, and resources before they're finalized","Focus equity efforts primarily on the discipline policy","Review hiring, scheduling, resource allocation, and communication practices through an equity lens, not just discipline"], c:3,
 e:"PSEL 3 calls for addressing matters of equity and cultural responsiveness in all aspects of leadership, not a single domain.",
 t:["Confining equity to a planning document doesn't translate to actual practices across the school.","An equity coordinator reviewing decisions is more integrated than a document-only approach, but centralizing that review in one person's check, rather than building equity consideration directly into how every leader approaches these practices, still limits how broadly the commitment is embedded.","Focusing only on discipline misses the other areas (hiring, scheduling, resources) where equity also matters.","Applying an equity lens across multiple domains reflects the broader commitment the question specifically asks about."]},
{cat:"CC", q:"A principal wants to understand the school's own traditions and cultural history well enough to lead thoughtfully through changes. Best approach?",
 o:["Learn the school's history and traditions from long-tenured staff and community members before making major cultural changes","Assume institutional knowledge is unnecessary since the school's mission is what matters","Focus only on current data rather than historical context","Rely solely on official school records for historical context"], c:0,
 e:"PSEL 3 calls for understanding the traditions and cultural history of the school and community as part of culturally responsive leadership.",
 t:["Learning directly from those who carry the school's history builds genuine understanding before making changes.","Assuming the mission alone is enough skips understanding the actual traditions and history at play.","Current data alone doesn't capture the historical and cultural context the question asks about.","Official records may miss the informal, lived history that community members and staff actually carry."]},
{cat:"CC", q:"A principal wants to build a comprehensive system of support for students' academic, social, emotional, and physical needs, not just academic needs. Best approach?",
 o:["Address social-emotional and physical needs only as individual concerns arise","Coordinate with counselors, social workers, and community health resources to build one coherent system of support","Rely on classroom teachers alone to identify and address all student needs","Focus primarily on academic interventions, since that is the school's core mission"], c:1,
 e:"PSEL 3 calls for building a safe, caring environment that meets students' academic, social, emotional, and physical needs through coordinated support.",
 t:["Reactive, case-by-case handling doesn't build the coordinated system the question describes.","Building a coordinated system across these roles is what actually addresses the full range of student needs together.","Expecting teachers alone to address academic, social, emotional, and physical needs overloads them without a coordinated support structure.","Focusing only on academics ignores the social, emotional, and physical needs the question explicitly includes."]},
{cat:"CC", q:"A principal wants to implement a schoolwide positive behavior support system rather than relying solely on punitive discipline. Best first step?",
 o:["Involve staff in designing the system's expectations and reinforcement structures before schoolwide rollout","Implement the system only in classrooms with the highest referral rates","Delay implementation until a full staff vote unanimously approves it","Announce the new system with a detailed explanation document and a Q&A session for staff"], c:0,
 e:"PSEL 3 calls for implementing support systems like positive behavior programs, most effectively built with staff involvement in design.",
 t:["Bringing staff into designing the system before it launches builds buy-in and better design than announcing it top-down.","Limiting it to certain classrooms misses building it as a schoolwide system.","Requiring full unanimity can stall implementation indefinitely.","A detailed explanation and Q&A session gives staff more information than a bare announcement, but staff still aren't involved in actually designing the system's expectations and reinforcement structures, which is what tends to build genuine buy-in before a schoolwide rollout."]},
{cat:"CC", q:"A principal wants to ensure economically disadvantaged students have access to programs addressing nutrition, hygiene, and medical needs. Best first step?",
 o:["Proactively identify and communicate available school and community outreach programs to families who may benefit","Refer all such requests directly to community agencies without school-level coordination","Assume existing programs are sufficient without reviewing participation data","Wait for families to request specific support services"], c:0,
 e:"PSEL 3 calls for facilitating the implementation of programs for economically disadvantaged students, requiring proactive outreach.",
 t:["Proactively reaching out to families ensures they know about and can access support that exists.","Referring without school-level coordination leaves families to navigate external systems alone.","Assuming sufficiency without reviewing participation risks missing families who aren't being reached.","Waiting for families to ask assumes they know what's available, which a proactive approach doesn't require."]},
{cat:"CC", q:"A principal wants every student to feel known, accepted, and valued as an active member of the school community. Which structural change would most directly support this goal?",
 o:["Recognizing top-performing students more frequently","Adding more extracurricular clubs for students to choose from","Increasing the frequency of schoolwide assemblies","Implement a consistent small-group structure (advisory, mentorship) where students build ongoing adult and peer relationships"], c:3,
 e:"PSEL 3 calls for creating an environment where each student is known, accepted, valued, and encouraged to be an active community member, best built through consistent relational structures.",
 t:["Recognizing high achievers more often leaves most students without the relational connection the question is asking about.","More clubs offer choice but don't guarantee every student builds a known relationship with an adult.","Assemblies are large-group events that don't build individual relationships.","A structure like advisory ensures every student, not just those who opt in, builds ongoing relationships."]},
{cat:"CC", q:"A principal wants to prevent harassment, intimidation, and bullying through both awareness and prevention, not just after-the-fact discipline. Best approach?",
 o:["Rely on the school's discipline policy to address incidents as they occur","Focus prevention efforts solely on the students who have been reported for bullying previously","Implement proactive awareness and prevention programming alongside a clear, responsive reporting and discipline system","Provide teachers training on bullying prevention strategies, allowing each to implement them at their discretion"], c:2,
 e:"PSEL 3 calls for ensuring the implementation of awareness and prevention programs addressing harassment, intimidation, and bullying, combined with responsive systems.",
 t:["Relying only on discipline after incidents is purely reactive, missing the prevention half of the question.","Focusing solely on past offenders misses preventing new incidents involving other students.","Combining prevention programming with a real reporting and discipline system covers both halves the question asks for.","Training gives teachers tools, but leaving implementation entirely to individual discretion, without a consistent schoolwide reporting and intervention system, still creates gaps in coverage across different classrooms."]},
{cat:"CC", q:"A principal wants to promote positive adult-student and peer relationships that support both academic learning and social-emotional development, not just one or the other. Best approach?",
 o:["Focus relationship-building efforts primarily through academic tutoring programs","Address social-emotional development only through the school counselor's caseload","Rely on individual teacher relationships without a schoolwide structure","Build structures (advisory, mentorship, peer support) that intentionally support both academic and social-emotional growth"], c:3,
 e:"PSEL 3 calls for promoting relationships that value both academic learning and positive social-emotional development together.",
 t:["Tutoring focuses only on the academic half, missing the social-emotional development also named in the question.","Routing social-emotional support only through the counselor keeps it separate from everyday relationships rather than integrated.","Without a schoolwide structure, support depends on which teacher a student happens to have.","Building structures that intentionally support both dimensions together is what the question specifically calls for."]},
{cat:"CC", q:"A principal wants to cultivate greater student engagement and reinforce positive conduct schoolwide, not just address negative behavior. Best approach?",
 o:["Build systems that recognize and reinforce positive engagement and conduct, alongside fair discipline practices","Focus primarily on tightening discipline consequences for negative behavior","Assume engagement will follow naturally from improved instruction alone","Address engagement only through individual teacher classroom management"], c:0,
 e:"PSEL 3 calls for cultivating and reinforcing student engagement and positive conduct as a proactive priority, not solely a reactive one.",
 t:["Adding systems that recognize positive engagement, alongside discipline, creates the proactive balance the question asks for.","Tightening consequences only addresses the negative side, not the proactive reinforcement the question wants.","Assuming better instruction alone will produce engagement skips building any deliberate reinforcement system.","Leaving it to individual teachers means there's no consistent schoolwide approach to reinforcing conduct."]},
{cat:"CC", q:"A principal wants staff to feel empowered to propose changes to school practices, not just implement decisions made elsewhere. Best approach?",
 o:["Ask staff informally during hallway conversations","Maintain a suggestion box without a clear process for follow-up","Hold a staff input session once each semester where ideas are collected for leadership review","Establish a clear, visible process for staff to propose and pilot ideas, with follow-through and feedback from leadership"], c:3,
 e:"PSEL 3 calls for empowering and motivating staff toward continuous improvement, which requires visible, structured avenues for their ideas.",
 t:["Informal conversations don't create a reliable, visible process staff can count on.","A box without visible follow-through offers no real sense that ideas are heard or acted on.","A semesterly session is more frequent than an annual survey, but if there's no clear, ongoing process for staff to actually propose and pilot ideas with visible follow-through, input sessions alone can still feel like they go into a black box.","A visible, structured process with real follow-through is what makes staff feel genuinely empowered, not just heard."]},
{cat:"CC", q:"A principal wants to develop open, trusting working relationships with staff who have historically been guarded with administration. Best first step?",
 o:["Consistently follow through on small commitments and communicate transparently to rebuild trust incrementally","Require staff to attend more one-on-one meetings with the principal","Wait for staff to initiate trust-building on their own","Address the guardedness directly in a whole-staff meeting"], c:0,
 e:"PSEL 3 calls for developing open, productive, caring, and trusting relationships, which are rebuilt through consistent, transparent follow-through over time.",
 t:["Consistent, small, transparent follow-through is what actually rebuilds trust incrementally over time.","Requiring more meetings doesn't itself build trust if the underlying follow-through and transparency aren't there.","Waiting for guarded staff to initiate trust-building on their own is unlikely to happen without the leader taking the first steps.","Calling out guardedness publicly in a group setting could increase discomfort rather than rebuild individual trust."]},
{cat:"CC", q:"A principal wants collaborative structures (PLCs, grade-level teams) to include genuine shared accountability, not just shared meeting time. Best approach?",
 o:["Require teams to submit meeting minutes without further follow-up","Schedule regular meeting time and let teams determine their own norms informally","Rotate team leadership monthly regardless of team goals","Establish clear shared goals and accountability structures (protocols, data reviews) alongside dedicated meeting time"], c:3,
 e:"PSEL 3 calls for creating structures that promote shared responsibility and accountability within the collaborative learning community, not just shared time.",
 t:["Requiring minutes without follow-up creates paperwork, not actual accountability for outcomes.","Just providing time and letting norms form informally doesn't establish real shared accountability.","Rotating leadership without connecting it to goals doesn't build accountability for outcomes.","Pairing dedicated time with clear goals and accountability structures like data reviews is what creates genuine shared accountability."]},
{cat:"CC", q:"A principal wants students with limited English proficiency to see their strengths and cultures reflected as assets in daily instruction, not as deficits to overcome. Best approach?",
 o:["Focus instructional support primarily on English language acquisition until proficiency improves","Address cultural assets only during designated cultural celebration events","Incorporate students' home languages and cultural knowledge into instruction as assets while building English proficiency","Group English learners separately until they reach a proficiency benchmark"], c:2,
 e:"PSEL 3 calls for recognizing and employing each student's strengths, diversity, and culture as assets for teaching and learning, not treating them as barriers.",
 t:["Focusing solely on English proficiency before addressing culture treats their existing strengths as secondary or irrelevant.","Confining cultural assets to occasional events keeps them separate from daily instruction.","Weaving students' existing knowledge into daily instruction is what actually treats it as an asset, not a separate add-on.","Separating students until a benchmark is met treats their current status as a barrier rather than building on their existing strengths now."]},
{cat:"CC", q:"A principal notices informal, exclusionary selection practices have repeatedly excluded students from leadership opportunities (student government, honor societies). Best first step?",
 o:["Assume current selection practices are fair since they've been used for years","Create a separate leadership opportunity exclusively for previously excluded students","Review selection criteria and processes for hidden barriers that may be excluding capable students","Ask student government advisors informally whether they've noticed any patterns in who gets selected"], c:2,
 e:"PSEL 3 calls for eliminating marginalization by examining and altering exclusionary systems of practice.",
 t:["Assuming fairness because a practice is long-standing doesn't verify whether it's actually equitable.","Creating a parallel opportunity works around the problem rather than fixing the exclusionary practices themselves.","Directly examining the selection process is what actually finds and removes the barriers causing exclusion.","Checking in with advisors adds a useful perspective, but relying on informal advisor impressions, rather than formally reviewing the actual selection criteria and process, may miss hidden structural barriers advisors themselves aren't aware of."]},
{cat:"CC", q:"A principal wants staff professional learning about equity to move beyond awareness into changed practice. Best approach?",
 o:["Distributing equity-related articles for staff to read independently","Sustained professional learning paired with coaching and peer observation that supports applying concepts to practice","A single annual equity training session covering foundational concepts","Addressing equity only through the discipline policy"], c:1,
 e:"PSEL 3 calls for sustained cultural competence development connected to practice, not one-time awareness-building alone.",
 t:["Independent reading builds awareness but doesn't provide the practice-based support needed to change behavior.","Pairing learning with coaching and peer observation is what actually helps staff apply concepts to their real practice.","A single annual session provides awareness but not the sustained support needed to change practice.","Limiting equity work to discipline misses the broader instructional and cultural practice change the question is asking about."]},
{cat:"CC", q:"A principal wants a shared staff commitment to high expectations to be visible in daily instructional practice, not just stated in the school's values. Best way to verify and reinforce this?",
 o:["Post the school's high-expectations statement in classrooms","Assume high expectations exist since the mission statement includes the phrase","Use walkthroughs and student work analysis to check for rigor and high expectations in daily practice, coaching where needed","Discuss high expectations as a standing agenda item at every staff meeting throughout the year"], c:2,
 e:"PSEL 3 calls for creating a culture of high expectations verified through direct evidence in practice, not statements alone.",
 t:["Posting a statement communicates intent but doesn't verify what's actually happening in instruction.","Assuming based on wording in a document doesn't confirm actual daily practice.","Directly checking classroom practice and student work is what verifies (and can reinforce) whether high expectations show up daily.","Regular discussion keeps the topic visible and top of mind, but talking about expectations in meetings doesn't verify what's actually happening in classrooms the way direct walkthroughs and student work analysis do."]},
{cat:"CC", q:"A principal wants a plan to reduce an identified achievement gap between two subgroups to include specific, monitored strategies, not just an aspirational statement. Best approach?",
 o:["State the general goal of closing the gap without further detail","Wait for the next full accountability cycle to develop a plan","Identify specific instructional and support strategies tied to the gap, with progress monitored on a regular schedule","Address the gap only through a single schoolwide assembly on the topic"], c:2,
 e:"PSEL 3 calls for developing plans to reduce achievement gaps with specific, monitored strategies, not aspirational statements alone.",
 t:["A general statement of intent provides no specific strategies or way to track progress.","Waiting delays addressing a gap that's already been identified.","Naming specific strategies and monitoring them on a schedule is what turns an aspiration into an actionable, trackable plan.","An assembly raises awareness but includes no specific instructional strategy or monitoring plan."]},
{cat:"CC", q:"A principal wants to ensure staff feel a healthy work-life balance is genuinely modeled by leadership, not just encouraged in words. Best approach?",
 o:["Encourage work-life balance only during designated wellness weeks","Assume staff will set their own boundaries without leadership modeling","Send staff wellness reminders via email","Model reasonable boundaries around after-hours communication and workload expectations as a leader, alongside verbal encouragement"], c:3,
 e:"PSEL 3 calls for promoting a healthy work-life balance for self and others, which requires leaders to model it, not just state it.",
 t:["Limiting modeling to designated weeks doesn't reflect the everyday behavior the question asks about.","Assuming staff will manage this alone, without leadership modeling, ignores what the question specifically asks for.","Sending reminders is a message, not a demonstrated behavior from leadership.","Actually modeling the behavior, not just stating it, is what makes work-life balance feel genuinely supported by leadership."]},
// ---------------- ETHICAL LEADERSHIP (EL) ----------------
{cat:"EL", q:"A principal notices a teacher posting complaints about specific students (without names but identifiable details) on a personal social media account. Best first step?",
 o:["Ask the teacher to make the account private","Address the practice directly with the teacher regarding appropriate technology use and student privacy, per policy","Wait for a parent complaint before addressing it","Ask the teacher to review the school's social media guidelines on their own"], c:1,
 e:"PSEL 4 calls for practicing and modeling appropriate technology use, including social media, and protecting student privacy and dignity.",
 t:["Making the account private doesn't address the underlying issue of discussing identifiable students inappropriately.","Addressing the practice directly, grounded in policy, is what actually corrects the behavior and protects student dignity.","Waiting for a parent complaint ignores a concern the school can already see and should act on.","Pointing the teacher toward the guidelines encourages self-review, but without a direct conversation addressing this specific practice and its privacy implications, there's no confirmation the underlying issue has actually been corrected."]},
{cat:"EL", q:"A principal is deciding how to handle a minor personal conflict of interest (a family member applying for a school volunteer position). Best approach?",
 o:["Approve the application but disclose the relationship informally to a few colleagues","Approve the application directly since it's a low-stakes volunteer role","Recuse from the decision and have another staff member apply the standard volunteer approval process","Deny the application to avoid any appearance of favoritism"], c:2,
 e:"PSEL 4 calls for modeling personal and professional integrity, which includes recusing from decisions involving personal conflicts of interest.",
 t:["Informal disclosure to a few colleagues doesn't replace stepping back from the actual decision.","Deciding personally on a family member's application, even a low-stakes one, is still a conflict of interest.","Stepping back and letting someone else apply the normal process is what actually removes the conflict of interest.","Denying outright, based on relationship alone rather than merit, is its own form of unfair treatment."]},
{cat:"EL", q:"A principal recognizes that a recent decision they made may have unintentionally violated a student's confidentiality rights. Best response?",
 o:["Address it only informally with the staff member involved","Acknowledge the error, take corrective action, and review procedures to prevent recurrence","Wait to see if the affected family notices before addressing it","Quietly adjust internal procedures going forward without directly addressing the specific incident that occurred"], c:1,
 e:"PSEL 4 calls for recognizing when ethics or rights have been breached and taking appropriate corrective action.",
 t:["Handling it only informally with staff misses correcting the actual impact on the student or family affected.","Acknowledging the mistake and reviewing procedures to prevent recurrence is what genuine accountability looks like.","Waiting to see if it's noticed treats correction as optional rather than a responsibility once an error is recognized.","Adjusting procedures shows some responsiveness, but without acknowledging and correcting the specific error that already happened, the family affected never receives the direct accountability the situation calls for."]},
{cat:"EL", q:"A principal wants to safeguard the value of social justice in how school resources are distributed among student groups. Best approach?",
 o:["Distribute resources based on identified need, ensuring historically underserved groups receive equitable access","Distribute resources based on which groups advocate most vocally","Maintain current resource distribution patterns to avoid controversy","Distribute resources equally across all groups regardless of need"], c:0,
 e:"PSEL 4 calls for safeguarding and promoting values of equity and social justice in resource decisions, based on need rather than equal division alone.",
 t:["Basing distribution on actual need is what makes equitable access to historically underserved groups a reality, not just a stated value.","Rewarding whoever advocates loudest isn't the same as distributing based on actual need.","Avoiding change to sidestep controversy preserves whatever inequities already exist in the current pattern.","Equal distribution regardless of need can still leave historically underserved groups without enough to close existing gaps."]},
