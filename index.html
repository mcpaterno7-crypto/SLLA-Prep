{cat:"EL", q:"A principal wants to use appropriate systems to protect the confidentiality of a staff member's ongoing medical leave. Best approach?",
 o:["Share general information with the staff member's team to explain the absence","Confirm details only if directly asked by a colleague","Limit information shared to what's operationally necessary, following established confidentiality procedures","Let staff draw their own conclusions without addressing it at all"], c:2,
 e:"PSEL 4 calls for using appropriate systems and procedures to protect the rights and confidentiality of faculty and staff.",
 t:["Sharing \"general information,\" even without specifics, still risks revealing more than necessary about a private medical matter.","Confirming details on request still discloses private medical information inappropriately.","Sharing only what's operationally needed, following established procedure, is what actually protects confidentiality.","Providing no information at all can create confusion and doesn't reflect an intentional, procedure-based approach."]},
{cat:"EL", q:"A principal remains ultimately responsible for each student's safety and well-being, even when tasks are delegated. Which situation most requires their direct, personal follow-through?",
 o:["Coordinating logistics for an upcoming school event","A serious, ongoing safety concern involving a specific student that has been only partially addressed by delegated staff","Scheduling the master schedule for the following year","Organizing routine school supply distribution"], c:1,
 e:"PSEL 4 calls for the principal to retain responsibility for each student's safety and well-being, especially for serious, unresolved concerns.",
 t:["Event logistics are routine operational tasks well suited to delegation without direct principal involvement.","A serious, unresolved safety concern is exactly the kind of situation where the principal's personal, direct follow-through matters most.","Master scheduling is an important but routine planning task appropriate for delegation.","Supply distribution is a routine logistical task that doesn't require the principal's personal, direct involvement."]},
{cat:"EL", q:"A principal wants a major disciplinary policy decision to be made through a transparent process where the rationale is clear to staff and families. Best approach?",
 o:["Announce the decision and rationale only if directly questioned","Proactively share the data and reasoning behind the decision before or alongside the announcement","Avoid explaining rationale to prevent further debate","Share the rationale with the school board and post a brief summary on the school website"], c:1,
 e:"PSEL 4 calls for modeling transparent decision-making by making data and rationales explicit and communicated proactively.",
 t:["Explaining the reasoning only when asked, rather than proactively, falls short of proactive transparency.","Sharing the reasoning up front, rather than waiting to be asked, is what makes the process genuinely transparent.","Avoiding explanation to prevent debate is the opposite of the transparency the question describes.","Posting a summary reaches more people than the board alone, but a brief summary posted passively still isn't the same as proactively sharing the fuller data and reasoning directly alongside the announcement to staff and families."]},
{cat:"EL", q:"A principal wants to disseminate school performance data transparently while respecting legal privacy constraints (e.g., small subgroup sizes). Best approach?",
 o:["Publish all data regardless of subgroup size for full transparency","Withhold all subgroup data to avoid any privacy risk","Share subgroup data only with the school board, not the public","Disseminate data as openly as possible within legal constraints, aggregating or suppressing where required to protect privacy"], c:3,
 e:"PSEL 4 calls for disseminating data transparently within legal constraints, balancing openness with privacy protection.",
 t:["Publishing without regard to subgroup size risks violating privacy protections for small groups.","Withholding everything sacrifices transparency that could be provided within legal limits.","Limiting distribution only to the board is more restrictive than legally necessary and undercuts public transparency.","Sharing as openly as legally possible, while protecting small subgroups as required, balances transparency and privacy."]},
{cat:"EL", q:"A principal wants to implement practices that hold both staff and students accountable for ethical behavior consistently, not selectively. Best approach?",
 o:["Focus accountability efforts primarily on students, since staff are already professionals","Apply clear, consistent accountability standards and processes to both staff and student conduct","Address accountability only when a formal complaint triggers it","Apply the same accountability standards to staff and students, but review student violations more frequently"], c:1,
 e:"PSEL 4 calls for implementing practices that hold faculty, staff, and students accountable for ethical and legal behavior consistently.",
 t:["Focusing mainly on students, since \"staff are already professionals,\" creates an uneven standard rather than consistent accountability.","Applying the same clear standards to both staff and student conduct is what actual consistency requires.","Waiting for a formal complaint before applying accountability standards isn't a consistent, proactive approach.","Reviewing student violations more frequently might seem responsive, but building in different levels of scrutiny by role still isn't the fully consistent, equal accountability standard the question specifically calls for."]},
{cat:"EL", q:"A principal wants to establish and maintain an inclusive school community where families of all backgrounds feel they belong. Best approach?",
 o:["Regularly review policies, communication, and practices to ensure they welcome and reflect all families in the community","Address inclusion only through a single annual diversity event","Rely on the demographics of the PTO board to represent all families","Address inclusion concerns as they're raised, and hold occasional listening sessions for interested families"], c:0,
 e:"PSEL 4 calls for establishing and maintaining an inclusive school community through ongoing, proactive practice, not isolated events.",
 t:["Regularly reviewing everyday policies and practices is what builds ongoing, genuine inclusion, not a one-time gesture.","A single annual event is the isolated approach that falls short of ongoing inclusive practice.","A single parent group's makeup doesn't guarantee it reflects every family's background or needs.","Occasional listening sessions add proactive elements beyond pure reaction, but without regularly reviewing the school's own policies and practices for how well they welcome all families, the approach still depends on families opting in rather than systemic review."]},
{cat:"EL", q:"A principal learns that unethical behavior by one staff member (falsifying attendance records) may be adversely affecting other students' access to services tied to accurate attendance data. Best response?",
 o:["Wait to see if the falsification recurs before taking action","Address the falsification directly and review whether other students were adversely affected, correcting any resulting harm","Address the falsification privately without examining downstream effects","Address it only if a family raises a concern about services"], c:1,
 e:"PSEL 4 calls for recognizing how unethical behavior may adversely affect students and adults and taking appropriate corrective action.",
 t:["Waiting for recurrence before acting leaves any current harm to students' service access unaddressed.","Directly addressing the falsification and checking who else was affected is what actually fixes the resulting harm, not just the immediate act.","Addressing it privately without checking effects on other students misses whether real harm needs correcting.","Waiting for a family to notice ignores a problem the school already knows exists."]},
{cat:"EL", q:"A principal wants to build in regular self-reflection and goal-setting for their own ethical leadership practice, not just react to incidents as they arise. Best approach?",
 o:["Set regular, structured opportunities for self-reflection and improvement goals related to ethical leadership practice","Assume ethical practice is sufficient without ongoing reflection","Reflect on ethical leadership only after a significant incident occurs","Review staff feedback survey results each year as the primary way to reflect on ethical leadership practice"], c:0,
 e:"PSEL 4 calls for understanding the importance of self-reflection and establishing goals for improvement in ethical leadership.",
 t:["Building in regular, structured reflection is what actually develops ethical leadership over time, not just reacting to problems.","Assuming current practice is fine without checking skips the ongoing reflection being asked about.","Reflecting only reactively, after something goes wrong, misses the proactive self-examination the question calls for.","Annual survey review is more structured than nothing, but relying primarily on one source of feedback, rather than building in the leader's own regular, structured self-reflection process, is a narrower approach than the question calls for."]},
{cat:"EL", q:"A principal is developing a new student enrollment policy and wants to ensure it provides equitable access for all students, including those without stable housing. Best approach?",
 o:["Review the policy specifically for barriers facing students without stable housing and build in appropriate accommodations","Apply the standard enrollment process uniformly without exception","Refer all such cases directly to the district office","Address such cases individually as they arise, without policy-level review"], c:0,
 e:"PSEL 4 calls for employing ethical decision-making regarding policies that provides equitable access for all students.",
 t:["Specifically checking the policy for barriers facing this group is what makes equitable access to enrollment a reality.","Applying the same process with no exceptions ignores that students without stable housing may face barriers the standard process doesn't address.","Referring every case away from the school avoids addressing the policy-level issue directly.","Handling only individual cases as they come up, without reviewing the policy itself, leaves the underlying barrier in place for future students."]},
{cat:"EL", q:"A principal wants hiring and promotion decisions to offer equitable access to all qualified staff, including those from underrepresented backgrounds. Best approach?",
 o:["Set hiring quotas without reviewing underlying practices","Review hiring and promotion practices for barriers and actively work to ensure equitable access for underrepresented staff","Address equity in hiring only if a complaint is filed","Review hiring data annually to confirm the practices meet legal requirements"], c:1,
 e:"PSEL 4 calls for offering equitable access to hiring and promotion for faculty and staff, requiring proactive review of practices.",
 t:["Setting quotas without examining what's actually creating barriers doesn't fix the underlying practices.","Actively reviewing and addressing barriers in hiring practices is what creates genuine equitable access.","Waiting for a complaint before reviewing practices misses barriers that exist but haven't been formally reported.","Annual data review is more active than doing nothing, but confirming only that practices meet the legal minimum doesn't achieve the more proactive work of actively identifying and removing barriers for underrepresented candidates."]},
{cat:"EL", q:"A principal wants to provide moral direction for the school during a divisive community controversy, without dictating a single viewpoint to staff or students. Best approach?",
 o:["Share a personal opinion on the controversy to provide clear direction","Reaffirm the school's shared values (respect, safety, inclusion) and model civil, ethical engagement with differing views","Avoid addressing the controversy at all to remain neutral","Direct staff to avoid discussing the controversy with students entirely"], c:1,
 e:"PSEL 4 calls for providing moral direction and promoting ethical behavior grounded in shared values, without imposing a single viewpoint.",
 t:["Sharing a personal opinion imposes a single viewpoint, which is exactly what the question says to avoid.","Grounding the response in shared values like respect and inclusion provides direction without dictating a single position on the controversy itself.","Avoiding it entirely leaves the school without any moral guidance during a time staff and students may need it.","Shutting down all discussion prevents any constructive, values-based engagement with the topic."]},
{cat:"EL", q:"A principal discovers a scheduling error has been quietly benefiting one teacher with a reduced course load for two years. Best response?",
 o:["Address it only if another teacher raises a concern","Correct the scheduling error transparently and communicate the change and rationale to those affected","Quietly correct it going forward without acknowledging the past discrepancy","Leave the arrangement in place since changing it now could cause disruption"], c:1,
 e:"PSEL 4 calls for modeling transparent, consistent decision-making, including correcting inequities once identified, communicated openly.",
 t:["Waiting for someone else to notice lets a known inequity continue in the meantime.","Fixing the error openly and explaining why is what models transparent correction of an identified inequity.","Fixing it quietly without acknowledging the past discrepancy misses the transparency the situation calls for.","Leaving a known inequity in place specifically to avoid disruption prioritizes convenience over fairness."]},
{cat:"EL", q:"A principal wants a new attendance policy to reflect the value of individual student responsibility while still supporting students facing genuine hardship. Best approach?",
 o:["Build in a clear process to consider documented hardship circumstances within an otherwise consistent policy","Address hardship circumstances only through informal, undocumented exceptions","Allow broad exceptions with no documentation required","Apply a strict, uniform policy with no consideration of individual circumstances"], c:0,
 e:"PSEL 4 calls for safeguarding individual freedom and responsibility while remaining consistent and documented, not applying an inflexible standard or unclear exceptions.",
 t:["Building a documented process for hardship within an otherwise consistent policy balances responsibility and genuine support.","Handling hardship only informally, without documentation, risks inconsistent application across students.","Allowing broad, undocumented exceptions undermines the consistency the policy needs to be fair.","A completely inflexible policy ignores genuine hardship circumstances the question specifically wants supported."]},
{cat:"EL", q:"A principal wants students' rights to privacy respected consistently when discussing individual student needs in staff meetings. Best approach?",
 o:["Share details only with the student's current teachers, regardless of the meeting's broader attendance","Limit discussion of individual student details to those with a legitimate need to know, following confidentiality procedures","Avoid discussing individual student needs in staff meetings altogether","Discuss individual student details openly to ensure all relevant staff are informed"], c:1,
 e:"PSEL 4 calls for using appropriate systems and procedures to protect the rights and confidentiality of students, based on legitimate need to know.",
 t:["Sharing based on who currently teaches the student, regardless of the meeting's broader attendance, doesn't reflect a \"need to know\" standard.","Limiting discussion based on legitimate need to know is what actually protects student confidentiality while still allowing necessary information sharing.","Avoiding all discussion of student needs prevents staff from getting information they may legitimately need to support the student.","Discussing details openly with everyone present, regardless of who actually needs to know, goes beyond what confidentiality allows."]},
{cat:"EL", q:"A principal is deciding whether to override the results of a fair but flawed process for selecting the teacher-of-the-year award, after discovering a scoring error inflated one candidate's total. Best response?",
 o:["Let the results stand since the award has already been announced","Quietly award both candidates without explaining the discrepancy","Delay any correction until the error is publicly discovered","Transparently correct the scoring error and communicate the correction and rationale to those involved"], c:3,
 e:"PSEL 4 calls for modeling transparent, consistent decision-making practices, including correcting known errors openly rather than avoiding them.",
 t:["Letting a known scoring error stand just because of timing prioritizes convenience over accuracy.","Awarding both without explaining the discrepancy avoids the transparency the situation calls for.","Waiting for the error to be discovered by others, rather than addressing it proactively, isn't transparent.","Correcting the error and explaining why is what models transparent, accountable decision-making even when it's uncomfortable."]},
{cat:"EL", q:"A principal wants to ensure a new discipline matrix is applied consistently and does not inadvertently disadvantage a particular group of students. Best approach before full implementation?",
 o:["Implement it only in grade levels with the most reported incidents","Implement the matrix schoolwide immediately, given time pressure","Review the outside organization's research supporting the matrix's fairness before implementing it schoolwide","Pilot the matrix and review disaggregated outcome data for early evidence of disparate impact before full implementation"], c:3,
 e:"PSEL 4 calls for safeguarding equity, which requires checking a new policy's real-world impact on subgroups before scaling it schoolwide.",
 t:["Implementing selectively by incident rate doesn't test for disparate impact across all student groups.","Rolling out schoolwide under time pressure skips checking for disparate impact before it affects many students.","Reviewing the organization's own research is more diligent than blind trust, but without piloting the matrix here and checking this school's own disaggregated outcome data, there's no direct evidence it won't have disparate impact in this specific context.","Piloting first and checking disaggregated outcomes is the direct way to catch disparate impact before scaling the matrix schoolwide."]},
{cat:"EL", q:"A principal learns that a well-intentioned staff member shared a struggling student's personal circumstances with other teachers without the family's consent, aiming to build a support network. Best response?",
 o:["Address the confidentiality breach directly with the staff member and review information-sharing procedures with the team","Take no action since the intent was supportive","Address it only if the family raises a formal complaint","Praise the collaborative intent without addressing the breach"], c:0,
 e:"PSEL 4 calls for protecting the confidentiality of students through appropriate systems and procedures, regardless of good intent behind a breach.",
 t:["Addressing the breach directly, despite good intent, is what actually protects confidentiality and prevents recurrence.","Good intent doesn't undo an actual breach of the family's confidentiality.","Waiting for a complaint ignores a breach the school already knows happened.","Praising the intent while ignoring the breach sends the message that confidentiality doesn't matter if the reason seems good."]},
{cat:"EL", q:"A principal wants ethical decision-making to guide a policy on students' use of personal devices, balancing safety with student responsibility. Best approach?",
 o:["Allow unrestricted use to avoid conflict","Develop a policy through stakeholder input that balances safety concerns with fostering student responsibility and trust","Ban personal devices outright without further consideration","Base the policy solely on what a neighboring school has implemented"], c:1,
 e:"PSEL 4 calls for safeguarding values of individual responsibility while addressing legitimate safety concerns through a thoughtful, inclusive process.",
 t:["Avoiding the issue by allowing unrestricted use skips balancing safety and responsibility altogether.","Developing the policy with input from those affected is what actually balances safety concerns with fostering responsibility.","An outright ban without consideration skips the balance between safety and student responsibility the question asks for.","Copying another school's policy doesn't account for this school's specific stakeholders or context."]},
{cat:"EL", q:"A principal wants to model consistent decision-making around a sensitive personnel matter without violating confidentiality. Best approach when staff ask for details?",
 o:["Decline to respond to any questions at all","Share partial details selectively with a few trusted staff members","Share full details to maintain transparency with the staff","Explain that confidentiality limits what can be shared, while affirming the matter is being handled through appropriate process"], c:3,
 e:"PSEL 4 calls for balancing transparent decision-making with the confidentiality protections owed to individuals in personnel matters.",
 t:["Refusing to respond at all can feel evasive rather than a balanced, transparent-as-possible response.","Selectively sharing details with only some staff creates inconsistency and still risks improper disclosure.","Sharing full details violates the confidentiality owed to the individual involved in the personnel matter.","Explaining that confidentiality limits disclosure, while confirming the matter is being handled, balances transparency with the individual's rights."]},
{cat:"EL", q:"A principal is deciding how to handle a report that a colleague administrator made a discriminatory remark during a hiring interview. Best first step?",
 o:["Dismiss the report since it was not made by the candidate directly","Investigate the report through appropriate district channels, protecting the confidentiality of those involved as appropriate","Address it informally with the colleague without further investigation","Ask a trusted colleague to informally check with the affected candidate about how the interview went"], c:1,
 e:"PSEL 4 calls for recognizing when ethics have been breached and taking appropriate action, including formal investigation of serious allegations.",
 t:["Who made the report doesn't change whether a serious allegation deserves investigation.","Investigating through appropriate channels, while protecting those involved, is the proper response to a serious allegation.","Handling a discriminatory remark informally understates the seriousness the allegation calls for.","Informally checking in shows some responsiveness, but an informal check-in outside established channels still isn't the same as a formal investigation that properly protects confidentiality and addresses a serious allegation."]},
{cat:"EL", q:"A principal wants to promote ethical behavior among students, not just staff, in how academic integrity violations are handled. Best approach?",
 o:["Address violations through a fair, educational process that reinforces the value of integrity while ensuring due process","Apply harsh, uniform discipline for any academic integrity violation regardless of context","Ignore minor violations to avoid overburdening the disciplinary process","Address academic integrity only through classroom teacher discretion, without a schoolwide approach"], c:0,
 e:"PSEL 4 calls for promoting ethical behavior among students through fair, educational processes, not just punitive uniformity.",
 t:["A fair, educational approach that also ensures due process teaches integrity rather than just punishing violations.","Applying the same harsh discipline regardless of context ignores the educational, developmental purpose the question emphasizes.","Ignoring violations, even minor ones, undermines the value of integrity the question wants reinforced.","Leaving it entirely to individual discretion means there's no consistent schoolwide approach to academic integrity."]},
{cat:"EL", q:"A principal wants a policy on staff use of school-issued devices and email to reflect appropriate ethical technology use expectations. Best approach to developing the policy?",
 o:["Leave technology use expectations undefined to avoid micromanaging staff","Develop clear, transparent expectations for appropriate use that balance accountability with reasonable staff autonomy","Adopt a strict policy focused solely on prohibited uses","Base the policy solely on what has caused problems at other schools"], c:1,
 e:"PSEL 4 calls for practicing and modeling appropriate technology use, balanced and clearly communicated rather than purely restrictive or undefined.",
 t:["Leaving expectations completely undefined provides no actual guidance on appropriate use.","Clear expectations that still respect staff autonomy is what actually reflects ethical, balanced policy-making.","A policy focused only on what's banned, with no positive guidance, is one-sided rather than balanced.","Building the policy solely around other schools' problems doesn't account for this school's specific staff and context."]},
{cat:"EL", q:"A principal wants a policy addressing dress code enforcement to avoid disproportionately targeting any one group of students. Best approach?",
 o:["Apply the existing dress code without reviewing enforcement patterns","Eliminate the dress code entirely to avoid any risk of disparity","Review enforcement data by student group and revise the policy or its application if disparities are found","Address disparities only if raised through a formal complaint"], c:2,
 e:"PSEL 4 calls for safeguarding equity, which requires examining whether policy enforcement disproportionately affects any group.",
 t:["Continuing to apply the code without checking enforcement patterns risks perpetuating an existing disparity unexamined.","Eliminating the policy altogether avoids the actual work of checking and fixing potential disparities in how it's enforced.","Directly examining enforcement data by student group is what actually reveals and allows fixing any disproportionate impact.","Waiting for a formal complaint ignores a pattern the school could proactively check for now."]},
{cat:"EL", q:"A principal must decide whether to approve a fundraiser proposed by a student group that could be seen as excluding students who can't afford to participate. Best approach?",
 o:["Approve it only for students who can demonstrate they can afford to participate","Approve the fundraiser as proposed since it was student-initiated","Work with the student group to modify the fundraiser so all students can participate regardless of financial means","Deny the fundraiser and suggest the student group propose a different activity instead"], c:2,
 e:"PSEL 4 calls for safeguarding equity and access, which requires adapting practices so all students can participate regardless of financial means.",
 t:["This directly formalizes the exclusion based on ability to pay, which is exactly the problem the question raises.","Being student-initiated doesn't change that the fundraiser as designed could exclude students based on financial means.","Modifying the fundraiser so all students can participate regardless of financial means directly resolves the equity concern.","Suggesting an alternative shows some support for the students' initiative, but denying the original idea outright, rather than working with the group to modify it, misses the chance to preserve their effort while fixing the equity concern."]},
{cat:"EL", q:"A principal wants a new peer-mentoring program to be run in a way that protects the privacy of both mentors and mentees regarding sensitive personal information shared. Best approach?",
 o:["Require mentors to report all conversations to school staff in full detail","Allow mentors to discuss whatever they judge helpful with school staff","Address confidentiality concerns only if an issue arises","Establish clear confidentiality guidelines and mandatory reporting boundaries for the program before it begins"], c:3,
 e:"PSEL 4 calls for using appropriate systems and procedures to protect confidentiality, established proactively before a program begins.",
 t:["Requiring full reporting of every conversation eliminates any real confidentiality for mentees sharing sensitive information.","Leaving disclosure entirely to individual mentor judgment creates inconsistent, unclear boundaries around sensitive information.","Waiting for a problem to arise means there's no clear guidance in place when sensitive information actually comes up.","Setting clear confidentiality guidelines and reporting boundaries before the program begins is what protects both mentors and mentees from the start."]},
{cat:"EL", q:"A principal wants ethical leadership modeled visibly enough that new staff learn expectations through observed practice, not just a handbook. Best approach?",
 o:["Address ethical expectations only if a new staff member's conduct becomes a concern","Rely on the staff handbook's ethics section during onboarding","Assume new staff will infer expectations from veteran colleagues","Model transparent, accountable decision-making visibly and consistently so new staff observe expectations in practice"], c:3,
 e:"PSEL 4 calls for modeling personal and professional ethics in visible practice as the clearest way to set expectations, not documentation alone.",
 t:["Waiting until a new staff member's conduct becomes a problem is reactive, not the visible modeling the question asks about.","A handbook section communicates policy but doesn't show new staff what ethical practice actually looks like day to day.","Assuming osmosis from colleagues, without deliberate visible modeling, leaves expectations unclear.","Consistently modeling ethical decision-making in visible practice is what actually teaches new staff the real expectations."]},
{cat:"EL", q:"A principal wants a whistleblower-style concern raised by a staff member about a financial irregularity to be handled in a way that protects the staff member from retaliation. Best approach?",
 o:["Ask the reporting staff member to raise the concern directly with the person involved first","Investigate the concern through appropriate channels while actively safeguarding the reporting staff member from retaliation","Delay investigation until the staff member is willing to be named publicly","Investigate the concern but do not take any specific steps to protect the reporting staff member"], c:1,
 e:"PSEL 4 calls for safeguarding individuals and holding others accountable for ethical behavior, which includes protecting those who report concerns in good faith.",
 t:["Requiring the reporting staff member to confront the person involved first defeats the purpose of protecting them from retaliation.","Investigating properly while actively safeguarding the reporter is what actually protects someone raising a concern in good faith.","Requiring public naming before investigating discourages reporting and increases retaliation risk.","Investigating the concern without taking any steps to protect the reporter leaves them exposed to retaliation."]},
// ---------------- ORGANIZATIONAL LEADERSHIP (OL) ----------------
{cat:"OL", q:"A principal is prioritizing a long list of facility needs (roof repair, playground equipment, HVAC) with limited annual funding. Best approach?",
 o:["Address needs in the order they appear on a master list, regardless of urgency","Address whichever need was requested most recently","Prioritize by documented safety risk and instructional impact, distinguishing urgent needs from long-range planning","Address only the need most visible to visiting families"], c:2,
 e:"PSEL 5 calls for prioritizing short-term and long-range facilities needs based on safety and impact, not visibility or arbitrary order.",
 t:["A list order that doesn't reflect urgency treats all items as equally pressing, which they likely aren't.","Recency of request doesn't reflect actual safety risk or impact.","Weighing documented safety risk and instructional impact, and distinguishing urgent from long-range needs, directs limited funding appropriately.","Visibility to visitors is a reputational consideration, not a measure of actual need or risk."]},
{cat:"OL", q:"A principal is developing a plan for community use of the school's facilities that complies with district policy. Best first step?",
 o:["Approve requests case-by-case based on personal judgment","Limit facility use to organizations the principal already knows well","Refer all facility use requests directly to the superintendent","Establish a clear, published process based on district policy that any community group can follow to request facility use"], c:3,
 e:"PSEL 5 calls for following district policy on facility use through a clear, equitable process available to the community.",
 t:["Deciding case-by-case on personal judgment, rather than a consistent process, risks unequal treatment.","Limiting access to known organizations excludes others equally entitled to request facility use.","Referring everything upward avoids establishing a workable school-level process.","A clear, published process based on district policy is what actually makes facility access equitable and available to any qualifying group."]},
{cat:"OL", q:"A principal wants to ensure the school is ready for an unannounced safety inspection at any time, not just before a scheduled one. Best approach?",
 o:["Address compliance issues only as they're identified during actual inspections","Assign inspection readiness primarily to facilities staff, with the principal checking in occasionally","Build ongoing compliance monitoring and routine checks into standard operating procedures year-round","Prepare intensively only when notified an inspection is upcoming"], c:2,
 e:"PSEL 5 calls for ensuring compliance with safety regulations and readiness for inspections through ongoing, not just reactive, monitoring.",
 t:["Waiting for an actual inspection to catch issues means problems go unaddressed in between.","Occasional principal check-ins add some oversight, but without building ongoing compliance monitoring directly into standard operating procedures year-round, readiness still depends on periodic spot-checks rather than a truly continuous system.","Making compliance monitoring part of everyday operations is what actually keeps the building ready at any time, not just before a scheduled visit.","Preparing only when notice arrives means the building isn't genuinely ready the rest of the time."]},
{cat:"OL", q:"A principal wants to implement an internet-use policy and actually monitor compliance, not just publish the policy. Best approach?",
 o:["Address violations only when a serious incident occurs","Publish clear expectations and pair them with a practical system for monitoring and addressing violations","Rely on students to self-report violations","Publish the policy in the student handbook and assume compliance"], c:1,
 e:"PSEL 5 calls for implementing an internet-use policy and monitoring compliance, not simply publishing expectations.",
 t:["Waiting for a serious incident before addressing violations misses catching problems early.","Pairing clear expectations with an actual system to monitor and address violations is what makes the policy more than words on paper.","Relying on self-reporting is unlikely to catch most violations.","Publishing alone, without any monitoring, doesn't verify whether the policy is actually being followed."]},
{cat:"OL", q:"A principal wants the school's daily operations and administrative systems to visibly reflect the school's stated mission and core values, not operate separately from them. Best approach?",
 o:["Address mission alignment only in the annual strategic plan document","Review key operational systems (scheduling, communication, recognition) for alignment with the mission and adjust as needed","Focus mission alignment efforts solely on instructional programs, not operations","Communicate the mission and values regularly to staff, trusting that awareness will shape how operations run"], c:1,
 e:"PSEL 5 calls for instituting and managing operations and administrative systems that promote the mission, vision, goals, and values directly.",
 t:["Confining mission alignment to a planning document doesn't ensure it shows up in daily operations.","Directly reviewing scheduling, communication, and recognition practices against the mission is what actually integrates it into daily operations.","Focusing only on instructional programs misses the operational systems the question specifically asks about.","Regular communication keeps the mission visible, but simply raising awareness doesn't verify whether specific operational systems like scheduling, communication, and recognition are actually structured to reflect it — that requires directly reviewing those systems."]},
{cat:"OL", q:"A principal is developing a collaborative budget process for the upcoming year rather than finalizing the budget alone. Best approach?",
 o:["Base the budget primarily on the prior year's allocations without further input","Draft the budget independently, then share it with staff for informational purposes","Delegate the entire budget process to the school's finance clerk","Involve staff and relevant stakeholders in identifying priorities before finalizing budget allocations"], c:3,
 e:"PSEL 5 calls for developing and monitoring a collaborative budget process, not a top-down or purely historical approach.",
 t:["Relying mainly on historical allocations skips the collaborative input the question asks for.","Sharing the budget only for information after it's drafted isn't genuine collaborative input.","Delegating the whole process away removes the principal's own strategic role in aligning the budget with priorities.","Bringing staff and stakeholders into identifying priorities before finalizing is what makes the process genuinely collaborative."]},
{cat:"OL", q:"A principal wants to act as a responsible, ethical steward of school resources when a vendor offers a bulk discount contingent on purchasing far more than the school currently needs. Best response?",
 o:["Accept the discount and store the surplus for future use","Evaluate actual need against the offer and purchase only what's justified by current and near-term needs","Decline any vendor discounts as a matter of policy","Accept the discount to reduce future budget requests"], c:1,
 e:"PSEL 5 calls for acting as a responsible, ethical, and accountable steward of the school's resources, guided by actual need.",
 t:["Accepting more than needed just because of a discount isn't responsible stewardship if it means spending on unnecessary surplus.","Basing the purchase on actual, justified need is what makes the decision a responsible use of resources.","An absolute no-discount policy is overly rigid and could forgo genuinely good, needs-based deals.","Accepting surplus specifically to reduce future requests treats the current budget as a place to stockpile rather than spend on identified need."]},
{cat:"OL", q:"A principal is developing an induction and mentoring plan for newly hired teachers as part of a broader recruitment and retention strategy. Best approach?",
 o:["Assign new teachers a mentor informally, based on availability","Provide induction support only during the first week of the school year","Develop a structured induction and mentoring plan with clear expectations, training for mentors, and regular check-ins","Rely on new teachers to seek out support as needed"], c:2,
 e:"PSEL 5 calls for planning effective induction and mentoring programs as part of recruiting, supporting, and retaining effective staff.",
 t:["Informal, availability-based pairing doesn't ensure the structured support the question specifically wants.","Limiting induction to the first week misses the ongoing support new teachers need throughout their first year.","A structured program with trained mentors and regular check-ins is what actually builds an effective induction and retention strategy.","Relying on new teachers to ask for help ignores that they may not know what support is available or feel comfortable asking."]},
{cat:"OL", q:"A principal wants the school's teacher recruitment process to be reflective of the diversity of the school community. Best approach?",
 o:["Proactively expand recruitment outreach to sources likely to reach a more diverse pool of qualified candidates","Rely solely on the district's central applicant pool","Focus recruitment efforts only on candidates referred by current staff","Set a target percentage for diverse hires and track progress toward it each year"], c:0,
 e:"PSEL 5 calls for ensuring a recruitment process reflective of the diversity of the school community through proactive outreach.",
 t:["Actively expanding where and how the school recruits is the direct way to reach a more diverse pool of qualified candidates.","Relying only on the existing central pool doesn't actively work toward a more diverse pool.","Relying only on staff referrals tends to reproduce the same networks rather than expanding diversity.","Tracking progress toward a target adds accountability, but setting a numeric target alone, without actually changing where and how the school recruits, doesn't address the recruitment process itself that determines who applies in the first place."]},
{cat:"OL", q:"A principal must assign a limited number of specialized support staff (reading specialists, counselors) across multiple grade levels with varying needs. Best approach?",
 o:["Assign support staff based on seniority of the grade-level teachers","Assign support staff based on which grade level requests the most support","Divide support staff time equally across all grade levels","Assign support staff based on documented student needs and legal requirements across grade levels"], c:3,
 e:"PSEL 5 calls for assigning personnel to address student needs, legal requirements, and equity goals, not equal division or requests alone.",
 t:["Teacher seniority doesn't reflect the actual support needs of students in that grade.","Requests reflect who asks, not necessarily where documented need and legal requirements are greatest.","Equal division ignores that needs vary by grade level, as the question states.","Allocating based on documented student needs and legal requirements directly serves both equity and compliance."]},
{cat:"OL", q:"A principal is evaluating whether an existing intervention program has adequate staffing to serve all eligible students, or whether additional hiring should be advocated for. Best approach?",
 o:["Advocate for additional hiring regardless of current program data","Wait for the district to identify staffing gaps independently","Analyze program enrollment and student need data against current staffing capacity to determine if additional hiring is justified","Assume current staffing is adequate unless a formal complaint arises"], c:2,
 e:"PSEL 5 calls for evaluating educational programs to ensure instructional and support needs are met, including advocating for hiring needs based on data.",
 t:["Advocating without data doesn't build a case grounded in actual need.","Waiting for the district to identify gaps on its own delays addressing something the school can investigate now.","Directly analyzing whether current staffing matches enrollment and need is what determines whether additional hiring is actually justified.","Assuming adequacy without checking data risks missing a real staffing shortfall."]},
{cat:"OL", q:"A principal wants to strategically manage personnel assignments heading into a year with a significant enrollment shift in one grade level. Best approach?",
 o:["Assign staffing changes based on which teachers request the grade level","Maintain current staffing assignments to avoid disruption","Address the shift only after the school year begins and actual enrollment is confirmed","Reassign or hire staff based on projected enrollment and identified student learning needs for that grade level"], c:3,
 e:"PSEL 5 calls for strategically managing personnel assignments to optimize student-learning needs, informed by enrollment projections.",
 t:["Teacher preference for a grade level doesn't account for whether staffing matches the projected enrollment shift.","Keeping assignments unchanged ignores the enrollment shift the question specifically describes.","Waiting until the year has already started to react means being unprepared for a shift that was already projected.","Proactively planning around projected enrollment and student needs ensures staffing is ready before the shift actually happens."]},
{cat:"OL", q:"A principal is developing a comprehensive safety and security plan in accordance with local, state, and federal policy. Best process to ensure the plan is both compliant and practical?",
 o:["Develop the plan per policy requirements while involving staff, students, and community members for practical input","Adopt the plan template provided by the state without modification","Develop the plan with the district safety office, then share a summary with staff for awareness","Delay development until a specific incident reveals a gap"], c:0,
 e:"PSEL 5 calls for developing a comprehensive safety plan in accordance with policy while involving appropriate stakeholders in its development.",
 t:["Meeting policy requirements while also gathering practical input from those who will use the plan produces something both compliant and workable.","An unmodified state template may be compliant but might not fit this specific school's practical needs.","Sharing a summary keeps staff informed, but gathering awareness after the fact isn't the same as involving staff, students, and community members directly in shaping the plan for practical, school-specific input before it's finalized.","Waiting for an incident to reveal gaps means the plan isn't actually ready when it's needed."]},
{cat:"OL", q:"A principal wants to ensure the school's safety and security plan stays current rather than becoming outdated. Best approach?",
 o:["Rely on staff to flag needed updates informally as they notice issues","Review the plan only when the district mandates an update","Finalize the plan once and revisit it only if a serious incident occurs","Conduct ongoing, scheduled reviews of the plan to ensure it remains current and effective"], c:3,
 e:"PSEL 5 calls for conducting ongoing reviews of the safety and security plan, not a one-time development process.",
 t:["Informal, ad hoc flagging doesn't ensure the plan is systematically reviewed and kept current.","Waiting for a mandate to review means the plan can go stale in the meantime.","Waiting for a serious incident to prompt review means the plan may already be outdated when it's needed most.","Regular, scheduled reviews are what actually keep the plan current and effective over time."]},
{cat:"OL", q:"A principal wants to develop a system of support ensuring the welfare and safety of both students and staff, not just students. Best approach?",
 o:["Focus welfare and safety planning primarily on student-facing systems","Address staff welfare only through the district's employee assistance program referral","Extend existing student support systems to also be available for staff to use when needed","Identify counseling and health services and align resources to meet the identified needs of both students and staff"], c:3,
 e:"PSEL 5 calls for developing a system of support for the welfare and safety of both students and staff, requiring resources aligned to both.",
 t:["Focusing mainly on students misses the staff welfare half the question specifically asks about.","Limiting staff support to a referral service is a narrow, passive approach compared to a full system of support.","Opening student systems to staff shows some inclusiveness, but staff often have distinct needs from students, so simply extending the same systems, rather than identifying and aligning resources specifically for staff, may not actually address what staff need.","Deliberately identifying and aligning resources for both students and staff is what builds a genuine system of support for both groups."]},
{cat:"OL", q:"A principal wants to involve teachers, students, and parents in developing guidelines for student safety (e.g., safe arrival/dismissal procedures). Best approach?",
 o:["Develop the guidelines administratively, then inform stakeholders of the final version","Address arrival/dismissal safety only if an incident occurs","Rely solely on the district's model guidelines without local input","Convene teachers, students, and parents early in the process to inform the guidelines before finalizing them"], c:3,
 e:"PSEL 5 calls for involving teachers, students, and parents in developing, implementing, and monitoring guidelines for student welfare and safety.",
 t:["Developing guidelines first and informing stakeholders afterward skips their input in shaping the actual guidelines.","Waiting for an incident to prompt guideline development is reactive rather than proactive planning.","A generic district model without local input may not fit this school's specific arrival and dismissal patterns.","Bringing teachers, students, and parents in early, before finalizing, ensures the guidelines reflect real, local input."]},
{cat:"OL", q:"A principal wants to stay current on student health program requirements (immunization records, vision screening) to ensure compliance. Best approach?",
 o:["Delegate all responsibility to the district health office without school-level tracking","Address compliance only when a family or state auditor raises a concern","Rely on the school nurse to independently manage all compliance without administrative oversight","Establish a regular process for the principal's office to review compliance status alongside the health office"], c:3,
 e:"PSEL 5 calls for being familiar with student health programs and ensuring compliance through active, not passive, oversight.",
 t:["Delegating entirely away removes the school-level tracking needed to catch issues specific to this building.","Waiting for a concern to surface is reactive rather than proactively ensuring compliance.","Leaving it entirely to the nurse without any administrative oversight misses a coordinated approach to compliance.","A regular process for the principal's office to review compliance alongside the health office ensures active, not passive, oversight."]},
{cat:"OL", q:"A principal is planning student safety programs, including background checks for volunteers and safe transportation procedures. Best approach?",
 o:["Address background checks and transportation safety only if concerns are raised","Limit safety planning to on-campus concerns, since transportation is a district responsibility","Rely on the district office to manage all volunteer background checks without school-level verification","Proactively implement and regularly review procedures for volunteer background checks and safe student transportation"], c:3,
 e:"PSEL 5 calls for planning student safety programs, including background checks and safe transportation, proactively and specifically at the school level.",
 t:["Waiting for concerns to arise before addressing safety programs is reactive rather than proactive.","Limiting scope to on-campus concerns ignores the school's role in student safety during transportation too.","Relying entirely on the district without any school-level verification misses a layer of oversight specific to this school's volunteers.","Proactively implementing and regularly reviewing these procedures is what ensures ongoing student safety, not just a one-time setup."]},
{cat:"OL", q:"A principal wants to identify and document key emergency support personnel, both inside and outside the school, and ensure this information is genuinely accessible during a crisis. Best approach?",
 o:["Update the list only after an actual emergency reveals a gap","Rely on staff to know who to contact based on experience","Maintain a list in the principal's personal files only","Maintain a clearly documented, regularly updated list accessible to relevant staff, with roles communicated in advance"], c:3,
 e:"PSEL 5 calls for identifying and documenting key emergency personnel and communicating that information clearly to appropriate parties in advance.",
 t:["Waiting for an actual emergency to reveal a gap means the information wasn't ready when needed.","Relying on informal staff knowledge risks confusion, especially for newer staff who lack that experience.","Keeping the list only in personal files makes it inaccessible to others who might need it during a crisis.","A clearly documented, accessible, and regularly updated list with roles communicated in advance is what ensures the information is actually usable during a real crisis."]},
{cat:"OL", q:"A principal wants to communicate safety expectations to the school community regularly, not just once at the start of the year. Best approach?",
 o:["Rely on the student handbook as the sole source of safety expectations","Communicate safety expectations regularly through multiple channels, documenting when and how this occurred","Communicate safety expectations only after an incident prompts the need","Share safety expectations once during back-to-school orientation"], c:1,
 e:"PSEL 5 calls for communicating with stakeholders regularly about safety expectations and documenting that communication.",
 t:["A single handbook mention, without ongoing communication, doesn't meet the \"regularly\" the question specifically asks for.","Communicating regularly through multiple channels, and documenting it, is what actually keeps safety expectations current and visible.","Waiting for an incident to prompt communication is reactive rather than the regular communication the question calls for.","A single mention at the start of the year doesn't provide the ongoing reinforcement regular communication requires."]},
{cat:"OL", q:"A principal is deciding how to allocate a grant intended to improve operational efficiency. Best approach?",
 o:["Use the funds for whichever operational need is most visible to visitors","Use the funds evenly across all departments regardless of documented need","Save half the funds in case of a future emergency, spending the rest on the most visible operational need","Assess current operational systems for the most impactful use of the funds tied to the school's efficiency and mission"], c:3,
 e:"PSEL 5 calls for using resources, including grants, to improve the quality and efficiency of operations tied to identified needs.",
 t:["Visibility to visitors is a reputational factor, not a measure of actual operational efficiency impact.","Even distribution regardless of documented need doesn't target where efficiency gains would actually happen.","Splitting the funds hedges against future uncertainty, but it doesn't fully use the grant for its stated purpose of improving current operational efficiency, and the remaining half is still directed by visibility rather than an actual assessment of impact.","Assessing current systems to find the most impactful use ties the grant directly to actual efficiency and mission goals."]},
{cat:"OL", q:"A principal wants a new data system's rollout to be monitored for whether it's actually improving operational efficiency, not just implemented and forgotten. Best approach?",
 o:["Establish specific metrics to monitor whether the new system is improving efficiency, and adjust processes as needed","Rely on the vendor's marketing claims about efficiency gains","Assume efficiency has improved once the system is fully implemented","Review the system's effectiveness only if staff complain"], c:0,
 e:"PSEL 5 calls for using technology to improve the quality and efficiency of operations, verified through ongoing monitoring, not assumption.",
 t:["Setting specific metrics to track is what actually verifies whether the system is improving efficiency, rather than assuming it.","Vendor claims describe intended benefits, not verified results at this specific school.","Assuming improvement without measurement skips confirming whether the investment is actually paying off.","Waiting for complaints to trigger review misses ongoing, proactive monitoring of the system's actual impact."]},
{cat:"OL", q:"A principal wants facility improvement decisions to reflect both short-term needs (a broken door lock) and long-range planning (an aging roof). Best approach?",
 o:["Address urgent short-term needs immediately while maintaining a documented long-range facilities plan","Address only short-term needs as they arise, deferring all long-range planning","Alternate focus between short-term and long-range needs by year, regardless of urgency","Focus primarily on long-range planning, addressing short-term needs only as budget allows"], c:0,
 e:"PSEL 5 calls for prioritizing both short-term and long-range facilities needs simultaneously, not favoring one at the expense of the other.",
 t:["Handling urgent short-term needs immediately while maintaining a long-range plan addresses both timeframes the question specifically names.","Deferring all long-range planning means larger issues, like the aging roof, never get proactively addressed.","Alternating focus regardless of actual urgency could delay a genuinely urgent short-term need in a \"long-range\" year.","Deprioritizing urgent short-term needs like the broken door lock risks real, immediate safety or operational problems."]},
{cat:"OL", q:"A principal is deciding how to structure oversight of a newly hired assistant principal's first year to ensure accountability without micromanaging. Best approach?",
 o:["Rely primarily on the district's new-administrator training program, checking in with the assistant principal informally once a month","Provide minimal oversight to demonstrate trust","Require the assistant principal to seek approval for every decision during the first year","Establish clear expectations and regular check-ins, paired with growing autonomy as competence is demonstrated"], c:3,
 e:"PSEL 5 calls for strategically managing personnel, providing structured support that builds capacity and appropriate autonomy over time.",
 t:["Monthly informal check-ins add some direct contact beyond the training program alone, but without clear expectations and regularly scheduled check-ins paired with intentionally growing autonomy, oversight still isn't as structured as the situation calls for.","Providing minimal oversight risks the new AP struggling without adequate support during their first year.","Requiring approval for every single decision is the micromanaging the question specifically wants to avoid.","Pairing clear expectations and regular check-ins with increasing autonomy over time balances accountability with avoiding micromanagement."]},
{cat:"OL", q:"A principal wants to ensure the school's data systems deliver accountable information without creating excessive burden on teachers to input data. Best approach?",
 o:["Require teachers to enter the same data in multiple separate systems for redundancy","Reduce data collection requirements to the legal minimum only","Streamline data collection to the essential fields needed for accountability and decision-making, minimizing redundant entry","Add more required data fields to ensure comprehensive information"], c:2,
 e:"PSEL 5 calls for using and maintaining data systems to deliver accountable information efficiently, balancing thoroughness with practicality.",
 t:["Requiring redundant entry across multiple systems adds burden without adding value.","Cutting collection to the bare legal minimum may not capture what's actually needed for good decision-making.","Streamlining to what's actually essential balances thorough accountability with respecting teachers' time.","Adding more fields increases the very burden the question is asking how to avoid."]},
{cat:"OL", q:"A principal must decide how to respond to a state audit finding related to facilities compliance. Best approach?",
 o:["Dispute the finding to avoid the cost of remediation","Delegate the response entirely to the facilities vendor without administrative oversight","Address the finding only if it recurs in a future audit","Develop and implement a documented corrective action plan addressing the finding within the required timeline"], c:3,
 e:"PSEL 5 calls for ensuring compliance with safety regulations, which requires a timely, documented response to audit findings.",
 t:["Disputing a finding to avoid cost, rather than addressing it, doesn't resolve the actual compliance issue.","Delegating the response entirely away removes the school's own accountability for the finding.","Waiting for a finding to recur before acting delays a fix that's already been identified as necessary.","Developing and following a documented corrective action plan within the required timeline is what actually resolves the audit finding responsibly."]},
{cat:"OL", q:"A principal wants a plan for acquiring and maintaining instructional technology that accounts for the full lifecycle of the equipment, not just the initial purchase. Best approach?",
 o:["Address maintenance needs only as devices begin to fail","Build a plan that accounts for acquisition, ongoing maintenance, and eventual replacement of technology","Focus the budget primarily on purchasing the maximum number of devices","Rely on the vendor to manage all maintenance without a school-level plan"], c:1,
 e:"PSEL 5 calls for developing a plan for acquisition and maintenance of equipment and technology, covering the full lifecycle.",
 t:["Waiting for devices to fail before addressing maintenance means disruptions happen before they're planned for.","Planning for the full lifecycle, not just the purchase, is what actually sustains the technology over time.","Focusing spending only on buying as many devices as possible ignores the ongoing maintenance and eventual replacement costs.","Relying entirely on the vendor without a school-level plan leaves gaps in the school's own responsibility for the technology's lifecycle."]},
{cat:"OL", q:"A principal is deciding how to respond to a facilities emergency (a burst pipe flooding several classrooms) during the school day. Best immediate approach?",
 o:["Delay addressing the situation until after the school day ends","Wait for district facilities staff to arrive before taking any action","Focus first on facilities repair to minimize instructional disruption","Follow the emergency response plan to ensure student and staff safety first, then coordinate facilities repair"], c:3,
 e:"PSEL 5 calls for proactively addressing challenges to physical safety first, following an established emergency response plan.",
 t:["Delaying response to an active flooding emergency risks worsening damage and safety concerns.","Waiting for outside staff to arrive before taking any action delays addressing immediate safety needs.","Prioritizing minimizing instructional disruption over safety gets the order of priorities backwards.","Following the emergency response plan to secure safety first, then coordinating repair, is what actually protects students and staff during an active emergency."]},
{cat:"OL", q:"A principal is deciding how to allocate limited professional support staff (school psychologist hours) across a building with varying levels of need by grade level. Best approach?",
 o:["Allocate hours based on the psychologist's personal preference","Divide hours equally across all grade levels","Allocate hours based on documented student need and legal requirements (e.g., evaluation timelines) across grade levels","Allocate hours based on historical patterns from the past three years"], c:2,
 e:"PSEL 5 calls for assigning personnel to address student needs and legal requirements, not equal division or preference.",
 t:["Personal preference doesn't reflect where documented student need and legal requirements actually are.","Equal division ignores that need varies by grade level, as the question specifically states.","Allocating based on documented need and legal requirements like evaluation timelines directly serves both compliance and actual student need.","Historical patterns offer a useful data point, but past patterns may not reflect this year's actual documented needs and legal requirements, like current evaluation timelines, which should drive the allocation."]},
{cat:"OL", q:"A principal wants a new master schedule to reflect both instructional priorities and operational efficiency. Best approach when building it?",
 o:["Prioritize operational convenience (e.g., minimizing room changes) over instructional priorities","Build the schedule starting from instructional priorities, then optimize for operational efficiency within that framework","Delegate scheduling entirely to a scheduling software without further review","Use the same schedule structure as the previous year to save planning time"], c:1,
 e:"PSEL 5 calls for aligning operations with the mission and goals, meaning instructional priorities should shape the schedule, not the reverse.",
 t:["Prioritizing convenience, like minimizing room changes, over instructional priorities gets the order backwards.","Building the schedule around instructional priorities first, then optimizing efficiency within that, keeps the schedule serving its core purpose.","Delegating entirely to software without further review risks a schedule that's efficient on paper but doesn't reflect actual instructional priorities.","Reusing the same structure regardless of current instructional priorities may not reflect what's actually needed this year."]},
{cat:"OL", q:"A principal is deciding whether to approve overtime pay for support staff during a facilities crunch before a major event. Best approach?",
 o:["Approve overtime for whichever tasks seem most urgent based on a quick walkthrough of the building","Approve overtime without reviewing the budget impact","Review the budget impact and necessity, approving overtime only for essential, time-sensitive work","Deny all overtime requests regardless of circumstances"], c:2,
 e:"PSEL 5 calls for acting as a responsible, accountable steward of resources, requiring a needs-based review before approving added costs.",
 t:["A quick walkthrough assessment is more informed than pure first-come approval, but without actually reviewing the budget impact alongside necessity, the approval still isn't grounded in a full evaluation of both factors together.","Approving without checking the budget impact risks overspending without regard to necessity.","Reviewing both the budget impact and actual necessity before approving ensures overtime spending is justified.","An absolute denial, regardless of circumstances, could leave genuinely essential, time-sensitive work undone before a major event."]},
{cat:"OL", q:"A principal wants a plan for facilities maintenance requests to be transparent and trackable for staff who submit them. Best approach?",
 o:["Address requests only during a designated annual maintenance review","Require all requests go directly to the principal personally","Implement a documented system for submitting, tracking, and prioritizing maintenance requests","Handle maintenance requests informally as they're mentioned in passing"], c:2,
 e:"PSEL 5 calls for instituting and managing operational systems that function reliably and transparently, not informal handling.",
 t:["Limiting requests to a once-a-year review window means most issues go unaddressed for months.","Routing every request through the principal personally isn't scalable and doesn't create a trackable system others can use.","A documented system that lets staff submit and track requests is what actually makes the process transparent and reliable.","Handling requests informally, based on chance mentions, isn't trackable or reliable for staff who submit them."]},
{cat:"OL", q:"A principal is deciding how to structure onboarding for new support staff (custodial, cafeteria) to align with the school's broader safety and culture expectations. Best approach?",
 o:["Provide onboarding focused solely on job-specific tasks","Assume support staff will learn expectations informally over time","Include safety protocols and culture expectations alongside job-specific training in onboarding for all staff, not just teachers","Limit onboarding to a brief orientation document"], c:2,
 e:"PSEL 5 calls for ensuring a safe environment and modeling the mission across all staff roles, requiring onboarding that includes all staff, not only teachers.",
 t:["Focusing only on job tasks skips the safety and culture expectations the question specifically wants included.","Assuming informal learning will cover safety and culture expectations leaves those expectations unclear from day one.","Including safety protocols and culture expectations in onboarding for all staff, not just teachers, ensures everyone starts with the same shared expectations.","A brief document alone doesn't provide the same grounding as structured onboarding that includes these expectations."]},
{cat:"OL", q:"A principal is deciding whether to invest limited operational funds in a facilities upgrade or additional instructional support staff. Best approach to this trade-off?",
 o:["Evaluate both options against documented student needs and the school's strategic priorities before deciding","Default to whichever option costs less","Choose additional staff by default, since staffing is always the higher priority","Choose the facilities upgrade, since physical improvements have lasting value"], c:0,
 e:"PSEL 5 calls for allocating resources based on student needs within the framework of the school's goals, not a default rule favoring one category.",
 t:["Weighing both options against documented student needs and strategic priorities is what makes the trade-off decision evidence-based rather than a default rule.","Defaulting to the cheaper option regardless of actual need doesn't reflect a needs-based decision.","Treating one category as automatically higher priority skips actually weighing this specific trade-off against real needs.","Assuming facilities upgrades are inherently the better choice, without weighing actual student needs, is its own kind of default rule."]},
// ---------------- COMMUNITY ENGAGEMENT LEADERSHIP (CE) ----------------
{cat:"CE", q:"A principal wants to remove specific barriers to learning identified by families (lack of transportation to tutoring, no quiet study space at home). Best first step?",
 o:["Address only the barriers the school can solve without community involvement","Assume the school cannot address barriers outside the school day","Refer families to a general list of community agencies that might help with transportation or study space","Collaborate with family and community resources to identify and address specific barriers, like transportation or study space"], c:3,
 e:"PSEL 6 calls for accessing and using resources from the school, family, and community to remove barriers to learning collaboratively.",
 t:["Limiting to only what the school alone can solve misses the collaborative resources the question specifically points to.","Assuming the school has no role outside the school day dismisses barriers like transportation or study space that the school could help address.","Providing a list of agencies gives families a starting point, but without the school actively coordinating and following up on those specific barriers together with families and community resources, it puts the burden of navigating those connections entirely on the family.","Actively collaborating to address the specific named barriers is what directly responds to what families identified."]},
{cat:"CE", q:"A principal wants families to have a genuine role in decisions about their children's individual educational placement, not just general schoolwide decisions. Best approach?",
 o:["Inform families of placement decisions after they are finalized","Rely on teacher recommendations alone for placement decisions","Involve families as active participants in placement discussions, with input considered before decisions are finalized","Involve families only when required by law (e.g., special education placements)"], c:2,
 e:"PSEL 6 calls for supporting and engaging families in decision-making about their children's individual education, not just schoolwide matters.",
 t:["Informing families only after the decision is made excludes them from having any real influence.","Relying solely on teacher recommendations leaves out the family's own perspective on their child's placement.","Involving families as genuine participants, with input considered before the decision is made, is what gives them a real role.","Limiting family involvement to only legally required cases misses giving families a voice in other individual placement decisions too."]},
{cat:"CE", q:"A principal wants to communicate schoolwide updates using a variety of channels (social media, email, evening meetings) to reach the broadest range of families. Best approach to selecting channels?",
 o:["Assess which channels different segments of the family community actually use and rely on, and use a mix accordingly","Use whichever single channel is most convenient for the school office","Prioritize in-person meetings as the main channel, supplemented occasionally by email","Use only the channel with the largest reach numerically"], c:0,
 e:"PSEL 6 calls for using effective public information strategies across multiple channels matched to how families actually communicate.",
 t:["Basing channel selection on what families actually use, rather than assumption, is what actually reaches the broadest range.","Choosing based on office convenience, rather than family use patterns, may miss many families.","Adding occasional email supplements a purely in-person approach, but without actually assessing which channels different family segments use and rely on, the choice is still based on assumption about what works best rather than actual data.","Focusing only on the single largest-reach channel could still miss specific family segments who don't use it."]},
{cat:"CE", q:"A principal wants two-way communication with families to be modeled consistently by all staff, not just the principal's office. Best approach?",
 o:["Handle all family communication centrally through the principal's office","Address communication concerns only if a family complains","Train and support staff schoolwide in two-way communication practices with families","Leave communication style entirely to individual teacher preference"], c:2,
 e:"PSEL 6 calls for modeling the need for two-way communication broadly, requiring schoolwide staff capacity, not centralization.",
 t:["Centralizing all communication through one office is the opposite of building schoolwide two-way communication capacity.","Waiting for complaints before addressing communication practices is reactive, not the modeling the question asks for.","Building this capacity across all staff, not just the principal's office, is what makes two-way communication a schoolwide practice.","Leaving it entirely to individual preference means inconsistent communication practices across the school."]},
{cat:"CE", q:"A principal wants to build positive family partnerships by genuinely celebrating educational successes, not just addressing problems. Best approach?",
 o:["Rely on students to share their own successes with families informally","Communicate with families primarily when addressing behavioral or academic concerns","Celebrate successes only at the end-of-year awards ceremony","Create regular, visible opportunities to celebrate and share student and school successes with families"], c:3,
 e:"PSEL 6 calls for applying communication strategies that include recognizing and celebrating educational success, not only addressing concerns.",
 t:["Relying on students to share their own successes is inconsistent and doesn't build a structured practice.","Communicating primarily about problems reinforces a one-sided, deficit-focused relationship with families.","A single annual ceremony doesn't provide the regular celebration opportunities the question is asking about.","Creating regular, visible opportunities throughout the year is what builds genuine, ongoing positive partnership with families."]},
{cat:"CE", q:"A principal wants to demonstrate genuine ability to communicate effectively with local media beyond simply following protocol. Best approach?",
 o:["Provide only the minimum required statement to avoid extended engagement","Let a single designated staff member handle all interactions without broader message preparation","Avoid media engagement whenever possible","Prepare clear, accurate messaging in advance, and engage proactively and professionally within district guidelines"], c:3,
 e:"PSEL 6 calls for demonstrating an ability to communicate effectively with the media, which requires proactive preparation, not just minimal compliance.",
 t:["Providing only the bare minimum misses demonstrating genuine, proactive communication skill.","Relying on one person without broader message preparation limits consistent, well-prepared communication.","Avoiding engagement whenever possible is the opposite of demonstrating effective media communication.","Preparing clear messaging ahead of time and engaging proactively within guidelines is what demonstrates genuine communication skill, not just compliance."]},
{cat:"CE", q:"A principal wants to genuinely identify the competing perspectives of different stakeholder groups (teachers, families, students) before a major decision. Best approach?",
 o:["Address competing perspectives only if conflict arises after a decision is made","Gather input at open forums where any stakeholder can attend and share their views","Proactively gather input from each distinct stakeholder group separately to understand their specific perspectives","Assume staff perspectives adequately represent all stakeholders"], c:2,
 e:"PSEL 6 calls for identifying the competing perspectives of faculty, staff, students, parents, and community members proactively.",
 t:["Waiting for conflict to arise after a decision is already made misses the chance to understand differing perspectives before finalizing anything.","Open forums invite broader participation than relying only on the loudest voices, but without proactively and separately gathering input from each distinct stakeholder group, quieter groups may still be underrepresented compared to those who show up and speak at the open forum.","Gathering input separately from each group directly captures where teachers, families, and students actually agree or differ, rather than assuming or guessing.","Assuming staff views stand in for everyone skips actually hearing from families and students, who may see the situation very differently."]},
