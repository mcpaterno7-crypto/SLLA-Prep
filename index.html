 t:["Matching candidate qualifications to identified student needs directly serves the goal of effective staffing.","Occasional outreach beyond the central pool is a step further than relying on it exclusively, but without a deliberate, expanded recruitment strategy matched to this school's specific needs, the pool of candidates considered may still be too narrow for a hard-to-staff school.","Prioritizing one factor above qualifications and fit risks overlooking what students actually need instructionally.","Filling quickly, without matching to specific needs, prioritizes speed over fit."]},
{cat:"OL", q:"A principal must decide how to allocate a new instructional coach position across departments. Best approach?",
 o:["Split time evenly regardless of need","Assign the coach wherever the principal has the closest relationships","Allocate based on data showing where instructional support needs are greatest","Let departments bid for the coach's time"], c:2,
 e:"PSEL 5 calls for strategically managing personnel assignments to optimize student learning needs based on data, not equal division or preference.",
 t:["Even division ignores that instructional support needs vary by department.","Basing the assignment on personal relationships rather than need is exactly what the standard cautions against.","Using data on where needs are greatest directly ties the coach's placement to actual instructional impact.","Bidding rewards whichever department pushes hardest, not necessarily where the need is greatest."]},
{cat:"OL", q:"A principal is developing a technology acquisition plan. Which consideration is most important?",
 o:["Matching whatever a neighboring school purchased","Getting the newest available technology regardless of cost","Prioritizing whichever vendor offers the steepest discount","Aligning purchases with instructional goals and planning for maintenance and training"], c:3,
 e:"PSEL 5 calls for using technology to improve operations while planning for acquisition, maintenance, and appropriate use tied to goals.",
 t:["What another school bought doesn't confirm it fits this school's specific instructional goals.","Prioritizing novelty over cost ignores whether the technology actually serves instructional goals.","Choosing based on discount size, rather than fit, can result in tools that don't serve the school's actual needs.","Tying purchases to instructional goals and planning for their full use over time is what makes a technology plan effective."]},
{cat:"OL", q:"A principal wants to delegate responsibilities effectively among the leadership team. Which task is most appropriate to delegate?",
 o:["Handling a serious student disciplinary appeal","Responding to a formal parent complaint against a staff member","Delivering a teacher's formal performance evaluation","Organizing the school's community event logistics"], c:3,
 e:"PSEL 5 distinguishes tasks that can be delegated from sensitive, confidential responsibilities best kept within school leadership.",
 t:["A serious disciplinary appeal involves sensitive judgment that should stay with school leadership.","A formal complaint against a staff member is a sensitive matter appropriate for the principal's direct involvement.","Delivering a formal evaluation is a supervisory responsibility that shouldn't be delegated away.","Event logistics are an appropriate operational task to delegate, freeing leadership for more sensitive responsibilities."]},
{cat:"OL", q:"A principal is developing an emergency response plan and must identify key personnel. Best approach?",
 o:["Address roles only during an actual emergency","Provide general training on emergency procedures during the annual staff orientation","Rely entirely on the district's central emergency plan without site-specific detail","Explicitly document and communicate emergency roles and responsibilities to all relevant staff"], c:3,
 e:"PSEL 5 calls for identifying and documenting key emergency support personnel and communicating this information clearly in advance.",
 t:["Waiting until an actual emergency to sort out roles is far too late for effective response.","General orientation training introduces the topic, but without explicitly documenting and communicating specific individual roles and responsibilities, staff may still be unclear about exactly what they're supposed to do when an actual emergency happens.","A district-wide plan without site-specific detail misses the building-specific roles an actual emergency requires.","Clearly documenting and communicating specific roles ahead of time is what ensures people know what to do when an emergency actually happens."]},
{cat:"OL", q:"A principal notices the school's data and communication systems are outdated, slowing decision-making. Best first step?",
 o:["Wait for the district to mandate a system upgrade","Purchase the newest available system immediately","Assess current data needs and gaps before selecting a system that fits those needs","Ask a few department chairs informally whether the current systems are causing problems"], c:2,
 e:"PSEL 5 calls for maintaining data and communication systems to deliver accountable information, which starts with a needs assessment.",
 t:["Waiting for a mandate lets the slowdown in decision-making continue in the meantime.","Buying immediately, without assessing actual needs, risks acquiring a system that doesn't fit the school's specific gaps.","Understanding the actual needs first ensures whatever system is chosen actually addresses the real gaps.","Informal check-ins with a few chairs gather some perspective, but without a fuller assessment of actual data needs and gaps across the whole school, the picture may be incomplete before selecting a new system."]},
{cat:"OL", q:"A principal is asked to approve after-hours community use of school facilities. Which condition should guide the decision most?",
 o:["Whether the group requests the space on a weekday","Whether the use is consistent with district policy on equitable access to facilities for community groups","Whether the requesting organization can pay a high rental fee","Whether the principal personally supports the organization's mission"], c:1,
 e:"PSEL 5 calls for following district policy on facility use to ensure equitable, consistent access for community groups.",
 t:["Day of the week isn't a meaningful equity or policy consideration for facility use.","Grounding the decision in district policy ensures consistent, equitable treatment of all community groups.","Basing approval on ability to pay a high fee favors wealthier groups over equitable access.","Personal approval or disapproval of an organization's mission isn't a legitimate basis for facility-use decisions."]},
{cat:"OL", q:"A principal must assign teachers to grade levels for the upcoming year amid several retirements. Best approach?",
 o:["Assign based on matching teacher strengths and certifications to identified student needs","Assign based on which grade level each teacher taught most recently, to minimize adjustment","Let teachers choose their assignments without regard to need","Assign based on seniority alone"], c:0,
 e:"PSEL 5 calls for strategically managing personnel assignments to optimize student-learning needs.",
 t:["Matching teacher strengths and credentials to the specific needs of each grade level directly serves student learning.","Building on recent experience reduces some adjustment period, but it doesn't specifically match teacher strengths and certifications to the particular needs of students in that grade level next year.","Choice without regard to need risks a mismatch between teacher strengths and what students in that grade actually require.","Seniority alone doesn't account for which teacher's specific strengths best fit which grade level's needs."]},
{cat:"OL", q:"A principal wants to evaluate whether current staffing supports all instructional programs adequately. Best approach?",
 o:["Maintain current staffing since no formal complaints have arisen","Wait for staff to report being overwhelmed","Compare staffing ratios to neighboring schools and adjust to match the average","Analyze program needs against current staffing and identify gaps tied to student outcomes"], c:3,
 e:"PSEL 5 calls for evaluating educational programs to ensure instructional and support needs are met, grounded in program-specific data.",
 t:["Absence of complaints doesn't confirm staffing actually supports every program adequately.","Waiting for staff distress before evaluating misses proactively catching a staffing gap.","Matching a neighboring average is a data-informed approach, but other schools' ratios don't reflect this school's own specific program needs and outcomes, which is what the evaluation should actually be grounded in.","Directly analyzing whether staffing meets actual program needs and outcomes is the evidence-based way to check adequacy."]},
{cat:"OL", q:"A principal discovers a facilities inspection is due within the month and the building has known maintenance issues. Best first step?",
 o:["Delay addressing the issues until after the inspection","Request the inspection be postponed","Prioritize and address the most critical safety-related issues immediately, documenting the plan for the rest","Address only issues visible during a walkthrough"], c:2,
 e:"PSEL 5 calls for ensuring compliance with safety regulations and readiness for inspections by prioritizing critical issues promptly.",
 t:["Delaying known safety-related issues until after the inspection prioritizes appearances over actual safety.","Postponing the inspection avoids addressing the actual maintenance issues rather than fixing them.","Addressing the most urgent safety concerns right away, while documenting a plan for the rest, is the responsible way to handle limited time before an inspection.","Limiting fixes to only what's visible during a walkthrough may miss known issues that aren't immediately apparent."]},
{cat:"OL", q:"A principal is managing a limited substitute teacher budget during a wave of staff absences. Best prioritization approach?",
 o:["Ask teachers to cover extra classes during their planning periods as the default solution","Prioritize substitute coverage for classrooms with the highest instructional stakes (e.g., testing windows, new content)","Combine classes to avoid using substitutes at all","Assign the first available substitute to any open classroom"], c:1,
 e:"PSEL 5 calls for allocating limited resources based on student needs, prioritizing where instructional impact is greatest.",
 t:["Making teacher coverage during their own planning periods the default solution adds burden to staff rather than prioritizing substitute funds strategically.","Directing limited substitute coverage to classrooms with the highest instructional stakes protects where the impact of an absence would be greatest.","Combining classes to avoid the cost entirely can compromise instruction more than a well-placed substitute would.","Assigning substitutes without regard to which classroom needs coverage most doesn't prioritize instructional impact."]},
{cat:"OL", q:"A principal wants a new student data system to genuinely support instructional decisions, not just record-keeping. Best implementation approach?",
 o:["Delay full rollout until the district requires it","Require the system be used only for compliance reporting initially","Roll out the system to all staff, providing a detailed reference guide and several training sessions throughout the first month","Pilot with a group of teachers, gather feedback, and build training around actual instructional use cases"], c:3,
 e:"PSEL 5 calls for using technology to improve the quality and efficiency of operations in ways tied to actual practice, built through piloting and feedback.",
 t:["Delaying indefinitely means the school misses out on a potentially useful tool without ever testing its fit.","Framing it as compliance-only from the start undercuts the goal of using it to support actual instructional decisions.","Multiple training sessions and a reference guide are more thorough than one session, but training everyone at once still skips piloting with a smaller group first to work out real instructional use cases before scaling schoolwide.","Piloting first and building training around real use cases ensures the system actually gets used to support decisions, not just data entry."]},
{cat:"OL", q:"A principal is deciding how to handle a request to use a portion of the school's outdoor field for a community farmers' market. Best process?",
 o:["Evaluate the request against facility-use policy, safety, and equitable access considerations before deciding","Approve only if the market agrees to donate proceeds to the school","Approve based on personal judgment about community benefit","Deny automatically since it's a non-educational use"], c:0,
 e:"PSEL 5 calls for following established procedures for community use of school facilities rather than ad hoc personal judgment.",
 t:["Applying the established policy and considerations consistently is what ensures a fair, defensible decision.","Making approval conditional on a donation shifts the basis for the decision away from policy and equity considerations.","Deciding based on personal judgment about community benefit, rather than policy, risks inconsistent treatment of similar requests.","Automatically denying based on a category label skips actually evaluating the request against policy."]},
// ---------------- COMMUNITY ENGAGEMENT LEADERSHIP (CE) ----------------
{cat:"CE", q:"Parents petition for immediate removal of library books they find objectionable, while district policy requires a formal reconsideration process. Best response?",
 o:["Acknowledge the concern, explain and follow the formal reconsideration process, and keep parents informed","Refuse to discuss the matter further","Ignore the request since it involves a small group","Remove the books immediately to satisfy the parents"], c:0,
 e:"PSEL 6 calls for supporting family engagement in decisions while honoring established, equitable processes.",
 t:["This honors the district's established process while still engaging genuinely with the parents' concern.","Refusing to engage at all dismisses the parents' concern rather than channeling it appropriately.","Dismissing the request because it's a small group ignores that any family's concern deserves a proper process.","Immediately removing the books bypasses the very reconsideration process the district requires."]},
{cat:"CE", q:"A principal wants to increase family engagement in a community with many working parents unable to attend daytime events. Best strategy?",
 o:["Offer varied engagement formats (evening/virtual options, translated materials) based on family input","Continue current events since attendance has always been low","Focus outreach only on families who already attend regularly","Require attendance as a condition of student participation in activities"], c:0,
 e:"PSEL 6 calls for using effective public information strategies, including varied formats and languages, to reach all families.",
 t:["Offering evening/virtual options and translated materials, informed by what families actually need, directly addresses the barrier described.","Continuing the same events that already have low attendance doesn't address why turnout has been low.","Focusing only on families who already attend does nothing to reach the working parents the question is about.","Making attendance mandatory for student participation punishes families rather than removing the barrier."]},
{cat:"CE", q:"A local business offers to donate equipment in exchange for prominent on-campus advertising. Best response?",
 o:["Accept immediately given the value of the donation","Decline automatically since it involves advertising","Review the offer against district policy on outside partnerships and advertising before deciding","Accept the donation and draft a simple agreement outlining the advertising terms"], c:2,
 e:"PSEL 6 calls for developing mutually beneficial relationships within district policy, not accepting or rejecting offers ad hoc.",
 t:["Accepting without reviewing policy skips checking whether the arrangement is appropriate.","Automatically declining without review misses a potentially legitimate partnership opportunity.","Checking the offer against established policy ensures the partnership is handled appropriately, not ad hoc.","Drafting a simple agreement is more formal than an informal arrangement, but doing so without first checking the offer against district policy on outside partnerships and advertising skips the review that determines whether the arrangement is appropriate in the first place."]},
{cat:"CE", q:"A principal wants family input on a major decision (e.g., schedule change) but has struggled with low turnout at meetings. Best approach?",
 o:["Make the decision based on the input gathered so far","Diversify outreach methods and format (surveys, small group sessions, multiple languages) to reach underrepresented families","Delay the decision indefinitely until turnout improves","Proceed with the decision since the meeting requirement was met"], c:1,
 e:"PSEL 6 calls for supporting and engaging families in decision-making using appropriate, varied communication strategies.",
 t:["Deciding based on limited input, without addressing why turnout was low, may not reflect the broader family perspective.","Trying varied formats and channels is the direct way to reach families the current meeting format isn't capturing.","Delaying indefinitely avoids making a needed decision rather than fixing the actual outreach problem.","Meeting a technical requirement doesn't mean genuine family input was actually gathered."]},
{cat:"CE", q:"A reporter contacts a principal about a sensitive incident at the school. Best first response?",
 o:["Follow the district's media communication protocol, providing accurate information within appropriate limits","Refer the reporter to a student for comment","Decline all comment","Speak freely and informally to build rapport with the reporter"], c:0,
 e:"PSEL 6 calls for using appropriate strategies for communicating effectively with the media, following established protocol.",
 t:["Following established protocol balances providing accurate information with appropriate limits on a sensitive matter.","Referring media to a student is inappropriate and puts a student in a position they shouldn't be in.","Declining all comment misses an opportunity to provide appropriate, accurate information within protocol.","Speaking freely and informally risks sharing information outside appropriate limits on a sensitive matter."]},
{cat:"CE", q:"A principal wants to build partnerships with community organizations to support student needs (e.g., health, housing). Best first step?",
 o:["Partner only with organizations recommended by the district","Proactively map community assets and identify potential partners aligned with identified student needs","Post a general call for community partners on the school website and wait for responses","Focus solely on partnerships that provide financial donations"], c:1,
 e:"PSEL 6 calls for identifying and using community resources appropriately to support student learning, starting with a proactive needs match.",
 t:["Limiting to only district recommendations may miss partners that specifically match this school's identified needs.","Actively identifying community assets that match specific student needs is what builds genuinely useful partnerships.","Posting a general call is more active than pure waiting, but it still relies on organizations discovering and responding to the post rather than the school proactively mapping community assets and specifically identifying partners aligned with identified student needs.","Limiting focus to only financial donations misses non-monetary partnerships that could directly serve health or housing needs."]},
{cat:"CE", q:"Some families feel excluded from school decision-making processes due to language barriers. Best systemic fix?",
 o:["Build multilingual communication and interpretation into all major engagement processes, not just materials","Address it only when a specific family raises a concern","Provide translated materials for major documents only","Rely on bilingual staff informally as needed"], c:0,
 e:"PSEL 6 calls for effective public information strategies across multiple languages built into the process itself, not translated documents alone.",
 t:["Building multilingual support into the engagement process itself, not just materials, is what actually removes the language barrier.","Reactive handling means families continue to be excluded until they specifically speak up.","Translating documents alone doesn't address barriers in live meetings or interactive decision-making processes.","Informal reliance on bilingual staff is inconsistent and not a systemic fix."]},
{cat:"CE", q:"A principal is planning a schoolwide event to celebrate student achievement. Best approach to maximize community connection?",
 o:["Delegate all planning entirely to a parent volunteer without staff coordination","Host the event during the school day for convenience","Schedule and format the event based on community accessibility, and invite diverse community stakeholders","Limit invitations to high-achieving students' families"], c:2,
 e:"PSEL 6 calls for celebrating success in ways that engage the full community, requiring accessible scheduling and broad invitation.",
 t:["Delegating entirely without staff coordination risks a poorly planned event that doesn't reflect school priorities.","Scheduling only during the school day excludes families who work and can't attend.","Planning around community accessibility and inviting a broad range of stakeholders is what maximizes genuine community connection.","Limiting invitations to only high-achieving students' families excludes much of the community from a schoolwide celebration."]},
{cat:"CE", q:"A principal wants ongoing, two-way communication with families rather than one-way announcements. Best approach?",
 o:["Establish regular feedback channels (surveys, forums) alongside informational communication","Increase the length of existing newsletters","Add a comments feature to the school's existing social media posts so families can respond","Send more frequent newsletters"], c:0,
 e:"PSEL 6 explicitly calls for modeling the need for two-way communication with families and community members.",
 t:["Establishing actual feedback channels, not just informational messages, is what makes communication genuinely two-way.","Longer newsletters are still one-way communication, regardless of length.","Allowing comments adds a channel for reaction, but without dedicated feedback mechanisms like surveys or forums built for the purpose, it's a less structured, less reliable way to actually gather family input than the situation calls for.","More frequent one-way newsletters doesn't add the two-way feedback the question asks for."]},
{cat:"CE", q:"A community group requests use of school facilities but has a mission at odds with the school's stated values. Best response?",
 o:["Deny the request based on differing values","Approve without review to avoid controversy","Approve only if the group changes their stated mission","Evaluate the request based on established, neutral facility-use policy applied equitably to all groups"], c:3,
 e:"PSEL 6 calls for equitable and open access to facilities as required or legally permissible, applied neutrally regardless of viewpoint.",
 t:["Denying based on the group's viewpoint, rather than neutral policy, risks unequal treatment based on beliefs.","Approving without any review skips confirming the request meets neutral facility-use standards.","Requiring a group to change its mission to gain facility access isn't a neutral, policy-based standard.","Applying the same neutral policy to all groups, regardless of viewpoint, is what ensures fair and legally sound facility access."]},
{cat:"CE", q:"A principal wants to engage a historically underrepresented cultural group in school planning efforts. Best approach?",
 o:["Wait for members of that group to volunteer","Proactively identify and personally invite representatives from that community into planning structures","Assign a staff member to represent that community's perspective instead","Add a general invitation to all planning meetings via newsletter"], c:1,
 e:"PSEL 6 calls for using diverse representatives of the community to strengthen planning through proactive, direct outreach.",
 t:["Waiting passively means the group may continue to be underrepresented if no one happens to step forward.","Actively reaching out and inviting specific representatives is what directly engages a group that hasn't been part of planning before.","Having a staff member represent the community's perspective substitutes for their actual voice rather than including it.","A general invitation to everyone doesn't specifically address why this particular group has been underrepresented."]},
{cat:"CE", q:"A principal is asked to comment publicly on a controversial school-related issue drawing local media attention. Best approach?",
 o:["Direct all questions to the superintendent without providing any information","Avoid any public statement","Provide a measured, factual statement consistent with district communication guidelines","Share personal opinions candidly to build community trust"], c:2,
 e:"PSEL 6 calls for demonstrating the ability to communicate effectively with the media within established guidelines.",
 t:["Redirecting everything without providing any information misses the opportunity for measured, appropriate communication.","Avoiding any statement at all can appear evasive rather than appropriately measured.","A factual statement consistent with district guidelines balances appropriate transparency with professional communication standards.","Sharing personal opinions on a controversial issue risks appearing to take an official position the school hasn't sanctioned."]},
{cat:"CE", q:"A principal wants to identify additional community resources to support students experiencing homelessness. Best first step?",
 o:["Refer all such cases directly to the district office without school-level support","Proactively connect with the district homeless liaison and community agencies to build a resource network in advance","Address needs individually as they arise, connecting each family to community agencies on a case-by-case basis","Wait for families to disclose their situation and request help"], c:1,
 e:"PSEL 6 calls for collaborating with community agencies that provide services to families and children, built proactively.",
 t:["Referring everything to the district removes the school's own role in building a proactive local resource network.","Building relationships with the district liaison and community agencies ahead of time ensures resources are ready when needed.","Case-by-case connections show responsiveness, but without proactively building relationships with agencies and the district liaison in advance, each new case still starts from scratch rather than drawing on an established resource network.","Waiting for families to come forward ignores that some may not feel comfortable disclosing their situation."]},
{cat:"CE", q:"Families raise a concern that recent scheduling changes were made without their input. Best principal response?",
 o:["Acknowledge the concern, explain the rationale, and create a process for gathering input on future decisions","Explain that the changes were within the principal's authority to make","Address concerns only from families who submit written complaints","Reverse the decision immediately upon hearing the complaint"], c:0,
 e:"PSEL 6 calls for supporting families in decision-making about their children's education going forward, not just defending past authority.",
 t:["Acknowledging the concern and building a process for future input addresses both the immediate frustration and the underlying gap.","Citing authority alone doesn't address the families' actual concern about being excluded from the process.","Limiting response to formal written complaints ignores families who raise concerns less formally.","Immediately reversing the decision upon a complaint doesn't actually build the ongoing input process families are asking for."]},
{cat:"CE", q:"A principal wants a public advocacy strategy to support increased funding for the school. Best approach?",
 o:["Avoid public advocacy to remain neutral","Rely solely on the district's advocacy efforts","Build relationships with local policymakers and community members, sharing data-driven evidence of need","Focus advocacy efforts primarily during budget season, with occasional outreach at other times"], c:2,
 e:"PSEL 6 calls for fostering relationships with policy makers and advocating publicly for the school using evidence of need.",
 t:["Avoiding advocacy entirely misses the opportunity to build support the school may need.","Relying entirely on the district doesn't build the school's own direct relationships and visibility.","Building ongoing relationships with policymakers and community members, backed by evidence, is what builds effective, sustained advocacy.","Occasional outreach beyond budget season is a step toward more consistent engagement, but if advocacy still isn't a sustained, ongoing relationship-building effort throughout the year, it may not build the same depth of support as a genuinely continuous approach."]},
// ---------------- STRATEGIC LEADERSHIP (SL) ----------------
{cat:"SL", q:"A principal designing an annual school improvement plan wants to identify the true root causes of a persistent problem before setting goals. Best approach?",
 o:["Conduct a structured root-cause analysis using multiple data sources before drafting solutions","Set a goal to 'improve' the area without specifying deeper causes","Brainstorm solutions as a leadership team and select the most popular one","Adopt a solution used successfully at a similar school"], c:0,
 e:"PSEL 1 calls for analyzing multiple sources of data to conduct a needs analysis before designing plans, not jumping to a popular or borrowed fix.",
 t:["This digs into why the problem exists before deciding what to do about it.","A vague \"improve\" goal skips the root-cause step entirely and gives no direction on what to actually change.","Popularity among the leadership team doesn't confirm the chosen solution actually addresses the underlying cause.","Borrowing a solution without first diagnosing this school's specific root cause risks solving the wrong problem."]},
{cat:"SL", q:"A principal wants staff, students, and families to help decide priority order among several competing goals. Best process?",
 o:["Let the leadership team vote without wider input","Rank goals based on the principal's professional judgment, informed by conversations with a few trusted staff members","Facilitate a structured process where stakeholders weigh in on priorities using shared data and criteria","Adopt whichever goal was loudest in community meetings"], c:2,
 e:"PSEL 1 calls for engaging staff, students, and community in planning and prioritizing using evidence, not the loudest voice or leader judgment alone.",
 t:["Keeping the prioritization decision inside a small leadership group is exactly what wider stakeholder involvement is meant to avoid.","Even with informal conversations, this still isn't the structured, broad-based process with shared data and criteria the question calls for — it's judgment with some input, not genuine shared prioritization.","This gives stakeholders a real, evidence-informed voice in setting priorities, not just a symbolic one.","Letting volume decide priority rewards whoever speaks most forcefully, not what the data or broader input actually supports."]},
{cat:"SL", q:"A principal must decide how to phase in a multi-year strategic initiative given limited staff capacity. Best approach?",
 o:["Implement components in the order staff request them","Delay the entire initiative until full capacity exists","Launch all components simultaneously to show urgency","Sequence implementation based on staff readiness and foundational dependencies among initiatives"], c:3,
 e:"PSEL 1 calls for managing uncertainty and risk and supporting individuals through change, which requires a readiness-based sequence rather than an all-at-once launch.",
 t:["Sequencing by staff preference doesn't account for which components actually depend on others being in place first.","Waiting for full capacity that may never arrive stalls all progress rather than finding a workable phased approach.","Launching everything simultaneously ignores the stated capacity limits and risks overwhelming staff.","This builds the rollout around what staff can actually handle and what genuinely needs to happen first."]},
{cat:"SL", q:"A principal reviewing progress toward a three-year goal finds the metric chosen (attendance rate) no longer captures the intended outcome (student engagement). Best response?",
 o:["Revise the metric to better capture engagement while transparently noting the change","Continue tracking the same metric to preserve year-over-year comparison","Track both metrics without adjusting either","Drop the goal since the metric doesn't work"], c:0,
 e:"PSEL 1's continuous-improvement approach calls for monitoring plans and adjusting them as needed, communicated transparently, rather than preserving a flawed metric.",
 t:["This fixes the actual measurement problem while keeping everyone aware of why the change was made.","Preserving comparability with a metric that no longer measures the real outcome means consistently tracking the wrong thing.","Adding a second metric without resolving the mismatch just doubles the data without fixing the underlying problem.","Abandoning the goal outright ignores that the goal itself may still be valid — it's the metric that needs fixing."]},
{cat:"SL", q:"A principal wants a strategic plan that survives leadership transitions. Best approach to sustainability?",
 o:["Focus year-to-year planning without long-term documentation","Keep planning documents primarily with the principal's office","Rely on institutional memory among veteran staff","Build shared ownership and documented processes so goals and progress live beyond any one leader"], c:3,
 e:"PSEL 1 calls for shared commitments and responsibilities among staff for carrying out the vision, which requires documented, distributed ownership.",
 t:["Without documentation, momentum depends entirely on people remembering, which evaporates the moment leadership changes.","Centralizing ownership with the principal's office ties the plan's survival to specific people rather than the broader organization.","Relying on institutional memory is fragile and disappears as veteran staff leave or roles change.","Documenting the process and distributing ownership is what actually lets the plan outlive any one leader."]},
// ---------------- INSTRUCTIONAL LEADERSHIP (IL) ----------------
{cat:"IL", q:"A principal wants an accurate picture of instructional quality across the building beyond isolated walkthroughs. Best approach?",
 o:["Combine frequent informal walkthroughs, student work analysis, and assessment data into a fuller instructional picture","Ask department chairs to self-report on their teams","Conduct two comprehensive walkthroughs per teacher each semester and use those as the primary data source","Rely solely on annual formal evaluations"], c:0,
 e:"PSEL 2 calls for using multiple sources of data, including classroom visits and student work, to understand instructional practice.",
 t:["Triangulating multiple sources gives a fuller picture than any single source alone.","Self-report from chairs is secondhand and may not reflect what's actually happening in each classroom.","Two walkthroughs per semester is more thorough than one, but relying on walkthroughs alone still misses the student work and assessment data needed for a truly complete picture.","Annual evaluations are infrequent and don't capture the day-to-day instructional picture."]},
{cat:"IL", q:"A principal notices teachers rarely use assessment data to differentiate instruction, even though data is collected regularly. Best response?",
 o:["Reduce the volume of assessments required","Provide teachers a one-time training session on how to read and interpret assessment reports","Model and coach how to translate specific data points into differentiated groupings and instruction","Require an additional assessment to gather more data"], c:2,
 e:"PSEL 2 calls for using data to provide ongoing, actionable feedback that improves practice, which requires modeling the actual translation of data into instruction.",
 t:["Fewer assessments doesn't solve the real problem, which is how existing data is being used.","A single training session builds awareness of the reports, but without ongoing modeling and coaching on translating specific data points into actual instructional changes, the pattern is likely to continue.","This builds the specific skill that's missing: turning data into actual instructional differentiation.","Adding more data collection doesn't help if the existing data isn't being used well."]},
{cat:"IL", q:"A principal is coaching a mid-career teacher who delivers strong lessons but resists trying new instructional strategies. Best coaching approach?",
 o:["Connect a new strategy explicitly to an outcome the teacher already values, and offer to co-plan or model it first","Mandate a specific new strategy for the next observation","Note the resistance in the formal evaluation","Let the teacher continue since current outcomes are already strong"], c:0,
 e:"PSEL 2 calls for differentiated, job-embedded support for teacher growth, which is more effective when tied to a teacher's own goals than to a mandate.",
 t:["Tying the new strategy to something the teacher already cares about, and offering hands-on support, addresses the actual source of resistance.","Mandating a strategy for a single observation risks surface compliance without real buy-in or skill-building.","Documenting resistance in a formal evaluation is punitive and doesn't build the teacher's willingness to try something new.","Leaving it alone because outcomes are currently strong misses an opportunity for continued growth."]},
{cat:"IL", q:"A school's course offerings have not changed as postsecondary and workforce expectations have shifted. Best first step for a principal wanting to modernize curriculum relevance?",
 o:["Review national workforce trend data and note it for consideration in next year's curriculum review cycle","Add a few new elective titles for variety","Survey students on which classes they'd prefer","Engage staff in evaluating current offerings against emerging trends and research before revising course pathways"], c:3,
 e:"PSEL 2 calls for working with staff to evaluate emerging trends and use research findings for school improvement before making structural changes.",
 t:["Noting the data for a future review cycle still delays acting on findings that are relevant right now, rather than beginning the evaluation with staff immediately.","A few new elective titles doesn't constitute the systematic evaluation the situation calls for.","Student preference is useful input, but alone it doesn't reflect research or workforce trend data.","This grounds the modernization in both staff expertise and current research and trends, not guesswork."]},
{cat:"IL", q:"A principal wants professional development to be sustainable rather than dependent on a single expert or consultant. Best long-term approach?",
 o:["Rehire the same consultant annually","Rotate which staff attend external conferences each year","Document the consultant's strategies in a shared folder","Build internal teacher-leader capacity to sustain and extend the practice after initial training"], c:3,
 e:"PSEL 2 calls for developing the capacity of faculty and providing opportunities for teacher leadership so growth outlasts any single outside expert.",
 t:["Continuing to depend on the same outside consultant is exactly the dependency the question wants to avoid.","Sending different staff to conferences each year doesn't build a coordinated, lasting internal capacity.","A folder of notes doesn't replace the ongoing support and coaching an expert provided.","Developing teacher leaders who can sustain and extend the practice is what makes the improvement outlast the consultant."]},
{cat:"IL", q:"A principal reviewing schoolwide data finds strong overall proficiency but a persistent, unaddressed gap for students receiving special education services in one content area. Best first step?",
 o:["Convene general and special education teachers to examine instructional practices and supports specific to that content area","Recommend increased pull-out time for those students","Note the gap in the annual report and monitor it next year","Share the data with the special education department and ask them to develop a support plan independently"], c:0,
 e:"PSEL 2 calls for using research-based strategies to close opportunity and achievement gaps, beginning with a joint examination of instruction, not monitoring or a service-only fix.",
 t:["Bringing both groups together to look at instruction directly targets the root of the persistent gap.","More pull-out time is a service increase, not an examination of whether current instructional practices are part of the problem.","Monitoring without acting lets a known, persistent gap continue for another year.","Asking special education staff to develop a plan on their own misses the joint examination with general education teachers needed to address instructional practices in that specific content area together."]},
{cat:"IL", q:"A principal wants classroom observation data to build trust rather than anxiety among staff. Best approach to introducing a new observation tool?",
 o:["Introduce the tool collaboratively, clarify its formative purpose, and model it transparently before using it broadly","Introduce the tool to the whole staff via a written memo explaining its formative purpose","Announce it applies only to the summative evaluation cycle","Roll it out without notice to capture authentic practice"], c:0,
 e:"PSEL 2 calls for transparent, actionable feedback processes that support growth, which requires clarity and collaboration up front, not a surprise rollout.",
 t:["Being transparent about the tool's purpose and modeling it first is what builds trust instead of anxiety.","A written memo explains the purpose, but without modeling the tool transparently and collaboratively first, staff may still feel uncertain rather than genuinely reassured.","Framing it as tied only to summative evaluation increases anxiety rather than building trust.","Introducing it with no notice, specifically to catch \"authentic\" practice, is the opposite of the transparency the question calls for."]},
{cat:"IL", q:"A principal wants to promote healthy work-life balance while still driving instructional improvement. Which action best reflects this balance?",
 o:["Reduce instructional expectations to lower teacher workload","Require all coaching conversations occur after contract hours","Build coaching and collaborative planning into the existing school day rather than adding to teachers' time","Offer optional weekend PD sessions for extra pay"], c:2,
 e:"PSEL 2 explicitly calls for promoting a healthy work-life balance for staff, which is best served by embedding support within existing time, not adding to it.",
 t:["Lowering expectations reduces workload but doesn't preserve the instructional improvement goal.","Pushing coaching outside contract hours adds to teacher time rather than balancing it.","Embedding support within the time teachers already have protects their time while still driving improvement.","Weekend sessions still add to teacher time, even if compensated, rather than balancing it."]},
{cat:"IL", q:"A principal wants to know whether recent PD on differentiated instruction actually changed classroom practice. Best evaluation method?",
 o:["Assume implementation occurred since the PD was well-received","Count how many teachers attended the PD session","Ask teachers to self-rate their comfort with differentiation","Conduct follow-up walkthroughs specifically looking for the differentiation strategies covered in the PD"], c:3,
 e:"PSEL 2 calls for assessing the effectiveness of professional development through direct evidence of practice change, not attendance or self-report alone.",
 t:["Positive reception doesn't confirm teachers actually changed what they do in the classroom.","Attendance measures participation, not whether practice actually changed afterward.","Comfort level is a perception, not direct evidence of classroom practice.","Looking for the actual strategies in classrooms afterward is the direct way to confirm the PD changed practice."]},
{cat:"IL", q:"A principal is deciding how to allocate coaching time between a teacher who is new to the profession and one who is experienced but plateaued. Best approach?",
 o:["Differentiate the coaching focus and cadence for each based on their distinct developmental needs","Prioritize the new teacher, providing the veteran teacher only quarterly informal check-ins","Provide identical coaching support to both","Focus only on teachers already performing above expectations"], c:0,
 e:"PSEL 2 calls for guiding individual professional development plans matched to each teacher's needs, not a one-size-fits-all or single-priority approach.",
 t:["Matching coaching approach to each teacher's distinct developmental stage serves both more effectively than one-size-fits-all.","Quarterly check-ins provide some contact, but they don't match the differentiated, ongoing coaching cadence a plateaued veteran may need to actually break through a plateau.","Providing the same coaching to a brand-new teacher and a plateaued veteran ignores that their needs are different.","Focusing coaching only on already-strong teachers leaves the two teachers actually needing support unaddressed."]},
{cat:"IL", q:"A principal wants teacher evaluation conversations to build instructional capacity, not just assign a rating. Best approach?",
 o:["Ask the teacher to identify their own rating first","Use the conversation to jointly identify specific next steps for growth tied to evidence from observations","Deliver the rating with minimal discussion to keep the meeting brief","Focus the conversation only on areas scored below expectations"], c:1,
 e:"PSEL 2 calls for using evaluation as a tool for continuous improvement of practice, grounded in joint, evidence-based next steps.",
 t:["Starting with self-rating can be useful, but by itself it doesn't ensure the conversation moves toward concrete next steps.","Grounding the conversation in evidence and co-developing next steps is what turns evaluation into real capacity-building.","Keeping the conversation brief and rating-focused skips the growth conversation entirely.","Focusing solely on deficits misses opportunities to build on strengths and still lacks a joint, evidence-based approach."]},
{cat:"IL", q:"A principal reviewing several years of data notices that a research-based math program has not produced expected gains. Best next step?",
 o:["Survey teacher satisfaction with the program materials","Discontinue the program and replace it with a different research-based curriculum starting next semester","Continue the program another year since new initiatives take time","Evaluate fidelity of implementation and specific student outcomes before deciding whether to continue, adjust, or replace it"], c:3,
 e:"PSEL 2 calls for evaluating the effectiveness of instructional programs using both outcome data and implementation fidelity before making a change decision.",
 t:["Satisfaction with materials doesn't address whether the program is actually producing student gains.","Switching programs addresses the disappointing results, but without first checking whether the current program was even implemented with fidelity, the same implementation issues could recur with a new curriculum too.","Continuing without investigating specifics repeats the same approach and may just delay a needed change.","Checking both whether it was implemented as intended and what it produced is necessary before deciding what to do next."]},
// ---------------- CLIMATE & CULTURE LEADERSHIP (CC) ----------------
{cat:"CC", q:"A principal wants student voice to meaningfully shape school climate decisions, not just be symbolic. Best structure?",
 o:["A suggestion box in the main office","Hold a student forum once a semester where administration presents ideas and gathers feedback","A standing student advisory group with real influence on specific climate decisions, with visible follow-through","Rotating student representatives who attend staff meetings as observers only"], c:2,
 e:"PSEL 3 calls for engaging students meaningfully in shaping their school community, which requires real influence and visible follow-through, not symbolic input.",
 t:["A suggestion box with no visible follow-through offers no real influence, just a place to submit ideas.","A semesterly forum offers more engagement than a survey, but if administration is still setting the agenda and presenting ideas rather than students shaping specific decisions with visible follow-through, student voice remains more consultative than truly influential.","A continuing group with actual decision influence and visible follow-through is what makes student voice meaningful rather than symbolic.","Observing without a voice in the conversation is symbolic participation, not real influence."]},
{cat:"CC", q:"A principal is introducing restorative practices to address a rise in peer conflict. Best implementation sequence?",
 o:["Train staff, build common language and structures first, then implement restorative circles with support","Apply restorative practices only to the most severe incidents","Announce a schoolwide restorative-practices policy with no preparation","Skip staff training and rely on the counseling office to run all restorative conversations"], c:0,
 e:"PSEL 3 calls for building staff capacity and structures for a caring, supportive climate before scaling a new practice broadly.",
 t:["Building capacity and common language before scaling ensures restorative circles are run well from the start.","Limiting use to severe incidents only misses the everyday peer conflict the practice is meant to address.","Announcing without preparing staff risks poor implementation and confusion.","Relying solely on counselors, without training classroom staff, limits the reach and everyday use of restorative practices."]},
{cat:"CC", q:"Long-standing traditions at a school no longer reflect the current, more diverse student population. Best approach to evolving school culture?",
 o:["Add new traditions without revisiting existing ones","Eliminate all existing traditions immediately","Maintain traditions unchanged since they represent school identity","Engage students, staff, and families in reshaping traditions to reflect the current community while honoring the school's history"], c:3,
 e:"PSEL 3 calls for understanding the traditions and cultural history of the school while addressing equity and responsiveness to the current community.",
 t:["Adding without revisiting existing traditions leaves the ones that don't reflect the current community unexamined.","Immediately eliminating traditions skips the community engagement and honors none of the school's history.","Keeping traditions unchanged ignores that the population and its needs have genuinely shifted.","Involving students, staff, and families in reshaping traditions balances honoring history with reflecting the current community."]},
{cat:"CC", q:"Incoming ninth-graders report high anxiety transitioning from middle school. Best systemic response?",
 o:["A one-day orientation event before the school year begins","A structured, multi-touchpoint transition program (summer bridge, peer mentors, ongoing check-ins) spanning the first semester","Rely on older siblings or friends to help students adjust informally","Assign a counselor specifically to check in with every incoming ninth-grader during the first month of school"], c:1,
 e:"PSEL 3 calls for building a safe, caring environment that meets students' social and emotional needs through sustained, structured support.",
 t:["A single orientation day doesn't address anxiety that persists across the transition period.","Sustained support across the semester, not just a single event, matches the ongoing nature of the anxiety described.","Informal peer help is inconsistent and isn't a structured schoolwide response.","A one-month check-in period is more proactive than open-ended reactive support, but it's still a single-point-in-time touch rather than the sustained, multi-touchpoint support spanning the semester that the anxiety described actually calls for."]},
{cat:"CC", q:"A principal wants staff to feel comfortable reporting colleague concerns about student welfare without fear of retaliation. Best structural step?",
 o:["Address the issue only if it arises through the teacher union","Ask staff to raise concerns directly and informally with the colleague first","Address the issue in general terms at a staff meeting only","Establish and communicate a clear, confidential reporting process with follow-through staff can see"], c:3,
 e:"PSEL 3 calls for holding faculty accountable for a safe and supportive climate through clear, trusted systems, not informal or vague processes.",
 t:["Routing only through the union limits the pathway and doesn't establish a direct school-level process.","Requiring staff to confront a colleague directly first before reporting could increase, not reduce, fear of retaliation.","A vague general discussion doesn't create an actual reporting mechanism staff can use.","A defined, confidential process that staff can see work is what actually builds the safety to report."]},
{cat:"CC", q:"A principal wants to authentically celebrate cultural diversity rather than through a single annual event. Best approach?",
 o:["Host one well-attended multicultural night each year","Integrate diverse cultural perspectives into curriculum, decor, and events consistently throughout the year","Form a dedicated diversity committee that plans several events throughout the year","Rotate which cultural group is highlighted each month via posters"], c:1,
 e:"PSEL 3 calls for addressing equity and cultural responsiveness in all aspects of leadership, not through a single isolated event.",
 t:["A single annual event is the isolated approach the question specifically wants to move beyond.","Weaving diverse perspectives throughout the year, not just one event, reflects authentic ongoing inclusion.","A committee planning multiple events throughout the year is a real improvement over a single event, but if those events remain separate additions rather than perspectives woven into everyday curriculum and school life, it's still episodic rather than fully integrated.","Posters rotate visibility but don't integrate diverse perspectives into actual teaching and school life."]},
{cat:"CC", q:"A principal notices staff morale is high in some departments and low in others, with no clear pattern by workload. Best diagnostic step?",
 o:["Gather qualitative input (focus groups, listening sessions) to understand the specific drivers of morale in each department","Wait to see if morale improves naturally over the semester","Apply the same morale-boosting initiative schoolwide regardless of department differences","Assume department chairs are responsible for morale differences"], c:0,
 e:"PSEL 3 calls for understanding the specific conditions behind staff climate before acting, rather than assuming causes or applying uniform fixes.",
 t:["Talking directly with each department is the way to actually understand what's driving morale in that specific context.","Waiting assumes the problem will resolve without understanding its cause.","A uniform fix ignores that morale drivers differ by department, as the question states.","Assuming a cause without checking risks misdiagnosing the actual problem."]},
// ---------------- ETHICAL LEADERSHIP (EL) ----------------
{cat:"EL", q:"A principal is asked to sign off on a grant report containing data she has not personally verified. Best response?",
 o:["Sign it since the data was prepared by a trusted staff member","Sign it but add a verbal caveat to colleagues afterward","Review and verify the data personally, or ensure a documented verification process occurred, before signing","Delegate signing authority to the staff member who prepared it"], c:2,
 e:"PSEL 4 calls for modeling transparent, accountable decision-making, which requires verifying data before certifying it, not relying on trust alone.",
 t:["Trusting the preparer doesn't substitute for actually verifying the data being certified.","Adding a caveat after signing doesn't change that the report was certified without verification.","Personally verifying, or confirming a documented process occurred, is what makes certifying the data responsible.","Delegating the signature doesn't remove the principal's own responsibility for what's being certified."]},
{cat:"EL", q:"Two teachers with similar performance records are being considered for the same leadership stipend, and one is a personal friend of the principal. Best process?",
 o:["Select the friend since the principal knows their work most closely","Ask the assistant principal to decide instead, without documentation","Select based on seniority alone","Use a documented, criteria-based selection process applied consistently, recusing personal relationships from the decision"], c:3,
 e:"PSEL 4 calls for equitable access to hiring and promotion decisions, which requires a documented, consistent process free of personal influence.",
 t:["Choosing the friend based on personal familiarity is exactly the kind of relationship-based decision the question flags as a concern.","Handing off the decision without documentation doesn't establish the fair, consistent process needed.","Seniority alone doesn't address the specific concern about personal relationship influencing the choice between similar performers.","Using a documented process and stepping back from personal involvement is what actually removes the relationship as a factor."]},
{cat:"EL", q:"A principal discovers that a well-liked, high-performing teacher has been consistently excluding students with disabilities from an enrichment activity's sign-up. Best response?",
 o:["Address the practice directly, correct it, and ensure future compliance with equitable access policy","Let the practice continue since overall student outcomes remain strong","Address it only if a parent files a formal complaint","Have a private conversation with the teacher and trust them to self-correct without further follow-up"], c:0,
 e:"PSEL 4 calls for holding all staff accountable for ethical and equitable behavior, regardless of their overall performance or popularity.",
 t:["Directly correcting the practice and ensuring compliance going forward addresses the actual inequity, regardless of the teacher's popularity.","Strong overall outcomes don't excuse actively excluding a specific group of students.","Waiting for a complaint lets a known exclusionary practice continue in the meantime.","A private conversation opens the issue directly, but without confirming future compliance through some follow-up, there's no way to verify whether the exclusionary practice has actually stopped."]},
{cat:"EL", q:"A principal is deciding whether to disclose a data error that slightly understated a subgroup's proficiency rate in a public report already released. Best response?",
 o:["Issue a timely, transparent correction explaining the error and providing accurate data","Leave the report as published since the error was unintentional","Wait to see if anyone notices before correcting it","Correct the error in next year's report, with a brief footnote referencing the prior year's figure"], c:0,
 e:"PSEL 4 calls for modeling transparent, consistent decision-making practices, including promptly correcting errors in public data.",
 t:["Issuing a clear, timely correction is what actually upholds accuracy and transparency once an error is found.","Being unintentional doesn't make leaving inaccurate public data uncorrected acceptable.","Waiting to see if the error is caught treats correction as optional rather than a responsibility.","A footnote adds slightly more transparency than a silent fix, but waiting until next year's report to correct a known current error still leaves inaccurate public data uncorrected in the meantime."]},
// ---------------- ORGANIZATIONAL LEADERSHIP (OL) ----------------
{cat:"OL", q:"A principal is developing a plan to replace aging classroom furniture across the building with a constrained facilities budget. Best prioritization approach?",
 o:["Replace furniture on a rotating schedule so every classroom eventually gets updated","Replace furniture in the principal's most-visited hallways first","Wait until a single large budget allocation allows replacement everywhere at once","Prioritize replacement based on documented safety concerns and instructional impact across classrooms"], c:3,
 e:"PSEL 5 calls for prioritizing facilities needs and acting as an accountable steward of resources based on documented need, not visibility or convenience.",
 t:["A rotating schedule ensures fairness over time, but it doesn't prioritize the classrooms with the most urgent, documented safety concerns or instructional impact right now, which the situation specifically calls for.","Prioritizing visibility to visitors over actual need misdirects limited funds.","Waiting for one big allocation delays addressing pressing needs that exist right now.","Basing replacement priority on documented safety concerns and instructional impact directs limited funds where they matter most."]},
// ---------------- COMMUNITY ENGAGEMENT LEADERSHIP (CE) ----------------
{cat:"CE", q:"A principal wants community feedback on a proposed redesign of the school's front entrance and security process. Best engagement approach?",
 o:["Finalize the design internally, then inform the community afterward","Post the final decision on the school website without a comment period","Share the draft design early, gather input on accessibility and flow, and incorporate feasible feedback before finalizing","Limit feedback collection to the parent-teacher organization's board only"], c:2,
 e:"PSEL 6 calls for engaging families and community members in decisions that affect them, with genuine input gathered before finalizing plans.",
 t:["Finalizing before informing the community skips gathering input that could improve the design.","Posting the decision without any comment period doesn't gather feedback at all.","Sharing the design while it's still a draft and genuinely incorporating feedback is what makes community engagement meaningful rather than symbolic.","Limiting input to just the PTO board excludes the broader community from a decision that affects everyone."]},
// ---------------- STRATEGIC LEADERSHIP (SL) ----------------
{cat:"SL", q:"A principal wants to determine effective strategies to evaluate progress toward the school's goals before the plan is finalized. Best approach?",
 o:["Build specific progress-monitoring measures and checkpoints into the plan itself, agreed upon by the planning team","Ask each department to define its own separate measures independently","Wait until the first data checkpoint to decide how to measure progress","Use whichever measures the district requires for compliance reporting only"], c:0,
 e:"PSEL 1 calls for determining and implementing effective strategies to evaluate progress before executing on the goals.",
 t:["Building monitoring measures in from the start, with team agreement, ensures progress can actually be tracked once the plan launches.","Separate, uncoordinated measures across departments make it hard to see a coherent picture of schoolwide progress.","Waiting until after the plan starts to decide how to measure it means early progress may go untracked.","Compliance-only measures may not capture the specific outcomes this plan is actually trying to achieve."]},
{cat:"SL", q:"A principal is building consensus among a divided staff about a new grading policy tied to the school's goals. Best approach?",
 o:["Delay any decision until unanimous agreement is reached","Implement the policy as proposed since the leadership team already approved it","Survey staff anonymously, then share the majority preference with staff and proceed","Facilitate structured dialogue where staff surface concerns and identify areas of common ground before finalizing"], c:3,
 e:"PSEL 1 calls for building consensus as part of developing shared commitments to implement the vision and goals.",
 t:["Waiting for full unanimity on a divisive issue can stall the decision indefinitely.","Moving ahead without addressing staff's stated concerns skips the consensus-building the situation calls for.","Even sharing the results afterward, a majority-rules survey skips the structured dialogue needed to actually surface and resolve the concerns of those in the minority.","This directly works through the disagreement to find where staff can actually align, rather than forcing or skipping the conversation."]},
{cat:"SL", q:"A principal is developing a plan to delegate responsibilities for a new advisory program. Which is the most appropriate task to delegate to a lead teacher rather than keep with the principal?",
 o:["Coordinating the daily logistics and schedule of advisory groups","Approving the overall advisory curriculum framework","Making final decisions about which students need additional behavioral intervention","Evaluating other teachers' delivery of advisory content"], c:0,
 e:"PSEL 1 calls for developing a plan to delegate responsibilities appropriately, keeping sensitive evaluative tasks with the leadership team.",
 t:["Logistics and scheduling are operational tasks well suited for a lead teacher to own.","Approving the overall framework is a higher-level decision that shapes the whole program and should stay with leadership.","Determining which students need behavioral intervention involves sensitive judgment calls that belong with the principal.","Evaluating colleagues is a supervisory function that shouldn't be delegated to a peer lead teacher."]},
{cat:"SL", q:"A principal wants a strategy to communicate a shared vision so that families who are not fluent readers can still understand and act on it. Best approach?",
 o:["Pair simplified written materials with a verbal explanation and visual summary at a family event","Rely on the school's social media page to share updates","Distribute a simplified, translated version of the vision statement through student backpacks and the school app","Simplify the written vision statement's vocabulary only"], c:0,
 e:"PSEL 1 calls for selecting and assessing communication strategies that let all stakeholders understand, support, and act on the vision.",
 t:["Combining simplified text with in-person explanation gives families multiple ways to actually access the content.","Posting online assumes families both use that platform and can read the written vocabulary, which the scenario says isn't guaranteed.","Even simplified and translated, a purely written distribution method still misses the verbal or visual support families with reading barriers may need to fully engage with it.","Simplifying words alone still relies entirely on written text, without the verbal or visual support some families need."]},
{cat:"SL", q:"In the strategic planning process, a principal wants to formulate critical questions to outline the process before gathering input. Which question is most foundational to ask first?",
 o:["'What does our data tell us about our students' most pressing needs?'","'Which staff members are most enthusiastic about change?'","'What did our previous strategic plan look like?'","'What will this cost?'"], c:0,
 e:"PSEL 1 calls for using relevant data and evidence-based inquiry to formulate a plan, starting with identified needs.",
 t:["Starting with student need, grounded in data, is the foundation everything else in planning should build on.","Staff enthusiasm is useful for implementation later, but it doesn't establish what the plan should actually address.","Looking backward at the old plan doesn't establish what current data says students need now.","Cost is a real constraint, but leading with budget before need risks shaping goals around money rather than students."]},
{cat:"SL", q:"A principal wants to identify and align resources, including technology, to support the school's newly revised goals. Best first step?",
 o:["Inventory current resources against the specific instructional priorities in the new goals to identify gaps","Purchase new technology tools that align with current trends","Maintain current resource allocations to avoid disruption","Ask teachers what technology they'd like to have"], c:0,
 e:"PSEL 1 calls for identifying and aligning resources, including technology, to support and achieve the goals, starting from an honest inventory.",
 t:["Checking what already exists against the new goals is the direct way to find real gaps before spending anything.","Buying based on trends risks acquiring tools that don't actually match the specific new goals.","Keeping resources unchanged assumes they already fit the newly revised goals, which hasn't actually been checked.","Teacher preference is useful input, but on its own it doesn't confirm alignment with the specific goals."]},
{cat:"SL", q:"A principal conducting a needs analysis to identify areas for improvement wants to avoid relying on a single data point. Best approach?",
 o:["Use only the most recent state test scores, since they are the most rigorous measure","Use the same single measure used in the previous needs analysis for consistency","Rely primarily on teacher perception of student needs","Triangulate multiple sources (assessment data, attendance, discipline, survey results) to identify patterns"], c:3,
 e:"PSEL 1 calls for using and interpreting multiple sources of data to conduct a needs analysis, not a single measure.",
 t:["Relying on one test, however rigorous, is still a single data point, which is exactly what the question says to avoid.","Repeating the same single measure for consistency still leaves the analysis resting on just one source.","Perception alone is one more single, subjective source rather than a genuinely triangulated picture.","Combining several different sources is the direct way to build a fuller, more reliable picture of need."]},
{cat:"SL", q:"A principal wants to use research and best practices systematically to design a new plan to raise reading proficiency. Best approach?",
 o:["Review research on effective reading interventions, then match findings to the school's specific data and context","Adopt whichever program is most popular among neighboring schools","Select a program from the district's suggested vendor list, then review whether it addresses the school's specific reading data","Choose the newest available reading technology on the market"], c:0,
 e:"PSEL 1 calls for using research and best practices systematically to design plans matched to the school's specific needs and data.",
 t:["This grounds the plan in both outside evidence and this school's specific situation, not either alone.","Popularity at nearby schools doesn't confirm the approach fits this school's specific reading data.","Reviewing after selecting still starts from a vendor list rather than starting from the school's own reading research and data — it reverses the more systematic order the question calls for.","Newest doesn't mean most effective for this specific reading challenge — it substitutes novelty for evidence."]},
{cat:"SL", q:"A principal facilitating a change process (a new bell schedule) wants to manage uncertainty and support staff through the transition. Best approach?",
 o:["Delay announcing the change until immediately before it takes effect to minimize anxiety","Announce a trial period for the new schedule, with a full explanation to follow once the trial concludes","Communicate the rationale and timeline, and create channels for staff questions throughout implementation","Announce the new schedule with a firm start date and no further discussion"], c:2,
 e:"PSEL 1 calls for managing uncertainty and risk and supporting the needs of individuals during the change process through clear communication.",
 t:["Announcing at the last minute maximizes uncertainty rather than giving staff time to process and ask questions.","Delaying the explanation until after the trial still leaves staff managing the transition without the rationale they need up front, which is when uncertainty is highest.","Explaining the reasoning and timeline and creating space for questions is what actually helps people manage the uncertainty of change.","Shutting down discussion after the announcement leaves staff concerns unaddressed during a stressful transition."]},
{cat:"SL", q:"A principal wants to communicate the outcomes of a yearlong improvement effort to the broader school community. Best approach?",
 o:["Wait until the following year's report to share any outcomes","Share the goals, process, data, and outcomes together, explaining what was learned and what's next","Share only the final data results without context","Share the full report, including goals, process, and outcomes, with the school board first, then post a summary on the website"], c:1,
 e:"PSEL 1 calls for communicating the needs, process, and outcomes of improvement efforts transparently to the community.",
 t:["Delaying the report means the community goes a full extra year without knowing what was learned.","Presenting the full arc — goals, process, data, and outcomes — lets the community actually understand what happened and why.","A number without context doesn't tell the community what was tried or what the result actually means.","Even with a summary posted afterward, prioritizing the board first, before actively communicating to the broader community, undercuts the same transparent process for the group most affected by the results."]},
{cat:"SL", q:"A principal identifies several barriers preventing progress toward a schoolwide attendance goal (transportation, family engagement, chronic health issues). Best first step?",
 o:["Analyze which barriers affect the most students and prioritize strategies accordingly, informed by the data","Focus efforts on the barrier that seems easiest to address","Address barriers only as individual families raise them","Address all barriers with equal effort simultaneously regardless of scale"], c:0,
 e:"PSEL 1 calls for identifying and knowing strategies to address barriers to achieving the vision and goals based on their scope and impact.",
 t:["Sizing up which barriers affect the most students focuses limited effort where it will have the biggest impact.","Choosing based on ease rather than impact might address a barrier that affects very few students.","A purely reactive approach means barriers go unaddressed until a family happens to speak up.","Spreading effort evenly regardless of scale can under-resource the barriers that actually affect the most students."]},
{cat:"SL", q:"A principal wants to engage students directly in planning a schoolwide culture initiative tied to the strategic plan. Best approach?",
 o:["Assume staff feedback adequately represents student needs","Rely on the student council to represent all student perspectives","Survey students after the initiative has already been designed","Create structured opportunities for a broader cross-section of students to provide input and help shape the initiative"], c:3,
 e:"PSEL 1 calls for engaging students in planning, implementing, and assessing programs and activities tied to the vision.",
 t:["Staff input, however well-intentioned, isn't a substitute for actually hearing from students themselves.","One elected council can't fully represent the range of perspectives across the whole student body.","Asking for input after the initiative is already designed limits students to reacting rather than truly shaping it.","This reaches beyond a single representative group to gather input before the initiative is finalized."]},
{cat:"SL", q:"A principal drafting a strategic plan wants goals that are results-driven rather than activity-driven. Which goal reflects that standard?",
 o:["'Hold monthly staff meetings to discuss literacy strategies.'","'Increase the percentage of students reading at grade level from 58% to 70% by spring.'","'Implement a new tutoring program twice a week.'","'Purchase updated reading materials for all classrooms.'"], c:1,
 e:"PSEL 1 calls for goals that are results-driven, focused on outcomes rather than the activities meant to produce them.",
 t:["A meeting schedule describes an activity, not an outcome for students.","This names the actual outcome for students, not just an action taken to try to produce it.","Tutoring frequency is an input the school controls, not a measure of the result it's meant to produce.","Buying materials is a resource action, not evidence of any change in student outcomes."]},
{cat:"SL", q:"A principal is evaluating whether the school's current core values, written a decade ago, still guide daily decision-making. Best way to assess this?",
 o:["Examine current practices and decisions against the stated values to identify gaps, involving staff in the review","Assume the values remain valid since no one has objected","Rewrite the values to match current practices, regardless of what practices are occurring","Ask only the leadership team whether the values still apply"], c:0,
 e:"PSEL 1 calls for evaluating if the current mission, vision, and goals are still appropriate through an honest examination of practice.",
 t:["Comparing what actually happens day to day against the stated values is the direct way to see if they still fit.","Absence of complaints isn't the same as confirming the values still guide decisions.","Automatically rewriting values to match whatever is currently happening skips asking whether current practice is actually right.","Limiting the check to leadership excludes the staff whose daily decisions the values are supposed to guide."]},
{cat:"SL", q:"A principal wants a strategic plan for closing a math achievement gap to align with district, state, and federal requirements. Best approach?",
 o:["Focus solely on school-level goals since compliance is handled by the district office","Adopt district goals directly without adapting them to the school's specific data","Review relevant district, state, and federal policy requirements as part of the initial planning process","Design the plan independently, then check for compliance issues afterward"], c:2,
 e:"PSEL 1 calls for knowing how the vision and goals relate to local, state, and federal policies from the outset of planning.",
