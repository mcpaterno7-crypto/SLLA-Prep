<style>
  :root{
    --ink: #1E2A38;
    --ink-soft: #445266;
    --paper: #EDEEF2;
    --card: #FFFFFF;
    --line: #D7DAE2;
    --brass: #A9803F;
    --brass-deep: #8A6A32;
    --green: #3F6B4F;
    --green-bg: #E7F0EA;
    --rust: #A6473A;
    --rust-bg: #F7E9E7;
    --navy-deep: #14202C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;}
  body{min-height:100vh;}
  .ui{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;}

  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 80px;}

  .masthead{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:3px solid var(--ink); padding-bottom:14px; margin-bottom:22px;
  }
  .masthead h1{font-size:26px; margin:0; font-weight:600; letter-spacing:0.2px;}
  .masthead .kicker{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    font-size:12.5px; color:var(--ink-soft); margin-top:4px;}
  .masthead .badge{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    font-size:12px; color:var(--brass-deep); border:1px solid var(--brass); border-radius:3px;
    padding:3px 9px; white-space:nowrap;}

  /* ---- Resume bar ---- */
  .resume-bar{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--card); border:1px solid var(--line); border-left:5px solid var(--green);
    padding:14px 18px; margin-bottom:18px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
  }
  .resume-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }

  /* ---- Home screen: tab-style mode cards ---- */
  .modes{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-top:8px;}
  @media (max-width:720px){ .modes{grid-template-columns:1fr;} }
  .mode-card{
    background:var(--card); border:1px solid var(--line); border-left:5px solid var(--brass);
    padding:20px 18px; cursor:pointer; transition:transform .12s ease, border-color .12s ease;
    position:relative;
  }
  .mode-card:hover{ transform:translateY(-2px); border-left-color:var(--green); }
  .mode-card .tab-index{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    font-size:11px; color:var(--ink-soft); }
  .mode-card h2{ font-size:18px; margin:6px 0 8px; }
  .mode-card p{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    font-size:13.5px; color:var(--ink-soft); line-height:1.5; margin:0; }

  .section-title{ font-size:15px; text-transform:none; color:var(--ink-soft);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    margin:34px 0 12px; border-bottom:1px solid var(--line); padding-bottom:8px;}

  /* ---- Category picker ---- */
  .cat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:720px){ .cat-grid{grid-template-columns:1fr;} }
  .cat-row{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--card); border:1px solid var(--line); padding:12px 16px; cursor:pointer;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif; font-size:14px;
  }
  .cat-row:hover{ border-color:var(--brass); }
  .cat-row .count{ color:var(--ink-soft); font-size:12.5px; }
  .cat-row-selectable input[type=checkbox]{ margin-right:8px; }

  .field-row{ display:flex; gap:10px; align-items:center; margin:14px 0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif; font-size:14px;}
  select, input[type=number]{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    padding:8px 10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:14px;
  }
  .btn{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    background:var(--ink); color:#fff; border:none; padding:10px 18px; font-size:14px;
    cursor:pointer; letter-spacing:0.2px;
  }
  .btn:hover{ background:var(--navy-deep); }
  .btn.secondary{ background:transparent; color:var(--ink); border:1px solid var(--ink); }
  .btn.secondary:hover{ background:var(--ink); color:#fff; }
  .btn:disabled{ opacity:.45; cursor:default; }
  .btn.small{ padding:6px 12px; font-size:12.5px; }

  .back-link{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    font-size:13px; color:var(--ink-soft); cursor:pointer; display:inline-block; margin-bottom:16px;
  }
  .back-link:hover{ color:var(--ink); text-decoration:underline; }

  /* ---- Exam item ---- */
  .progress-line{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    font-size:12.5px; color:var(--ink-soft); display:flex; justify-content:space-between; margin-bottom:10px;
  }
  .progress-bar{ height:4px; background:var(--line); margin-bottom:22px; }
  .progress-bar .fill{ height:4px; background:var(--brass); }

  .item{ background:var(--card); border:1px solid var(--line); border-left:5px solid var(--ink);

  .toolbar-note{ font-size:12px; color:var(--ink-soft); margin:0 0 16px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif; min-height:14px; }

  /* ---- Constructed response: in-app grading ---- */
  .grading-wrap{ margin-top:22px; }
  .spinner-row{ display:flex; align-items:center; gap:10px; color:var(--ink-soft);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif; font-size:13.5px; }
  .spinner{ width:16px; height:16px; border:2px solid var(--line); border-top-color:var(--brass);
    border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .grade-card{ background:var(--card); border:1px solid var(--line); padding:24px; margin-top:6px; }
  .grade-score-row{ display:flex; align-items:baseline; gap:14px; border-bottom:1px solid var(--line);
    padding-bottom:16px; margin-bottom:16px; }
  .grade-score-row .num{ font-size:40px; font-weight:600; }
  .grade-score-row .lbl{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    font-size:14px; color:var(--ink-soft); }
  .grade-section{ margin-bottom:16px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    font-size:13.5px; line-height:1.6; }
  .grade-section h4{ margin:0 0 6px; font-size:12.5px; text-transform:none; color:var(--brass-deep); }
  .grade-section ul{ margin:6px 0 0; padding-left:20px; }
  .error-note{ background:var(--rust-bg); border-left:3px solid var(--rust); padding:12px 16px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif; font-size:13px; color:var(--ink); }

  /* ---- Constructed response: rubric / self-check / model ---- */
  .rubric-panel, .self-check-panel, .model-panel{
    background:var(--card); border:1px solid var(--line); padding:18px 20px; margin-bottom:18px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
  }
  .rubric-panel-title{ font-size:13px; color:var(--brass-deep); margin-bottom:10px; }
  .rubric-levels{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  @media (max-width:720px){ .rubric-levels{ grid-template-columns:1fr 1fr; } }
  .rubric-level{ background:var(--paper); border:1px solid var(--line); padding:10px 12px; font-size:12px; }
  .rubric-level-head{ font-weight:600; margin-bottom:6px; font-size:12.5px; }
  .rubric-score{ display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px;
    background:var(--ink); color:#fff; border-radius:50%; font-size:11px; margin-right:5px; }
  .rubric-level ul{ margin:0; padding-left:16px; }
  .rubric-level li{ margin-bottom:3px; }

  .self-check-hint{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin:0 0 12px; }
  .check-row{ display:flex; align-items:flex-start; gap:10px; font-size:13.5px; line-height:1.5;
    margin-bottom:10px; cursor:pointer; }
  .check-row input{ margin-top:3px; flex:0 0 auto; }
  .check-result{ background:var(--paper); border-left:3px solid var(--brass); padding:12px 16px; font-size:13.5px; margin-top:8px; }
  .check-result-note{ font-size:12px; color:var(--ink-soft); margin-top:6px; }

  .model-action{ border-top:1px solid var(--line); padding-top:14px; margin-top:14px; }
  .model-action:first-child{ border-top:none; margin-top:0; padding-top:0; }
  .model-action-title{ font-weight:600; font-size:14px; margin-bottom:8px; }
  .model-tag{ display:inline-block; font-size:11px; color:var(--brass-deep); border:1px solid var(--brass);
    border-radius:3px; padding:2px 7px; margin:6px 0 4px; }
  .model-panel p{ font-size:13.5px; line-height:1.55; margin:0 0 4px; color:var(--ink-soft); }

<body>
<div class="wrap ui">
  <div class="masthead">
    <div>
      <h1 style="font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;">PSEL/SLLA Practice Ledger</h1>
      <div class="kicker">Original practice items modeled on the SLLA (Praxis 6990) format · aligned to PSEL standards</div>
    </div>
    <div class="badge">for your prep only</div>
  </div>

  <div id="app"></div>
</div>

<script>
window.addEventListener('error', function(e){
  try{
    var appEl = document.getElementById('app');
    if(appEl && !appEl.innerHTML.trim()){
      var msg = (e && e.message) ? e.message : 'Unknown error';
      appEl.innerHTML = '<div class="error-note"><strong>This app hit an error while loading.</strong><br>'
        + msg.replace(/</g,'&lt;')
        + '<br><br>Try opening this file directly in Safari or Chrome (not a text/email/file preview), then reload the page.</div>';
    }
  } catch(err){ /* nothing more we can do */ }
});
</script>
<script>
// PSEL/SLLA Practice Data
// Categories match the SLLA (6990) content categories, aligned to PSEL standards.
const CATEGORIES = {
  SL: { name: "Strategic Leadership", full: 20 },
  IL: { name: "Instructional Leadership", full: 27 },
  CC: { name: "Climate & Culture Leadership", full: 22 },
  EL: { name: "Ethical Leadership", full: 19 },
  OL: { name: "Organizational Leadership", full: 16 },
  CE: { name: "Community Engagement Leadership", full: 16 }
};

const QUESTIONS = [
// ---------------- STRATEGIC LEADERSHIP (SL) ----------------
{cat:"SL", q:"Three years of declining state math scores prompt a principal to convene grade-level teams. All four are reasonable starting moves — which best reflects PSEL 1's use of data to shape vision and goals?",
 o:["Wait for this year's state results before making any changes","Bring in an instructional coach to support all fourth-grade teachers with general math strategies this semester","Facilitate teams in disaggregating the data by standard and subgroup to pinpoint where instruction is breaking down","Direct each team to increase math instructional minutes by 15 this year"], c:2,
 e:"PSEL 1 calls for analyzing multiple data sources before revising goals; disaggregation identifies the actual gap before committing resources.",
 t:["Waiting sacrifices a full year of instruction on a hunch, when the team already has actionable data in hand right now.","General coaching without first knowing exactly where instruction is breaking down risks addressing the wrong things — support without a diagnosis yet.","This turns a vague sense that \"scores are down\" into a specific, actionable diagnosis of exactly which standards and student groups need attention.","More instructional minutes doesn't fix anything if the underlying instructional gap hasn't been identified yet — it's a guess dressed up as an action."]},
{cat:"SL", q:"A principal wants school goals to reflect both the district's strategic plan and staff's daily instructional priorities. Which approach best balances both?",
 o:["Alternate years focusing on district goals, then staff goals","Draft goals independently based on staff input, then request a waiver from district goals","Adopt the district's stated goals as the school's official targets, then ask each team to informally note where their daily priorities already connect","Cross-walk staff-identified priorities against district goals and co-author targets that satisfy both"], c:3,
 e:"PSEL 1 calls for goals aligned with district goals and grounded in data — a cross-walk honors both without treating them as separate tracks.",
 t:["Alternating years treats the two priorities as competitors that take turns, rather than finding where they actually overlap.","Asking for a waiver after drafting independently is adversarial and skips the collaborative cross-walk that would avoid the conflict altogether.","Treating the district goals as fixed and only noting informal connections afterward doesn't actually let staff priorities shape the targets — it's alignment in name only.","This directly maps where staff priorities and district goals already align, producing targets that legitimately serve both."]},
{cat:"SL", q:"Two years into a five-year strategic plan, a principal notices staff enthusiasm waning because the plan no longer shows up in daily practice. Best move?",
 o:["Relaunch the plan with a renewed all-staff kickoff event","Meet with department chairs to hear which parts of the plan feel disconnected, then adjust based on their feedback","Survey staff on whether to abandon the plan","Audit which action steps have stalled and re-engage teams in revising the implementation timeline"], c:3,
 e:"PSEL 1's continuous-improvement cycle calls for monitoring and adjusting plans, not just re-announcing them or enforcing compliance.",
 t:["A new kickoff event addresses morale for a day but does nothing to fix the stalled action steps causing the disengagement.","Relying only on department chairs' impressions, without auditing which specific action steps have actually stalled, risks fixing based on a partial picture rather than the complete one.","Putting the plan's survival to a vote sidesteps the leader's responsibility to diagnose and fix what's actually stalled.","This treats the disengagement as a signal to diagnose specifically what's broken in the plan, then fix that."]},
{cat:"SL", q:"A principal is deciding how to communicate a new three-year vision to a community with many non-English-speaking families. Which strategy best reflects PSEL 1's guidance on communicating a shared vision?",
 o:["Publish the vision statement in English on the school website","Translate written materials and host multilingual sessions with staff answering questions in person","Ask bilingual students to informally translate for their parents at pickup","Translate the written vision materials into families' primary languages and send them home"], c:1,
 e:"PSEL 1 calls for communication that lets all families understand, support, and act on the vision — that requires genuine two-way, translated engagement.",
 t:["This reaches only families who already read English fluently, doing nothing for the community the question specifically flags.","Pairing translated documents with live, in-person multilingual sessions gives families both the content and a real chance to engage with it.","Relying on children for informal interpretation at pickup is unreliable and puts translation responsibility on students rather than the school.","Translated materials provide the content but skip the live, two-way session that lets families actually ask questions and engage directly with the vision."]},
{cat:"SL", q:"A school's mission statement hasn't been revisited in eight years, and demographics have shifted substantially. Best first step?",
 o:["Rewrite the mission statement based on current best practices in the field","Leave the mission unchanged since changing it could confuse long-time stakeholders","Convene staff, students, and families to evaluate whether the mission still reflects the community","Adopt a neighboring high-performing school's mission statement"], c:2,
 e:"PSEL 1 calls for evaluating whether the current mission is still appropriate using multiple data sources and stakeholder input before revising it.",
 t:["Rewriting from external best practices, without first checking whether the current mission fits this community, skips the actual diagnostic step.","Assuming the mission is still fine despite eight years and major demographic change avoids the evaluation the situation clearly calls for.","Bringing staff, students, and families into an honest evaluation is the direct way to find out whether the mission still fits.","Borrowing another school's mission statement sidesteps this community's own values and context entirely."]},
{cat:"SL", q:"A principal wants school improvement goals to be genuinely measurable. Which goal best meets that standard?",
 o:["Increase student engagement in core classes, as measured by a schoolwide survey administered in the spring","Support teachers in becoming more reflective practitioners","Increase the percentage of students scoring proficient on the fall writing benchmark from 62% to 75% by June","Foster a culture where all students feel like they belong"], c:2,
 e:"PSEL 1 calls for goals that are specific, measurable, and time-bound; only this option has a baseline, target, and deadline.",
 t:["This adds a measurement tool but still lacks a specific target number or baseline to gauge whether \"increased\" engagement was actually achieved.","This describes an ongoing disposition for teachers, not a measurable student outcome — there's nothing here to check progress against.","This names a starting point, a target number, and a deadline — everything needed to verify whether the goal was met.","\"Foster a culture\" is a worthy aspiration but has no baseline or target that would let anyone measure it."]},
{cat:"SL", q:"Midway through implementing a new PBIS framework, referral data show mixed results across grade levels. Which action best reflects strategic monitoring of progress toward goals?",
 o:["Disaggregate referral data by grade level and adjust supports where implementation is weakest","Wait until year-end data to make any adjustments","Provide additional PBIS training to teachers in the underperforming grade levels","Continue the current timeline since first-year dips are expected"], c:0,
 e:"PSEL 1 calls for using data systematically to monitor and adjust plans in progress, not waiting for a single end-point measure.",
 t:["This uses the mixed data to find exactly where implementation is struggling, rather than treating all grades the same.","Waiting for final data means letting weak implementation continue for months when the mid-year data already shows where the problem is.","Offering more training addresses a plausible cause, but without first analyzing the referral data to see exactly where implementation is weak, it's a guess at the fix rather than a diagnosis-driven one.","Chalking mixed results up to normal first-year variation risks ignoring a real, addressable implementation gap."]},
{cat:"SL", q:"A principal is building a strategic planning team and wants broad ownership of the school's next set of goals. Which composition best reflects PSEL 1's emphasis on shared commitment?",
 o:["A rotating committee of the most veteran teachers","The administrative team, with results shared afterward","Department chairs only, to keep the process efficient","A cross-section of teachers, support staff, students, and family representatives"], c:3,
 e:"PSEL 1 calls for engaging staff and community members with diverse perspectives in developing shared commitments to the vision.",
 t:["Rotating among only veteran teachers still excludes support staff, students, and families from the ownership the question asks for.","Deciding privately and sharing results afterward is the opposite of building broad ownership before decisions are made.","Limiting membership to department chairs is efficient but narrow, leaving out the broader staff and community voice PSEL calls for.","This composition actually reflects the full range of people PSEL 1 wants involved in shaping shared commitments."]},
{cat:"SL", q:"When aligning a school's technology purchases to its strategic goals, what should guide the principal's decision most?",
 o:["Which tools directly support the instructional priorities named in the school's goals","Vendor recommendations based on similar schools' purchases","Whichever technology has the lowest per-unit cost","Staff preference, regardless of connection to stated goals"], c:0,
 e:"PSEL 1 calls for identifying and aligning resources, including technology, to support and achieve the stated goals — not cost or preference alone.",
 t:["This ties spending directly to what the strategic goals actually need, rather than to an outside factor.","What worked at another school doesn't guarantee it matches this school's specific instructional priorities.","Optimizing for the lowest price can produce tools that are cheap but disconnected from what the goals actually require.","Preference is a reasonable input, but by itself it ignores whether the tool actually serves the stated goals."]},
{cat:"SL", q:"A principal notices that goals set at the start of the year no longer reflect an urgent need that emerged from mid-year data (a spike in chronic absenteeism). Best response?",
 o:["Note the concern for next year's planning cycle","Add the absenteeism concern as a new priority and revise the plan's action steps accordingly","Finish the year with the original goals to maintain consistency","Ask the counseling office to develop an attendance intervention plan for the affected students, coordinating with the leadership team on progress"], c:1,
 e:"PSEL 1's continuous-improvement approach calls for responding to emerging data rather than treating the plan as fixed or siloing urgent needs away from the school's goals.",
 t:["Deferring a current spike to next year's planning lets the problem run unaddressed for the rest of this year.","This responds to what the new data actually shows, updating the plan rather than treating it as untouchable.","Sticking to the original goals \"for consistency\" ignores that the underlying data has changed since they were written.","Even with leadership coordination, this treats the spike as a service response rather than something that actually revises the strategic plan's own goals and action steps to reflect the new priority."]},
{cat:"SL", q:"A principal wants staff to understand *why* a new schoolwide reading initiative matters, not just comply with it. Best strategy?",
 o:["Present the data trends and instructional rationale behind the initiative, then invite staff questions and input","Share the state mandate requiring the initiative","Require lesson plans to document reading initiative components","Publicly recognize the first department to implement it fully"], c:0,
 e:"PSEL 1 calls for communicating the needs, process, and rationale of improvement efforts so staff understand and can act on them, not just comply.",
 t:["Sharing the actual data and reasoning behind the initiative is what builds genuine understanding, not just compliance.","Citing a mandate explains the requirement but not why it matters for these students, so it doesn't build real understanding.","A paperwork requirement can produce compliance on paper without actually building staff understanding of the initiative's purpose.","A public recognition incentive rewards speed of compliance, not the deeper understanding the question is asking about."]},
{cat:"SL", q:"In developing a strategic plan, a principal must decide how to allocate a limited PD budget. Which use best aligns spending with the vision and goals?",
 o:["Distributing funds evenly across every department regardless of stated priorities","Prioritizing PD requested most often by staff, regardless of alignment","Funding PD directly tied to the school's top two instructional goals","Saving the budget in case of unexpected staffing needs"], c:2,
 e:"PSEL 1 calls for aligning resources with the mission, vision, and goals — spreading funds evenly or by popularity undercuts strategic focus.",
 t:["Spreading funds evenly ignores that some priorities matter more than others in the current strategic plan.","Popularity among staff doesn't guarantee alignment with the school's actual top instructional goals.","This directly connects spending to the specific instructional priorities named in the plan.","Holding PD funds in reserve for a different purpose means the money isn't supporting the plan's stated goals at all."]},
{cat:"SL", q:"A school's improvement plan includes a goal to 'close the achievement gap between students with disabilities and their peers.' Which addition would make this goal most measurable and actionable?",
 o:["Adding a specific target percentage, data source, and interim checkpoints","Adding a firm deadline and identifying the department responsible for reporting progress","Adding a list of general strategies without targets","Adding a statement of commitment from the special education team"], c:0,
 e:"PSEL 1 calls for goals that are specific, measurable, and results-driven — a target, data source, and checkpoints operationalize the goal.",
 t:["This adds exactly the missing pieces — a number, where the number comes from, and when it will be checked.","This adds accountability and a deadline but still lacks the actual target percentage and data source needed to know whether the gap is actually closing.","Listing strategies describes activity, not the measurable target and data source the goal is actually missing.","A statement of commitment is a values signal, not the specific, measurable criteria the goal needs."]},
{cat:"SL", q:"A principal facilitating a strategic planning retreat wants decisions grounded in evidence rather than driven by the loudest voices in the room. Best facilitation move?",
 o:["Have participants vote anonymously without discussion","Ground each discussion in a shared data set before soliciting opinions","Limit each person to one comment per topic","Ask only department chairs to speak on behalf of their teams"], c:1,
 e:"PSEL 1 calls for using relevant data and evidence-based inquiry to formulate plans — grounding discussion in shared data does this directly.",
 t:["Voting without discussion skips the shared examination of evidence that grounds decisions in data rather than instinct.","Establishing a common data set before opinions are shared keeps the loudest voices from driving the conversation.","Limiting comment length manages airtime but does nothing to ensure the discussion is actually grounded in evidence.","Filtering input through department chairs adds a layer of interpretation between the data and the room, rather than grounding discussion directly in it."]},
{cat:"SL", q:"A principal is asked by the superintendent to justify continued funding for an instructional coaching position tied to the school's strategic plan. What evidence would most strongly support the request?",
 o:["The number of coaching sessions conducted","Teacher satisfaction survey results about the coach","Anecdotes from a few teachers who valued the support","Data showing improved instructional practice and corresponding student outcome gains linked to coaching cycles"], c:3,
 e:"PSEL 1 ties resource decisions to evidence of progress toward the vision and goals — outcome data, not satisfaction or activity counts, makes that case.",
 t:["A session count measures activity, not whether the coaching actually changed instruction or outcomes.","Satisfaction reflects how the coaching felt to teachers, not whether it produced measurable instructional or student gains.","A handful of anecdotes can't demonstrate schoolwide impact the way outcome data can.","This is the only option that ties the investment directly to measurable improvement, which is what funding decisions should rest on."]},
// ---------------- INSTRUCTIONAL LEADERSHIP (IL) ----------------
{cat:"IL", q:"Data shows a teacher's students consistently underperform on open-ended math questions despite strong scores on multiple-choice items. Best first coaching step?",
 o:["Recommend the teacher assign more homework","Transfer the highest-need students to another teacher","Require the teacher to attend a district-wide PD on open-response writing","Co-analyze student work samples with the teacher to identify where reasoning breaks down"], c:3,
 e:"PSEL 2 calls for using data to provide ongoing, actionable feedback rooted in collaborative analysis of student work, not a generic fix.",
 t:["More homework doesn't address why the reasoning is breaking down; it just adds volume without diagnosing the actual gap.","Moving students elsewhere treats them as the problem rather than addressing the instructional gap the data reveals.","A generic district session isn't tailored to what this specific class's work is actually revealing.","Looking at the actual student work together is the direct way to see exactly where students' reasoning is breaking down."]},
{cat:"IL", q:"A principal wants walk-through data to genuinely improve instruction rather than just document compliance. Best approach?",
 o:["Use a detailed checklist that documents which instructional strategies were observed during each visit","Provide specific, timely, actionable feedback tied to what was observed, followed by a brief conversation","Conduct walk-throughs only during formal evaluation windows","Share aggregate walk-through data with staff at the end of the year"], c:1,
 e:"PSEL 2 calls for actionable, timely feedback from classroom visits that develops faculty practice, not compliance documentation.",
 t:["A checklist can capture what was observed, but without a direct, timely conversation about it, documentation alone doesn't build teacher practice the way real dialogue does.","Real-time, specific feedback tied to what was actually seen is what turns a walkthrough into a tool for growth.","Limiting visits to evaluation season misses the ongoing, informal look at practice that actually drives improvement.","Waiting until year's end to share anything means feedback arrives too late to change practice during the year it was observed."]},
{cat:"IL", q:"Several veteran teachers resist using common formative assessments, arguing it limits their autonomy. Best principal response?",
 o:["Invite the teachers to help design the formative assessments so their expertise shapes the tool","Mandate immediate compliance, citing the school improvement plan","Exempt veteran teachers from participating","Postpone the initiative until next year"], c:0,
 e:"PSEL 2 calls for collaborative processes that build teacher capacity and ownership rather than compliance mandates or exemptions.",
 t:["Giving teachers a real hand in designing the tool builds buy-in through their expertise, not around it.","Mandating compliance addresses the behavior but ignores the underlying autonomy concern driving the resistance.","Exempting veteran teachers abandons the initiative for exactly the group whose buy-in matters most for schoolwide consistency.","Postponing doesn't resolve the autonomy concern; it just delays the same conversation."]},
{cat:"IL", q:"A principal is designing a professional development plan for the year. Which approach best reflects job-embedded PD?",
 o:["Ongoing coaching cycles, peer observation, and collaborative data review embedded in the school week","An optional evening course offered through the district","A one-time consultant visit focused on a single strategy","A single all-staff workshop in August covering the year's initiatives"], c:0,
 e:"PSEL 2 specifically calls for job-embedded, standards-based PD that meets ongoing learning needs, which one-time events don't provide.",
 t:["This is PD woven into the actual work week, which is the definition of job-embedded support.","An optional after-hours course depends on individual motivation and isn't embedded in the school day at all.","A single visit, however good, doesn't provide the sustained support job-embedded PD requires.","One workshop before the year starts has no ongoing follow-through once school begins."]},
{cat:"IL", q:"Benchmark data shows a persistent gap between English learners and peers in science, and teachers attribute it to language proficiency alone. Best leadership move?",
 o:["Provide EL students small-group review sessions focused on the specific vocabulary used in test questions","Facilitate teacher examination of instructional practices alongside the data to identify non-language-related gaps","Recommend EL students be grouped separately for science instruction","Delay addressing the gap until the following school year"], c:1,
 e:"PSEL 2 calls for identifying research-based strategies that close opportunity gaps, which requires examining instruction, not just accommodations.",
 t:["Vocabulary support is a reasonable step, but it still treats the gap as purely language-based without examining whether the instructional approach itself needs to change for these students.","This tests the teachers' assumption directly by looking at whether instruction, not just language, plays a role.","Separating students by language status doesn't investigate whether current instruction is part of the problem.","Delaying leaves the current cohort of English learners unsupported for another year."]},
{cat:"IL", q:"A principal wants curriculum to be vertically aligned between grade levels. Best strategy to start?",
 o:["Convene teachers across grade levels to map current standards coverage and identify gaps or redundancies","Ask each grade-level team to individually update their curriculum maps to note connections to adjacent grades","Direct each grade level to submit their curriculum maps for administrative review","Purchase a new vertically-aligned curriculum program"], c:0,
 e:"PSEL 2 calls for engaging in constructive discussions among staff to align curriculum horizontally and vertically for coherence.",
 t:["Bringing teachers together to actually map what's taught where is the direct way to find gaps and overlaps.","Individual updates without a shared conversation across grade levels still miss the collaborative dialogue needed to actually resolve gaps and redundancies together.","Collecting maps for administrative review, without a shared conversation, misses the cross-grade dialogue alignment actually requires.","Buying a new program is a costly fix that doesn't address whether current teachers are equipped to align it themselves."]},
{cat:"IL", q:"Observation data show strong content delivery but little student-to-student discourse across classrooms. Best PD focus?",
 o:["A refresher on classroom management","A workshop on content-area vocabulary","Coaching on structures for student discourse and collaborative learning strategies","Additional planning time with no specific focus"], c:2,
 e:"PSEL 2 calls for differentiated PD targeted to an identified instructional gap — here, discourse structures directly address what's missing.",
 t:["Classroom management isn't the gap the data points to; it targets the wrong skill entirely.","Vocabulary knowledge isn't what's missing here — the data shows a discourse gap, not a content gap.","This directly targets the specific gap the walkthrough data revealed: a lack of student-to-student talk.","Extra time without a specific focus doesn't guarantee it gets used to build discourse structures."]},
{cat:"IL", q:"A principal reviewing common assessment data at a PLC meeting notices one teacher's data show significantly lower mastery on a shared skill. Best next step in the meeting?",
 o:["Assign that teacher additional observations later in private","Facilitate the team in comparing instructional approaches for that skill across classrooms","Publicly ask that teacher to explain the lower scores","Move on to the next agenda item to avoid singling out a colleague"], c:1,
 e:"PSEL 2 calls for collaborative data analysis that improves practice through shared inquiry, not individual scrutiny or avoidance.",
 t:["Handling it entirely in private skips the chance for the team to learn together from the shared data.","This turns the gap into a team learning opportunity by looking at what different teachers are doing differently.","Putting one teacher on the spot in front of the team is more likely to shut down honest data conversations than improve them.","Skipping the data entirely avoids awkwardness but also avoids the chance to actually help students."]},
{cat:"IL", q:"A principal wants teachers to use formative data to inform instruction, not just to grade. Which action best supports that shift?",
 o:["Modeling how to use a specific formative data point to reteach or regroup students, then having teams practice","Requiring weekly formative assessment scores be submitted","Reducing the number of formative assessments required","Providing a rubric for scoring formative assessments"], c:0,
 e:"PSEL 2 calls for using data to provide ongoing, actionable feedback — modeling the actual use of data builds this capacity directly.",
 t:["Actually walking through how to use one data point to change instruction builds the real skill, not just the expectation.","Collecting scores confirms compliance but does nothing to ensure the data is actually used to adjust instruction.","Fewer assessments doesn't address the real issue, which is how the existing data is being used.","A scoring rubric standardizes grading, not the instructional response to what the data shows."]},
{cat:"IL", q:"A principal is evaluating two PD options with a limited budget: a one-day expert speaker or a semester of embedded coaching for a smaller group. Which best reflects instructional leadership best practice?",
 o:["Splitting the budget evenly regardless of impact","The embedded coaching, since sustained support builds deeper instructional capacity","The expert speaker, since it reaches more staff at once","Whichever option teachers vote for"], c:1,
 e:"PSEL 2 favors sustained, job-embedded development over one-time exposure, since it builds capacity for continuous improvement.",
 t:["Splitting funds evenly means neither option gets the depth of investment needed to actually work well.","Sustained, embedded coaching builds deeper capacity over the semester than a single day ever could.","Reaching more people for one day trades depth for breadth, with little follow-through.","A popularity vote doesn't weigh which option actually builds more lasting instructional capacity."]},
{cat:"IL", q:"A principal notices in walk-throughs that most classrooms rely almost entirely on direct instruction. Best way to build teacher capacity for varied strategies?",
 o:["Identify teachers already using varied strategies effectively and set up peer observation opportunities","Mandate a specific number of 'student-centered' activities per week","Provide a list of approved strategies via email","Require each teacher to submit a written reflection on their use of varied strategies at the end of each semester"], c:0,
 e:"PSEL 2 calls for developing capacity through collaborative professional learning, and peer observation leverages existing internal expertise.",
 t:["This leverages expertise already in the building rather than looking outside for a fix.","Mandating a quota can produce surface compliance without real skill-building in how to run those activities well.","An email list gives information but no modeling or support in how to actually implement it.","A reflection assignment prompts thinking about strategy variety, but without peer observation or modeling from teachers already skilled in this area, it doesn't give teachers concrete expertise to draw from."]},
{cat:"IL", q:"A new principal inherits a school where teacher-created assessments rarely include higher-order thinking questions. Best first step?",
 o:["Provide teachers a set of sample higher-order thinking questions they can optionally incorporate","Replace teacher-made assessments with commercial ones","Work collaboratively with departments to review and revise assessments against a shared rigor framework","Require all assessments be submitted for approval before use"], c:2,
 e:"PSEL 2 calls for supporting teachers in developing assessments aligned with rigor and standards through collaboration, not top-down control.",
 t:["Providing sample questions is helpful, but making it optional, without collaborative review against a shared framework, means adoption stays inconsistent and no shared understanding gets built across departments.","Buying replacement assessments sidesteps building teachers' own capacity to write rigorous questions.","Working together against a shared framework builds shared understanding of what rigor actually looks like.","Requiring sign-off adds a compliance layer without building teachers' capacity to write better assessments themselves."]},
{cat:"IL", q:"A principal wants to know whether a costly new reading intervention program is actually working. Best evaluation approach?",
 o:["Check whether the program's usage logs show teachers are implementing it as intended","Assume it's working since it's evidence-based nationally","Track specific student progress-monitoring data before and after implementation, compared to a similar prior cohort","Ask teachers informally whether they like the program"], c:2,
 e:"PSEL 2 calls for evaluating instructional programs using data specific to the intervention's intended outcomes, not assumption or a single delayed measure.",
 t:["Confirming implementation fidelity is a valid step, but it only tells you whether the program was used correctly — not whether it's actually improving student outcomes, which requires progress-monitoring data.","National evidence doesn't confirm it's actually working for these specific students.","This directly measures whether the program is producing a real difference for these students.","Teacher opinion about the program isn't the same as evidence it's improving student outcomes."]},
{cat:"IL", q:"A principal supporting a struggling first-year teacher must balance urgency with the teacher's development. Best coaching approach?",
 o:["Reassign the teacher to a co-teaching role permanently","Document deficiencies for a possible non-renewal decision","Set a focused improvement plan with specific, observable goals and frequent, supportive feedback cycles","Take over lesson planning for the teacher for the semester"], c:2,
 e:"PSEL 2 calls for guiding and monitoring individual professional development plans for continuous improvement, not removing ownership or jumping to punitive steps.",
 t:["A permanent reassignment sidesteps developing the teacher's own independent practice.","Jumping to documentation for possible non-renewal abandons development before giving it a real chance.","This balances urgency and support by giving concrete goals and consistent coaching.","Taking over planning removes the teacher's ownership entirely rather than building their capacity."]},
{cat:"IL", q:"A principal wants technology integration to enhance learning, not just be present in classrooms. Best approach to guide teacher use of a new classroom tech tool?",
 o:["Require teachers to use the tool at least once per week, choosing how to incorporate it into their existing lessons","Provide models of the tool deepening specific learning objectives, then let teachers adapt based on their content","Require every lesson to include the tool","Track how often the tool is used via login data"], c:1,
 e:"PSEL 2 calls for promoting the effective use of technology tied to learning objectives, not usage compliance or unguided adoption.",
 t:["A usage requirement ensures the tool gets used, but without modeling how it deepens a specific learning objective, teachers may incorporate it in ways that don't actually enhance learning.","Showing how the tool serves a specific learning objective, then letting teachers adapt it, keeps the focus on learning, not novelty.","Requiring universal use in every lesson risks shoehorning the tool in without regard to whether it fits the content.","Login frequency shows usage, not whether the tool is actually deepening learning."]},
// ---------------- CLIMATE & CULTURE LEADERSHIP (CC) ----------------
{cat:"CC", q:"Veteran staff increasingly perceive a more diverse student population as 'less capable.' Best first step?",
 o:["Provide a comprehensive, well-reviewed diversity training led by an outside expert this semester","Replace veteran staff resistant to the shift","Share achievement data broken down by subgroup to start a conversation","Provide structured opportunities for staff to examine their own biases and assumptions about the changing population"], c:3,
 e:"PSEL 3 calls for confronting institutional bias directly by helping staff identify and alter assumptions that undermine equity.",
 t:["A well-designed training session raises awareness, but without sustained follow-up and structured space for staff to keep examining their assumptions over time, the shift in perception is unlikely to stick.","Replacing staff sidesteps addressing the underlying assumptions rather than confronting them directly.","Sharing data is a useful conversation starter but doesn't by itself examine the biases driving the perception.","Directly confronting the underlying assumptions is what actually addresses the belief driving the \"less capable\" perception."]},
{cat:"CC", q:"Discipline data show a long-standing disproportionality in referrals for students of a particular racial group. Best first response?",
 o:["Provide additional training on culturally responsive classroom management to all teachers this year","Increase administrative presence in hallways","Revise the code of conduct to explicitly address cultural differences in behavior","Analyze the disaggregated referral data with staff to identify patterns in when, where, and by whom referrals are issued"], c:3,
 e:"PSEL 3 calls for analyzing disaggregated discipline data to identify inequitable patterns before deciding on a remedy.",
 t:["Training all teachers is more comprehensive than targeting just the highest-referral ones, but without first analyzing the disaggregated data to understand the specific patterns behind the disproportionality, the training may not address what's actually driving it.","More supervision doesn't examine whether the referral process itself is producing inequitable outcomes.","Explicitly coding behavioral expectations by culture risks reinforcing stereotypes rather than examining the actual referral pattern.","Digging into when, where, and by whom referrals happen is the direct way to understand what's actually driving the disproportionality."]},
{cat:"CC", q:"A principal wants to build a school climate where teachers feel safe taking instructional risks. Best strategy?",
 o:["Require all teachers to try one new strategy per semester","Leave risk-taking entirely to individual teacher initiative","Explicitly normalize and discuss both successes and setbacks from new instructional approaches in staff meetings","Recognize only teachers whose new strategies succeed"], c:2,
 e:"PSEL 3 calls for creating structures where staff can take appropriate risks for improving teaching and learning without fear of failure.",
 t:["A mandate can produce compliance without actually making risk-taking feel safe.","Leaving it entirely to individuals does nothing to build the safety the question specifically asks about.","Openly discussing both outcomes, including setbacks, is what actually removes the fear of failure.","Recognizing only what succeeds implicitly punishes setbacks, undermining the safety risk-taking requires."]},
{cat:"CC", q:"Students report feeling like adults in the building don't know them personally. Best systemic response?",
 o:["Add a student recognition bulletin board","Conduct a schoolwide survey each semester asking students whether they feel known by an adult at school","Address it case-by-case as issues arise","Implement a structure (advisory, mentor check-ins) ensuring every student has a consistent trusted adult connection"], c:3,
 e:"PSEL 3 calls for creating a school environment where each student is known, accepted, and valued through consistent, structural relationships.",
 t:["A bulletin board highlights a few students publicly but doesn't build relationships for every student.","Surveying more frequently provides better data on the problem, but measuring it isn't the same as building the actual structure — like an advisory or mentor system — that ensures every student has that connection.","Reactive, case-by-case handling means most students go unaddressed unless a problem surfaces.","A consistent structure like advisory guarantees every student, not just those who ask, gets a known relationship."]},
{cat:"CC", q:"A principal is developing a bullying prevention program. Which element is most critical to include?",
 o:["Assemblies focused on the topic once per year","A clear reporting system paired with proactive social-emotional curriculum and staff training on early intervention","A strict punishment schedule for offenders","A poster campaign around the building"], c:1,
 e:"PSEL 3 calls for implementing awareness and prevention systems, not just reactive discipline or one-time messaging.",
 t:["A once-a-year assembly is a one-time message, not an ongoing prevention system.","Combining a real reporting channel with proactive teaching and staff readiness covers both prevention and response.","A punishment schedule is purely reactive and does nothing to prevent bullying before it happens.","Posters raise awareness passively but provide no reporting mechanism or actual intervention training."]},
{cat:"CC", q:"Teachers express burnout and describe the school's culture as 'all compliance, no support.' Best leadership response?",
 o:["Address individual complaints privately without a broader response","Host a wellness day as a one-time gesture","Reduce the number of required initiatives this year based on the principal's judgment of which seem least essential","Engage staff in identifying which practices feel like unsupported compliance and collaboratively redesign them"], c:3,
 e:"PSEL 3 calls for developing open, trusting relationships and shared responsibility for a healthy work culture, not surface fixes.",
 t:["Handling complaints one by one misses the systemic culture issue staff are describing.","A single day of wellness activities doesn't change the underlying culture producing the burnout.","Cutting some initiatives may ease workload somewhat, but deciding unilaterally, without engaging staff on which practices actually feel like unsupported compliance, misses the collaborative diagnosis the culture shift requires.","Working with staff to name and redesign what feels like unsupported compliance addresses the actual culture, not just symptoms."]},
{cat:"CC", q:"A principal wants to institutionalize a culture of collaboration rather than rely on personality-driven teamwork. Best structural move?",
 o:["Require attendance at monthly full-staff meetings","Build shared planning time and clear collaborative structures (protocols, norms) into the master schedule","Recognize collaborative teachers informally","Encourage teachers to form their own informal groups"], c:1,
 e:"PSEL 3 calls for creating structures and procedures that provide time and resources for a collaborative learning community.",
 t:["Requiring attendance at meetings doesn't itself build collaborative structures or norms.","Building dedicated time and clear structures into the schedule makes collaboration systemic rather than dependent on personality.","Recognizing collaborative teachers informally doesn't create a structure others can rely on.","Leaving it to informal, self-formed groups is exactly the personality-driven approach the question wants to move away from."]},
{cat:"CC", q:"Students from a particular cultural background are noticeably underrepresented in advanced coursework. Best first step?",
 o:["Review the identification and enrollment criteria and process for hidden barriers to access","Increase outreach flyers about advanced courses translated into more languages","Set a strict enrollment quota reflecting school demographics","Wait to see if participation changes naturally over time"], c:0,
 e:"PSEL 3 calls for ensuring equitable access to learning opportunities by identifying and altering systems of practice that create opportunity gaps.",
 t:["Examining the actual criteria and process is the direct way to find what's blocking access.","More outreach doesn't help if the underlying identification criteria themselves are the barrier.","A quota addresses the numbers without fixing whatever process is producing the underrepresentation.","Waiting assumes the pattern will resolve itself without addressing its cause."]},
{cat:"CC", q:"A principal wants to build a schoolwide culture of high expectations for all students, especially those historically underserved. Best foundational action?",
 o:["Recognize high achievers publicly each quarter","Provide additional academic support resources specifically targeted at underperforming subgroups","Engage staff in examining current practices and beliefs that may perpetuate lower expectations for some groups","Post motivational messaging throughout the building"], c:2,
 e:"PSEL 3 calls for developing a shared commitment to high standards for all students, which starts with examining existing beliefs and practices.",
 t:["Recognizing those already achieving doesn't address expectations for those currently underserved.","Targeted support resources are a reasonable step, but without first examining whether staff beliefs and practices are contributing to lower expectations for these students, the support alone may not shift the underlying pattern.","Examining the beliefs and practices that may be lowering expectations gets at the actual root of the culture.","Posters convey a message but don't change any underlying staff belief or practice."]},
{cat:"CC", q:"New teachers report feeling isolated and unsupported in their first year. Best systemic solution?",
 o:["A welcome email from the principal at the start of the year","An optional new-teacher social event each semester","Leave mentorship informal, based on existing staff relationships","A structured mentoring program pairing new teachers with trained veteran mentors and regular check-ins"], c:3,
 e:"PSEL 3 calls for structures that support teacher growth and a community of care, which requires deliberate, sustained mentoring.",
 t:["A one-time email doesn't provide the ongoing support new teachers say they're missing.","An occasional optional event doesn't provide structured, consistent support.","Leaving mentorship informal means some new teachers get support and others don't, based on chance relationships.","A deliberate program with trained mentors and regular check-ins ensures every new teacher gets consistent support."]},
{cat:"CC", q:"A principal is addressing recurring conflict between two staff factions with different instructional philosophies. Best first step?",
 o:["Separate the factions onto different teams to reduce conflict","Side with the philosophy best supported by current data","Facilitate a structured dialogue where both groups articulate shared goals for students before debating methods","Let the conflict resolve naturally over time"], c:2,
 e:"PSEL 3 calls for open, productive working relationships built through shared purpose, which grounds conflict resolution in common goals first.",
 t:["Separating the groups avoids the conflict without resolving the underlying philosophical disagreement.","Picking a side skips the dialogue needed to find common ground and may deepen the divide.","Starting from shared goals for students, before debating methods, builds common ground before tackling the disagreement.","Hoping the conflict resolves on its own leaves it unaddressed and likely to continue."]},
{cat:"CC", q:"A principal notices emotionally supportive practices exist for students but not visibly for staff. Best way to build a reciprocal culture of care?",
 o:["Add an employee assistance program pamphlet to the staff handbook","Ask supervisors to check in on staff wellbeing during scheduled one-on-one meetings throughout the year","Create regular, structured opportunities (check-ins, peer support systems) for staff wellbeing, modeled by leadership","Assume staff will seek support if needed"], c:2,
 e:"PSEL 3 calls for promoting a healthy work-life balance and community of care for staff, not just passive resource availability.",
 t:["A pamphlet is passive information, not an active structure of support.","Regular check-ins during existing meetings show more consistent attention than reviews alone, but without dedicated, visible structures modeled by leadership specifically for staff wellbeing, it can still feel secondary to other agenda items.","Building visible, regular opportunities for staff support mirrors the same intentionality shown for students.","Assuming staff will ask for support ignores that many won't without an active structure inviting it."]},
{cat:"CC", q:"A principal wants students with disabilities to feel like full members of the school community, not just recipients of services. Best approach?",
 o:["Increase the frequency of pull-out support sessions","Build inclusive practices into general education spaces and decision-making, not only compliance-focused services","Ensure IEP compliance and services are delivered correctly","Recognize students with disabilities separately at year-end awards"], c:1,
 e:"PSEL 3 calls for each student to be known and valued as a member of the community, which requires inclusion beyond service compliance.",
 t:["Increasing pull-out time actually reduces time in the general community rather than building membership in it.","Building inclusion into everyday spaces and decisions treats students as full members, not separate recipients of services.","Compliance ensures services are delivered correctly but doesn't address the sense of belonging the question asks about.","A separate recognition track distinguishes rather than integrates these students into the community."]},
{cat:"CC", q:"A principal is investigating a report of harassment based on a student's identity. Best immediate step?",
 o:["Conduct a prompt, fair, and confidential investigation following established protocol, ensuring the reporting student's safety","Speak informally with the reporting student to gather more detail before deciding on next steps","Address it informally between the students involved","Handle it solely through a classroom-wide conversation"], c:0,
 e:"PSEL 3 calls for legal, fair, and timely investigation of misconduct that protects privacy, rights, and due process.",
 t:["Following established protocol protects both the investigation's integrity and the reporting student's safety.","Gathering more detail is a reasonable instinct, but doing so informally, outside the established investigation protocol, risks delaying the fair, structured process and protections the situation requires.","An informal conversation skips the protections a fair, protocol-based investigation is meant to provide.","Addressing it with the whole class risks exposing the reporting student rather than protecting their privacy."]},
{cat:"CC", q:"A school's culture has historically avoided discussing race and identity directly. A principal wants to shift toward more open, constructive dialogue. Best first step?",
 o:["Delegate the effort entirely to a student diversity club","Build staff capacity and comfort first through facilitated, ongoing professional learning before broader schoolwide dialogue","Address the topic only when incidents arise","Mandate a single schoolwide assembly on the topic"], c:1,
 e:"PSEL 3 calls for staff to act with cultural competence, which is built through sustained professional learning before scaling to the whole school.",
 t:["Handing this to a student club shifts adult responsibility for building staff capacity onto students.","Preparing staff with sustained learning before wider dialogue ensures the conversation is handled with genuine competence.","Purely reactive handling means the culture of avoidance continues until forced by an incident.","One assembly without staff preparation risks a surface-level event rather than building real capacity for dialogue."]},
// ---------------- ETHICAL LEADERSHIP (EL) ----------------
{cat:"EL", q:"A teacher confides suspicion that a colleague is inflating grades for athletic eligibility, asking for confidentiality. Best response?",
 o:["Explain confidentiality has limits given the integrity concern, then begin a discreet, fact-based review","Escalate to the district office after briefly noting the concern in an email","Ask the reporting teacher to gather more proof herself","Promise full confidentiality to preserve trust"], c:0,
 e:"PSEL 4 calls for recognizing when ethics have been breached and taking appropriate action, while safeguarding confidentiality within legal limits.",
 t:["This honestly sets expectations about confidentiality while still taking the integrity concern seriously through a careful, low-profile review.","A brief email documents the concern, but escalating right away, without first conducting even a discreet initial review, skips verifying whether there's a real basis before involving the district.","Putting the burden of proof on the reporting teacher risks retaliation and isn't the principal's role to delegate.","Promising unconditional confidentiality could box the principal into being unable to act if the concern turns out to be substantiated."]},
{cat:"EL", q:"A principal discovers an instructional aide has been using students' personal information inappropriately on social media. Best first action?",
 o:["Terminate the aide immediately without investigation","Address it informally with a verbal reminder about the handbook","Follow formal district protocol for reviewing the incident, including protecting student privacy going forward","Ignore it since it happened outside school hours"], c:2,
 e:"PSEL 4 calls for using appropriate systems and procedures to protect confidentiality and to address unethical behavior through due process.",
 t:["Terminating without any investigation skips due process even for a legitimate concern.","A casual reminder treats a privacy violation as a minor lapse rather than the serious concern it is.","Following the established protocol ensures both a fair process and that student privacy protections are put in place going forward.","Where it happened doesn't change that student personal information was misused; this dismisses a real concern."]},
{cat:"EL", q:"A school board member asks a principal for preferential enrollment consideration for their child with a specific teacher. Best response?",
 o:["Deny it and publicly announce the request was made","Grant the request quietly to maintain a good relationship with the board","Apply the same placement process used for all families, regardless of the requester's position","Grant the request, documenting in a private note that it was made by a board member"], c:2,
 e:"PSEL 4 calls for equitable, transparent decision-making applied consistently, regardless of a requester's influence.",
 t:["Publicizing the request escalates a personnel and family matter unnecessarily and isn't required to uphold fairness.","Granting the request based on the requester's position is exactly the kind of influence-based decision that undermines equity.","Using the same process regardless of who's asking is what actually ensures fairness and consistency.","Documenting the request shows some awareness of the sensitivity, but granting it at all, regardless of documentation, still departs from applying the same placement process used for every family."]},
{cat:"EL", q:"A principal has data suggesting a pattern of unfair grading practices toward a specific group of students by one department. Best first step?",
 o:["Ask the department head to handle it internally without oversight","Wait for parent complaints before investigating","Review the grading data and practices directly and address inequities found, involving the department as needed","Ask the department to conduct its own internal review and report back with findings"], c:2,
 e:"PSEL 4 calls for safeguarding equity and holding staff accountable for ethical behavior, which requires proactive review, not waiting for escalation.",
 t:["Leaving it entirely to the department itself, without any oversight, doesn't ensure the concern is actually addressed.","Waiting for complaints lets a known pattern of unfair grading continue affecting students in the meantime.","Directly reviewing the data and practices is the proactive step needed to confirm and fix the pattern.","An internal review shows some responsiveness, but relying on the department to review itself, without direct principal oversight of the data and practices, risks a less objective examination of the pattern."]},
{cat:"EL", q:"A principal wants to model transparent decision-making around a controversial policy change. Best approach?",
 o:["Make the decision privately, then announce it with a brief rationale","Avoid explaining the reasoning to prevent further debate","Poll only formal leadership team members before deciding","Share the data and reasoning behind the decision-making process, then explain the outcome and how input was considered"], c:3,
 e:"PSEL 4 calls for modeling transparent, consistent decision-making by making data and rationale explicit and communicating an open process.",
 t:["A brief rationale after a private decision doesn't model the open process transparency actually requires.","Avoiding explanation entirely is the opposite of transparency.","Limiting input to a small leadership group before deciding isn't the open, broadly informed process being modeled.","Sharing the reasoning and how input was considered throughout the process is what actually makes decision-making transparent."]},
{cat:"EL", q:"A principal learns a teacher used derogatory language toward a student's family in a private conversation overheard by a colleague. Best first step?",
 o:["Ask the overhearing colleague for more detail, then decide on next steps within a few days","Address the incident directly with the teacher, and take appropriate corrective action per policy","Dismiss it since it wasn't said directly to the family","Wait to see if the family finds out and complains"], c:1,
 e:"PSEL 4 calls for recognizing unethical behavior that could adversely affect others and taking appropriate action promptly.",
 t:["Gathering a bit more detail is reasonable, but taking several days before addressing a known ethical concern about derogatory language toward a family still delays the prompt corrective action the situation calls for.","Addressing the behavior directly and applying policy is the appropriate response to a real ethical concern, regardless of who overheard it.","Whether the family heard it directly doesn't change that the behavior itself is a problem.","Waiting for the affected family to find out and complain avoids addressing behavior the school already knows about."]},
{cat:"EL", q:"A principal is under pressure from a state deadline to certify data that appears incomplete. Best ethical response?",
 o:["Request an extension while correcting the data, documenting the reason for the delay","Estimate missing values to complete the submission","Submit and correct it quietly afterward if noticed","Submit the data as-is to meet the deadline"], c:0,
 e:"PSEL 4 calls for transparent, accurate data practices; certifying known-incomplete data undermines integrity even under deadline pressure.",
 t:["Requesting more time to actually fix the data is the honest path, even under deadline pressure.","Filling gaps with estimates to meet a deadline compromises the integrity of the certified data.","Planning to quietly fix it only if noticed treats accuracy as optional rather than a standing responsibility.","Submitting data known to be incomplete undermines the integrity of what's being certified."]},
{cat:"EL", q:"A principal suspects a hiring decision was influenced by a personal relationship rather than qualifications. Best response?",
 o:["Proceed with the hire since it's already been informally promised","Proceed but note the concern in a private file","Pause the process and ensure the decision follows the school's equitable hiring procedures","Defer entirely to the hiring manager's judgment"], c:2,
 e:"PSEL 4 calls for offering equitable access to hiring and promotion, which requires pausing to verify the process was followed fairly.",
 t:["An informal promise doesn't override the responsibility to follow a fair hiring process.","Documenting privately without pausing the process doesn't actually address the suspected influence.","Pausing to verify the process was followed fairly is the direct way to address a suspected integrity issue before it's finalized.","Deferring entirely avoids the principal's own responsibility to ensure the process was fair."]},
{cat:"EL", q:"Multiple staff express discomfort about a new policy but no one has formally objected. A principal wants ethical, transparent leadership. Best approach?",
 o:["Assume silence means agreement","Proceed since no formal objection was raised","Proactively invite feedback and concerns before finalizing the policy","Address concerns informally as individual staff members happen to bring them up in passing"], c:2,
 e:"PSEL 4 calls for facilitating an open decision-making process rather than treating silence as consent.",
 t:["Treating silence as agreement ignores that staff may not feel comfortable formally objecting.","Proceeding without addressing known discomfort, just because no one filed an objection, misses the spirit of open leadership.","Proactively creating space for concerns before finalizing is what genuinely open, transparent leadership looks like.","Responding to concerns as they come up shows some openness, but without proactively inviting feedback from everyone before finalizing, quieter staff who don't happen to raise it in passing are still left out of the process."]},
{cat:"EL", q:"A principal must decide whether to disclose the reason for a teacher's sudden leave to curious staff. Best response?",
 o:["Confirm or deny rumors directly when asked","Share general information to reduce speculation and rumors","Let the front office decide what to say","Protect the teacher's confidentiality and share only what is appropriate and necessary operationally"], c:3,
 e:"PSEL 4 calls for using systems and procedures that protect the rights and confidentiality of faculty and staff.",
 t:["Confirming or denying specific rumors risks revealing details that should remain confidential.","Sharing \"general information\" still risks revealing more than is appropriate about a personnel matter.","Leaving the decision to whoever happens to be asked creates inconsistent handling of a confidentiality matter.","Limiting disclosure to what's operationally necessary is what actually protects the teacher's confidentiality rights."]},
{cat:"EL", q:"A principal discovers a student's data was inadvertently shared with an unauthorized third party. Best first step?",
 o:["Address it only if the family notices","Correct the error and inform the affected family personally, without formally documenting it in district systems","Follow the district's data breach protocol, including notifying appropriate parties as required by law","Discipline the staff member involved before investigating"], c:2,
 e:"PSEL 4 calls for protecting confidentiality through established procedures, including legally required notification steps.",
 t:["Waiting for the family to notice ignores the school's own responsibility to respond to a known breach.","Personally informing the family shows more transparency than doing it quietly, but skipping formal documentation still means the district's required breach protocol and any necessary broader notifications aren't fully followed.","Following the established protocol, including required notifications, is what actually fulfills the legal and ethical obligation here.","Disciplining before investigating skips understanding what actually happened and who, if anyone, is responsible."]},
{cat:"EL", q:"A vendor offers a principal a personal gift in exchange for a facilities contract recommendation. Best response?",
 o:["Decline the gift and follow the district's standard procurement process","Ask a colleague whether it's acceptable","Accept but disclose it afterward","Accept a modest gift since it doesn't affect the decision"], c:0,
 e:"PSEL 4 calls for modeling integrity and holding self accountable for ethical behavior, which precludes accepting gifts tied to decisions.",
 t:["Declining and sticking to the standard process is what keeps the recommendation free of improper influence.","Asking a colleague's opinion doesn't resolve the underlying conflict of interest in accepting the gift.","Disclosing after accepting doesn't undo having accepted something tied to an active decision.","Assuming a gift has no influence doesn't remove the actual appearance and risk of a conflict of interest."]},
{cat:"EL", q:"A principal notices a colleague administrator consistently bypasses due process in disciplinary decisions. Best response?",
 o:["Mention it informally to other staff to be aware","Avoid getting involved since it's not the principal's department","Document the pattern in detail and raise it with the colleague privately in a one-on-one conversation","Address the concern directly, and escalate through appropriate channels if the pattern continues"], c:3,
 e:"PSEL 4 calls for holding self and others accountable for ethical behavior, which requires direct action, not private documentation or avoidance.",
 t:["Discussing it informally with other staff doesn't address the colleague's actual practice or protect those affected.","Avoiding involvement ignores the responsibility to hold colleagues accountable for ethical practice.","A private conversation is a reasonable first step, but without also being prepared to escalate through appropriate channels if the pattern continues, addressing it only privately may not create enough accountability to actually change the behavior.","Direct address, with escalation as a next step if needed, is what actually holds a colleague accountable."]},
{cat:"EL", q:"A principal wants to ensure equitable access to extracurricular opportunities regardless of a family's ability to pay. Best approach?",
 o:["Rely on scholarship requests submitted by families","Address it only when a family raises a concern","Maintain current fees since most families can afford them","Proactively review fee structures and build in accessible alternatives (waivers, sliding scale) communicated to all families"], c:3,
 e:"PSEL 4 calls for safeguarding equity and individual freedom, which requires proactive access, not reactive accommodation.",
 t:["Waiting for families to request scholarships assumes they know one exists and are comfortable asking.","Reactive handling means some families go without access simply because they didn't speak up.","Assuming most families can afford it ignores the families who specifically cannot.","Proactively building in waivers or sliding scale options, communicated to everyone, ensures access isn't limited to who happens to ask."]},
{cat:"EL", q:"A principal receives an anonymous tip about a teacher's inappropriate online interactions with students outside of official platforms. Best first step?",
 o:["Confront the teacher directly and informally first","Dismiss the tip since it's anonymous","Review the teacher's recent interactions with students more broadly before deciding whether a formal investigation is warranted","Initiate a discreet, appropriate investigation following district protocol for student safety concerns"], c:3,
 e:"PSEL 4 calls for taking responsibility for each student's safety and well-being, requiring prompt, protocol-driven investigation.",
 t:["Confronting informally first, before any protocol-driven investigation, risks compromising a serious safety concern.","Dismissing a tip solely because it's anonymous ignores that anonymous tips can still point to real, serious concerns.","A broader informal review shows some diligence, but taking time to review generally, rather than initiating the discreet, protocol-driven investigation the safety concern calls for, still delays the more rigorous response the situation needs.","Initiating an appropriate, discreet investigation is the right first response to a student safety concern, regardless of the tip's anonymity."]},
// ---------------- ORGANIZATIONAL LEADERSHIP (OL) ----------------
{cat:"OL", q:"A principal is developing a school safety plan after a state mandate update. Best process?",
 o:["Have the administrative team draft it alone for efficiency","Adopt a neighboring school's plan directly","Involve staff, students, and families in developing and reviewing the plan, then conduct ongoing reviews","Ask the district safety office to draft the plan, then have the administrative team review it before adoption"], c:2,
 e:"PSEL 5 calls for involving appropriate stakeholders in developing a comprehensive safety plan and conducting ongoing reviews.",
 t:["Drafting it entirely within administration skips the stakeholder involvement PSEL 5 calls for.","Copying another school's plan doesn't account for this school's specific facility and community context.","Bringing staff, students, and families into development, then reviewing over time, builds both a better plan and one that stays current.","Reviewing before adoption adds a check, but building the plan primarily from a district draft, rather than involving staff, students, and families directly, still misses the practical, local input the process calls for."]},
{cat:"OL", q:"Facing a mid-year budget cut, a principal must reduce spending without harming instruction. Best approach?",
 o:["Cut extracurricular programs first since they're non-academic","Review spending against strategic priorities and cut lowest-impact items first","Freeze new spending on discretionary items only, for the rest of this fiscal year","Cut evenly across all budget lines"], c:1,
 e:"PSEL 5 calls for allocating funds based on student needs and acting as an accountable steward, which requires prioritizing by impact, not blanket cuts.",
 t:["Cutting a whole category first, based on a label rather than actual impact, skips the strategic prioritization the situation calls for.","Reviewing spending against strategic priorities targets cuts where they'll do the least harm to instruction.","Limiting the freeze to discretionary items is more targeted than an across-the-board freeze, but it doesn't involve the active, priority-based review that identifies specifically which items matter most versus least right now.","An even cut treats all budget lines as equally important, which ignores actual priorities."]},
{cat:"OL", q:"A principal is recruiting to fill several teaching vacancies at a hard-to-staff school. Best hiring strategy?",
 o:["Target candidates with relevant experience and qualifications matched to identified student needs","Rely mainly on the district's central applicant pool, occasionally reaching out to a few local contacts","Prioritize candidates who reflect the school's demographics above all else","Hire the first qualified applicant for each position to fill vacancies quickly"], c:0,
 e:"PSEL 5 calls for implementing effective strategies to recruit certified staff matched to student needs, not speed alone.",
