{cat:"EL", q:"A principal wants students' rights to privacy respected consistently when discussing individual student needs in staff meetings. Best approach?",
 o:["Discuss individual student details openly to ensure all relevant staff are informed","Limit discussion of individual student details to those with a legitimate need to know, following confidentiality procedures","Avoid discussing individual student needs in staff meetings altogether","Share details only with the student's current teachers, regardless of the meeting's broader attendance"], c:1,
 e:"PSEL 4 calls for using appropriate systems and procedures to protect the rights and confidentiality of students, based on legitimate need to know."},
{cat:"EL", q:"A principal is deciding whether to override the results of a fair but flawed process for selecting the teacher-of-the-year award, after discovering a scoring error inflated one candidate's total. Best response?",
 o:["Let the results stand since the award has already been announced","Transparently correct the scoring error and communicate the correction and rationale to those involved","Quietly award both candidates without explaining the discrepancy","Delay any correction until the error is publicly discovered"], c:1,
 e:"PSEL 4 calls for modeling transparent, consistent decision-making practices, including correcting known errors openly rather than avoiding them."},
{cat:"EL", q:"A principal wants to ensure a new discipline matrix is applied consistently and does not inadvertently disadvantage a particular group of students. Best approach before full implementation?",
 o:["Implement the matrix schoolwide immediately, given time pressure","Pilot the matrix and review disaggregated outcome data for early evidence of disparate impact before full implementation","Assume the matrix is fair since it was developed by a reputable outside organization","Implement it only in grade levels with the most reported incidents"], c:1,
 e:"PSEL 4 calls for safeguarding equity, which requires checking a new policy's real-world impact on subgroups before scaling it schoolwide."},
{cat:"EL", q:"A principal learns that a well-intentioned staff member shared a struggling student's personal circumstances with other teachers without the family's consent, aiming to build a support network. Best response?",
 o:["Take no action since the intent was supportive","Address the confidentiality breach directly with the staff member and review information-sharing procedures with the team","Praise the collaborative intent without addressing the breach","Address it only if the family raises a formal complaint"], c:1,
 e:"PSEL 4 calls for protecting the confidentiality of students through appropriate systems and procedures, regardless of good intent behind a breach."},
{cat:"EL", q:"A principal wants ethical decision-making to guide a policy on students' use of personal devices, balancing safety with student responsibility. Best approach?",
 o:["Ban personal devices outright without further consideration","Develop a policy through stakeholder input that balances safety concerns with fostering student responsibility and trust","Allow unrestricted use to avoid conflict","Base the policy solely on what a neighboring school has implemented"], c:1,
 e:"PSEL 4 calls for safeguarding values of individual responsibility while addressing legitimate safety concerns through a thoughtful, inclusive process."},
{cat:"EL", q:"A principal wants to model consistent decision-making around a sensitive personnel matter without violating confidentiality. Best approach when staff ask for details?",
 o:["Share full details to maintain transparency with the staff","Explain that confidentiality limits what can be shared, while affirming the matter is being handled through appropriate process","Decline to respond to any questions at all","Share partial details selectively with a few trusted staff members"], c:1,
 e:"PSEL 4 calls for balancing transparent decision-making with the confidentiality protections owed to individuals in personnel matters."},
{cat:"EL", q:"A principal is deciding how to handle a report that a colleague administrator made a discriminatory remark during a hiring interview. Best first step?",
 o:["Dismiss the report since it was not made by the candidate directly","Investigate the report through appropriate district channels, protecting the confidentiality of those involved as appropriate","Address it informally with the colleague without further investigation","Wait for a formal complaint from the affected candidate before acting"], c:1,
 e:"PSEL 4 calls for recognizing when ethics have been breached and taking appropriate action, including formal investigation of serious allegations."},
{cat:"EL", q:"A principal wants to promote ethical behavior among students, not just staff, in how academic integrity violations are handled. Best approach?",
 o:["Apply harsh, uniform discipline for any academic integrity violation regardless of context","Address violations through a fair, educational process that reinforces the value of integrity while ensuring due process","Address academic integrity only through classroom teacher discretion, without a schoolwide approach","Ignore minor violations to avoid overburdening the disciplinary process"], c:1,
 e:"PSEL 4 calls for promoting ethical behavior among students through fair, educational processes, not just punitive uniformity."},
{cat:"EL", q:"A principal wants a policy on staff use of school-issued devices and email to reflect appropriate ethical technology use expectations. Best approach to developing the policy?",
 o:["Adopt a strict policy focused solely on prohibited uses","Develop clear, transparent expectations for appropriate use that balance accountability with reasonable staff autonomy","Leave technology use expectations undefined to avoid micromanaging staff","Base the policy solely on what has caused problems at other schools"], c:1,
 e:"PSEL 4 calls for practicing and modeling appropriate technology use, balanced and clearly communicated rather than purely restrictive or undefined."},
{cat:"EL", q:"A principal wants a policy addressing dress code enforcement to avoid disproportionately targeting any one group of students. Best approach?",
 o:["Apply the existing dress code without reviewing enforcement patterns","Review enforcement data by student group and revise the policy or its application if disparities are found","Eliminate the dress code entirely to avoid any risk of disparity","Address disparities only if raised through a formal complaint"], c:1,
 e:"PSEL 4 calls for safeguarding equity, which requires examining whether policy enforcement disproportionately affects any group."},
{cat:"EL", q:"A principal must decide whether to approve a fundraiser proposed by a student group that could be seen as excluding students who can't afford to participate. Best approach?",
 o:["Approve the fundraiser as proposed since it was student-initiated","Work with the student group to modify the fundraiser so all students can participate regardless of financial means","Deny the fundraiser outright without further discussion","Approve it only for students who can demonstrate they can afford to participate"], c:1,
 e:"PSEL 4 calls for safeguarding equity and access, which requires adapting practices so all students can participate regardless of financial means."},
{cat:"EL", q:"A principal wants a new peer-mentoring program to be run in a way that protects the privacy of both mentors and mentees regarding sensitive personal information shared. Best approach?",
 o:["Allow mentors to discuss whatever they judge helpful with school staff","Establish clear confidentiality guidelines and mandatory reporting boundaries for the program before it begins","Address confidentiality concerns only if an issue arises","Require mentors to report all conversations to school staff in full detail"], c:1,
 e:"PSEL 4 calls for using appropriate systems and procedures to protect confidentiality, established proactively before a program begins."},
{cat:"EL", q:"A principal wants ethical leadership modeled visibly enough that new staff learn expectations through observed practice, not just a handbook. Best approach?",
 o:["Rely on the staff handbook's ethics section during onboarding","Model transparent, accountable decision-making visibly and consistently so new staff observe expectations in practice","Address ethical expectations only if a new staff member's conduct becomes a concern","Assume new staff will infer expectations from veteran colleagues"], c:1,
 e:"PSEL 4 calls for modeling personal and professional ethics in visible practice as the clearest way to set expectations, not documentation alone."},
{cat:"EL", q:"A principal wants a whistleblower-style concern raised by a staff member about a financial irregularity to be handled in a way that protects the staff member from retaliation. Best approach?",
 o:["Investigate the concern but do not take any specific steps to protect the reporting staff member","Investigate the concern through appropriate channels while actively safeguarding the reporting staff member from retaliation","Ask the reporting staff member to raise the concern directly with the person involved first","Delay investigation until the staff member is willing to be named publicly"], c:1,
 e:"PSEL 4 calls for safeguarding individuals and holding others accountable for ethical behavior, which includes protecting those who report concerns in good faith."},

// Organizational Leadership +34 (50 total)
{cat:"OL", q:"A principal is prioritizing a long list of facility needs (roof repair, playground equipment, HVAC) with limited annual funding. Best approach?",
 o:["Address whichever need was requested most recently","Prioritize by documented safety risk and instructional impact, distinguishing urgent needs from long-range planning","Address needs in the order they appear on a master list, regardless of urgency","Address only the need most visible to visiting families"], c:1,
 e:"PSEL 5 calls for prioritizing short-term and long-range facilities needs based on safety and impact, not visibility or arbitrary order."},
{cat:"OL", q:"A principal is developing a plan for community use of the school's facilities that complies with district policy. Best first step?",
 o:["Approve requests case-by-case based on personal judgment","Establish a clear, published process based on district policy that any community group can follow to request facility use","Limit facility use to organizations the principal already knows well","Refer all facility use requests directly to the superintendent"], c:1,
 e:"PSEL 5 calls for following district policy on facility use through a clear, equitable process available to the community."},
{cat:"OL", q:"A principal wants to ensure the school is ready for an unannounced safety inspection at any time, not just before a scheduled one. Best approach?",
 o:["Prepare intensively only when notified an inspection is upcoming","Build ongoing compliance monitoring and routine checks into standard operating procedures year-round","Assign inspection readiness solely to the facilities staff without administrative oversight","Address compliance issues only as they're identified during actual inspections"], c:1,
 e:"PSEL 5 calls for ensuring compliance with safety regulations and readiness for inspections through ongoing, not just reactive, monitoring."},
{cat:"OL", q:"A principal wants to implement an internet-use policy and actually monitor compliance, not just publish the policy. Best approach?",
 o:["Publish the policy in the student handbook and assume compliance","Publish clear expectations and pair them with a practical system for monitoring and addressing violations","Rely on students to self-report violations","Address violations only when a serious incident occurs"], c:1,
 e:"PSEL 5 calls for implementing an internet-use policy and monitoring compliance, not simply publishing expectations."},
{cat:"OL", q:"A principal wants the school's daily operations and administrative systems to visibly reflect the school's stated mission and core values, not operate separately from them. Best approach?",
 o:["Address mission alignment only in the annual strategic plan document","Review key operational systems (scheduling, communication, recognition) for alignment with the mission and adjust as needed","Assume operations naturally reflect the mission since staff are aware of it","Focus mission alignment efforts solely on instructional programs, not operations"], c:1,
 e:"PSEL 5 calls for instituting and managing operations and administrative systems that promote the mission, vision, goals, and values directly."},
{cat:"OL", q:"A principal is developing a collaborative budget process for the upcoming year rather than finalizing the budget alone. Best approach?",
 o:["Draft the budget independently, then share it with staff for informational purposes","Involve staff and relevant stakeholders in identifying priorities before finalizing budget allocations","Delegate the entire budget process to the school's finance clerk","Base the budget primarily on the prior year's allocations without further input"], c:1,
 e:"PSEL 5 calls for developing and monitoring a collaborative budget process, not a top-down or purely historical approach."},
{cat:"OL", q:"A principal wants to act as a responsible, ethical steward of school resources when a vendor offers a bulk discount contingent on purchasing far more than the school currently needs. Best response?",
 o:["Accept the discount and store the surplus for future use","Evaluate actual need against the offer and purchase only what's justified by current and near-term needs","Accept the discount to reduce future budget requests","Decline any vendor discounts as a matter of policy"], c:1,
 e:"PSEL 5 calls for acting as a responsible, ethical, and accountable steward of the school's resources, guided by actual need."},
{cat:"OL", q:"A principal is developing an induction and mentoring plan for newly hired teachers as part of a broader recruitment and retention strategy. Best approach?",
 o:["Assign new teachers a mentor informally, based on availability","Develop a structured induction and mentoring plan with clear expectations, training for mentors, and regular check-ins","Rely on new teachers to seek out support as needed","Provide induction support only during the first week of the school year"], c:1,
 e:"PSEL 5 calls for planning effective induction and mentoring programs as part of recruiting, supporting, and retaining effective staff."},
{cat:"OL", q:"A principal wants the school's teacher recruitment process to be reflective of the diversity of the school community. Best approach?",
 o:["Rely solely on the district's central applicant pool","Proactively expand recruitment outreach to sources likely to reach a more diverse pool of qualified candidates","Set a strict demographic hiring quota","Focus recruitment efforts only on candidates referred by current staff"], c:1,
 e:"PSEL 5 calls for ensuring a recruitment process reflective of the diversity of the school community through proactive outreach."},
{cat:"OL", q:"A principal must assign a limited number of specialized support staff (reading specialists, counselors) across multiple grade levels with varying needs. Best approach?",
 o:["Divide support staff time equally across all grade levels","Assign support staff based on documented student needs and legal requirements across grade levels","Assign support staff based on which grade level requests the most support","Assign support staff based on seniority of the grade-level teachers"], c:1,
 e:"PSEL 5 calls for assigning personnel to address student needs, legal requirements, and equity goals, not equal division or requests alone."},
{cat:"OL", q:"A principal is evaluating whether an existing intervention program has adequate staffing to serve all eligible students, or whether additional hiring should be advocated for. Best approach?",
 o:["Assume current staffing is adequate unless a formal complaint arises","Analyze program enrollment and student need data against current staffing capacity to determine if additional hiring is justified","Advocate for additional hiring regardless of current program data","Wait for the district to identify staffing gaps independently"], c:1,
 e:"PSEL 5 calls for evaluating educational programs to ensure instructional and support needs are met, including advocating for hiring needs based on data."},
{cat:"OL", q:"A principal wants to strategically manage personnel assignments heading into a year with a significant enrollment shift in one grade level. Best approach?",
 o:["Maintain current staffing assignments to avoid disruption","Reassign or hire staff based on projected enrollment and identified student learning needs for that grade level","Address the shift only after the school year begins and actual enrollment is confirmed","Assign staffing changes based on which teachers request the grade level"], c:1,
 e:"PSEL 5 calls for strategically managing personnel assignments to optimize student-learning needs, informed by enrollment projections."},
{cat:"OL", q:"A principal is developing a comprehensive safety and security plan in accordance with local, state, and federal policy. Best process to ensure the plan is both compliant and practical?",
 o:["Adopt the plan template provided by the state without modification","Develop the plan per policy requirements while involving staff, students, and community members for practical input","Develop the plan solely with the district safety office, without school-level input","Delay development until a specific incident reveals a gap"], c:1,
 e:"PSEL 5 calls for developing a comprehensive safety plan in accordance with policy while involving appropriate stakeholders in its development."},
{cat:"OL", q:"A principal wants to ensure the school's safety and security plan stays current rather than becoming outdated. Best approach?",
 o:["Finalize the plan once and revisit it only if a serious incident occurs","Conduct ongoing, scheduled reviews of the plan to ensure it remains current and effective","Review the plan only when the district mandates an update","Rely on staff to flag needed updates informally as they notice issues"], c:1,
 e:"PSEL 5 calls for conducting ongoing reviews of the safety and security plan, not a one-time development process."},
{cat:"OL", q:"A principal wants to develop a system of support ensuring the welfare and safety of both students and staff, not just students. Best approach?",
 o:["Focus welfare and safety planning primarily on student-facing systems","Identify counseling and health services and align resources to meet the identified needs of both students and staff","Address staff welfare only through the district's employee assistance program referral","Assume staff welfare needs are adequately addressed by existing student support systems"], c:1,
 e:"PSEL 5 calls for developing a system of support for the welfare and safety of both students and staff, requiring resources aligned to both."},
{cat:"OL", q:"A principal wants to involve teachers, students, and parents in developing guidelines for student safety (e.g., safe arrival/dismissal procedures). Best approach?",
 o:["Develop the guidelines administratively, then inform stakeholders of the final version","Convene teachers, students, and parents early in the process to inform the guidelines before finalizing them","Rely solely on the district's model guidelines without local input","Address arrival/dismissal safety only if an incident occurs"], c:1,
 e:"PSEL 5 calls for involving teachers, students, and parents in developing, implementing, and monitoring guidelines for student welfare and safety."},
{cat:"OL", q:"A principal wants to stay current on student health program requirements (immunization records, vision screening) to ensure compliance. Best approach?",
 o:["Rely on the school nurse to independently manage all compliance without administrative oversight","Establish a regular process for the principal's office to review compliance status alongside the health office","Address compliance only when a family or state auditor raises a concern","Delegate all responsibility to the district health office without school-level tracking"], c:1,
 e:"PSEL 5 calls for being familiar with student health programs and ensuring compliance through active, not passive, oversight."},
{cat:"OL", q:"A principal is planning student safety programs, including background checks for volunteers and safe transportation procedures. Best approach?",
 o:["Address background checks and transportation safety only if concerns are raised","Proactively implement and regularly review procedures for volunteer background checks and safe student transportation","Rely on the district office to manage all volunteer background checks without school-level verification","Limit safety planning to on-campus concerns, since transportation is a district responsibility"], c:1,
 e:"PSEL 5 calls for planning student safety programs, including background checks and safe transportation, proactively and specifically at the school level."},
{cat:"OL", q:"A principal wants to identify and document key emergency support personnel, both inside and outside the school, and ensure this information is genuinely accessible during a crisis. Best approach?",
 o:["Maintain a list in the principal's personal files only","Maintain a clearly documented, regularly updated list accessible to relevant staff, with roles communicated in advance","Rely on staff to know who to contact based on experience","Update the list only after an actual emergency reveals a gap"], c:1,
 e:"PSEL 5 calls for identifying and documenting key emergency personnel and communicating that information clearly to appropriate parties in advance."},
{cat:"OL", q:"A principal wants to communicate safety expectations to the school community regularly, not just once at the start of the year. Best approach?",
 o:["Share safety expectations once during back-to-school orientation","Communicate safety expectations regularly through multiple channels, documenting when and how this occurred","Rely on the student handbook as the sole source of safety expectations","Communicate safety expectations only after an incident prompts the need"], c:1,
 e:"PSEL 5 calls for communicating with stakeholders regularly about safety expectations and documenting that communication."},
{cat:"OL", q:"A principal is deciding how to allocate a grant intended to improve operational efficiency. Best approach?",
 o:["Use the funds for whichever operational need is most visible to visitors","Assess current operational systems for the most impactful use of the funds tied to the school's efficiency and mission","Use the funds evenly across all departments regardless of documented need","Save the funds in case of a future emergency"], c:1,
 e:"PSEL 5 calls for using resources, including grants, to improve the quality and efficiency of operations tied to identified needs."},
{cat:"OL", q:"A principal wants a new data system's rollout to be monitored for whether it's actually improving operational efficiency, not just implemented and forgotten. Best approach?",
 o:["Assume efficiency has improved once the system is fully implemented","Establish specific metrics to monitor whether the new system is improving efficiency, and adjust processes as needed","Review the system's effectiveness only if staff complain","Rely on the vendor's marketing claims about efficiency gains"], c:1,
 e:"PSEL 5 calls for using technology to improve the quality and efficiency of operations, verified through ongoing monitoring, not assumption."},
{cat:"OL", q:"A principal wants facility improvement decisions to reflect both short-term needs (a broken door lock) and long-range planning (an aging roof). Best approach?",
 o:["Address only short-term needs as they arise, deferring all long-range planning","Address urgent short-term needs immediately while maintaining a documented long-range facilities plan","Focus primarily on long-range planning, addressing short-term needs only as budget allows","Alternate focus between short-term and long-range needs by year, regardless of urgency"], c:1,
 e:"PSEL 5 calls for prioritizing both short-term and long-range facilities needs simultaneously, not favoring one at the expense of the other."},
{cat:"OL", q:"A principal is deciding how to structure oversight of a newly hired assistant principal's first year to ensure accountability without micromanaging. Best approach?",
 o:["Provide minimal oversight to demonstrate trust","Establish clear expectations and regular check-ins, paired with growing autonomy as competence is demonstrated","Require the assistant principal to seek approval for every decision during the first year","Rely solely on the district's new-administrator training program for oversight"], c:1,
 e:"PSEL 5 calls for strategically managing personnel, providing structured support that builds capacity and appropriate autonomy over time."},
{cat:"OL", q:"A principal wants to ensure the school's data systems deliver accountable information without creating excessive burden on teachers to input data. Best approach?",
 o:["Add more required data fields to ensure comprehensive information","Streamline data collection to the essential fields needed for accountability and decision-making, minimizing redundant entry","Require teachers to enter the same data in multiple separate systems for redundancy","Reduce data collection requirements to the legal minimum only"], c:1,
 e:"PSEL 5 calls for using and maintaining data systems to deliver accountable information efficiently, balancing thoroughness with practicality."},
{cat:"OL", q:"A principal must decide how to respond to a state audit finding related to facilities compliance. Best approach?",
 o:["Dispute the finding to avoid the cost of remediation","Develop and implement a documented corrective action plan addressing the finding within the required timeline","Address the finding only if it recurs in a future audit","Delegate the response entirely to the facilities vendor without administrative oversight"], c:1,
 e:"PSEL 5 calls for ensuring compliance with safety regulations, which requires a timely, documented response to audit findings."},
{cat:"OL", q:"A principal wants a plan for acquiring and maintaining instructional technology that accounts for the full lifecycle of the equipment, not just the initial purchase. Best approach?",
 o:["Focus the budget primarily on purchasing the maximum number of devices","Build a plan that accounts for acquisition, ongoing maintenance, and eventual replacement of technology","Address maintenance needs only as devices begin to fail","Rely on the vendor to manage all maintenance without a school-level plan"], c:1,
 e:"PSEL 5 calls for developing a plan for acquisition and maintenance of equipment and technology, covering the full lifecycle."},
{cat:"OL", q:"A principal is deciding how to respond to a facilities emergency (a burst pipe flooding several classrooms) during the school day. Best immediate approach?",
 o:["Wait for district facilities staff to arrive before taking any action","Follow the emergency response plan to ensure student and staff safety first, then coordinate facilities repair","Focus first on facilities repair to minimize instructional disruption","Delay addressing the situation until after the school day ends"], c:1,
 e:"PSEL 5 calls for proactively addressing challenges to physical safety first, following an established emergency response plan."},
{cat:"OL", q:"A principal is deciding how to allocate limited professional support staff (school psychologist hours) across a building with varying levels of need by grade level. Best approach?",
 o:["Divide hours equally across all grade levels","Allocate hours based on documented student need and legal requirements (e.g., evaluation timelines) across grade levels","Allocate hours based on which grade level teachers request support most frequently","Allocate hours based on the psychologist's personal preference"], c:1,
 e:"PSEL 5 calls for assigning personnel to address student needs and legal requirements, not equal division or preference."},
{cat:"OL", q:"A principal wants a new master schedule to reflect both instructional priorities and operational efficiency. Best approach when building it?",
 o:["Prioritize operational convenience (e.g., minimizing room changes) over instructional priorities","Build the schedule starting from instructional priorities, then optimize for operational efficiency within that framework","Use the same schedule structure as the previous year to save planning time","Delegate scheduling entirely to a scheduling software without further review"], c:1,
 e:"PSEL 5 calls for aligning operations with the mission and goals, meaning instructional priorities should shape the schedule, not the reverse."},
{cat:"OL", q:"A principal is deciding whether to approve overtime pay for support staff during a facilities crunch before a major event. Best approach?",
 o:["Approve overtime without reviewing the budget impact","Review the budget impact and necessity, approving overtime only for essential, time-sensitive work","Deny all overtime requests regardless of circumstances","Approve overtime based on which staff members request it first"], c:1,
 e:"PSEL 5 calls for acting as a responsible, accountable steward of resources, requiring a needs-based review before approving added costs."},
{cat:"OL", q:"A principal wants a plan for facilities maintenance requests to be transparent and trackable for staff who submit them. Best approach?",
 o:["Handle maintenance requests informally as they're mentioned in passing","Implement a documented system for submitting, tracking, and prioritizing maintenance requests","Require all requests go directly to the principal personally","Address requests only during a designated annual maintenance review"], c:1,
 e:"PSEL 5 calls for instituting and managing operational systems that function reliably and transparently, not informal handling."},
{cat:"OL", q:"A principal is deciding how to structure onboarding for new support staff (custodial, cafeteria) to align with the school's broader safety and culture expectations. Best approach?",
 o:["Provide onboarding focused solely on job-specific tasks","Include safety protocols and culture expectations alongside job-specific training in onboarding for all staff, not just teachers","Assume support staff will learn expectations informally over time","Limit onboarding to a brief orientation document"], c:1,
 e:"PSEL 5 calls for ensuring a safe environment and modeling the mission across all staff roles, requiring onboarding that includes all staff, not only teachers."},
{cat:"OL", q:"A principal is deciding whether to invest limited operational funds in a facilities upgrade or additional instructional support staff. Best approach to this trade-off?",
 o:["Default to whichever option costs less","Evaluate both options against documented student needs and the school's strategic priorities before deciding","Choose the facilities upgrade, since physical improvements have lasting value","Choose additional staff by default, since staffing is always the higher priority"], c:1,
 e:"PSEL 5 calls for allocating resources based on student needs within the framework of the school's goals, not a default rule favoring one category."},

// Community Engagement Leadership +34 (50 total)
{cat:"CE", q:"A principal wants to remove specific barriers to learning identified by families (lack of transportation to tutoring, no quiet study space at home). Best first step?",
 o:["Assume the school cannot address barriers outside the school day","Collaborate with family and community resources to identify and address specific barriers, like transportation or study space","Address only the barriers the school can solve without community involvement","Refer families to community agencies without school-level coordination"], c:1,
 e:"PSEL 6 calls for accessing and using resources from the school, family, and community to remove barriers to learning collaboratively."},
{cat:"CE", q:"A principal wants families to have a genuine role in decisions about their children's individual educational placement, not just general schoolwide decisions. Best approach?",
 o:["Inform families of placement decisions after they are finalized","Involve families as active participants in placement discussions, with input considered before decisions are finalized","Involve families only when required by law (e.g., special education placements)","Rely on teacher recommendations alone for placement decisions"], c:1,
 e:"PSEL 6 calls for supporting and engaging families in decision-making about their children's individual education, not just schoolwide matters."},
{cat:"CE", q:"A principal wants to communicate schoolwide updates using a variety of channels (social media, email, evening meetings) to reach the broadest range of families. Best approach to selecting channels?",
 o:["Use whichever single channel is most convenient for the school office","Assess which channels different segments of the family community actually use and rely on, and use a mix accordingly","Use only the channel with the largest reach numerically","Use only in-person meetings to ensure personal connection"], c:1,
 e:"PSEL 6 calls for using effective public information strategies across multiple channels matched to how families actually communicate."},
{cat:"CE", q:"A principal wants two-way communication with families to be modeled consistently by all staff, not just the principal's office. Best approach?",
 o:["Handle all family communication centrally through the principal's office","Train and support staff schoolwide in two-way communication practices with families","Leave communication style entirely to individual teacher preference","Address communication concerns only if a family complains"], c:1,
 e:"PSEL 6 calls for modeling the need for two-way communication broadly, requiring schoolwide staff capacity, not centralization."},
{cat:"CE", q:"A principal wants to build positive family partnerships by genuinely celebrating educational successes, not just addressing problems. Best approach?",
 o:["Communicate with families primarily when addressing behavioral or academic concerns","Create regular, visible opportunities to celebrate and share student and school successes with families","Celebrate successes only at the end-of-year awards ceremony","Rely on students to share their own successes with families informally"], c:1,
 e:"PSEL 6 calls for applying communication strategies that include recognizing and celebrating educational success, not only addressing concerns."},
{cat:"CE", q:"A principal wants to demonstrate genuine ability to communicate effectively with local media beyond simply following protocol. Best approach?",
 o:["Provide only the minimum required statement to avoid extended engagement","Prepare clear, accurate messaging in advance, and engage proactively and professionally within district guidelines","Avoid media engagement whenever possible","Let a single designated staff member handle all interactions without broader message preparation"], c:1,
 e:"PSEL 6 calls for demonstrating an ability to communicate effectively with the media, which requires proactive preparation, not just minimal compliance."},
{cat:"CE", q:"A principal wants to genuinely identify the competing perspectives of different stakeholder groups (teachers, families, students) before a major decision. Best approach?",
 o:["Assume staff perspectives adequately represent all stakeholders","Proactively gather input from each distinct stakeholder group separately to understand their specific perspectives","Rely on the most vocal stakeholders to represent all perspectives","Address competing perspectives only if conflict arises after a decision is made"], c:1,
 e:"PSEL 6 calls for identifying the competing perspectives of faculty, staff, students, parents, and community members proactively."},
{cat:"CE", q:"A principal wants to engage with the local community proactively, not just when the school needs something. Best approach?",
 o:["Attend community events only when the school has an item to promote","Regularly participate in community events and build relationships independent of any immediate school need","Rely on the PTO to represent the school at community events","Engage with the community only during scheduled district-wide events"], c:1,
 e:"PSEL 6 calls for engaging with the local community proactively and regularly, not only transactionally."},
{cat:"CE", q:"A principal wants to advocate for the school within the broader community, building visibility and support over time. Best approach?",
 o:["Advocate for the school only during budget or bond campaigns","Build ongoing relationships and visibility within the community consistently, not only during high-stakes moments","Rely on the district's communications office to handle all community advocacy","Focus advocacy efforts solely on families already engaged with the school"], c:1,
 e:"PSEL 6 calls for engaging with the community proactively and advocating for the school within it on an ongoing basis."},
{cat:"CE", q:"A principal wants to accommodate the specific dynamics of a community with a recent influx of newcomer families using appropriate research-informed strategies. Best approach?",
 o:["Apply the same family engagement strategies used in past years without modification","Research effective engagement strategies for newcomer families and adapt current practices accordingly","Wait for newcomer families to adapt to existing school engagement practices","Address newcomer family engagement only through translated materials"], c:1,
 e:"PSEL 6 calls for accommodating diverse student and community dynamics using appropriate strategies and research methods."},
{cat:"CE", q:"A principal wants representatives from multiple distinct community groups to genuinely strengthen the school's educational planning, not just be present. Best approach?",
 o:["Invite diverse representatives to observe planning meetings without a defined role","Involve diverse community representatives with defined roles and real influence in shaping specific planning decisions","Rely on a single representative to speak for all diverse groups","Involve diverse representatives only after major decisions have been made"], c:1,
 e:"PSEL 6 calls for using diverse representatives of the community to strengthen educational programs and planning through real involvement."},
{cat:"CE", q:"A principal wants to demonstrate cultural sensitivity by engaging community members from a specific cultural group in shared responsibility for a new initiative, not just consultation. Best approach?",
 o:["Consult the group for feedback, then implement the initiative independently","Invite the group into shared planning and implementation roles, not just a consultative one","Assign a single staff member to represent the group's interests instead","Limit the group's involvement to an annual feedback survey"], c:1,
 e:"PSEL 6 calls for demonstrating cultural sensitivity by engaging community members in shared responsibilities, not consultation alone."},
{cat:"CE", q:"A principal wants to collaborate with a community health agency to address a rise in students needing vision or dental care. Best first step?",
 o:["Refer individual students to community resources as needs are identified","Establish an ongoing partnership with a community health agency to provide services proactively at the school","Address the issue only through the school nurse's existing caseload","Wait for families to request health-related community referrals"], c:1,
 e:"PSEL 6 calls for collaborating with community agencies that provide health, social, and other services to families and children proactively."},
{cat:"CE", q:"A principal wants to develop a mutually beneficial relationship with a local business willing to share resources (meeting space, volunteer time). Best approach?",
 o:["Accept the offer without documenting terms or expectations","Document the relationship's terms clearly, ensuring equitable, open access consistent with district policy","Limit the relationship to informal, undocumented arrangements to maintain flexibility","Decline the offer to avoid any appearance of favoring one business"], c:1,
 e:"PSEL 6 calls for developing mutually beneficial relationships with documented terms and equitable, open access as legally permissible."},
{cat:"CE", q:"A principal wants to evaluate whether the community resources the school currently uses are actually supporting student learning effectively. Best approach?",

function formatTime(sec){
  sec = Math.max(0, sec);
  const m = Math.floor(sec/60);
  const s = sec%60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

// ---------------- MOCK EXAM PROGRESS (persisted) ----------------
// Uses Claude's built-in storage when running inside Claude's interface (window.storage),
// and falls back to the browser's own localStorage when the file is downloaded and opened
// directly in a browser (where window.storage doesn't exist). Either way, progress persists
// on that device/browser between visits. The constructed-response timer is never persisted
// as "running" — reloading or leaving the app always resumes it paused, which is what lets
// someone step away mid-exam without the clock running out behind their back.
const MOCK_KEY = 'mock-exam-progress';

function hasClaudeStorage(){
  return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.set === 'function';
}

async function saveMockProgress(){
  const payload = JSON.stringify({
    order: state.items.map(q=>q._idx),
    idx: state.idx,
    answers: state.answers.map(a=>({ qIndex: a.q._idx, chosen: a.chosen, correct: a.correct })),
    phase: state.phase || 'mc',
    crItemIds: (state.crItems || []).map(c=>c.id),
    crResponses: state.crResponses || {},
    crIdx: state.crIdx || 0,
    crTimeRemaining: state.crTimeRemaining != null ? state.crTimeRemaining : CR_SECTION_SECONDS,
    savedAt: Date.now()
  });
  if(hasClaudeStorage()){
    try{ await window.storage.set(MOCK_KEY, payload, false); return; }
    catch(e){ /* fall through to local storage */ }
  }
  try{ localStorage.setItem(MOCK_KEY, payload); }
  catch(e){ /* no persistence available in this environment; practice still works this session */ }
}

async function loadMockProgress(){
  let raw = null;
  if(hasClaudeStorage()){
    try{
      const res = await window.storage.get(MOCK_KEY, false);
      raw = res ? res.value : null;
    } catch(e){ raw = null; }
  }
  if(!raw){
    try{ raw = localStorage.getItem(MOCK_KEY); }
    catch(e){ raw = null; }
  }
  if(!raw) return null;
  try{
    const parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.order) || parsed.order.length === 0) return null;
    return parsed;
  } catch(e){ return null; }
}

async function clearMockProgress(){
  if(hasClaudeStorage()){
    try{ await window.storage.delete(MOCK_KEY, false); } catch(e){ /* ignore */ }
  }
  try{ localStorage.removeItem(MOCK_KEY); } catch(e){ /* ignore */ }
}

// ---------------- QUIZ HISTORY (persisted, separate from in-progress state) ----------------
// Records every completed Mock Exam and Category Practice run so past scores and missed
// questions can be reviewed later. Stores question indices + chosen answers only (not full
// question text) to stay compact; questions are looked back up from QUESTIONS when reviewing.
const HISTORY_KEY = 'quiz-history';
const HISTORY_MAX_ENTRIES = 50;

async function loadHistory(){
  let raw = null;
  if(hasClaudeStorage()){
    try{
      const res = await window.storage.get(HISTORY_KEY, false);
      raw = res ? res.value : null;
    } catch(e){ raw = null; }
  }
  if(!raw){
    try{ raw = localStorage.getItem(HISTORY_KEY); }
    catch(e){ raw = null; }
  }
  if(!raw) return [];
  try{
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch(e){ return []; }
}

async function saveHistoryList(list){
  const payload = JSON.stringify(list);
  if(hasClaudeStorage()){
    try{ await window.storage.set(HISTORY_KEY, payload, false); return; }
    catch(e){ /* fall through */ }
  }
  try{ localStorage.setItem(HISTORY_KEY, payload); }
  catch(e){ /* no persistence available; history just won't be remembered this session */ }
}

async function recordHistoryEntry(entry){
  const list = await loadHistory();
  list.unshift(entry);
  if(list.length > HISTORY_MAX_ENTRIES) list.length = HISTORY_MAX_ENTRIES;
  await saveHistoryList(list);
}

async function clearAllHistory(){
  if(!confirm('Clear all saved history? This removes every past attempt and cannot be undone.')) return;
  await saveHistoryList([]);
  render();
}

function buildIncorrectList(answers){
  return answers.filter(a=>!a.correct).map(a=>({ qIdx: a.q._idx, chosen: a.chosen }));
}

function render(){
  try{
    let result;
    if(state.screen === 'home') result = renderHome();
    else if(state.screen === 'cat-picker') result = renderCatPicker();
    else if(state.screen === 'quiz'){
      result = (state.mode === 'mock' && state.phase === 'cr') ? renderMockCR() : renderQuiz();
    }
    else if(state.screen === 'results') result = renderResults();
    else if(state.screen === 'cr-picker') result = renderCRPicker();
    else if(state.screen === 'cr-write') result = renderCRWrite();
    else if(state.screen === 'history') result = renderHistory();
    else if(state.screen === 'history-detail') result = renderHistoryDetail();

    if(result && typeof result.catch === 'function'){
      result.catch(showFatalError);
    }
  } catch(err){
    showFatalError(err);
  }
}

function showFatalError(err){
  try{ console.error(err); } catch(e){}
  const message = (err && err.message) ? err.message : String(err);
  if(app){
    app.innerHTML = `
      <div class="error-note">
        <strong>Something went wrong loading this screen.</strong><br>
        ${message.replace(/</g,'&lt;')}<br><br>
        Try reloading the page. If you're viewing this through a text message, email, or file preview,
        try opening it directly in a full browser (Safari or Chrome) instead — some previews don't run
        the JavaScript this app needs.
        <div style="margin-top:14px;">
          <button class="btn small secondary" onclick="goHome()">Try going home</button>
        </div>
      </div>
    `;
  }
}

// ---------------- MOCK EXAM SETUP / RESUME ----------------
async function startMockExamSetup(){
  // Sample the exact category counts ETS outlines for the SLLA (6990) — e.g. Strategic
  // Leadership 20, Instructional Leadership 27, etc. — drawing a fresh random subset from
  // each category's full pool (up to 50 questions per category) every time. Also draw 4
  // constructed-response items at random from the full CR pool for Section II.
  let pool = [];
  Object.keys(CATEGORIES).forEach(k=>{
    const target = CATEGORIES[k].full;
    const catQs = shuffle(QUESTIONS.filter(q=>q.cat===k));
    pool = pool.concat(catQs.slice(0, target));
  });
  pool = shuffle(pool);
  const crItems = shuffle(CR_SCENARIOS).slice(0, 4);
  state = {
    screen:'quiz', mode:'mock', items: pool, idx:0, answers:[], selected:null, locked:false,
    phase:'mc', crItems, crResponses:{}, crIdx:0, crTimeRemaining: CR_SECTION_SECONDS, crTimerRunning:false
  };
  await saveMockProgress();
  render();
}
async function confirmNewMock(){
  if(!confirm('Starting a new mock exam will discard your in-progress run. Continue?')) return;
  await clearMockProgress();
  await startMockExamSetup();
}
async function resumeMockExam(){
  const saved = await loadMockProgress();
  if(!saved){ await startMockExamSetup(); return; }
  const items = saved.order.map(i=>QUESTIONS[i]);
  const answers = saved.answers.map(a=>({ q: QUESTIONS[a.qIndex], chosen: a.chosen, correct: a.correct }));
  const crItems = (saved.crItemIds || []).map(id => CR_SCENARIOS.find(s=>s.id===id)).filter(Boolean);
  state = {
    screen:'quiz', mode:'mock',
    items, idx: Math.min(saved.idx, items.length-1), answers, selected:null, locked:false,
    phase: saved.phase || 'mc',
    crItems, crResponses: saved.crResponses || {}, crIdx: saved.crIdx || 0,
    crTimeRemaining: saved.crTimeRemaining != null ? saved.crTimeRemaining : CR_SECTION_SECONDS,
    crTimerRunning: false
  };
  render();
}
async function discardMockProgress(){
  await clearMockProgress();
  render();
}

  state = { screen:'quiz', mode:'category', catKey, items, idx:0, answers:[], selected:null, locked:false };

}

function selectOpt(i){
  if(state.locked) return;
  state.selected = i;
  state.locked = true;
  state.answers.push({ q: state.items[state.idx], chosen: i, correct: i===state.items[state.idx].c });
  render();
}
async function nextItem(){
  if(!state.locked) return;
  if(state.idx === state.items.length-1){
    if(state.mode === 'mock'){
      // Move into Section II: Constructed Response, with its own 75-minute clock.
      state.phase = 'cr';
      startCRTimer();
      await saveMockProgress();
      render();
      return;
    }
    // Category practice run complete — record it to history before showing results.
    await recordHistoryEntry({
      id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
      type: 'category',
      catKey: state.catKey,
      date: Date.now(),
      correct: state.answers.filter(a=>a.correct).length,

      incorrect: buildIncorrectList(state.answers)
    });

  }
  state.idx++;
  state.selected = null;
  state.locked = false;
  if(state.mode === 'mock') await saveMockProgress();
  render();
}
async function confirmExit(){
  if(state.mode === 'mock'){
    // Progress (and, in the CR section, the timer) is saved automatically — pause and leave
    // without confirming. Reloading or leaving always resumes the CR timer paused.
    if(state.phase === 'cr'){
      saveCurrentCRResponse();
      pauseCRTimer();
      await saveMockProgress();
    }
    goHome();
    return;
  }
  if(state.answers && state.answers.length > 0){
    if(!confirm('Leave this practice session? Your progress on this run will be lost.')) return;
  }
  goHome();
}

// ---------------- MOCK EXAM: CONSTRUCTED-RESPONSE SECTION (TIMED) ----------------
function clearCRTimerHandle(){
  if(crTimerHandle){ clearInterval(crTimerHandle); crTimerHandle = null; }
}
function startCRTimer(){
  state.crTimerRunning = true;
  clearCRTimerHandle();
  crTimerHandle = setInterval(async ()=>{
    state.crTimeRemaining = Math.max(0, (state.crTimeRemaining||0) - 1);
    updateCRTimerDisplay();
    if(state.crTimeRemaining % 10 === 0){ await saveMockProgress(); }
    if(state.crTimeRemaining <= 0){
      clearCRTimerHandle();
      state.crTimerRunning = false;
      await finishCRSection(true);
    }
  }, 1000);
}
function pauseCRTimer(){
  clearCRTimerHandle();
  state.crTimerRunning = false;
}
function toggleCRTimer(){
  if(state.crTimerRunning){ pauseCRTimer(); }
  else{ startCRTimer(); }
  saveMockProgress();
  renderMockCR();
}
function updateCRTimerDisplay(){
  const el = document.getElementById('crTimerDisplay');
  if(!el) return;
  el.textContent = formatTime(state.crTimeRemaining);
  el.classList.toggle('time-low', state.crTimeRemaining <= 300);
}
function saveCurrentCRResponse(){
  const ta = document.getElementById('mockCRResponse');
  if(ta && state.crItems && state.crItems[state.crIdx]){
    state.crResponses[state.crItems[state.crIdx].id] = ta.value;
  }
}
async function finishCRSection(timeExpired){
  saveCurrentCRResponse();
  pauseCRTimer();
  state.crFinishedNote = timeExpired
    ? "Time's up for the constructed-response section — your responses have been saved below."
    : '';
  const byCat = {};
  state.answers.forEach(a=>{
    const c = a.q.cat;
    byCat[c] = byCat[c] || {correct:0,total:0};
    byCat[c].total++;
    if(a.correct) byCat[c].correct++;
  });
  await recordHistoryEntry({
    id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
    type: 'mock',
    date: Date.now(),
    correct: state.answers.filter(a=>a.correct).length,
    total: state.answers.length,
    byCat,
    incorrect: buildIncorrectList(state.answers)
  });
  state.screen = 'results';
  await clearMockProgress();
  render();
}
async function mockCRNext(){
  saveCurrentCRResponse();
  if(state.crIdx === state.crItems.length-1){
    await finishCRSection(false);
    return;
  }
  state.crIdx++;
  await saveMockProgress();
  renderMockCR();
}
async function mockCRPrev(){
  saveCurrentCRResponse();
  if(state.crIdx === 0) return;

        compare your raw points to the one documented benchmark from ETS's own standard-setting study: a raw score

      </p>

        ${[0,1,2,3].map(i => `
          <label class="cr-score-input">
            CR ${i+1}
            <select onchange="setCRScore(${i}, this.value)">

function updateReadinessResult(mcCorrect){
  const el = document.getElementById('readinessResult');
  if(!el) return;
  const loggedCR = state.crScores.filter(s => s !== null);
  const crTotal = loggedCR.reduce((a,b)=>a+b, 0);
  const crMax = 12;
  const mcMax = 120;
  const rawTotal = mcCorrect + crTotal;
  const rawMax = mcMax + crMax;
  const pctOfMax = Math.round((rawTotal / rawMax) * 100);
  const benchmarkPct = Math.round((77/133) * 100);
  const diff = pctOfMax - benchmarkPct;

  let comparisonNote;
  if(loggedCR.length < 4){
    comparisonNote = `Log all 4 constructed-response scores above for a fuller picture &mdash; currently showing ${loggedCR.length}/4 logged.`;
  } else if(diff >= 5){
    comparisonNote = `That's meaningfully above the documented benchmark (${benchmarkPct}%) &mdash; a good sign, though it's not a guarantee of any particular scaled score.`;
  } else if(diff >= -5){
    comparisonNote = `That's close to the documented benchmark (${benchmarkPct}%) &mdash; right around where a passing score has historically landed, though this varies by form and state.`;
  } else {
    comparisonNote = `That's below the documented benchmark (${benchmarkPct}%) &mdash; may be worth more practice before test day, though this comparison is approximate.`;
  }

  el.innerHTML = `
    <div class="check-result">
      <strong>${rawTotal}/${rawMax} raw points (${pctOfMax}%)</strong> &mdash; MC: ${mcCorrect}/${mcMax}, CR: ${crTotal}/${crMax} (${loggedCR.length}/4 scores logged)
      <div class="check-result-note">${comparisonNote}</div>
      <div class="check-result-note">This is a rough self-study benchmark based on one published data point, not a predicted score. Your state's actual required passing score may differ &mdash; check www.ets.org/sls/states for current requirements.</div>
    </div>
  `;
}

// ---------------- EXPORT / GRADE-ELSEWHERE HELPERS ----------------
function htmlToPlainText(html){
  let text = html;
  text = text.replace(/<tr[^>]*>/gi, '\n');
  text = text.replace(/<\/tr>/gi, '');
  text = text.replace(/<t[hd][^>]*>/gi, '');
  text = text.replace(/<\/t[hd]>/gi, ' | ');
  text = text.replace(/<table[^>]*>/gi, '\n');
  text = text.replace(/<\/table>/gi, '\n');
  text = text.replace(/<br\s*\/?>/gi, '\n');
  text = text.replace(/<\/(p|div)>/gi, '\n');
  text = text.replace(/<li[^>]*>/gi, '\n- ');
  text = text.replace(/<\/li>/gi, '');
  text = text.replace(/<\/?(ul|ol)[^>]*>/gi, '\n');
  text = text.replace(/<\/?(strong|em)>/gi, '');
  text = text.replace(/<[^>]+>/g, '');
  text = text.replace(/&ndash;/g,'-').replace(/&mdash;/g,'-').replace(/&amp;/g,'&')
             .replace(/&hellip;/g,'...').replace(/&rsquo;/g,"'").replace(/&nbsp;/g,' ');
  text = text.replace(/ \| *\n/g, '\n').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  return text;
}

function buildGradingPacketFor(s, responseText){
  responseText = (responseText || '').trim();
  return [
    'SLLA CONSTRUCTED-RESPONSE — PLEASE GRADE',
    '',
    'SCENARIO: ' + s.title,

    '',
    'DOCUMENTS:',
    htmlToPlainText(s.documents),
    '',
    'QUESTION:',
    htmlToPlainText(s.question),
    '',
    'MY RESPONSE:',
    responseText || '(no response written yet)',
    '',
    '---',
    'Please grade my response above using the rubric below, on a 0–3 scale. Tell me what score it earns, what I did well, and specifically what would move it to a higher score.',
    '',
    'RUBRIC:',
    RUBRIC_TEXT
  ].join('\n');
}

}

async function copyToClipboard(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  } catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      return true;
    } catch(e2){ return false; }
  }
}

function triggerBlobDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

function ensureDocxLibLoaded(){
  return new Promise((resolve,reject)=>{
    if(window.docx){ resolve(); return; }
    const script = document.createElement('script');
    script.src = 'https://unpkg.com/docx@8.5.0/build/index.js';
    script.onload = ()=>resolve();
    script.onerror = ()=>reject(new Error('docx library failed to load'));
    document.head.appendChild(script);
  });
}

async function downloadPacketText(text, filenameBase, onNote){
  const note = onNote || showExportNote;
  try{
    await ensureDocxLibLoaded();
    const { Document, Packer, Paragraph, TextRun } = window.docx;
    const headerLines = ['SLLA CONSTRUCTED-RESPONSE — PLEASE GRADE','SCENARIO:','DOCUMENTS:','QUESTION:','MY RESPONSE:','RUBRIC:'];
    const children = text.split('\n').map(line=>{
      const trimmed = line.trim();
      if(trimmed === '' || trimmed === '---'){
        return new Paragraph({ text: '' });
      }
      const isHeader = headerLines.some(h => trimmed.startsWith(h));
      return new Paragraph({
        spacing: { after: 100 },
        children: [ new TextRun({ text: trimmed, bold: isHeader, size: isHeader ? 24 : 22 }) ]
      });
    });
    const doc = new Document({ sections: [{ children }] });
    const blob = await Packer.toBlob(doc);
    triggerBlobDownload(blob, filenameBase + '.docx');
    note('Downloaded as a Word document.');
  } catch(e){
    const blob = new Blob([text], { type: 'text/plain' });
    triggerBlobDownload(blob, filenameBase + '.txt');
    note('No internet connection for Word formatting — downloaded as a .txt file instead.');
  }
}

            <ul>${l.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>
          </div>
        `).join('')}
      </div>
    </div>
    <div class="self-check-panel">
      <div class="rubric-panel-title">Self-check against the Score-3 criteria</div>
      <p class="self-check-hint">Go through each item honestly. This won't judge your writing quality or reasoning &mdash; only a trained reader (or the AI options below) can really do that &mdash; but it flags whether the structural pieces the rubric asks for are present.</p>
      ${SELF_CHECK_ITEMS.map((item,i)=>`
        <label class="check-row">
          <input type="checkbox" ${state.checks[i]?'checked':''} onchange="toggleCheck(${i})">
          <span>${item}</span>
        </label>
      `).join('')}
      <div id="checkResult"></div>
    </div>
  `;

  app.innerHTML = `
    <span class="back-link" onclick="showCRPicker()">&larr; Back to scenarios</span>

    <div class="cr-tabs">
      <div class="cr-tab ${state.crTab==='scenario'?'active':''}" onclick="switchCRTab('scenario')">Scenario &amp; Documents</div>
      <div class="cr-tab ${state.crTab==='checklist'?'active':''}" onclick="switchCRTab('checklist')">Rubric &amp; Self-Check</div>
    </div>
    <div class="cr-tab-panel">
      ${state.crTab === 'scenario' ? scenarioTabHTML : checklistTabHTML}
    </div>

    <textarea id="crResponse" placeholder="Write your response here. Identify each action clearly, cite specific evidence from the documents, and explain how the action improves professional practice or student outcomes.">${state.response||''}</textarea>
    <div class="word-count" id="wordCount">0 words</div>

    <div class="cr-toolbar">
      <button class="btn small secondary" onclick="copyPacket()">Copy scenario + rubric + response</button>
      <button class="btn small secondary" onclick="downloadPacket()">Download as Word (.docx)</button>
      <div style="position:relative;">
        <button class="btn small secondary" onclick="toggleAIMenu()">Grade with AI &#9662;</button>
        ${state.aiMenuOpen ? `
          <div class="ai-menu">
            <button onclick="openWithAI('claude')">Open in Claude</button>
            <button onclick="openWithAI('chatgpt')">Open in ChatGPT</button>
            <button onclick="openWithAI('other')">Just copy (paste anywhere)</button>
          </div>` : ''}
      </div>
    </div>
    <div class="toolbar-note" id="exportNote">${state.exportNote||''}</div>

    <div class="nav-row">
      <button class="btn" id="submitCR" onclick="submitCR()">Submit for in-app grading</button>
      <button class="btn secondary" onclick="toggleModel()">${state.showModel ? 'Hide' : 'Show'} model response</button>
    </div>
    <div class="toolbar-note">In-app grading calls Claude directly and only works while you're using this app inside Claude's interface. The buttons above work anywhere, including downloaded and offline.</div>

    <div id="modelWrap">${state.showModel ? renderModelHTML(s) : ''}</div>
    <div class="grading-wrap" id="gradingWrap"></div>
  `;

  const ta = document.getElementById('crResponse');
  const wc = document.getElementById('wordCount');
  function updateWC(){
    const words = ta.value.trim().split(/\s+/).filter(Boolean).length;
    wc.textContent = words + ' words';
  }
  ta.addEventListener('input', ()=>{ state.response = ta.value; updateWC(); });
  updateWC();
  updateCheckResult();

  if(state.grading){
    document.getElementById('gradingWrap').innerHTML = `
      <div class="spinner-row"><div class="spinner"></div> Scoring your response against the rubric&hellip;</div>
    `;
  } else if(state.result){
    renderGradeResult(state.result);
  } else if(state.error){
    document.getElementById('gradingWrap').innerHTML = `<div class="error-note">${state.error}</div>`;
  }
}

function switchCRTab(tab){
  const ta = document.getElementById('crResponse');
  if(ta) state.response = ta.value;
  state.crTab = tab;
  renderCRWrite();
}

function toggleCheck(i){
  state.checks[i] = !state.checks[i];
  updateCheckResult();
}
function updateCheckResult(){
  const el = document.getElementById('checkResult');
  if(!el) return;
  const count = state.checks.filter(Boolean).length;
  let band;
  if(count === 5) band = RUBRIC_LEVELS[0];
  else if(count >= 3) band = RUBRIC_LEVELS[1];
  else if(count >= 1) band = RUBRIC_LEVELS[2];
  else band = RUBRIC_LEVELS[3];
  el.innerHTML = `
    <div class="check-result">
      <strong>${count}/5 checked</strong> — this pattern most resembles a <strong>Score ${band.score}: ${band.label}</strong>.
      <div class="check-result-note">This is a self-assessment prompt, not an actual score — the real rubric also weighs how well-reasoned and specific your writing is.</div>
    </div>
  `;
}

function toggleModel(){
  state.showModel = !state.showModel;
  renderCRWrite();
}
function renderModelHTML(s){
  if(!s.model) return '';
  return `
    <div class="model-panel">
      <div class="rubric-panel-title">Model response (Score 3) — annotated</div>
      <p class="self-check-hint">This is one strong way to answer this scenario, not the only correct answer. Compare its structure and specificity to your own.</p>
      ${s.model.map((m,i)=>`
        <div class="model-action">
          <div class="model-action-title">Action ${i+1}: ${m.action}</div>
          <div class="model-tag evidence">Evidence cited</div>
          <p>${m.evidence}</p>
          <div class="model-tag standard">PSEL connection</div>
          <p>${m.standard}</p>
          <div class="model-tag outcome">Student-learning connection</div>
          <p>${m.outcome}</p>
        </div>
      `).join('')}
    </div>
  `;
}

async function submitCR(){
  const ta = document.getElementById('crResponse');
  const text = ta.value.trim();
  if(text.length < 20){
    document.getElementById('gradingWrap').innerHTML = `<div class="error-note">Write a fuller response before submitting &mdash; identify your actions, cite evidence, and explain your reasoning.</div>`;
    return;
  }
  state.response = text;
  state.grading = true;
  state.result = null;
  state.error = null;
  document.getElementById('gradingWrap').innerHTML = `
    <div class="spinner-row"><div class="spinner"></div> Scoring your response against the rubric&hellip;</div>
  `;
  document.getElementById('submitCR').disabled = true;

  const s = state.scenario;
  const systemPrompt = `You are an expert scorer for the ETS School Leaders Licensure Assessment (SLLA) constructed-response section. Score the candidate's response using EXACTLY this rubric:

${RUBRIC_TEXT}

Score strictly and fairly on a 0-3 integer scale. Then return ONLY valid JSON (no markdown fences, no preamble) in exactly this shape:
{"score": <0|1|2|3>, "strengths": ["...", "..."], "improvements": ["...", "..."], "feedback": "2-4 sentence overall explanation of the score, referencing specifically what the response did or did not do against the rubric criteria (completeness, evidence, connection to PSEL/leadership standards, logical plan, connection to student learning)."}`;

  const userPrompt = `SCENARIO: ${s.title}

${htmlToPlainText(s.scenario)}

DOCUMENTS:
${htmlToPlainText(s.documents)}

QUESTION:
${htmlToPlainText(s.question)}

CANDIDATE RESPONSE:
${text}`;

  try{
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: systemPrompt,
        messages: [ { role: "user", content: userPrompt } ]
      })
    });
    const data = await resp.json();
    const textOut = (data.content || []).map(b=>b.text||'').join('\n');
    const clean = textOut.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    state.grading = false;
    state.result = parsed;
    renderCRWrite();
  } catch(err){
    state.grading = false;
    state.error = "In-app grading isn't available right now (this only works inside Claude's interface, with an internet connection). Try the copy/download/Grade-with-AI buttons above instead.";
    renderCRWrite();
  }
}

function renderGradeResult(r){
  const labels = {0:'Little or No Understanding', 1:'Limited Understanding', 2:'General Understanding', 3:'Thorough Understanding'};
  document.getElementById('gradingWrap').innerHTML = `
    <div class="grade-card">
      <div class="grade-score-row">
        <div class="num">${r.score}/3</div>
        <div class="lbl">${labels[r.score] || ''}</div>
      </div>
      <div class="grade-section">
        <p>${r.feedback || ''}</p>
      </div>
      ${r.strengths && r.strengths.length ? `
        <div class="grade-section">
          <h4>What worked</h4>
          <ul>${r.strengths.map(x=>`<li>${x}</li>`).join('')}</ul>
        </div>` : ''}
      ${r.improvements && r.improvements.length ? `
        <div class="grade-section">
          <h4>To reach a higher score</h4>
          <ul>${r.improvements.map(x=>`<li>${x}</li>`).join('')}</ul>
        </div>` : ''}
    </div>
  `;
}

// ---------------- HISTORY: LIST ----------------
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' })
    + ' ' + d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
}

function buildSparkline(points){
  // points: array of 0-100 numbers, oldest first. Returns an inline SVG line chart.
  if(points.length < 2) return '';
  const w = 280, h = 60, pad = 6;
  const stepX = (w - pad*2) / (points.length - 1);
  const coords = points.map((p,i)=>{
    const x = pad + i*stepX;
    const y = pad + (1 - p/100) * (h - pad*2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const last = points[points.length-1];
  return `
    <svg viewBox="0 0 ${w} ${h}" class="sparkline" preserveAspectRatio="none">
      <polyline points="${coords.join(' ')}" fill="none" stroke="var(--brass)" stroke-width="2.5"/>
      <circle cx="${coords[coords.length-1].split(',')[0]}" cy="${coords[coords.length-1].split(',')[1]}" r="4" fill="var(--green)"/>
    </svg>
    <div class="sparkline-label">Most recent: ${Math.round(last)}%</div>
  `;
}

async function renderHistory(){
  const history = await loadHistory();
  state._history = history;
  const mockAttempts = history.filter(h=>h.type==='mock');
  const catAttempts = history.filter(h=>h.type==='category');
  const mockTrend = mockAttempts.slice().reverse().map(a=>Math.round((a.correct/a.total)*100)); // oldest first

  function attemptRow(a, label){
    const pct = Math.round((a.correct/a.total)*100);
    return `
      <div class="history-row">
        <div class="history-row-main">
          <div>
            <strong>${label}</strong>
            <div class="toolbar-note" style="margin:2px 0 0;">${fmtDate(a.date)} &middot; ${a.correct}/${a.total} (${pct}%)</div>
          </div>
          ${a.incorrect.length > 0
            ? `<button class="btn small secondary" onclick="openHistoryDetail('${a.id}')">Review ${a.incorrect.length} missed</button>`
            : `<span class="toolbar-note">All correct!</span>`}
        </div>
        <div class="history-bar-track"><div class="history-bar-fill" style="width:${pct}%;"></div></div>
      </div>
    `;
  }

  app.innerHTML = `
    <span class="back-link" onclick="goHome()">&larr; Back to home</span>
    <div class="section-title">Full Mock Exam attempts</div>
    ${mockAttempts.length === 0 ? `
      <p class="self-check-hint">No mock exam attempts recorded yet — finish a Full Mock Exam (including Section II) to see it appear here.</p>
    ` : `
      ${mockTrend.length >= 2 ? `<div class="sparkline-wrap">${buildSparkline(mockTrend)}</div>` : ''}
      ${mockAttempts.map(a => attemptRow(a, 'Full Mock Exam')).join('')}
    `}

    <div class="section-title">Category Practice attempts</div>
    ${Object.keys(CATEGORIES).map(k=>{
      const attempts = catAttempts.filter(a=>a.catKey===k);
      if(attempts.length === 0) return '';
      return `
        <div class="history-cat-group">
          <div class="model-action-title">${CATEGORIES[k].name}</div>
          ${attempts.map(a => attemptRow(a, CATEGORIES[k].name)).join('')}
        </div>
      `;
    }).join('') || `<p class="self-check-hint">No category practice attempts recorded yet.</p>`}

    ${history.length > 0 ? `
      <div style="margin-top:20px;">
        <button class="btn secondary small" onclick="clearAllHistory()">Clear all history</button>
      </div>
    ` : ''}
  `;
}

// ---------------- HISTORY: DETAIL (REVIEW MISSED QUESTIONS) ----------------
function openHistoryDetail(id){
  state.screen = 'history-detail';
  state.historyDetailId = id;
  render();
}

async function renderHistoryDetail(){
  const history = state._history && state._history.length ? state._history : await loadHistory();
  const entry = history.find(h => String(h.id) === String(state.historyDetailId));
  if(!entry){
    app.innerHTML = `
      <span class="back-link" onclick="showHistory()">&larr; Back to history</span>
      <p class="self-check-hint">This attempt couldn't be found — it may have been cleared.</p>
    `;
    return;
  }
  const pct = Math.round((entry.correct/entry.total)*100);
  const label = entry.type === 'mock' ? 'Full Mock Exam' : CATEGORIES[entry.catKey].name;
  const letters = ['A','B','C','D'];

  app.innerHTML = `
    <span class="back-link" onclick="showHistory()">&larr; Back to history</span>
    <div class="section-title">${label} &middot; ${fmtDate(entry.date)}</div>
    <p class="self-check-hint">${entry.correct}/${entry.total} correct (${pct}%). Reviewing the ${entry.incorrect.length} question${entry.incorrect.length===1?'':'s'} you missed below.</p>
    ${entry.incorrect.map(inc => {
      const q = QUESTIONS[inc.qIdx];
      if(!q) return '';
      return `
        <div class="item" style="margin-bottom:16px;">
          <div class="cat-tag">${CATEGORIES[q.cat].name}</div>
          <div class="prompt">${q.q}</div>
          ${q.o.map((opt,i)=>`
            <div class="opt disabled ${i===q.c?'correct':(i===inc.chosen?'incorrect':'')}">
              <div class="letter">${letters[i]}</div>
              <div>${opt}</div>
            </div>
          `).join('')}
          <div class="explain show">${q.e}</div>
        </div>
      `;
    }).join('')}
  `;
}

// ---------------- UTIL ----------------
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

render();
