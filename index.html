<style>
  :root{
    --ink: #1E2A38;
    --ink-soft: #445266;
    --paper: #EDEEF2;
    --card: #FFFFFF;
    --line: #D7DAE2;
    --brass: #A9803F;
    --brass-deep: #8A6A32;
    --green: #3F6B4F;
    --green-bg: #E7F0EA;
    --rust: #A6473A;
    --rust-bg: #F7E9E7;
    --navy-deep: #14202C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;}
  body{min-height:100vh;}
  .ui{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;}

  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 80px;}

  .masthead{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:3px solid var(--ink); padding-bottom:14px; margin-bottom:22px;
  }
  .masthead h1{font-size:26px; margin:0; font-weight:600; letter-spacing:0.2px;}
  .masthead .kicker{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    font-size:12.5px; color:var(--ink-soft); margin-top:4px;}
  .masthead .badge{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    font-size:12px; color:var(--brass-deep); border:1px solid var(--brass); border-radius:3px;
    padding:3px 9px; white-space:nowrap;}

  /* ---- Resume bar ---- */
  .resume-bar{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--card); border:1px solid var(--line); border-left:5px solid var(--green);
    padding:14px 18px; margin-bottom:18px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
  }
  .resume-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }

  /* ---- Home screen: tab-style mode cards ---- */
  .modes{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-top:8px;}
  @media (max-width:720px){ .modes{grid-template-columns:1fr;} }
  .mode-card{
    background:var(--card); border:1px solid var(--line); border-left:5px solid var(--brass);
    padding:20px 18px; cursor:pointer; transition:transform .12s ease, border-color .12s ease;
    position:relative;
  }
  .mode-card:hover{ transform:translateY(-2px); border-left-color:var(--green); }
  .mode-card .tab-index{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    font-size:11px; color:var(--ink-soft); }
  .mode-card h2{ font-size:18px; margin:6px 0 8px; }
  .mode-card p{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    font-size:13.5px; color:var(--ink-soft); line-height:1.5; margin:0; }

  .section-title{ font-size:15px; text-transform:none; color:var(--ink-soft);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    margin:34px 0 12px; border-bottom:1px solid var(--line); padding-bottom:8px;}

  /* ---- Category picker ---- */
  .cat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:720px){ .cat-grid{grid-template-columns:1fr;} }
  .cat-row{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--card); border:1px solid var(--line); padding:12px 16px; cursor:pointer;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif; font-size:14px;
  }
  .cat-row:hover{ border-color:var(--brass); }
  .cat-row .count{ color:var(--ink-soft); font-size:12.5px; }

  .field-row{ display:flex; gap:10px; align-items:center; margin:14px 0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif; font-size:14px;}
  select, input[type=number]{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    padding:8px 10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:14px;
  }
  .btn{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    background:var(--ink); color:#fff; border:none; padding:10px 18px; font-size:14px;
    cursor:pointer; letter-spacing:0.2px;
  }
  .btn:hover{ background:var(--navy-deep); }
  .btn.secondary{ background:transparent; color:var(--ink); border:1px solid var(--ink); }
  .btn.secondary:hover{ background:var(--ink); color:#fff; }
  .btn:disabled{ opacity:.45; cursor:default; }
  .btn.small{ padding:6px 12px; font-size:12.5px; }

  .back-link{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    font-size:13px; color:var(--ink-soft); cursor:pointer; display:inline-block; margin-bottom:16px;
  }
  .back-link:hover{ color:var(--ink); text-decoration:underline; }

  /* ---- Exam item ---- */
  .progress-line{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    font-size:12.5px; color:var(--ink-soft); display:flex; justify-content:space-between; margin-bottom:10px;
  }
  .progress-bar{ height:4px; background:var(--line); margin-bottom:22px; }
  .progress-bar .fill{ height:4px; background:var(--brass); }

  .item{ background:var(--card); border:1px solid var(--line); border-left:5px solid var(--ink);
    padding:22px 24px; }

  .grading-wrap{ margin-top:22px; }

    border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .grade-card{ background:var(--card); border:1px solid var(--line); padding:24px; margin-top:6px; }
  .grade-score-row{ display:flex; align-items:baseline; gap:14px; border-bottom:1px solid var(--line);
    padding-bottom:16px; margin-bottom:16px; }
  .grade-score-row .num{ font-size:40px; font-weight:600; }
  .grade-score-row .lbl{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    font-size:14px; color:var(--ink-soft); }
  .grade-section{ margin-bottom:16px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    font-size:13.5px; line-height:1.6; }
  .grade-section h4{ margin:0 0 6px; font-size:12.5px; text-transform:none; color:var(--brass-deep); }
  .grade-section ul{ margin:6px 0 0; padding-left:20px; }
  .error-note{ background:var(--rust-bg); border-left:3px solid var(--rust); padding:12px 16px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif; font-size:13px; color:var(--ink); }

  /* ---- Constructed response: rubric / self-check / model ---- */
  .rubric-panel, .self-check-panel, .model-panel{
    background:var(--card); border:1px solid var(--line); padding:18px 20px; margin-bottom:18px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
  }
  .rubric-panel-title{ font-size:13px; color:var(--brass-deep); margin-bottom:10px; }
  .rubric-levels{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  @media (max-width:720px){ .rubric-levels{ grid-template-columns:1fr 1fr; } }
  .rubric-level{ background:var(--paper); border:1px solid var(--line); padding:10px 12px; font-size:12px; }
  .rubric-level-head{ font-weight:600; margin-bottom:6px; font-size:12.5px; }
  .rubric-score{ display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px;
    background:var(--ink); color:#fff; border-radius:50%; font-size:11px; margin-right:5px; }
  .rubric-level ul{ margin:0; padding-left:16px; }
  .rubric-level li{ margin-bottom:3px; }

  .self-check-hint{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin:0 0 12px; }
  .check-row{ display:flex; align-items:flex-start; gap:10px; font-size:13.5px; line-height:1.5;
    margin-bottom:10px; cursor:pointer; }
  .check-row input{ margin-top:3px; flex:0 0 auto; }
  .check-result{ background:var(--paper); border-left:3px solid var(--brass); padding:12px 16px; font-size:13.5px; margin-top:8px; }
  .check-result-note{ font-size:12px; color:var(--ink-soft); margin-top:6px; }

  .model-action{ border-top:1px solid var(--line); padding-top:14px; margin-top:14px; }
  .model-action:first-child{ border-top:none; margin-top:0; padding-top:0; }
  .model-action-title{ font-weight:600; font-size:14px; margin-bottom:8px; }
  .model-tag{ display:inline-block; font-size:11px; color:var(--brass-deep); border:1px solid var(--brass);
    border-radius:3px; padding:2px 7px; margin:6px 0 4px; }
  .model-panel p{ font-size:13.5px; line-height:1.55; margin:0 0 4px; color:var(--ink-soft); }

<body>
<div class="wrap ui">
  <div class="masthead">
    <div>
      <h1 style="font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;">PSEL/SLLA Practice Ledger</h1>
      <div class="kicker">Original practice items modeled on the SLLA (Praxis 6990) format · aligned to PSEL standards</div>
    </div>
    <div class="badge">for your prep only</div>
  </div>

  <div id="app"></div>
</div>

<script>
window.addEventListener('error', function(e){
  try{
    var appEl = document.getElementById('app');
    if(appEl && !appEl.innerHTML.trim()){
      var msg = (e && e.message) ? e.message : 'Unknown error';
      appEl.innerHTML = '<div class="error-note"><strong>This app hit an error while loading.</strong><br>'
        + msg.replace(/</g,'&lt;')
        + '<br><br>Try opening this file directly in Safari or Chrome (not a text/email/file preview), then reload the page.</div>';
    }
  } catch(err){ /* nothing more we can do */ }
});
</script>
<script>
// PSEL/SLLA Practice Data
// Categories match the SLLA (6990) content categories, aligned to PSEL standards.
const CATEGORIES = {
  SL: { name: "Strategic Leadership", full: 20 },
  IL: { name: "Instructional Leadership", full: 27 },
  CC: { name: "Climate & Culture Leadership", full: 22 },
  EL: { name: "Ethical Leadership", full: 19 },
  OL: { name: "Organizational Leadership", full: 16 },
  CE: { name: "Community Engagement Leadership", full: 16 }
};

const QUESTIONS = [
// ---------------- STRATEGIC LEADERSHIP (SL) ----------------
{cat:"SL", q:"Three years of declining state math scores prompt a principal to convene grade-level teams. All four are reasonable starting moves — which best reflects PSEL 1's use of data to shape vision and goals?",
 o:["Direct each team to increase math instructional minutes by 15 this year","Facilitate teams in disaggregating the data by standard and subgroup to pinpoint where instruction is breaking down","Hire a math coach to work exclusively with the lowest-performing teacher","Wait for this year's state results before making any changes"], c:1,
 e:"PSEL 1 calls for analyzing multiple data sources before revising goals; disaggregation identifies the actual gap before committing resources."},
{cat:"SL", q:"A principal wants school goals to reflect both the district's strategic plan and staff's daily instructional priorities. Which approach best balances both?",
 o:["Adopt the district's goals verbatim to ensure alignment","Draft goals independently based on staff input, then request a waiver from district goals","Cross-walk staff-identified priorities against district goals and co-author targets that satisfy both","Alternate years focusing on district goals, then staff goals"], c:2,
 e:"PSEL 1 calls for goals aligned with district goals and grounded in data — a cross-walk honors both without treating them as separate tracks."},
{cat:"SL", q:"Two years into a five-year strategic plan, a principal notices staff enthusiasm waning because the plan no longer shows up in daily practice. Best move?",
 o:["Relaunch the plan with a renewed all-staff kickoff event","Survey staff on whether to abandon the plan","Audit which action steps have stalled and re-engage teams in revising the implementation timeline","Assign an administrator to enforce compliance with the original plan"], c:2,
 e:"PSEL 1's continuous-improvement cycle calls for monitoring and adjusting plans, not just re-announcing them or enforcing compliance."},
{cat:"SL", q:"A principal is deciding how to communicate a new three-year vision to a community with many non-English-speaking families. Which strategy best reflects PSEL 1's guidance on communicating a shared vision?",
 o:["Publish the vision statement in English on the school website","Translate written materials and host multilingual sessions with staff answering questions in person","Ask bilingual students to informally translate for their parents at pickup","Focus outreach on English-speaking families first, then translate materials later"], c:1,
 e:"PSEL 1 calls for communication that lets all families understand, support, and act on the vision — that requires genuine two-way, translated engagement."},
{cat:"SL", q:"A school's mission statement hasn't been revisited in eight years, and demographics have shifted substantially. Best first step?",
 o:["Rewrite the mission statement based on current best practices in the field","Convene staff, students, and families to evaluate whether the mission still reflects the community","Leave the mission unchanged since changing it could confuse long-time stakeholders","Adopt a neighboring high-performing school's mission statement"], c:1,
 e:"PSEL 1 calls for evaluating whether the current mission is still appropriate using multiple data sources and stakeholder input before revising it."},
{cat:"SL", q:"A principal wants school improvement goals to be genuinely measurable. Which goal best meets that standard?",
 o:["Improve student engagement in core classes this year","Increase the percentage of students scoring proficient on the fall writing benchmark from 62% to 75% by June","Support teachers in becoming more reflective practitioners","Foster a culture where all students feel like they belong"], c:1,
 e:"PSEL 1 calls for goals that are specific, measurable, and time-bound; only this option has a baseline, target, and deadline."},
{cat:"SL", q:"Midway through implementing a new PBIS framework, referral data show mixed results across grade levels. Which action best reflects strategic monitoring of progress toward goals?",
 o:["Continue the current timeline since first-year dips are expected","Disaggregate referral data by grade level and adjust supports where implementation is weakest","Discontinue PBIS in the underperforming grade levels","Wait until year-end data to make any adjustments"], c:1,
 e:"PSEL 1 calls for using data systematically to monitor and adjust plans in progress, not waiting for a single end-point measure."},
{cat:"SL", q:"A principal is building a strategic planning team and wants broad ownership of the school's next set of goals. Which composition best reflects PSEL 1's emphasis on shared commitment?",
 o:["Department chairs only, to keep the process efficient","A cross-section of teachers, support staff, students, and family representatives","The administrative team, with results shared afterward","A rotating committee of the most veteran teachers"], c:1,
 e:"PSEL 1 calls for engaging staff and community members with diverse perspectives in developing shared commitments to the vision."},
{cat:"SL", q:"When aligning a school's technology purchases to its strategic goals, what should guide the principal's decision most?",
 o:["Vendor recommendations based on similar schools' purchases","Which tools directly support the instructional priorities named in the school's goals","Whichever technology has the lowest per-unit cost","Staff preference, regardless of connection to stated goals"], c:1,
 e:"PSEL 1 calls for identifying and aligning resources, including technology, to support and achieve the stated goals — not cost or preference alone."},
{cat:"SL", q:"A principal notices that goals set at the start of the year no longer reflect an urgent need that emerged from mid-year data (a spike in chronic absenteeism). Best response?",
 o:["Finish the year with the original goals to maintain consistency","Add the absenteeism concern as a new priority and revise the plan's action steps accordingly","Delegate the absenteeism issue entirely to the counseling office, separate from the school's goals","Note the concern for next year's planning cycle"], c:1,
 e:"PSEL 1's continuous-improvement approach calls for responding to emerging data rather than treating the plan as fixed or siloing urgent needs away from the school's goals."},
{cat:"SL", q:"A principal wants staff to understand *why* a new schoolwide reading initiative matters, not just comply with it. Best strategy?",
 o:["Share the state mandate requiring the initiative","Present the data trends and instructional rationale behind the initiative, then invite staff questions and input","Require lesson plans to document reading initiative components","Publicly recognize the first department to implement it fully"], c:1,
 e:"PSEL 1 calls for communicating the needs, process, and rationale of improvement efforts so staff understand and can act on them, not just comply."},
{cat:"SL", q:"In developing a strategic plan, a principal must decide how to allocate a limited PD budget. Which use best aligns spending with the vision and goals?",
 o:["Distributing funds evenly across every department regardless of stated priorities","Funding PD directly tied to the school's top two instructional goals","Prioritizing PD requested most often by staff, regardless of alignment","Saving the budget in case of unexpected staffing needs"], c:1,
 e:"PSEL 1 calls for aligning resources with the mission, vision, and goals — spreading funds evenly or by popularity undercuts strategic focus."},
{cat:"SL", q:"A school's improvement plan includes a goal to 'close the achievement gap between students with disabilities and their peers.' Which addition would make this goal most measurable and actionable?",
 o:["Adding a firm deadline only","Adding a specific target percentage, data source, and interim checkpoints","Adding a statement of commitment from the special education team","Adding a list of general strategies without targets"], c:1,
 e:"PSEL 1 calls for goals that are specific, measurable, and results-driven — a target, data source, and checkpoints operationalize the goal."},
{cat:"SL", q:"A principal facilitating a strategic planning retreat wants decisions grounded in evidence rather than driven by the loudest voices in the room. Best facilitation move?",
 o:["Limit each person to one comment per topic","Ground each discussion in a shared data set before soliciting opinions","Ask only department chairs to speak on behalf of their teams","Have participants vote anonymously without discussion"], c:1,
 e:"PSEL 1 calls for using relevant data and evidence-based inquiry to formulate plans — grounding discussion in shared data does this directly."},
{cat:"SL", q:"A principal is asked by the superintendent to justify continued funding for an instructional coaching position tied to the school's strategic plan. What evidence would most strongly support the request?",
 o:["Teacher satisfaction survey results about the coach","Data showing improved instructional practice and corresponding student outcome gains linked to coaching cycles","The number of coaching sessions conducted","Anecdotes from a few teachers who valued the support"], c:1,
 e:"PSEL 1 ties resource decisions to evidence of progress toward the vision and goals — outcome data, not satisfaction or activity counts, makes that case."},

// ---------------- INSTRUCTIONAL LEADERSHIP (IL) ----------------
{cat:"IL", q:"Data shows a teacher's students consistently underperform on open-ended math questions despite strong scores on multiple-choice items. Best first coaching step?",
 o:["Recommend the teacher assign more homework","Co-analyze student work samples with the teacher to identify where reasoning breaks down","Require the teacher to attend a district-wide PD on open-response writing","Transfer the highest-need students to another teacher"], c:1,
 e:"PSEL 2 calls for using data to provide ongoing, actionable feedback rooted in collaborative analysis of student work, not a generic fix."},
{cat:"IL", q:"A principal wants walk-through data to genuinely improve instruction rather than just document compliance. Best approach?",
 o:["Use a checklist focused solely on whether lesson plans are posted","Provide specific, timely, actionable feedback tied to what was observed, followed by a brief conversation","Conduct walk-throughs only during formal evaluation windows","Share aggregate walk-through data with staff at the end of the year"], c:1,
 e:"PSEL 2 calls for actionable, timely feedback from classroom visits that develops faculty practice, not compliance documentation."},
{cat:"IL", q:"Several veteran teachers resist using common formative assessments, arguing it limits their autonomy. Best principal response?",
 o:["Mandate immediate compliance, citing the school improvement plan","Invite the teachers to help design the formative assessments so their expertise shapes the tool","Exempt veteran teachers from participating","Postpone the initiative until next year"], c:1,
 e:"PSEL 2 calls for collaborative processes that build teacher capacity and ownership rather than compliance mandates or exemptions."},
{cat:"IL", q:"A principal is designing a professional development plan for the year. Which approach best reflects job-embedded PD?",
 o:["A single all-staff workshop in August covering the year's initiatives","Ongoing coaching cycles, peer observation, and collaborative data review embedded in the school week","An optional evening course offered through the district","A one-time consultant visit focused on a single strategy"], c:1,
 e:"PSEL 2 specifically calls for job-embedded, standards-based PD that meets ongoing learning needs, which one-time events don't provide."},
{cat:"IL", q:"Benchmark data shows a persistent gap between English learners and peers in science, and teachers attribute it to language proficiency alone. Best leadership move?",
 o:["Provide EL students extra time on assessments only","Facilitate teacher examination of instructional practices alongside the data to identify non-language-related gaps","Recommend EL students be grouped separately for science instruction","Delay addressing the gap until the following school year"], c:1,
 e:"PSEL 2 calls for identifying research-based strategies that close opportunity gaps, which requires examining instruction, not just accommodations."},
{cat:"IL", q:"A principal wants curriculum to be vertically aligned between grade levels. Best strategy to start?",
 o:["Purchase a new vertically-aligned curriculum program","Convene teachers across grade levels to map current standards coverage and identify gaps or redundancies","Direct each grade level to submit their curriculum maps for administrative review","Wait for the district to mandate vertical alignment"], c:1,
 e:"PSEL 2 calls for engaging in constructive discussions among staff to align curriculum horizontally and vertically for coherence."},
{cat:"IL", q:"Observation data show strong content delivery but little student-to-student discourse across classrooms. Best PD focus?",
 o:["A workshop on content-area vocabulary","Coaching on structures for student discourse and collaborative learning strategies","A refresher on classroom management","Additional planning time with no specific focus"], c:1,
 e:"PSEL 2 calls for differentiated PD targeted to an identified instructional gap — here, discourse structures directly address what's missing."},
{cat:"IL", q:"A principal reviewing common assessment data at a PLC meeting notices one teacher's data show significantly lower mastery on a shared skill. Best next step in the meeting?",
 o:["Publicly ask that teacher to explain the lower scores","Facilitate the team in comparing instructional approaches for that skill across classrooms","Move on to the next agenda item to avoid singling out a colleague","Assign that teacher additional observations later in private"], c:1,
 e:"PSEL 2 calls for collaborative data analysis that improves practice through shared inquiry, not individual scrutiny or avoidance."},
{cat:"IL", q:"A principal wants teachers to use formative data to inform instruction, not just to grade. Which action best supports that shift?",
 o:["Requiring weekly formative assessment scores be submitted","Modeling how to use a specific formative data point to reteach or regroup students, then having teams practice","Reducing the number of formative assessments required","Providing a rubric for scoring formative assessments"], c:1,
 e:"PSEL 2 calls for using data to provide ongoing, actionable feedback — modeling the actual use of data builds this capacity directly."},
{cat:"IL", q:"A principal is evaluating two PD options with a limited budget: a one-day expert speaker or a semester of embedded coaching for a smaller group. Which best reflects instructional leadership best practice?",
 o:["The expert speaker, since it reaches more staff at once","The embedded coaching, since sustained support builds deeper instructional capacity","Whichever option teachers vote for","Splitting the budget evenly regardless of impact"], c:1,
 e:"PSEL 2 favors sustained, job-embedded development over one-time exposure, since it builds capacity for continuous improvement."},
{cat:"IL", q:"A principal notices in walk-throughs that most classrooms rely almost entirely on direct instruction. Best way to build teacher capacity for varied strategies?",
 o:["Mandate a specific number of 'student-centered' activities per week","Identify teachers already using varied strategies effectively and set up peer observation opportunities","Provide a list of approved strategies via email","Address it only in end-of-year evaluations"], c:1,
 e:"PSEL 2 calls for developing capacity through collaborative professional learning, and peer observation leverages existing internal expertise."},
{cat:"IL", q:"A new principal inherits a school where teacher-created assessments rarely include higher-order thinking questions. Best first step?",
 o:["Require all assessments be submitted for approval before use","Work collaboratively with departments to review and revise assessments against a shared rigor framework","Replace teacher-made assessments with commercial ones","Address the issue only with teachers whose students underperform"], c:1,
 e:"PSEL 2 calls for supporting teachers in developing assessments aligned with rigor and standards through collaboration, not top-down control."},
{cat:"IL", q:"A principal wants to know whether a costly new reading intervention program is actually working. Best evaluation approach?",
 o:["Ask teachers informally whether they like the program","Track specific student progress-monitoring data before and after implementation, compared to a similar prior cohort","Assume it's working since it's evidence-based nationally","Wait for state test results at year's end only"], c:1,
 e:"PSEL 2 calls for evaluating instructional programs using data specific to the intervention's intended outcomes, not assumption or a single delayed measure."},
{cat:"IL", q:"A principal supporting a struggling first-year teacher must balance urgency with the teacher's development. Best coaching approach?",
 o:["Take over lesson planning for the teacher for the semester","Set a focused improvement plan with specific, observable goals and frequent, supportive feedback cycles","Reassign the teacher to a co-teaching role permanently","Document deficiencies for a possible non-renewal decision"], c:1,
 e:"PSEL 2 calls for guiding and monitoring individual professional development plans for continuous improvement, not removing ownership or jumping to punitive steps."},
{cat:"IL", q:"A principal wants technology integration to enhance learning, not just be present in classrooms. Best approach to guide teacher use of a new classroom tech tool?",
 o:["Require every lesson to include the tool","Provide models of the tool deepening specific learning objectives, then let teachers adapt based on their content","Track how often the tool is used via login data","Leave tool adoption entirely up to individual teacher preference"], c:1,
 e:"PSEL 2 calls for promoting the effective use of technology tied to learning objectives, not usage compliance or unguided adoption."},

// ---------------- CLIMATE & CULTURE LEADERSHIP (CC) ----------------
{cat:"CC", q:"Veteran staff increasingly perceive a more diverse student population as 'less capable.' Best first step?",
 o:["Share achievement data broken down by subgroup to start a conversation","Provide structured opportunities for staff to examine their own biases and assumptions about the changing population","Replace veteran staff resistant to the shift","Address it only through a one-time diversity training"], c:1,
 e:"PSEL 3 calls for confronting institutional bias directly by helping staff identify and alter assumptions that undermine equity."},
{cat:"CC", q:"Discipline data show a long-standing disproportionality in referrals for students of a particular racial group. Best first response?",
 o:["Revise the code of conduct to explicitly address cultural differences in behavior","Analyze the disaggregated referral data with staff to identify patterns in when, where, and by whom referrals are issued","Increase administrative presence in hallways","Require additional training only for teachers with the highest referral rates"], c:1,
 e:"PSEL 3 calls for analyzing disaggregated discipline data to identify inequitable patterns before deciding on a remedy."},
{cat:"CC", q:"A principal wants to build a school climate where teachers feel safe taking instructional risks. Best strategy?",
 o:["Recognize only teachers whose new strategies succeed","Explicitly normalize and discuss both successes and setbacks from new instructional approaches in staff meetings","Require all teachers to try one new strategy per semester","Leave risk-taking entirely to individual teacher initiative"], c:1,
 e:"PSEL 3 calls for creating structures where staff can take appropriate risks for improving teaching and learning without fear of failure."},
{cat:"CC", q:"Students report feeling like adults in the building don't know them personally. Best systemic response?",
 o:["Add a student recognition bulletin board","Implement a structure (advisory, mentor check-ins) ensuring every student has a consistent trusted adult connection","Survey students once a year about school climate","Address it case-by-case as issues arise"], c:1,
 e:"PSEL 3 calls for creating a school environment where each student is known, accepted, and valued through consistent, structural relationships."},
{cat:"CC", q:"A principal is developing a bullying prevention program. Which element is most critical to include?",
 o:["A strict punishment schedule for offenders","A clear reporting system paired with proactive social-emotional curriculum and staff training on early intervention","Assemblies focused on the topic once per year","A poster campaign around the building"], c:1,
 e:"PSEL 3 calls for implementing awareness and prevention systems, not just reactive discipline or one-time messaging."},
{cat:"CC", q:"Teachers express burnout and describe the school's culture as 'all compliance, no support.' Best leadership response?",
 o:["Reduce the number of required initiatives without addressing underlying culture","Engage staff in identifying which practices feel like unsupported compliance and collaboratively redesign them","Host a wellness day as a one-time gesture","Address individual complaints privately without a broader response"], c:1,
 e:"PSEL 3 calls for developing open, trusting relationships and shared responsibility for a healthy work culture, not surface fixes."},
{cat:"CC", q:"A principal wants to institutionalize a culture of collaboration rather than rely on personality-driven teamwork. Best structural move?",
 o:["Recognize collaborative teachers informally","Build shared planning time and clear collaborative structures (protocols, norms) into the master schedule","Encourage teachers to form their own informal groups","Require attendance at monthly full-staff meetings"], c:1,
 e:"PSEL 3 calls for creating structures and procedures that provide time and resources for a collaborative learning community."},
{cat:"CC", q:"Students from a particular cultural background are noticeably underrepresented in advanced coursework. Best first step?",
 o:["Review the identification and enrollment criteria and process for hidden barriers to access","Increase outreach flyers about advanced courses translated into more languages","Set a strict enrollment quota reflecting school demographics","Wait to see if participation changes naturally over time"], c:0,
 e:"PSEL 3 calls for ensuring equitable access to learning opportunities by identifying and altering systems of practice that create opportunity gaps."},
{cat:"CC", q:"A principal wants to build a schoolwide culture of high expectations for all students, especially those historically underserved. Best foundational action?",
 o:["Post motivational messaging throughout the building","Engage staff in examining current practices and beliefs that may perpetuate lower expectations for some groups","Increase academic requirements only for underperforming subgroups","Recognize high achievers publicly each quarter"], c:1,
 e:"PSEL 3 calls for developing a shared commitment to high standards for all students, which starts with examining existing beliefs and practices."},
{cat:"CC", q:"New teachers report feeling isolated and unsupported in their first year. Best systemic solution?",
 o:["An optional new-teacher social event each semester","A structured mentoring program pairing new teachers with trained veteran mentors and regular check-ins","A welcome email from the principal at the start of the year","Leave mentorship informal, based on existing staff relationships"], c:1,
 e:"PSEL 3 calls for structures that support teacher growth and a community of care, which requires deliberate, sustained mentoring."},
{cat:"CC", q:"A principal is addressing recurring conflict between two staff factions with different instructional philosophies. Best first step?",
 o:["Side with the philosophy best supported by current data","Facilitate a structured dialogue where both groups articulate shared goals for students before debating methods","Separate the factions onto different teams to reduce conflict","Let the conflict resolve naturally over time"], c:1,
 e:"PSEL 3 calls for open, productive working relationships built through shared purpose, which grounds conflict resolution in common goals first."},
{cat:"CC", q:"A principal notices emotionally supportive practices exist for students but not visibly for staff. Best way to build a reciprocal culture of care?",
 o:["Add an employee assistance program pamphlet to the staff handbook","Create regular, structured opportunities (check-ins, peer support systems) for staff wellbeing, modeled by leadership","Address staff wellbeing only during performance reviews","Assume staff will seek support if needed"], c:1,
 e:"PSEL 3 calls for promoting a healthy work-life balance and community of care for staff, not just passive resource availability."},
{cat:"CC", q:"A principal wants students with disabilities to feel like full members of the school community, not just recipients of services. Best approach?",
 o:["Ensure IEP compliance and services are delivered correctly","Build inclusive practices into general education spaces and decision-making, not only compliance-focused services","Increase the frequency of pull-out support sessions","Recognize students with disabilities separately at year-end awards"], c:1,
 e:"PSEL 3 calls for each student to be known and valued as a member of the community, which requires inclusion beyond service compliance."},
{cat:"CC", q:"A principal is investigating a report of harassment based on a student's identity. Best immediate step?",
 o:["Address it informally between the students involved","Conduct a prompt, fair, and confidential investigation following established protocol, ensuring the reporting student's safety","Wait to see if additional reports emerge before acting","Handle it solely through a classroom-wide conversation"], c:1,
 e:"PSEL 3 calls for legal, fair, and timely investigation of misconduct that protects privacy, rights, and due process."},
{cat:"CC", q:"A school's culture has historically avoided discussing race and identity directly. A principal wants to shift toward more open, constructive dialogue. Best first step?",
 o:["Mandate a single schoolwide assembly on the topic","Build staff capacity and comfort first through facilitated, ongoing professional learning before broader schoolwide dialogue","Address the topic only when incidents arise","Delegate the effort entirely to a student diversity club"], c:1,
 e:"PSEL 3 calls for staff to act with cultural competence, which is built through sustained professional learning before scaling to the whole school."},

// ---------------- ETHICAL LEADERSHIP (EL) ----------------
{cat:"EL", q:"A teacher confides suspicion that a colleague is inflating grades for athletic eligibility, asking for confidentiality. Best response?",
 o:["Promise full confidentiality to preserve trust","Explain confidentiality has limits given the integrity concern, then begin a discreet, fact-based review","Escalate immediately to the district office without further inquiry","Ask the reporting teacher to gather more proof herself"], c:1,
 e:"PSEL 4 calls for recognizing when ethics have been breached and taking appropriate action, while safeguarding confidentiality within legal limits."},
{cat:"EL", q:"A principal discovers an instructional aide has been using students' personal information inappropriately on social media. Best first action?",
 o:["Address it informally with a verbal reminder about the handbook","Follow formal district protocol for reviewing the incident, including protecting student privacy going forward","Terminate the aide immediately without investigation","Ignore it since it happened outside school hours"], c:1,
 e:"PSEL 4 calls for using appropriate systems and procedures to protect confidentiality and to address unethical behavior through due process."},
{cat:"EL", q:"A school board member asks a principal for preferential enrollment consideration for their child with a specific teacher. Best response?",
 o:["Grant the request quietly to maintain a good relationship with the board","Apply the same placement process used for all families, regardless of the requester's position","Grant it, but only if no other parent complains","Deny it and publicly announce the request was made"], c:1,
 e:"PSEL 4 calls for equitable, transparent decision-making applied consistently, regardless of a requester's influence."},
{cat:"EL", q:"A principal has data suggesting a pattern of unfair grading practices toward a specific group of students by one department. Best first step?",
 o:["Wait for parent complaints before investigating","Review the grading data and practices directly and address inequities found, involving the department as needed","Address it only if it becomes a legal complaint","Ask the department head to handle it internally without oversight"], c:1,
 e:"PSEL 4 calls for safeguarding equity and holding staff accountable for ethical behavior, which requires proactive review, not waiting for escalation."},
{cat:"EL", q:"A principal wants to model transparent decision-making around a controversial policy change. Best approach?",
 o:["Make the decision privately, then announce it with a brief rationale","Share the data and reasoning behind the decision-making process, then explain the outcome and how input was considered","Poll only formal leadership team members before deciding","Avoid explaining the reasoning to prevent further debate"], c:1,
 e:"PSEL 4 calls for modeling transparent, consistent decision-making by making data and rationale explicit and communicating an open process."},
{cat:"EL", q:"A principal learns a teacher used derogatory language toward a student's family in a private conversation overheard by a colleague. Best first step?",
 o:["Dismiss it since it wasn't said directly to the family","Address the incident directly with the teacher, and take appropriate corrective action per policy","Wait to see if the family finds out and complains","Ask the overhearing colleague to confirm details before doing anything"], c:1,
 e:"PSEL 4 calls for recognizing unethical behavior that could adversely affect others and taking appropriate action promptly."},
{cat:"EL", q:"A principal is under pressure from a state deadline to certify data that appears incomplete. Best ethical response?",
 o:["Submit the data as-is to meet the deadline","Request an extension while correcting the data, documenting the reason for the delay","Estimate missing values to complete the submission","Submit and correct it quietly afterward if noticed"], c:1,
 e:"PSEL 4 calls for transparent, accurate data practices; certifying known-incomplete data undermines integrity even under deadline pressure."},
{cat:"EL", q:"A principal suspects a hiring decision was influenced by a personal relationship rather than qualifications. Best response?",
 o:["Proceed with the hire since it's already been informally promised","Pause the process and ensure the decision follows the school's equitable hiring procedures","Proceed but note the concern in a private file","Defer entirely to the hiring manager's judgment"], c:1,
 e:"PSEL 4 calls for offering equitable access to hiring and promotion, which requires pausing to verify the process was followed fairly."},
{cat:"EL", q:"Multiple staff express discomfort about a new policy but no one has formally objected. A principal wants ethical, transparent leadership. Best approach?",
 o:["Proceed since no formal objection was raised","Proactively invite feedback and concerns before finalizing the policy","Assume silence means agreement","Address concerns only if raised in a formal grievance"], c:1,
 e:"PSEL 4 calls for facilitating an open decision-making process rather than treating silence as consent."},
{cat:"EL", q:"A principal must decide whether to disclose the reason for a teacher's sudden leave to curious staff. Best response?",
 o:["Share general information to reduce speculation and rumors","Protect the teacher's confidentiality and share only what is appropriate and necessary operationally","Let the front office decide what to say","Confirm or deny rumors directly when asked"], c:1,
 e:"PSEL 4 calls for using systems and procedures that protect the rights and confidentiality of faculty and staff."},
{cat:"EL", q:"A principal discovers a student's data was inadvertently shared with an unauthorized third party. Best first step?",
 o:["Address it only if the family notices","Follow the district's data breach protocol, including notifying appropriate parties as required by law","Correct the error quietly without documentation","Discipline the staff member involved before investigating"], c:1,
 e:"PSEL 4 calls for protecting confidentiality through established procedures, including legally required notification steps."},
{cat:"EL", q:"A vendor offers a principal a personal gift in exchange for a facilities contract recommendation. Best response?",
 o:["Accept a modest gift since it doesn't affect the decision","Decline the gift and follow the district's standard procurement process","Accept but disclose it afterward","Ask a colleague whether it's acceptable"], c:1,
 e:"PSEL 4 calls for modeling integrity and holding self accountable for ethical behavior, which precludes accepting gifts tied to decisions."},
{cat:"EL", q:"A principal notices a colleague administrator consistently bypasses due process in disciplinary decisions. Best response?",
 o:["Avoid getting involved since it's not the principal's department","Address the concern directly, and escalate through appropriate channels if the pattern continues","Document it privately in case it becomes relevant later","Mention it informally to other staff to be aware"], c:1,
 e:"PSEL 4 calls for holding self and others accountable for ethical behavior, which requires direct action, not private documentation or avoidance."},
{cat:"EL", q:"A principal wants to ensure equitable access to extracurricular opportunities regardless of a family's ability to pay. Best approach?",
 o:["Rely on scholarship requests submitted by families","Proactively review fee structures and build in accessible alternatives (waivers, sliding scale) communicated to all families","Maintain current fees since most families can afford them","Address it only when a family raises a concern"], c:1,
 e:"PSEL 4 calls for safeguarding equity and individual freedom, which requires proactive access, not reactive accommodation."},
{cat:"EL", q:"A principal receives an anonymous tip about a teacher's inappropriate online interactions with students outside of official platforms. Best first step?",
 o:["Dismiss the tip since it's anonymous","Initiate a discreet, appropriate investigation following district protocol for student safety concerns","Confront the teacher directly and informally first","Wait for a second complaint before acting"], c:1,
 e:"PSEL 4 calls for taking responsibility for each student's safety and well-being, requiring prompt, protocol-driven investigation."},

// ---------------- ORGANIZATIONAL LEADERSHIP (OL) ----------------
{cat:"OL", q:"A principal is developing a school safety plan after a state mandate update. Best process?",
 o:["Have the administrative team draft it alone for efficiency","Involve staff, students, and families in developing and reviewing the plan, then conduct ongoing reviews","Adopt a neighboring school's plan directly","Delegate the plan entirely to the district safety office"], c:1,
 e:"PSEL 5 calls for involving appropriate stakeholders in developing a comprehensive safety plan and conducting ongoing reviews."},
{cat:"OL", q:"Facing a mid-year budget cut, a principal must reduce spending without harming instruction. Best approach?",
 o:["Cut evenly across all budget lines","Review spending against strategic priorities and cut lowest-impact items first","Cut extracurricular programs first since they're non-academic","Freeze all spending until the next fiscal year"], c:1,
 e:"PSEL 5 calls for allocating funds based on student needs and acting as an accountable steward, which requires prioritizing by impact, not blanket cuts."},
{cat:"OL", q:"A principal is recruiting to fill several teaching vacancies at a hard-to-staff school. Best hiring strategy?",
 o:["Hire the first qualified applicant for each position to fill vacancies quickly","Target candidates with relevant experience and qualifications matched to identified student needs","Prioritize candidates who reflect the school's demographics above all else","Rely solely on the district's central applicant pool without additional outreach"], c:1,
 e:"PSEL 5 calls for implementing effective strategies to recruit certified staff matched to student needs, not speed alone."},
{cat:"OL", q:"A principal must decide how to allocate a new instructional coach position across departments. Best approach?",
 o:["Split time evenly regardless of need","Allocate based on data showing where instructional support needs are greatest","Assign the coach wherever the principal has the closest relationships","Let departments bid for the coach's time"], c:1,
 e:"PSEL 5 calls for strategically managing personnel assignments to optimize student learning needs based on data, not equal division or preference."},
{cat:"OL", q:"A principal is developing a technology acquisition plan. Which consideration is most important?",
 o:["Getting the newest available technology regardless of cost","Aligning purchases with instructional goals and planning for maintenance and training","Matching whatever a neighboring school purchased","Prioritizing whichever vendor offers the steepest discount"], c:1,
 e:"PSEL 5 calls for using technology to improve operations while planning for acquisition, maintenance, and appropriate use tied to goals."},
{cat:"OL", q:"A principal wants to delegate responsibilities effectively among the leadership team. Which task is most appropriate to delegate?",
 o:["Handling a serious student disciplinary appeal","Organizing the school's community event logistics","Delivering a teacher's formal performance evaluation","Responding to a formal parent complaint against a staff member"], c:1,
 e:"PSEL 5 distinguishes tasks that can be delegated from sensitive, confidential responsibilities best kept within school leadership."},
{cat:"OL", q:"A principal is developing an emergency response plan and must identify key personnel. Best approach?",
 o:["Assume current staff know their roles from general training","Explicitly document and communicate emergency roles and responsibilities to all relevant staff","Address roles only during an actual emergency","Rely entirely on the district's central emergency plan without site-specific detail"], c:1,
 e:"PSEL 5 calls for identifying and documenting key emergency support personnel and communicating this information clearly in advance."},
{cat:"OL", q:"A principal notices the school's data and communication systems are outdated, slowing decision-making. Best first step?",
 o:["Purchase the newest available system immediately","Assess current data needs and gaps before selecting a system that fits those needs","Wait for the district to mandate a system upgrade","Address it only if teachers formally complain"], c:1,
 e:"PSEL 5 calls for maintaining data and communication systems to deliver accountable information, which starts with a needs assessment."},
{cat:"OL", q:"A principal is asked to approve after-hours community use of school facilities. Which condition should guide the decision most?",
 o:["Whether the requesting organization can pay a high rental fee","Whether the use is consistent with district policy on equitable access to facilities for community groups","Whether the principal personally supports the organization's mission","Whether the group requests the space on a weekday"], c:1,
 e:"PSEL 5 calls for following district policy on facility use to ensure equitable, consistent access for community groups."},
{cat:"OL", q:"A principal must assign teachers to grade levels for the upcoming year amid several retirements. Best approach?",
 o:["Assign based on seniority alone","Assign based on matching teacher strengths and certifications to identified student needs","Let teachers choose their assignments without regard to need","Assign randomly to ensure fairness"], c:1,
 e:"PSEL 5 calls for strategically managing personnel assignments to optimize student-learning needs."},
{cat:"OL", q:"A principal wants to evaluate whether current staffing supports all instructional programs adequately. Best approach?",
 o:["Compare staffing ratios to neighboring schools only","Analyze program needs against current staffing and identify gaps tied to student outcomes","Wait for staff to report being overwhelmed","Maintain current staffing since no formal complaints have arisen"], c:1,
 e:"PSEL 5 calls for evaluating educational programs to ensure instructional and support needs are met, grounded in program-specific data."},
{cat:"OL", q:"A principal discovers a facilities inspection is due within the month and the building has known maintenance issues. Best first step?",
 o:["Delay addressing the issues until after the inspection","Prioritize and address the most critical safety-related issues immediately, documenting the plan for the rest","Request the inspection be postponed","Address only issues visible during a walkthrough"], c:1,
 e:"PSEL 5 calls for ensuring compliance with safety regulations and readiness for inspections by prioritizing critical issues promptly."},
{cat:"OL", q:"A principal is managing a limited substitute teacher budget during a wave of staff absences. Best prioritization approach?",
 o:["Assign the first available substitute to any open classroom","Prioritize substitute coverage for classrooms with the highest instructional stakes (e.g., testing windows, new content)","Combine classes to avoid using substitutes at all","Ask teachers to cover extra classes during their planning periods as the default solution"], c:1,
 e:"PSEL 5 calls for allocating limited resources based on student needs, prioritizing where instructional impact is greatest."},
{cat:"OL", q:"A principal wants a new student data system to genuinely support instructional decisions, not just record-keeping. Best implementation approach?",
 o:["Roll out the system to all staff with a single training session","Pilot with a group of teachers, gather feedback, and build training around actual instructional use cases","Require the system be used only for compliance reporting initially","Delay full rollout until the district requires it"], c:1,
 e:"PSEL 5 calls for using technology to improve the quality and efficiency of operations in ways tied to actual practice, built through piloting and feedback."},
{cat:"OL", q:"A principal is deciding how to handle a request to use a portion of the school's outdoor field for a community farmers' market. Best process?",
 o:["Approve based on personal judgment about community benefit","Evaluate the request against facility-use policy, safety, and equitable access considerations before deciding","Deny automatically since it's a non-educational use","Approve only if the market agrees to donate proceeds to the school"], c:1,
 e:"PSEL 5 calls for following established procedures for community use of school facilities rather than ad hoc personal judgment."},

// ---------------- COMMUNITY ENGAGEMENT LEADERSHIP (CE) ----------------
{cat:"CE", q:"Parents petition for immediate removal of library books they find objectionable, while district policy requires a formal reconsideration process. Best response?",
 o:["Remove the books immediately to satisfy the parents","Acknowledge the concern, explain and follow the formal reconsideration process, and keep parents informed","Refuse to discuss the matter further","Ignore the request since it involves a small group"], c:1,
 e:"PSEL 6 calls for supporting family engagement in decisions while honoring established, equitable processes."},
{cat:"CE", q:"A principal wants to increase family engagement in a community with many working parents unable to attend daytime events. Best strategy?",
 o:["Continue current events since attendance has always been low","Offer varied engagement formats (evening/virtual options, translated materials) based on family input","Require attendance as a condition of student participation in activities","Focus outreach only on families who already attend regularly"], c:1,
 e:"PSEL 6 calls for using effective public information strategies, including varied formats and languages, to reach all families."},
{cat:"CE", q:"A local business offers to donate equipment in exchange for prominent on-campus advertising. Best response?",
 o:["Accept immediately given the value of the donation","Review the offer against district policy on outside partnerships and advertising before deciding","Decline automatically since it involves advertising","Accept but keep the advertising terms informal"], c:1,
 e:"PSEL 6 calls for developing mutually beneficial relationships within district policy, not accepting or rejecting offers ad hoc."},
{cat:"CE", q:"A principal wants family input on a major decision (e.g., schedule change) but has struggled with low turnout at meetings. Best approach?",
 o:["Proceed with the decision since the meeting requirement was met","Diversify outreach methods and format (surveys, small group sessions, multiple languages) to reach underrepresented families","Make the decision based on the input gathered so far","Delay the decision indefinitely until turnout improves"], c:1,
 e:"PSEL 6 calls for supporting and engaging families in decision-making using appropriate, varied communication strategies."},
{cat:"CE", q:"A reporter contacts a principal about a sensitive incident at the school. Best first response?",
 o:["Decline all comment","Follow the district's media communication protocol, providing accurate information within appropriate limits","Speak freely and informally to build rapport with the reporter","Refer the reporter to a student for comment"], c:1,
 e:"PSEL 6 calls for using appropriate strategies for communicating effectively with the media, following established protocol."},
{cat:"CE", q:"A principal wants to build partnerships with community organizations to support student needs (e.g., health, housing). Best first step?",
 o:["Wait for organizations to approach the school","Proactively map community assets and identify potential partners aligned with identified student needs","Partner only with organizations recommended by the district","Focus solely on partnerships that provide financial donations"], c:1,
 e:"PSEL 6 calls for identifying and using community resources appropriately to support student learning, starting with a proactive needs match."},
{cat:"CE", q:"Some families feel excluded from school decision-making processes due to language barriers. Best systemic fix?",
 o:["Provide translated materials for major documents only","Build multilingual communication and interpretation into all major engagement processes, not just materials","Rely on bilingual staff informally as needed","Address it only when a specific family raises a concern"], c:1,
 e:"PSEL 6 calls for effective public information strategies across multiple languages built into the process itself, not translated documents alone."},
{cat:"CE", q:"A principal is planning a schoolwide event to celebrate student achievement. Best approach to maximize community connection?",
 o:["Host the event during the school day for convenience","Schedule and format the event based on community accessibility, and invite diverse community stakeholders","Limit invitations to high-achieving students' families","Delegate all planning entirely to a parent volunteer without staff coordination"], c:1,
 e:"PSEL 6 calls for celebrating success in ways that engage the full community, requiring accessible scheduling and broad invitation."},
{cat:"CE", q:"A principal wants ongoing, two-way communication with families rather than one-way announcements. Best approach?",
 o:["Send more frequent newsletters","Establish regular feedback channels (surveys, forums) alongside informational communication","Increase the length of existing newsletters","Rely on social media posts as the primary communication method"], c:1,
 e:"PSEL 6 explicitly calls for modeling the need for two-way communication with families and community members."},
{cat:"CE", q:"A community group requests use of school facilities but has a mission at odds with the school's stated values. Best response?",
 o:["Deny the request based on differing values","Evaluate the request based on established, neutral facility-use policy applied equitably to all groups","Approve only if the group changes their stated mission","Approve without review to avoid controversy"], c:1,
 e:"PSEL 6 calls for equitable and open access to facilities as required or legally permissible, applied neutrally regardless of viewpoint."},
{cat:"CE", q:"A principal wants to engage a historically underrepresented cultural group in school planning efforts. Best approach?",
 o:["Wait for members of that group to volunteer","Proactively identify and personally invite representatives from that community into planning structures","Add a general invitation to all planning meetings via newsletter","Assign a staff member to represent that community's perspective instead"], c:1,
 e:"PSEL 6 calls for using diverse representatives of the community to strengthen planning through proactive, direct outreach."},
{cat:"CE", q:"A principal is asked to comment publicly on a controversial school-related issue drawing local media attention. Best approach?",
 o:["Avoid any public statement","Provide a measured, factual statement consistent with district communication guidelines","Share personal opinions candidly to build community trust","Direct all questions to the superintendent without providing any information"], c:1,
 e:"PSEL 6 calls for demonstrating the ability to communicate effectively with the media within established guidelines."},
{cat:"CE", q:"A principal wants to identify additional community resources to support students experiencing homelessness. Best first step?",
 o:["Wait for families to disclose their situation and request help","Proactively connect with the district homeless liaison and community agencies to build a resource network in advance","Address needs only as emergencies arise","Refer all such cases directly to the district office without school-level support"], c:1,
 e:"PSEL 6 calls for collaborating with community agencies that provide services to families and children, built proactively."},
{cat:"CE", q:"Families raise a concern that recent scheduling changes were made without their input. Best principal response?",
 o:["Explain that the changes were within the principal's authority to make","Acknowledge the concern, explain the rationale, and create a process for gathering input on future decisions","Reverse the decision immediately upon hearing the complaint","Address concerns only from families who submit written complaints"], c:1,
 e:"PSEL 6 calls for supporting families in decision-making about their children's education going forward, not just defending past authority."},
{cat:"CE", q:"A principal wants a public advocacy strategy to support increased funding for the school. Best approach?",
 o:["Rely solely on the district's advocacy efforts","Build relationships with local policymakers and community members, sharing data-driven evidence of need","Focus advocacy efforts only during budget season","Avoid public advocacy to remain neutral"], c:1,
 e:"PSEL 6 calls for fostering relationships with policy makers and advocating publicly for the school using evidence of need."},

// ---------------- ADDITIONAL ITEMS (bringing bank to 120, matching SLLA category proportions) ----------------
// Strategic Leadership +5 (20 total)
{cat:"SL", q:"A principal designing an annual school improvement plan wants to identify the true root causes of a persistent problem before setting goals. Best approach?",
 o:["Brainstorm solutions as a leadership team and select the most popular one","Conduct a structured root-cause analysis using multiple data sources before drafting solutions","Adopt a solution used successfully at a similar school","Set a goal to 'improve' the area without specifying deeper causes"], c:1,
 e:"PSEL 1 calls for analyzing multiple sources of data to conduct a needs analysis before designing plans, not jumping to a popular or borrowed fix."},
{cat:"SL", q:"A principal wants staff, students, and families to help decide priority order among several competing goals. Best process?",
 o:["Rank goals based on the principal's professional judgment alone","Facilitate a structured process where stakeholders weigh in on priorities using shared data and criteria","Let the leadership team vote without wider input","Adopt whichever goal was loudest in community meetings"], c:1,
 e:"PSEL 1 calls for engaging staff, students, and community in planning and prioritizing using evidence, not the loudest voice or leader judgment alone."},
{cat:"SL", q:"A principal must decide how to phase in a multi-year strategic initiative given limited staff capacity. Best approach?",

{cat:"IL", q:"A principal wants to ensure the assessments used in early childhood classrooms are appropriate to students' developmental stage, not simply scaled-down versions of upper-grade tests. Best approach?",

{cat:"CC", q:"A principal wants to act with cultural competence when making a decision that will affect a specific cultural group differently than others. Best approach?",

{cat:"CC", q:"A principal receives a report suggesting a pattern of inequitable treatment toward a specific group of students by a particular team of teachers. Best first step?",

{cat:"EL", q:"A principal wants to establish and maintain an inclusive school community where families of all backgrounds feel they belong. Best approach?",

{cat:"EL", q:"A principal wants to build in regular self-reflection and goal-setting for their own ethical leadership practice, not just react to incidents as they arise. Best approach?",

{cat:"EL", q:"A principal wants hiring and promotion decisions to offer equitable access to all qualified staff, including those from underrepresented backgrounds. Best approach?",

{cat:"EL", q:"A principal discovers a scheduling error has been quietly benefiting one teacher with a reduced course load for two years. Best response?",
