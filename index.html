{cat:"CE", q:"A principal wants to engage with the local community proactively, not just when the school needs something. Best approach?",
 o:["Attend community events only when the school has an item to promote","Regularly participate in community events and build relationships independent of any immediate school need","Ask PTO leadership to represent the school at most community events, attending personally for major ones","Engage with the community only during scheduled district-wide events"], c:1,
 e:"PSEL 6 calls for engaging with the local community proactively and regularly, not only transactionally.",
 t:["Attending events only to promote something treats community engagement as transactional rather than genuine.","Regularly participating and building relationships independent of any immediate need is what makes engagement proactive rather than transactional.","Attending personally for major events shows some direct involvement, but relying mainly on the PTO for most events still isn't the same as the principal regularly building the school's own direct, ongoing relationships and visibility in the community.","Limiting engagement to scheduled district-wide events misses the ongoing, local relationship-building the question calls for."]},
{cat:"CE", q:"A principal wants to advocate for the school within the broader community, building visibility and support over time. Best approach?",
 o:["Rely on the district's communications office to handle all community advocacy","Focus advocacy efforts solely on families already engaged with the school","Build ongoing relationships and visibility within the community consistently, not only during high-stakes moments","Advocate for the school only during budget or bond campaigns"], c:2,
 e:"PSEL 6 calls for engaging with the community proactively and advocating for the school within it on an ongoing basis.",
 t:["Relying on the district's communications office to handle it removes the principal's own direct, ongoing relationship-building.","Focusing only on families already engaged misses building visibility with the broader community the question specifically asks about.","Building ongoing relationships and visibility consistently, not just at high-stakes moments, is what actually builds support over time.","Advocating only during budget or bond campaigns means visibility and relationships aren't there when they'd matter most."]},
{cat:"CE", q:"A principal wants to accommodate the specific dynamics of a community with a recent influx of newcomer families using appropriate research-informed strategies. Best approach?",
 o:["Research effective engagement strategies for newcomer families and adapt current practices accordingly","Address newcomer family engagement only through translated materials","Apply the same family engagement strategies used in past years without modification","Wait for newcomer families to adapt to existing school engagement practices"], c:0,
 e:"PSEL 6 calls for accommodating diverse student and community dynamics using appropriate strategies and research methods.",
 t:["Researching effective strategies for this specific population and adapting practices accordingly directly responds to the community's actual, changed dynamics.","Limiting engagement to translated materials misses other dimensions of newcomer families' specific needs and expectations.","Applying the same strategies used in past years, unmodified, ignores that the community's dynamics have genuinely changed.","Waiting for newcomer families to adapt to existing practices places the burden on families rather than the school adjusting its approach."]},
{cat:"CE", q:"A principal wants representatives from multiple distinct community groups to genuinely strengthen the school's educational planning, not just be present. Best approach?",
 o:["Invite diverse representatives to observe planning meetings without a defined role","Invite one representative from each distinct community group to a joint planning session","Involve diverse representatives only after major decisions have been made","Involve diverse community representatives with defined roles and real influence in shaping specific planning decisions"], c:3,
 e:"PSEL 6 calls for using diverse representatives of the community to strengthen educational programs and planning through real involvement.",
 t:["Inviting representatives to observe without a defined role gives them presence but not genuine influence.","Including a representative from each group is more inclusive than relying on just one overall, but without giving each representative defined roles and real influence over specific decisions, their presence risks being more symbolic than substantively shaping the planning.","Involving representatives only after major decisions are made limits their input to reacting rather than shaping the planning.","Giving representatives defined roles and real influence in shaping specific decisions is what makes their involvement genuine, not symbolic."]},
{cat:"CE", q:"A principal wants to demonstrate cultural sensitivity by engaging community members from a specific cultural group in shared responsibility for a new initiative, not just consultation. Best approach?",
 o:["Limit the group's involvement to an annual feedback survey","Consult the group for feedback, then implement the initiative independently","Invite the group into shared planning and implementation roles, not just a consultative one","Assign a single staff member to represent the group's interests instead"], c:2,
 e:"PSEL 6 calls for demonstrating cultural sensitivity by engaging community members in shared responsibilities, not consultation alone.",
 t:["Limiting involvement to an annual survey provides only occasional, passive input rather than shared responsibility.","Consulting for feedback, then implementing independently, keeps the group in a consultative role rather than a shared one.","Inviting the group into shared planning and implementation roles is what actually reflects shared responsibility, not just consultation.","Assigning a single staff member to represent the group substitutes for their direct involvement rather than including them."]},
{cat:"CE", q:"A principal wants to collaborate with a community health agency to address a rise in students needing vision or dental care. Best first step?",
 o:["Refer students to community resources as needs are identified, keeping a log to track referral outcomes","Wait for families to request health-related community referrals","Address the issue only through the school nurse's existing caseload","Establish an ongoing partnership with a community health agency to provide services proactively at the school"], c:3,
 e:"PSEL 6 calls for collaborating with community agencies that provide health, social, and other services to families and children proactively.",
 t:["Tracking referral outcomes adds useful follow-up, but individual, case-by-case referrals still don't establish the ongoing, proactive partnership that would let the agency provide services directly and consistently at the school.","Waiting for families to request referrals assumes they know to ask, which may not be the case.","Relying solely on the school nurse's existing caseload doesn't add the additional capacity a rising need requires.","Establishing an ongoing partnership to provide services proactively at the school directly and sustainably addresses the rising need."]},
{cat:"CE", q:"A principal wants to develop a mutually beneficial relationship with a local business willing to share resources (meeting space, volunteer time). Best approach?",
 o:["Decline the offer to avoid any appearance of favoring one business","Limit the relationship to informal, undocumented arrangements to maintain flexibility","Document the relationship's terms clearly, ensuring equitable, open access consistent with district policy","Accept the offer without documenting terms or expectations"], c:2,
 e:"PSEL 6 calls for developing mutually beneficial relationships with documented terms and equitable, open access as legally permissible.",
 t:["Declining the offer forgoes a potentially valuable, legitimate partnership out of an overly cautious concern.","Limiting the relationship to informal, undocumented arrangements risks unclear expectations and inconsistent access for others.","Documenting the relationship's terms and ensuring equitable, open access is what makes the partnership both beneficial and fair.","Accepting without documenting terms or expectations leaves the arrangement unclear and harder to manage responsibly."]},
{cat:"CE", q:"A principal wants to evaluate whether the community resources the school currently uses are actually supporting student learning effectively. Best approach?",
 o:["Evaluate current community resources against student outcome data to determine their actual effectiveness","Continue using current resources since they've been in place for years","Review the community partners' own self-reported impact alongside basic participation numbers","Add new community resources without evaluating current ones"], c:0,
 e:"PSEL 6 calls for evaluating the effective use of current community resources in support of student learning, not assuming continued value.",
 t:["Evaluating current resources against actual student outcome data is the direct way to confirm whether they're genuinely effective.","Continuing to use resources just because they've been in place for years assumes continued value without verifying it.","Adding participation numbers provides a bit more than self-report alone, but participation doesn't confirm the resource is actually improving student learning outcomes, which requires evaluating against actual outcome data.","Adding new resources without evaluating current ones risks accumulating partnerships without knowing which ones actually help."]},
{cat:"CE", q:"A principal wants to seek community support to sustain a valuable after-school program facing a funding gap. Best approach?",
 o:["Discontinue the program if district funding isn't renewed","Wait for a community member to offer support unprompted","Reduce the program's scope quietly without informing the community","Proactively communicate the program's benefits to the community and solicit additional community resources to sustain it"], c:3,
 e:"PSEL 6 calls for seeking community support to sustain existing resources by proactively communicating benefits and soliciting support.",
 t:["Discontinuing the program if district funding isn't renewed gives up before exploring other community support options.","Waiting for a community member to offer support unprompted is passive and unlikely to secure what's needed.","Reducing the program's scope quietly, without informing the community, misses the chance to rally support that might sustain it fully.","Proactively communicating the program's benefits and soliciting support is the direct way to build community backing to sustain it."]},
{cat:"CE", q:"A principal wants to identify additional community resources for a growing need (mental health support) that current partnerships don't fully address. Best approach?",
 o:["Address the gap solely through internal school staff, without new community resources","Proactively identify and solicit new community resources or partnerships to fill the specific identified gap","Wait until the current partnership renews to raise the issue","Expand the current partner's scope after a brief conversation confirming they're willing to take on more"], c:1,
 e:"PSEL 6 calls for identifying additional resources as needed to meet emerging student needs, beyond existing partnerships.",
 t:["Addressing the gap solely through internal staff, without new resources, may not provide the specialized support the growing need requires.","Proactively identifying and soliciting new resources or partnerships is what directly fills a gap current partnerships don't cover.","Waiting until the current partnership renews delays addressing a need that already exists now.","Checking willingness is a reasonable step, but confirming willingness alone doesn't assess whether the partner actually has the capacity or expertise to meet this specific new need — that requires a fuller assessment before expanding their scope."]},
{cat:"CE", q:"A principal wants to advocate publicly for increased funding by facilitating constructive discussion about relevant policy with the school community. Best approach?",
 o:["Limit policy discussion to formal board meetings only","Advocate for funding without explaining the underlying policy context to the community","Facilitate discussions helping the community understand relevant policy alongside the funding request","Focus advocacy solely on emotional appeals rather than policy context"], c:2,
 e:"PSEL 6 calls for facilitating constructive discussions with the school community about relevant laws, policies, and regulations as part of advocacy.",
 t:["Limiting policy discussion to formal board meetings excludes the broader school community from understanding the issue.","Advocating for funding without explaining the underlying policy context leaves the community without the understanding needed to support it.","Facilitating discussions that help the community understand relevant policy alongside the funding request builds genuine, informed support.","Focusing solely on emotional appeals, without policy context, doesn't build the substantive understanding constructive advocacy requires."]},
{cat:"CE", q:"A principal wants to foster relationships with local policymakers proactively, not just when a specific funding need arises. Best approach?",
 o:["Limit policymaker engagement to written correspondence only","Build ongoing relationships with local policymakers over time, independent of any single funding request","Rely primarily on the district office for policymaker relationships, reaching out personally once a year","Reach out to policymakers only when the school faces a budget shortfall"], c:1,
 e:"PSEL 6 calls for fostering relationships with policy makers proactively to meet student needs over time, not only reactively.",
 t:["Limiting engagement to written correspondence only misses building the kind of ongoing relationship proactive engagement requires.","Building ongoing relationships over time, independent of any single request, is what makes the engagement genuinely proactive.","An annual personal outreach adds some direct connection, but a once-a-year touchpoint still isn't the kind of ongoing, ordinary-time relationship-building that genuinely proactive engagement with policymakers requires.","Reaching out only when facing a budget shortfall is reactive, which is exactly what the question wants to move away from."]},
{cat:"CE", q:"A principal wants to advocate for excellence and equity in education as part of broader public advocacy, not focus solely on the school's own funding needs. Best approach?",
 o:["Limit advocacy efforts strictly to the school's specific budget requests","Delegate broader equity advocacy entirely to district or state-level organizations","Avoid broader advocacy to focus resources on immediate school needs","Advocate for excellence and equity broadly, connecting the school's needs to larger educational priorities"], c:3,
 e:"PSEL 6 calls for advocating for excellence and equity in education as part of the school leader's public advocacy role.",
 t:["Limiting advocacy strictly to the school's own budget requests misses the broader excellence and equity focus the question specifically asks for.","Delegating broader equity advocacy entirely to other organizations removes the school leader's own voice from that larger conversation.","Avoiding broader advocacy to focus only on immediate needs narrows the scope below what the question is asking about.","Connecting the school's needs to larger educational priorities is what makes advocacy about excellence and equity broadly, not just this school's funding."]},
{cat:"CE", q:"A principal wants community programs (tutoring, health, enrichment) to work together with the school, not operate as disconnected offerings. Best approach?",
 o:["Limit the number of community partnerships to reduce coordination complexity","Ask each community partner to share their schedule with the front office so activities don't conflict","Coordinate community programs and services intentionally so they align with and support each other and the school's goals","Focus solely on the community program with the largest enrollment"], c:2,
 e:"PSEL 6 calls for integrating a variety of programs and services that fully engage the school and community together, not disconnected offerings.",
 t:["Limiting the number of partnerships to reduce complexity avoids the coordination work rather than actually integrating the programs.","Coordinating schedules avoids logistical conflicts, but it doesn't actually align the programs' goals and content with each other and the school's own goals, which is the deeper coordination the question is asking about.","Intentionally coordinating programs so they align with school goals is what makes them work together rather than operate separately.","Focusing solely on the largest-enrollment program neglects the other programs and the goal of integrating all of them."]},
{cat:"CE", q:"A principal wants families new to the country to understand how to be involved in decisions about their children's education, given differing expectations from their prior school systems. Best approach?",
 o:["Assume families will learn expectations informally over time","Proactively explain, in accessible language, how family involvement works in this school system and specific ways to participate","Limit outreach to written translated materials only","Rely on other families from the same community to explain expectations informally"], c:1,
 e:"PSEL 6 calls for supporting and engaging families in decision-making about their children's education, requiring proactive, accessible explanation of how to participate.",
 t:["Assuming families will learn expectations informally over time leaves them without guidance in the meantime.","Proactively explaining, in accessible language, how involvement works here directly addresses the differing expectations the question describes.","Limiting outreach to written translated materials only misses families who need more than text-based explanation.","Relying on other families to explain informally is inconsistent and not a reliable systemic approach."]},
{cat:"CE", q:"A principal wants to use social media as one of several public information strategies without letting it become the sole communication channel for critical information. Best approach?",
 o:["Avoid using social media altogether due to reach limitations","Require families to follow social media to receive critical school information","Use social media as a supplement to more direct, reliable channels for critical information (calls, letters, official emails)","Post all critical information exclusively on social media for speed and reach"], c:2,
 e:"PSEL 6 calls for using varied public information strategies, with critical information conveyed through more direct, reliable channels than social media alone.",
 t:["Avoiding social media altogether forgoes a useful channel rather than using it appropriately alongside others.","Requiring families to follow social media to get critical information excludes those who don't use that platform.","Using social media as a supplement to more direct, reliable channels for critical information is exactly the balance the question asks for.","Posting critical information exclusively on social media risks families missing it if they don't check that channel."]},
{cat:"CE", q:"A principal wants to organize a venue specifically to celebrate the successes of a group of students who don't often receive schoolwide recognition. Best approach?",
 o:["Add a special mention for this group during the standard end-of-year awards ceremony","Create a dedicated recognition opportunity that specifically highlights their achievements and invites their families","Recognize them informally through a note sent home","Wait until they achieve a schoolwide-level accomplishment to recognize them"], c:1,
 e:"PSEL 6 calls for organizing venues and practices to celebrate the successes of students and the school, including groups not often highlighted.",
 t:["A special mention gives them some added visibility within the existing ceremony, but folding it into the same standard event still doesn't create the dedicated recognition opportunity and family invitation that would specifically highlight their often-overlooked achievements.","Creating a dedicated recognition opportunity that specifically highlights their achievements directly addresses the lack of recognition described.","An informal note home is a private gesture, not the schoolwide recognition venue the question is asking about.","Waiting for a schoolwide-level accomplishment sets an unreasonably high bar before this group receives any recognition at all."]},
{cat:"CE", q:"A principal wants to demonstrate the ability to communicate effectively with media during a fast-moving, sensitive situation. Best approach?",
 o:["Delay any communication until all facts are fully confirmed, however long that takes","Provide timely, accurate initial information within district guidelines, with clear commitment to follow up as more is known","Allow individual staff members to speak to media informally as questions arise","Avoid providing any information until the situation is fully resolved"], c:1,
 e:"PSEL 6 calls for effective media communication that balances timeliness and accuracy, following established protocol rather than silence or informal responses.",
 t:["Delaying until all facts are fully confirmed, however long that takes, leaves a communication vacuum during a fast-moving situation.","Providing timely, accurate initial information with a commitment to follow up balances the need for speed and accuracy.","Allowing individual staff to speak informally as questions arise risks inconsistent or inaccurate information reaching the media.","Avoiding all information until fully resolved leaves the community without any communication during an active, sensitive situation."]},
{cat:"CE", q:"A principal wants to identify competing perspectives between staff and families regarding a proposed dress code change before finalizing a decision. Best approach?",
 o:["Finalize the decision based on staff input alone, since they enforce the policy","Assume staff and family perspectives are likely aligned","Rely on the PTO's position to represent all family perspectives","Gather input separately from staff and families to understand where their perspectives align and differ before deciding"], c:3,
 e:"PSEL 6 calls for identifying the competing perspectives of different stakeholder groups before a decision is finalized.",
 t:["Finalizing based on staff input alone, since they enforce the policy, excludes the family perspective entirely.","Assuming staff and family perspectives are likely aligned skips actually checking whether they differ.","Relying on the PTO's position to represent all families may not capture the full range of family views.","Gathering input separately from staff and families is the direct way to see where their perspectives actually align or differ before deciding."]},
{cat:"CE", q:"A principal wants to engage families in a community with several distinct cultural and linguistic groups so that no single group's needs dominate engagement efforts. Best approach?",
 o:["Use one generalized approach assumed to work across all groups","Address smaller groups' needs only if the larger group's needs are already met","Focus engagement efforts on the largest single language group represented","Assess the specific needs of each cultural and linguistic group and design engagement strategies that address each proportionally"], c:3,
 e:"PSEL 6 calls for accommodating diverse community dynamics using strategies suited to each group's specific needs.",
 t:["A single generalized approach doesn't address the distinct needs of different cultural and linguistic groups.","Deprioritizing smaller groups until the larger group's needs are met treats them as secondary rather than equally important.","Focusing only on the largest language group leaves other groups' needs unaddressed, which is exactly what the question wants to avoid.","Assessing and addressing each group's specific needs proportionally is what ensures no single group's needs dominate engagement efforts."]},
{cat:"CE", q:"A principal wants to build a mutually beneficial relationship with a local college that could provide student mentors and resources. Best first step?",
 o:["Formalize a partnership agreement before discussing specific goals or expectations","Proactively reach out to identify shared interests and potential mutual benefits before formalizing a partnership","Wait for the college to propose a partnership","Limit any partnership discussion to a single introductory meeting"], c:1,
 e:"PSEL 6 calls for developing mutually beneficial relationships with organizations, beginning with proactive outreach to identify shared interests.",
 t:["Formalizing an agreement before discussing goals skips the step of actually identifying shared interests first.","Starting with a conversation about shared interests and mutual benefit is what builds a genuinely mutually beneficial relationship.","Waiting passively for the college to initiate misses the school's own opportunity to build the relationship.","Limiting discussion to one meeting doesn't allow for the deeper conversation needed to identify real mutual benefit."]},
{cat:"CE", q:"A principal wants to ensure that a new partnership with a local business providing school supplies doesn't create an appearance of preferential access for that business over competitors. Best approach?",
 o:["Document the relationship and ensure the process for such partnerships remains open and equitable to other potential partners","Allow the arrangement with a brief informal understanding, revisited each semester","Decline all business partnerships to avoid any appearance concerns","Limit the partnership to a single school year to avoid long-term appearance issues"], c:0,
 e:"PSEL 6 calls for identifying and documenting community relationships and ensuring equitable, open access to all groups as required.",
 t:["Documenting the relationship and keeping the process open to other potential partners is what actually prevents unfair appearance or reality of favoritism.","Revisiting each semester adds some regular check-in, but an informal understanding still isn't the documented, clearly defined process needed to ensure the arrangement remains genuinely open and equitable to other potential partners.","Declining all partnerships entirely forgoes potentially valuable, legitimate relationships rather than managing them properly.","Limiting the timeframe doesn't address the underlying question of whether the process itself is open and equitable."]},
{cat:"CE", q:"A principal wants a translated newsletter to actually reach the families who need it, not just exist as a document. Best approach?",
 o:["Assume translation alone ensures the information reaches its intended audience","Send the translated newsletter home in students' backpacks only","Post the translated newsletter on the school website only","Confirm which channels each family group actually uses, and distribute the translated newsletter through those"], c:3,
 e:"PSEL 6 calls for using effective public information strategies matched to how families actually receive information, not just producing translated materials.",
 t:["Assuming translation alone solves the problem ignores whether families actually receive it through channels they use.","Sending home only in backpacks may not reach every family reliably, especially if it's a channel they don't check.","Posting only on the website assumes families will actively check it, which may not match how they actually get information.","Confirming which channels each family group actually uses is what ensures the translated newsletter actually reaches its intended audience."]},
{cat:"CE", q:"A principal wants to build family engagement around a specific goal (e.g., improving early literacy) rather than generic participation. Best approach?",
 o:["Address literacy engagement only through school-based instruction, without a family component","Design family engagement activities specifically tied to supporting early literacy at home, with clear guidance for families","Assume general family engagement will naturally support literacy goals","Invite families to general school events without a specific literacy focus"], c:1,
 e:"PSEL 6 calls for engaging families in ways that support and achieve specific school goals, not generic participation alone.",
 t:["Leaving out any family component misses the engagement piece the question specifically asks about.","Designing engagement activities specifically connected to the literacy goal, with clear guidance, directly supports that particular outcome.","Assuming general participation will naturally support a specific goal doesn't ensure it actually does.","Inviting families to generic events without a literacy focus doesn't build engagement around the specific goal being targeted."]},
{cat:"CE", q:"A principal wants to ensure community partnerships are evaluated periodically rather than assumed to remain effective indefinitely. Best approach?",
 o:["Rely on partner satisfaction alone as the measure of a partnership's value","Ask partners annually to self-certify that the partnership is still working well","Continue partnerships indefinitely unless a partner ends the relationship","Establish a periodic review process to evaluate whether each partnership continues to effectively support student learning"], c:3,
 e:"PSEL 6 calls for evaluating the effective use of community resources on an ongoing basis, not assuming indefinite continued value.",
 t:["Relying only on the partner's self-reported satisfaction doesn't independently verify whether the partnership benefits students.","An annual self-certification is more proactive than waiting for a complaint, but relying on the partner's own certification, rather than the school's periodic review of whether the partnership continues to support student learning, still isn't independent verification.","Assuming continued value indefinitely, without review, risks maintaining partnerships that no longer serve students well.","Establishing a regular review process is what ensures partnerships are evaluated on an ongoing basis, not assumed to remain effective."]},
{cat:"CE", q:"A principal wants students themselves to have a voice in shaping family and community engagement strategies, not just adults. Best approach?",
 o:["Limit student involvement to being present at community events","Conduct a student survey twice a year and share a summary with staff planning engagement strategies","Assume adult stakeholders adequately represent student interests in engagement planning","Include student input and perspectives directly in designing family and community engagement strategies"], c:3,
 e:"PSEL 6 calls for engaging stakeholders broadly in planning, and directly including student voice strengthens the resulting strategies.",
 t:["Simply being present at events doesn't give students an actual voice in shaping the strategies themselves.","A twice-yearly survey with a shared summary is more frequent and visible than a single annual one, but a survey summary still isn't the same as directly including students in the actual process of designing the engagement strategies themselves.","Assuming adult stakeholders adequately capture student perspectives skips actually asking students directly.","Directly including students in designing the engagement strategies is what actually gives them a voice, not just adults deciding on their behalf."]},
{cat:"CE", q:"A principal wants public advocacy efforts to be grounded in accurate data about student needs and priorities identified by families, not the principal's own assumptions. Best approach?",
 o:["Ground advocacy efforts in data and family/community-identified priorities alongside professional judgment","Limit advocacy topics to those the district has already prioritized","Rely solely on state-level data trends, without local input","Advocate based on the principal's professional judgment about what the school needs most"], c:0,
 e:"PSEL 6 calls for advocating publicly using evidence of need and the priorities of families and the community, not assumption alone.",
 t:["Combining actual data and community-identified priorities with professional judgment grounds advocacy in evidence rather than assumption alone.","Limiting advocacy only to what the district already prioritizes may miss locally identified needs.","State-level data alone misses the specific local needs and priorities families have identified.","Relying solely on personal judgment is exactly the assumption-based approach the question wants to move away from."]},
];

  question: `<ul><li>Using the information in the documents, identify THREE actions the school leader should include in a plan to help Mr. Alvarez improve his professional practice.</li><li>Justify each identified action using specific evidence from the documents.</li><li>For each action, explain how it will help improve his professional practice and student writing outcomes.</li></ul>`,

      evidence: "The notes state that two teachers stayed after the data meeting specifically to analyze argument-writing samples together, while Mr. Alvarez left early for a scheduled duty — missing the one collaborative moment most relevant to his own students' weakest area.",
      standard: "PSEL 2 calls for working with teams to analyze student work and monitor student progress collaboratively, which builds shared instructional strategies rather than leaving one teacher to work in isolation.",
      outcome: "Bringing him into that collaborative analysis exposes him to strategies his colleagues are already using successfully in the same skill area, accelerating improvement beyond what one-on-one coaching alone would achieve."
    }
  ]

{
  id: "cr2",
  title: "Fairhaven Middle School — Inconsistent Discipline Referrals",
  standards: "PSEL 3 (Climate & Culture), PSEL 4 (Ethical Leadership)",
  scenario: `Fairhaven Middle School has two assistant principals, Mr. Doyle and Ms. Iwu, who split discipline referrals by grade level. The school leader, Dr. Ferro, reviews the semester's discipline data after a teacher raises a concern that "some kids get sent to the office for things others just get talked to about."`,
  documents: `<strong>Semester Discipline Data by Administrator</strong><br>
  <table class="cr-table"><tr><th></th><th>Referrals for minor disruption</th><th>Of those, % resulting in suspension</th><th>Referrals for major incidents</th></tr>
  <tr><td>Mr. Doyle (grades 6-7)</td><td>142</td><td>38%</td><td>19</td></tr>
  <tr><td>Ms. Iwu (grade 8)</td><td>96</td><td>12%</td><td>21</td></tr></table>
  <br><strong>Subgroup Breakdown, Minor Disruption Referrals — Mr. Doyle's Grades</strong><br>
  Students with disabilities: 31% of referrals, 14% of enrollment.<br>
  Black students: 44% of referrals, 26% of enrollment.<br>
  <br><strong>Additional Context</strong><br>
  Neither administrator has received formal training on the discipline matrix in the past two years. Ms. Iwu recently completed a district restorative-practices course; Mr. Doyle has not. Teachers report the written discipline code is the same for both grade bands, but not all teachers apply the "minor vs. major" distinction consistently before referring a student.`,
  question: `<ul><li>Using the information in the documents, identify THREE actions the school leader should take to address the discipline concern.</li><li>Justify each identified action using specific evidence from the documents.</li><li>For each action, explain how it supports equitable, ethical decision-making and improved student outcomes.</li></ul>`,
  model: [
    {
      action: "Provide Mr. Doyle the same restorative-practices training Ms. Iwu has already completed, alongside a refresher on the discipline matrix for both administrators.",
      evidence: "Ms. Iwu, whose referrals result in suspension only 12% of the time, has completed a district restorative-practices course; Mr. Doyle, whose referrals result in suspension 38% of the time, has not, and neither has had discipline-matrix training in two years.",
      standard: "PSEL 4 calls for implementing practices that hold staff accountable for consistent, ethical, and legal behavior, which starts with ensuring both administrators are working from the same current training.",
      outcome: "Closing this training gap directly targets the sharpest disparity in the data — the gap in suspension rates between the two administrators — which should reduce unnecessary suspensions in Mr. Doyle's grade band."
    },
    {
      action: "Conduct a joint review of the disaggregated referral data with both administrators and relevant teachers, focused specifically on the disproportionate rates for students with disabilities and Black students in Mr. Doyle's grades.",
      evidence: "Students with disabilities account for 31% of minor-disruption referrals in Mr. Doyle's grades despite being 14% of enrollment, and Black students account for 44% of referrals versus 26% of enrollment — both notably wider gaps than would be expected from enrollment alone.",
      standard: "PSEL 3 and PSEL 4 call for analyzing disaggregated discipline data to identify inequitable patterns and for safeguarding equity in how policies are applied, not waiting for a formal complaint to investigate.",
      outcome: "Directly examining these patterns with the people involved is the step most likely to reveal whether the same behavior is being referred differently for different students, which is necessary before the disparity can actually close."
    },
    {
      action: "Establish and communicate clear, shared criteria for the 'minor vs. major' distinction so all teachers apply it consistently, regardless of which administrator ultimately handles the referral.",
      evidence: "Teachers report that the written discipline code is the same for both grade bands, but that not all teachers apply the minor-versus-major distinction consistently before referring a student — a system-level inconsistency independent of either administrator's judgment.",
      standard: "PSEL 4 calls for modeling transparent, consistent decision-making practices, which requires the underlying referral criteria themselves to be applied uniformly before any administrator's response can be fair.",
      outcome: "Standardizing how referrals are classified at the point of origin reduces variation caused by inconsistent teacher judgment, making both the data and the resulting discipline more equitable going forward."
    }
  ]
},
{
  id: "cr3",
  title: "Crestwood High School — Declining Sense of Belonging",
  standards: "PSEL 3 (Climate & Culture), PSEL 6 (Community Engagement)",
  scenario: `Crestwood High School administers an annual school climate survey to students and staff. The school leader, Mr. Bennett, reviews this year's results alongside last year's and notices a decline in one area, concentrated among a specific group of students.`,
  documents: `<strong>Climate Survey — % of Students Agreeing "Adults at this school know me well"</strong><br>
  <table class="cr-table"><tr><th></th><th>This Year</th><th>Last Year</th></tr>
  <tr><td>All students</td><td>68%</td><td>71%</td></tr>
  <tr><td>Multilingual learners</td><td>44%</td><td>63%</td></tr>
  <tr><td>All other students</td><td>72%</td><td>72%</td></tr></table>
  <br><strong>Additional Survey Comments (multilingual learners, anonymous)</strong><br>
  "I don't go to clubs because nobody explains them in a way I understand."<br>
  "My counselor only talks to me about my grades, not really me."<br>
  <br><strong>School Context</strong><br>
  The school's multilingual learner population grew from 9% to 21% of enrollment over two years. The school has one bilingual family liaison, shared with two other schools. Advisory period exists schoolwide but advisory groups were formed alphabetically, not with any attention to language background or newcomer status.`,
  question: `<ul><li>Using the information in the documents, identify THREE actions the school leader should take to address the decline in sense of belonging among multilingual learners.</li><li>Justify each identified action using specific evidence from the documents.</li><li>For each action, explain how it will improve school climate and student outcomes for this group.</li></ul>`,
  model: [
    {
      action: "Restructure advisory groupings so multilingual learners, especially newcomers, are intentionally placed with staff or peers who share language background, rather than assigned alphabetically.",
      evidence: "Advisory groups are currently formed alphabetically with no attention to language background or newcomer status, while the 'adults know me well' agreement rate for multilingual learners dropped sharply, from 63% to 44%, even as their share of enrollment more than doubled.",
      standard: "PSEL 3 calls for creating an environment where each student is known and valued, built through consistent relational structures, not structures that happen to ignore a student's specific context.",
      outcome: "Intentional grouping gives multilingual learners a more reliable relational anchor in the building, which is the specific gap the survey and student comments point to."
    },
    {
      action: "Advocate for additional, more consistent bilingual family and student liaison support dedicated to this school, rather than relying on a liaison shared across three schools.",
      evidence: "The multilingual learner population grew from 9% to 21% of enrollment over two years, while the school's only bilingual liaison is still shared across three schools — a level of support that hasn't scaled with the population.",
      standard: "PSEL 6 calls for collaborating with community and support resources and allocating them based on student need, which requires revisiting a staffing ratio that data shows is now inadequate.",
      outcome: "More dedicated liaison time increases the chances multilingual families and students get timely, accessible support, addressing the isolation reflected in comments like feeling clubs are never explained accessibly."
    },
    {
      action: "Provide staff, especially counselors, with training on building relationships with multilingual learners that go beyond academic monitoring, and ensure extracurricular information is actively explained or translated.",
      evidence: "Student comments specifically note that 'my counselor only talks to me about my grades, not really me' and that club information isn't explained in an understandable way — both pointing to a gap in relational, not just academic, engagement.",
      standard: "PSEL 3 calls for recognizing and employing each student's culture and background as an asset and for building relationships that support both academic and social-emotional development, not academic monitoring alone.",
      outcome: "Broadening how staff engage with these students directly targets the specific disconnect students described, which should help rebuild the sense of being known that the survey shows has eroded."
    }
  ]
},
{
  id: "cr4",
  title: "Oakhill Elementary — Low Family Engagement at Conferences",
  standards: "PSEL 6 (Community Engagement), PSEL 1 (Strategic Leadership)",
  scenario: `Oakhill Elementary holds fall parent-teacher conferences on two weekday afternoons. The school leader, Ms. Okafor, reviews attendance data after several teachers mention that certain families "never come in."`,
  documents: `<strong>Conference Attendance by Family Language Preference</strong><br>
  <table class="cr-table"><tr><th></th><th>% of families attending</th></tr>
  <tr><td>English-speaking families</td><td>81%</td></tr>
  <tr><td>Spanish-speaking families</td><td>39%</td></tr>
  <tr><td>Families speaking other languages</td><td>28%</td></tr></table>
  <br><strong>Additional Notes</strong><br>
  Conference sign-up is done through an English-only online scheduling tool. Interpreters are available on request, but the request must be submitted 5 business days in advance and few families know this. Conferences are held only from 1:00-4:00 p.m., which conflicts with many families' work shifts. The school's newsletter, sent in English and Spanish, does not currently go out in the other languages spoken by families at the school.`,
  question: `<ul><li>Using the information in the documents, identify THREE actions the school leader should take to increase equitable family engagement in conferences.</li><li>Justify each identified action using specific evidence from the documents.</li><li>For each action, explain how it will improve family engagement and support for student learning.</li></ul>`,
  model: [
    {
      action: "Replace the English-only online scheduling tool with a multilingual option, and offer an alternate sign-up path (phone or paper) for families who aren't comfortable with the online system.",
      evidence: "Conference sign-up is currently done through an English-only online scheduling tool, and attendance is far lower for Spanish-speaking (39%) and other-language (28%) families than English-speaking families (81%) — a gap that starts at the very first step of signing up.",
      standard: "PSEL 6 calls for using effective public information strategies across multiple languages and channels, matched to how families actually communicate, not a single English-only system.",
      outcome: "Removing the language barrier at sign-up is likely to have the most direct effect on attendance, since families can't attend a conference they were never able to schedule in the first place."
    },
    {
      action: "Make interpreter availability the default and publicize it clearly, rather than requiring a request five business days in advance that most families don't know exists.",
      evidence: "Interpreters are available on request, but the request must be submitted five business days in advance and few families know this requirement exists — meaning a real resource is going largely unused.",
      standard: "PSEL 6 calls for supporting family engagement in decision-making through accessible, proactive communication, not a process that depends on families already knowing an obscure procedural rule.",
      outcome: "A default, well-publicized interpreter option removes a hidden barrier for non-English-speaking families and should increase the number who feel they can meaningfully participate once they do attend."
    },
    {
      action: "Add conference time windows outside 1:00-4:00 p.m. (evenings or a weekend option), and expand the newsletter's translation to all languages spoken at the school, not just English and Spanish.",
      evidence: "Conferences are held only from 1:00-4:00 p.m., which conflicts with many families' work shifts, and the newsletter is translated into English and Spanish only, leaving out families who speak other languages represented at the school.",
      standard: "PSEL 6 calls for accommodating diverse family and community dynamics using strategies suited to their actual circumstances and reaching every language group represented, not just the largest one.",
      outcome: "Expanding both scheduling windows and translated communication addresses two separate, documented barriers at once, giving more families both the information and the practical opportunity to attend."
    }
  ]
},
{
  id: "cr5",
  title: "Hendricks High School — Uneven Student Support Staffing",
  standards: "PSEL 5 (Organizational Leadership), PSEL 4 (Ethical Leadership)",
  scenario: `Hendricks High School has one school psychologist and two counselors serving grades 9 through 12. The new principal, Mr. Ibarra, reviews support staff allocation and referral data after a teacher raises a concern that "students in the ninth-grade building never get seen."`,

  <table class="cr-table"><tr><th>Grade</th><th>Counselor Hours/Week</th><th>Psychologist Hours/Week</th><th>Open Support Referrals</th><th>Students Enrolled</th></tr>

  <tr><td>10th</td><td>10</td><td>3</td><td>22</td><td>395</td></tr>
  <tr><td>11th</td><td>12</td><td>4</td><td>15</td><td>380</td></tr>

  <br><strong>Additional Notes</strong><br>

  question: `<ul><li>Using the information in the documents, identify THREE actions the school leader should take to address the uneven access to student support staff.</li><li>Justify each identified action using specific evidence from the documents.</li><li>For each action, explain how it will improve the efficiency and fairness of support services for students.</li></ul>`,
  model: [
    {
      action: "Reallocate counselor and psychologist hours to be proportional to referral volume and identified need by grade level, prioritizing the ninth grade's disproportionate backlog.",
      evidence: "Ninth grade carries 47 open referrals with only 2 psychologist hours and 8 counselor hours per week, while twelfth grade has just 9 open referrals but comparable or greater staffing (10 counselor hours, 3 psychologist hours) — the current allocation doesn't track need.",
      standard: "PSEL 5 calls for assigning personnel to address student needs, not preserving a staffing pattern based on staff preference alone.",
      outcome: "Reallocating support to match referral volume directly targets the grade level with the largest unmet need, which should reduce the backlog and wait times."
    },
    {
      action: "Provide targeted onboarding and coaching for the ninth-grade counselor specifically on transition-related student needs, since experience isn't currently matched to that population's demands.",
      evidence: "The notes state the ninth-grade counselor has the least experience with students transitioning from middle school, while ninth grade shows by far the highest referral volume of any grade.",
      standard: "PSEL 5 calls for planning effective induction and support for staff matched to the specific demands of their role.",
      outcome: "Building this counselor's capacity for transition-specific support should improve how effectively referrals in that grade are addressed, not just how many staff hours are assigned."
    },
    {
      action: "Establish a regular, scheduled review process for support-staff allocation tied to current referral and enrollment data, rather than leaving the allocation fixed from a five-year-old decision.",
      evidence: "The allocation was set five years ago based on counselor preference and has not been reviewed since, despite referral volume now varying widely by grade.",
      standard: "PSEL 5 calls for evaluating educational programs to ensure student support needs continue to be met over time.",

{
  id: "cr6",
  title: "Meridian Middle School — Stalled PLC Effectiveness",
  standards: "PSEL 2 (Instructional Leadership), PSEL 1 (Strategic Leadership)",
  scenario: `Meridian Middle School established math professional learning communities (PLCs) two years ago as part of its strategic plan to raise math achievement. The school leader, Ms. Whitfield, reviews PLC meeting logs and student growth data at the midpoint of this school year.`,
  documents: `<strong>Math PLC Meeting Log — Primary Focus of Last 8 Meetings</strong><br>
  <table class="cr-table"><tr><th>Meeting Focus</th><th># of Meetings</th></tr>
  <tr><td>Reviewing the pacing guide</td><td>5</td></tr>
  <tr><td>Planning upcoming unit tests</td><td>2</td></tr>
  <tr><td>Analyzing student work/data</td><td>1</td></tr></table>
  <br><strong>District Interim Math Assessment — Average Growth, Fall to Winter</strong><br>
  <table class="cr-table"><tr><th>Grade</th><th>This Year</th><th>Last Year</th></tr>
  <tr><td>6th</td><td>+4 pts</td><td>+9 pts</td></tr>
  <tr><td>7th</td><td>+3 pts</td><td>+8 pts</td></tr>
  <tr><td>8th</td><td>+5 pts</td><td>+9 pts</td></tr></table>
  <br><strong>Additional Notes</strong><br>
  PLC facilitation rotates weekly among team members with no designated lead. No PLC has a standard agenda template; each week's facilitator brings whatever feels most urgent at the time. The strategic plan's math goal explicitly calls for PLCs to use interim assessment data to adjust instruction, but the master schedule does not build in dedicated time for that specific work.`,
  question: `<ul><li>Using the information in the documents, identify THREE actions the school leader should take to realign the math PLCs with the strategic plan's goal.</li><li>Justify each identified action using specific evidence from the documents.</li><li>For each action, explain how it will help improve instructional practice and student growth.</li></ul>`,
  model: [
    {
      action: "Build a required, recurring agenda structure into every PLC meeting that reserves dedicated time specifically for analyzing student work and interim data.",
      evidence: "Five of the last eight meetings focused on pacing and only one on data analysis, even though the strategic plan explicitly calls for PLCs to use interim data to adjust instruction.",
      standard: "PSEL 2 calls for working with teams to analyze student work and monitor progress, and PSEL 1 calls for aligning practice with the strategic plan's stated goals.",
      outcome: "Consistent, protected data-analysis time reconnects PLC work to the instructional adjustments needed to reverse the decline in math growth."
    },
    {
      action: "Designate a trained, consistent PLC lead rather than rotating facilitation weekly, so the team's focus stays anchored to data-driven priorities.",
      evidence: "Facilitators currently rotate weekly with no designated lead, and each brings 'whatever feels most urgent,' which likely explains the drift toward pacing-guide logistics over data analysis.",
      standard: "PSEL 2 calls for developing capacity and providing opportunities for teacher leadership, which a stable, trained lead role builds directly.",
      outcome: "A consistent lead creates accountability for staying on the data-focused agenda from week to week, rather than restarting priorities each time facilitation changes hands."
    },
    {
      action: "Share the growth data decline directly with the PLC teams, explicitly connecting it to the shift away from data-analysis time, so staff understand why the structural change matters.",
      evidence: "Growth dropped in all three grade levels this year compared to last (6th: +9 to +4, 7th: +8 to +3, 8th: +9 to +5) during the same period PLC data-analysis time nearly disappeared.",
      standard: "PSEL 1 calls for communicating the data and outcomes behind improvement efforts, and PSEL 2 calls for collaborative data analysis with teams.",
      outcome: "Making the pattern visible to teachers builds shared urgency and buy-in for the change, rather than the new agenda structure feeling like an arbitrary mandate."
    }
  ]
},
{
  id: "cr7",
  title: "Sunview Elementary — Gifted Program Referral Patterns",
  standards: "PSEL 4 (Ethical Leadership), PSEL 3 (Climate & Culture)",
  scenario: `Sunview Elementary's gifted program relies on teacher referral as the first step before formal testing. The school leader, Mr. Castellano, reviews this year's referral data after a parent asks why so few students from certain classrooms are ever referred.`,

  <table class="cr-table"><tr><th>Teacher</th><th>Students Referred</th><th>Class Size</th><th>Reading Benchmark (% Proficient)</th></tr>

  <tr><td>Ms. Farrow</td><td>6</td><td>23</td><td>65%</td></tr>
  <tr><td>Mr. Delgado</td><td>0</td><td>25</td><td>74%</td></tr></table>
  <br><strong>Subgroup Breakdown of All Referrals Schoolwide</strong><br>

  question: `<ul><li>Using the information in the documents, identify THREE actions the school leader should take to address the referral patterns in the gifted program.</li><li>Justify each identified action using specific evidence from the documents.</li><li>For each action, explain how it will improve equitable access to the program.</li></ul>`,
  model: [
    {
      action: "Implement a universal screening step, such as an ability or achievement assessment given to all students at a set grade, before or alongside teacher referral.",
      evidence: "Referral rates vary drastically by teacher — Ms. Ahn referred 9 students while Mr. Delgado referred none, despite Mr. Delgado's class having the highest reading proficiency of the four — and no universal screening currently occurs.",
      standard: "PSEL 3 calls for ensuring each student has equitable access to programs and identifying opportunity gaps, which a single, judgment-based referral gate does not support.",
      outcome: "Universal screening reduces reliance on inconsistent individual teacher judgment as the sole gateway into the program."
    },
    {
      action: "Provide teachers structured, shared training and clearer, more specific referral criteria, replacing the current single vague policy statement.",
      evidence: "The written policy provides only one criterion — 'teacher believes student demonstrates advanced ability' — and no formal training on referral criteria currently exists.",
      standard: "PSEL 4 calls for employing ethical decision-making regarding policies that provide equitable access for students, which requires clear, consistently applied criteria.",
      outcome: "Clearer, shared criteria should narrow the wide teacher-to-teacher variation currently seen in referral rates."

    {
      action: "Directly examine and address why English learners and economically disadvantaged students are so severely underrepresented in referrals relative to their enrollment.",
      evidence: "English learners account for 3% of referrals versus 19% of enrollment, and economically disadvantaged students account for 11% of referrals versus 41% of enrollment.",
      standard: "PSEL 3 calls for identifying and altering systems of practice that perpetuate inequities and avoiding deficit-based schooling.",

  model: [
    {
      action: "Review and adjust the master schedule and staff workload expectations to protect dedicated planning time.",

      standard: "PSEL 3 calls for promoting a healthy work-life balance and a community of care for teachers, which starts with protecting the time they need to do their core work.",
      outcome: "Addressing the single most commonly cited resignation driver directly targets the biggest lever available for improving retention."
    },
    {
      action: "Establish a clear, responsive system for staff to receive timely support from administration when they ask for it, such as defined response windows or a designated point person.",

      standard: "PSEL 3 calls for developing open, trusting, and supportive working relationships between leadership and staff.",

    {

      standard: "PSEL 6 calls for engaging families in ways that genuinely support the school's goals, built through collaboration rather than announcement.",

- Lacks structure, reasoning, or justification`;
// ---------------- APP STATE & ROUTING ----------------
const app = document.getElementById('app');
let state = { screen: 'home' };
let crTimerHandle = null;
const CR_SECTION_SECONDS = 75 * 60;

// Give every question a stable index so saved progress can reference questions by id.
QUESTIONS.forEach((q,i)=>{ q._idx = i; });

function formatTime(sec){
  sec = Math.max(0, sec);
  const m = Math.floor(sec/60);
  const s = sec%60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

// ---------------- TEST-TAKING TIP CLASSIFIER ----------------
// Compares all 4 options against each other (not just the correct one) across several
// dimensions common in SLLA-style items. Each distractor is analyzed independently, and its
// reason quotes the actual trigger phrase from its own text — so the explanation is visibly
// grounded in what that specific option says, not a canned line reused across options. When
// two distractors share the same underlying flaw, the classifier tries to give each one a
// different applicable dimension so the reasons don't read as duplicates. A dimension is only
// used when the correct answer does NOT show the flaw. Original analysis — not sourced from
// any specific prep book.
const TIP_DIMENSIONS = [
  { good: /\b(collaborat|engage|involve|invite input|facilitat|co-plan|co-creat|stakeholder|partner with|input from)/i,
    bad: /\b(alone|without (staff|family|families|further discussion|input|community)|personal judgment|quietly|the principal (alone|personally decides))/i,
    goodTip: 'brings others into the process rather than acting alone — notice "{match}"',
    badTip: 'acts alone or without real input from others — notice "{match}"' },
  { good: /\b(review (the )?data|analy[sz]|examine (the )?data|disaggregat|evidence|documented (need|evidence|data|criteria)|based on data)/i,
    bad: /\b(assume|personal preference|without review|based on (which|who) (asks|requests)|frequently request|convenience)/i,
    goodTip: 'grounds the decision in documented data or evidence — notice "{match}"',
    badTip: 'leans on assumption or convenience instead of evidence — notice "{match}"' },
  { good: /\b(policy|process|system\b|structure|practice|procedure|schoolwide|ongoing review)/i,
    bad: /\b(case-by-case|informally|ad hoc|whichever (classroom|teacher|group)|one-time)/i,
    goodTip: 'fixes the underlying process or policy rather than handling it informally — notice "{match}"',
    badTip: 'handles it informally rather than through a consistent process — notice "{match}"' },
  { good: /\b(proactiv|ongoing|regularly|before (it|a|an)|prevent|establish.*advance|scheduled review)/i,
    bad: /\b(wait (until|to see)|delay|only if|only when|only during|only for|until (a|an|the)|ignore|avoid addressing|only after|when (a )?concerns? (is|are) raised|arises?)\b/i,
    goodTip: 'takes proactive, ongoing action rather than waiting for a problem to surface — notice "{match}"',
    badTip: 'waits or only reacts once a problem has surfaced — notice "{match}"' },
  { good: null,
    bad: /\b(exclusively|solely|entirely|altogether|automatically|immediately (remove|deny|terminate|discipline)|regardless of|all at once|simultaneously|require (all|every)|outright)/i,
    goodTip: "takes a measured, proportionate approach rather than swinging to an extreme",
    badTip: 'swings to an all-or-nothing extreme — notice "{match}"' },
  { good: null,
    bad: /\b(approval for every|every decision|micromanag|minimal (oversight|support|involvement|guidance))/i,
    goodTip: "balances clear expectations with appropriate autonomy, avoiding both too much control and too little oversight",
    badTip: 'swings to the opposite extreme of too much control or too little oversight — notice "{match}"' },
  { good: /\b(same process|regardless of (the|their)|consisten(t(ly)?|cy)|equitable|applied to all|documented criteria|standard (process|procedure))/i,
    bad: /\b(favorit|familiar|already knows?|request(s|ed)? it first|loudest|based on (personal|who))/i,
    goodTip: 'applies a consistent standard to everyone rather than favoring convenience or familiarity — notice "{match}"',
    badTip: 'lets favoritism, familiarity, or convenience drive the decision — notice "{match}"' },
  { good: /\b(communicat|explain|transparen(t|cy)|inform (families|staff|the)|share (the )?rationale|disseminat)/i,
    bad: /\b(quietly|without (explanation|informing)|privately handle|avoid (explaining|discussing))/i,
    goodTip: 'keeps people informed and explains the reasoning rather than acting quietly — notice "{match}"',
    badTip: 'handles it quietly rather than explaining the reasoning to those affected — notice "{match}"' },
  { good: /\b(regularly|ongoing|comprehensive|throughout|all aspects|consistently|routinely|multiple (channels|sources|formats))/i,
    bad: /\b(single|one-time|isolated|standalone|once (a|per) year|annual (event|assembly)|a single)\b/i,
    goodTip: 'builds an ongoing, comprehensive practice rather than relying on one isolated event — notice "{match}"',
    badTip: 'relies on a single, one-time event rather than an ongoing practice — notice "{match}"' },
  { good: /\b(directly (review|engage|survey|assess)|engage (a )?(broad|diverse|wide) (range|cross-section)|proactively (identify|invite))/i,
    bad: /\brely (solely |entirely )?on (the |a )?[a-zA-Z'\s]{0,35}(board|committee|group|representative|office|department)s? to (handle|manage|represent|speak for)/i,
    goodTip: 'directly engages a broad range of people rather than delegating representation — notice "{match}"',
    badTip: 'delegates representation to a single group instead of engaging broadly — notice "{match}"' },
  { good: /\b(re-?engage|revis(e|ing)|adjust|adapt|update the (plan|timeline|approach))/i,
    bad: /\benforc(e|ing) compliance|mandate compliance|assign .{0,20}to enforce|require compliance/i,
    goodTip: 'adapts and re-engages people with the plan rather than simply enforcing compliance with it as-is — notice "{match}"',
    badTip: 'tries to enforce the existing approach rather than adapting it — notice "{match}"' },
  { good: null,
    bad: /\b(vote on whether|whether to abandon|leave (it|the decision) (up )?to|let (staff|teachers) decide alone)/i,
    goodTip: "keeps the leader actively driving a clear next step rather than deferring the core decision entirely",
    badTip: 'defers the real decision to an open vote instead of the leader driving it — notice "{match}"' }
];
const TIP_FALLBACK_CORRECT_TEMPLATE = (text) => {
  const shortText = text.length > 60 ? text.slice(0,57) + '...' : text;
  return `most directly and completely resolves what the scenario is asking — "${shortText}" addresses it without cutting corners or leaving a step out`;
};

function fallbackDistractorReason(optionText, correctText){
  const shortOpt = optionText.length > 55 ? optionText.slice(0,52) + '...' : optionText;
  return `takes a narrower or less complete approach than the correct answer — "${shortOpt}" doesn't fully resolve what the scenario is asking`;
}

function trimPhrase(phrase){
  if(phrase.length <= 40) return phrase;
  return phrase.slice(0, 37) + '...';
}

// Finds a "bad" pattern match while ignoring matches that are actually negated (e.g. "not only
// during high-stakes moments" should NOT count as showing the "only during..." flaw — the "not"
// flips it into a positive). Returns the regex match object, or null if no real (non-negated)
// match exists.
function findRealBadMatch(regex, text){
  const re = new RegExp(regex.source, regex.flags.includes('g') ? regex.flags : regex.flags + 'g');
  let m;
  while((m = re.exec(text)) !== null){
    const preceding = text.slice(Math.max(0, m.index - 16), m.index).toLowerCase();
    if(!/\bnot\s+(just\s+|simply\s+|only\s+|merely\s+)?$/.test(preceding)) return m;
    if(m.index === re.lastIndex) re.lastIndex++; // avoid infinite loop on zero-length match
  }
  return null;
}
function testReal(regex, text){ return !!findRealBadMatch(regex, text); }

function analyzeAnswerChoices(q){
  const opts = q.o;
  const correctIdx = q.c;
  const correctText = opts[correctIdx];

  // Pick the dimension that best explains why the CORRECT answer stands out. Critically, if the
  // dimension defines a "good" pattern, the correct answer's own text must actually match it —
  // otherwise the claim wouldn't be grounded in what that answer actually says.
  let bestForCorrect = null;
  TIP_DIMENSIONS.forEach(dim => {
    if(testReal(dim.bad, correctText)) return;
    if(dim.good && !dim.good.test(correctText)) return; // require real textual grounding
    let badCount = 0;
    opts.forEach((o,i)=>{ if(i!==correctIdx && testReal(dim.bad, o)) badCount++; });
    if(badCount === 0) return; // doesn't discriminate this question
    if(!bestForCorrect || badCount > bestForCorrect.score) bestForCorrect = { dim, score: badCount };
  });

  let correctTip;
  if(bestForCorrect){
    const dim = bestForCorrect.dim;
    if(dim.good){
      const m = dim.good.exec(correctText);
      const phrase = m ? trimPhrase(m[0]) : '';
      correctTip = dim.goodTip.includes('{match}') ? dim.goodTip.replace('{match}', phrase) : dim.goodTip;
    } else {
      correctTip = dim.goodTip;
    }
  } else {
    correctTip = TIP_FALLBACK_CORRECT_TEMPLATE(correctText);
  }

  // Analyze each distractor independently, preferring a dimension not already claimed by an
  // earlier distractor in this same question so the reasons stay distinct from each other.
  const usedDims = new Set();
  const reasons = [];
  opts.forEach((o,i) => {
    if(i === correctIdx) return;
    const candidates = TIP_DIMENSIONS.filter(dim => testReal(dim.bad, o) && !testReal(dim.bad, correctText));
    const chosen = candidates.find(d => !usedDims.has(d)) || candidates[0];
    let reason;
    if(chosen){
      usedDims.add(chosen);
      const m = findRealBadMatch(chosen.bad, o);
      const phrase = m ? trimPhrase(m[0]) : '';
      reason = chosen.badTip.replace('{match}', phrase);
    } else {
      reason = fallbackDistractorReason(o, correctText);
    }
    reasons.push({ i, reason });
  });
  return { correctTip, reasons };
}

function renderTipHTML(q){
  const letters = ['A','B','C','D'];
  // Prefer hand-written, question-specific reasoning (q.t) when available; fall back to the
  // pattern-based analyzer for questions not yet individually rewritten.
  if(q.t && q.t.length === 4){
    const correctText = q.t[q.c];
    const distractorReasons = q.t
      .map((r,i)=>({ i, r }))
      .filter(x => x.i !== q.c);
    return `
      <div class="tip-line">
        <strong>Why ${letters[q.c]} is the strongest answer:</strong> ${correctText}
      </div>
      <div class="tip-line">
        <strong>Why the others aren't the best choice:</strong>
        <ul class="tip-reasons">
          ${distractorReasons.map(x => `<li><strong>${letters[x.i]})</strong> ${x.r}</li>`).join('')}
        </ul>
      </div>
    `;
  }
  const { correctTip, reasons } = analyzeAnswerChoices(q);
  return `
    <div class="tip-line">
      <strong>Why ${letters[q.c]} is the strongest answer:</strong> it ${correctTip}.
    </div>
    <div class="tip-line">
      <strong>Why the others aren't the best choice:</strong>
      <ul class="tip-reasons">
        ${reasons.map(r => `<li><strong>${letters[r.i]})</strong> ${r.reason}.</li>`).join('')}
      </ul>
    </div>
  `;
}

// ---------------- MOCK EXAM PROGRESS (persisted) ----------------
// Uses Claude's built-in storage when running inside Claude's interface (window.storage),
// and falls back to the browser's own localStorage when the file is downloaded and opened
// directly in a browser (where window.storage doesn't exist). Either way, progress persists
// on that device/browser between visits. The constructed-response timer is never persisted
// as "running" — reloading or leaving the app always resumes it paused, which is what lets
// someone step away mid-exam without the clock running out behind their back.
const MOCK_KEY = 'mock-exam-progress';

function hasClaudeStorage(){
  return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.set === 'function';
}

async function saveMockProgress(){
  const payload = JSON.stringify({
    order: state.items.map(q=>q._idx),
    idx: state.idx,
    answers: state.answers.map(a=>({ qIndex: a.q._idx, chosen: a.chosen, correct: a.correct })),
    phase: state.phase || 'mc',
    crItemIds: (state.crItems || []).map(c=>c.id),
    crResponses: state.crResponses || {},
    crIdx: state.crIdx || 0,
    crTimeRemaining: state.crTimeRemaining != null ? state.crTimeRemaining : CR_SECTION_SECONDS,
    savedAt: Date.now()
  });
  if(hasClaudeStorage()){
    try{ await window.storage.set(MOCK_KEY, payload, false); return; }
    catch(e){ /* fall through to local storage */ }
  }
  try{ localStorage.setItem(MOCK_KEY, payload); }
  catch(e){ /* no persistence available in this environment; practice still works this session */ }
}

async function loadMockProgress(){
  let raw = null;
  if(hasClaudeStorage()){
    try{
      const res = await window.storage.get(MOCK_KEY, false);
      raw = res ? res.value : null;
    } catch(e){ raw = null; }
  }
  if(!raw){
    try{ raw = localStorage.getItem(MOCK_KEY); }
    catch(e){ raw = null; }
  }
  if(!raw) return null;
  try{
    const parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.order) || parsed.order.length === 0) return null;
    return parsed;
  } catch(e){ return null; }
}

async function clearMockProgress(){
  if(hasClaudeStorage()){
    try{ await window.storage.delete(MOCK_KEY, false); } catch(e){ /* ignore */ }
  }
  try{ localStorage.removeItem(MOCK_KEY); } catch(e){ /* ignore */ }
}

// ---------------- QUIZ HISTORY (persisted, separate from in-progress state) ----------------
// Records every completed Mock Exam and Category Practice run so past scores and missed
// questions can be reviewed later. Stores question indices + chosen answers only (not full
// question text) to stay compact; questions are looked back up from QUESTIONS when reviewing.
const HISTORY_KEY = 'quiz-history';
const HISTORY_MAX_ENTRIES = 50;

async function loadHistory(){
  let raw = null;
  if(hasClaudeStorage()){
    try{
      const res = await window.storage.get(HISTORY_KEY, false);
      raw = res ? res.value : null;
    } catch(e){ raw = null; }
  }
  if(!raw){
    try{ raw = localStorage.getItem(HISTORY_KEY); }
    catch(e){ raw = null; }
  }
  if(!raw) return [];
  try{
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed.map(normalizeHistoryEntry) : [];
  } catch(e){ return []; }
}

// Older history entries (saved before multi-category practice existed) used a single
// "catKey" field with no per-category breakdown. Normalize those to the current shape
// (catKeys array + byCat breakdown) so old and new entries render identically.
function normalizeHistoryEntry(e){
  if(e.type === 'category' && !e.catKeys){
    e.catKeys = e.catKey ? [e.catKey] : [];
    if(!e.byCat){
      e.byCat = {};
      if(e.catKey) e.byCat[e.catKey] = { correct: e.correct, total: e.total };
    }
  }
  return e;
}

async function saveHistoryList(list){
  const payload = JSON.stringify(list);
  if(hasClaudeStorage()){
    try{ await window.storage.set(HISTORY_KEY, payload, false); return; }
    catch(e){ /* fall through */ }
  }
  try{ localStorage.setItem(HISTORY_KEY, payload); }
  catch(e){ /* no persistence available; history just won't be remembered this session */ }
}

async function recordHistoryEntry(entry){
  const list = await loadHistory();
  list.unshift(entry);
  if(list.length > HISTORY_MAX_ENTRIES) list.length = HISTORY_MAX_ENTRIES;
  await saveHistoryList(list);
}

async function clearAllHistory(){
  if(!confirm('Clear all saved history? This removes every past attempt and cannot be undone.')) return;
  await saveHistoryList([]);
  render();
}

function buildIncorrectList(answers){
  return answers.filter(a=>!a.correct).map(a=>({ qIdx: a.q._idx, chosen: a.chosen }));
}

function render(){
  try{
    let result;
    if(state.screen === 'home') result = renderHome();
    else if(state.screen === 'cat-picker') result = renderCatPicker();
    else if(state.screen === 'quiz'){
      result = (state.mode === 'mock' && state.phase === 'cr') ? renderMockCR() : renderQuiz();
    }
    else if(state.screen === 'results') result = renderResults();
    else if(state.screen === 'cr-picker') result = renderCRPicker();
    else if(state.screen === 'cr-write') result = renderCRWrite();
    else if(state.screen === 'history') result = renderHistory();
    else if(state.screen === 'history-detail') result = renderHistoryDetail();

    if(result && typeof result.catch === 'function'){
      result.catch(showFatalError);
    }
  } catch(err){
    showFatalError(err);
  }
}

function showFatalError(err){
  try{ console.error(err); } catch(e){}
  const message = (err && err.message) ? err.message : String(err);
  if(app){
    app.innerHTML = `
      <div class="error-note">
        <strong>Something went wrong loading this screen.</strong><br>
        ${message.replace(/</g,'&lt;')}<br><br>
        Try reloading the page. If you're viewing this through a text message, email, or file preview,
        try opening it directly in a full browser (Safari or Chrome) instead — some previews don't run
        the JavaScript this app needs.
        <div style="margin-top:14px;">
          <button class="btn small secondary" onclick="goHome()">Try going home</button>
        </div>
      </div>
    `;
  }
}

// ---------------- MOCK EXAM SETUP / RESUME ----------------
async function startMockExamSetup(){
  // Sample the exact category counts ETS outlines for the SLLA (6990) — e.g. Strategic
  // Leadership 20, Instructional Leadership 27, etc. — drawing a fresh random subset from
  // each category's full pool (up to 50 questions per category) every time. Also draw 4
  // constructed-response items at random from the full CR pool for Section II.
  let pool = [];
  Object.keys(CATEGORIES).forEach(k=>{
    const target = CATEGORIES[k].full;
    const catQs = shuffle(QUESTIONS.filter(q=>q.cat===k));
    pool = pool.concat(catQs.slice(0, target));
  });
  pool = shuffle(pool);
  const crItems = shuffle(CR_SCENARIOS).slice(0, 4);
  state = {
    screen:'quiz', mode:'mock', items: pool, idx:0, answers:[], selected:null, locked:false,
    phase:'mc', crItems, crResponses:{}, crIdx:0, crTimeRemaining: CR_SECTION_SECONDS, crTimerRunning:false
  };
  await saveMockProgress();
  render();
}
async function confirmNewMock(){
  if(!confirm('Starting a new mock exam will discard your in-progress run. Continue?')) return;
  await clearMockProgress();
  await startMockExamSetup();
}
async function resumeMockExam(){
  const saved = await loadMockProgress();
  if(!saved){ await startMockExamSetup(); return; }
  const items = saved.order.map(i=>QUESTIONS[i]);
  const answers = saved.answers.map(a=>({ q: QUESTIONS[a.qIndex], chosen: a.chosen, correct: a.correct }));
  const crItems = (saved.crItemIds || []).map(id => CR_SCENARIOS.find(s=>s.id===id)).filter(Boolean);
  state = {
    screen:'quiz', mode:'mock',
    items, idx: Math.min(saved.idx, items.length-1), answers, selected:null, locked:false,
    phase: saved.phase || 'mc',
    crItems, crResponses: saved.crResponses || {}, crIdx: saved.crIdx || 0,
    crTimeRemaining: saved.crTimeRemaining != null ? saved.crTimeRemaining : CR_SECTION_SECONDS,
    crTimerRunning: false
  };
  render();
}
async function discardMockProgress(){
  await clearMockProgress();
  render();
}

  if(selected.length === 0) return;
  const input = document.getElementById('qcount');
  const pool = shuffle(QUESTIONS.filter(q=>selected.includes(q.cat)));
  let n = parseInt(input.value, 10);
  if(isNaN(n) || n < 1) n = 1;
  if(n > pool.length) n = pool.length;
  const items = pool.slice(0, n);
  state = { screen:'quiz', mode:'category', catKeys: selected.slice(), items, idx:0, answers:[], selected:null, locked:false };
  render();
}
